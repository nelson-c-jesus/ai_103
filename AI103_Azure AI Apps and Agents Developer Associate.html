,283)&quot;\n                              },\n                              {\n                                  &quot;content&quot;: &quot;Email:&quot;,\n                                  &quot;span&quot;: {\n                                      &quot;offset&quot;: 11,\n                                      &quot;length&quot;: 6\n                                  },\n                                  &quot;confidence&quot;: 0.995,\n                                  &quot;source&quot;: &quot;D(1,75,310,165,309,165,340,75,340)&quot;\n                              },\n                              {\n                                  &quot;content&quot;: &quot;john@contoso.com&quot;,\n                                  &quot;span&quot;: {\n                                      &quot;offset&quot;: 18,\n                                      &quot;length&quot;: 16\n                                  },\n                                  &quot;confidence&quot;: 0.977,\n                                  &quot;source&quot;: &quot;D(1,179,309,458,311,458,340,179,341)&quot;\n                              }\n                          ],\n                          &quot;lines&quot;: [\n                              {\n                                  &quot;content&quot;: &quot;John Smith&quot;,\n                                  &quot;source&quot;: &quot;D(1,69,234,333,233,333,282,69,282)&quot;,\n                                  &quot;span&quot;: {\n                                      &quot;offset&quot;: 0,\n                                      &quot;length&quot;: 10\n                                  }\n                              },\n                              {\n                                  &quot;content&quot;: &quot;Email: john@contoso.com&quot;,\n                                  &quot;source&quot;: &quot;D(1,75,309,458,309,458,340,75,340)&quot;,\n                                  &quot;span&quot;: {\n                                      &quot;offset&quot;: 11,\n                                      &quot;length&quot;: 23\n                                  }\n                              }\n                          ]\n                      }\n                  ],\n                  &quot;paragraphs&quot;: [\n                      {\n                          &quot;content&quot;: &quot;John Smith Email: john@contoso.com&quot;,\n                          &quot;source&quot;: &quot;D(1,69,233,458,233,458,340,69,340)&quot;,\n                          &quot;span&quot;: {\n                              &quot;offset&quot;: 0,\n                              &quot;length&quot;: 34\n                          }\n                      }\n                  ],\n                  &quot;sections&quot;: [\n                      {\n                          &quot;span&quot;: {\n                              &quot;offset&quot;: 0,\n                              &quot;length&quot;: 34\n                          },\n                          &quot;elements&quot;: [\n                              &quot;/paragraphs/0&quot;\n                          ]\n                      }\n                  ]\n              }\n          ]\n      }\n  }\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"9370,9509"}},{"content":"Example<br>\n(code extracts all of the string values)  <pre><code>\n  # (continued from previous code example)\n  &#xa0;\n  # Iterate through the fields and extract the names and type-specific values\n  contents = result_json[&quot;result&quot;][&quot;contents&quot;]\n  for content in contents:\n      if &quot;fields&quot; in content:\n          fields = content[&quot;fields&quot;]\n          for field_name, field_data in fields.items():\n              if field_data[&apos;type&apos;] == &quot;string&quot;:\n                  print(f&quot;{field_name}: {field_data[&apos;valueString&apos;]}&quot;)\n  </code></pre>","children":[{"content":"Output  <pre>\n  ContactName: John Smith\n  EmailAddress: john@contoso.com\n  </pre>","children":[],"payload":{"tag":"li","lines":"9523,9529"}}],"payload":{"tag":"li","lines":"9509,9529"}}],"payload":{"tag":"li","lines":"9367,9529"}}],"payload":{"tag":"li","lines":"9229,9529"}},{"content":"\n<p data-lines=\"9529,9530\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/\">Azure Content Understanding documentation</a>","children":[],"payload":{"tag":"li","lines":"9530,9532"}}],"payload":{"tag":"li","lines":"9529,9532"}},{"content":"\n<p data-lines=\"9532,9534\"><strong>Exercise - Develop a Content Understanding client application</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-information-extraction/Instructions/Exercises/01-content-understanding.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"9532,9536"}}],"payload":{"tag":"h3","lines":"9027,9028"}},{"content":"7. <a href=\"https://learn.microsoft.com/en-us/training/modules/extract-data-with-document-intelligence/\">Extract data with Azure Document Intelligence</a>","children":[{"content":"\n<p data-lines=\"9538,9539\"><strong>Introduction</strong></p>","children":[{"content":"Forms and documents play a critical role in daily business operations across all industries.","children":[],"payload":{"tag":"li","lines":"9539,9540"}},{"content":"Many organizations still rely on <strong>manual data extraction</strong>, which can be time-consuming, costly, and error-prone.","children":[],"payload":{"tag":"li","lines":"9540,9541"}},{"content":"Automating document processing helps improve operational efficiency, accuracy, and scalability.","children":[],"payload":{"tag":"li","lines":"9541,9542"}},{"content":"Microsoft Azure Document Intelligence provides AI-powered tools for extracting data from forms and documents automatically.","children":[],"payload":{"tag":"li","lines":"9542,9543"}},{"content":"The service is part of Microsoft Foundry and leverages:","children":[{"content":"Optical Character Recognition (OCR)","children":[],"payload":{"tag":"li","lines":"9544,9545"}},{"content":"Deep learning models","children":[],"payload":{"tag":"li","lines":"9545,9546"}}],"payload":{"tag":"li","lines":"9543,9546"}},{"content":"Azure Document Intelligence can extract:","children":[{"content":"Text","children":[],"payload":{"tag":"li","lines":"9547,9548"}},{"content":"Key-value pairs","children":[],"payload":{"tag":"li","lines":"9548,9549"}},{"content":"Tables","children":[],"payload":{"tag":"li","lines":"9549,9550"}},{"content":"Structured document data","children":[],"payload":{"tag":"li","lines":"9550,9551"}}],"payload":{"tag":"li","lines":"9546,9551"}},{"content":"The platform includes prebuilt models for common document types such as invoices, receipts, and tax forms.","children":[],"payload":{"tag":"li","lines":"9551,9552"}},{"content":"Developers can also create <strong>custom models</strong> tailored to specific business forms and workflows.","children":[],"payload":{"tag":"li","lines":"9552,9553"}},{"content":"AI-powered document analysis reduces manual effort and accelerates business processes such as:","children":[{"content":"Claims processing","children":[],"payload":{"tag":"li","lines":"9554,9555"}},{"content":"Patient enrollment","children":[],"payload":{"tag":"li","lines":"9555,9556"}},{"content":"Expense management","children":[],"payload":{"tag":"li","lines":"9556,9557"}},{"content":"Financial operations<br>\nAzure Document Intelligence enables organizations to build scalable and intelligent document automation solutions.","children":[],"payload":{"tag":"li","lines":"9557,9560"}}],"payload":{"tag":"li","lines":"9553,9560"}}],"payload":{"tag":"li","lines":"9538,9560"}},{"content":"\n<p data-lines=\"9560,9561\"><strong>What is Azure Document Intelligence?</strong></p>","children":[{"content":"\n<p data-lines=\"9562,9563\">What is Azure Document Intelligence (ADI)</p>","children":[{"content":"ADI is a cloud-based AI service that uses OCR and<br>\ndeep learning models to extract","children":[{"content":"Text","children":[],"payload":{"tag":"li","lines":"9565,9566"}},{"content":"Key-value pairs","children":[],"payload":{"tag":"li","lines":"9566,9567"}},{"content":"Selection marks","children":[],"payload":{"tag":"li","lines":"9567,9568"}},{"content":"Tables from documents.","children":[],"payload":{"tag":"li","lines":"9568,9569"}}],"payload":{"tag":"li","lines":"9563,9569"}},{"content":"OCR captures document structure by creating bounding boxes<br>\naround detected objects in an image","children":[],"payload":{"tag":"li","lines":"9569,9571"}},{"content":"The locations of the bounding boxes are recorded as<br>\ncoordinates in relation to the rest of the page","children":[],"payload":{"tag":"li","lines":"9571,9573"}},{"content":"Returns bounding box data and other information in a<br>\nstructured JSON format","children":[],"payload":{"tag":"li","lines":"9573,9575"}},{"content":"Preserves the relationships from the original document","children":[],"payload":{"tag":"li","lines":"9575,9576"}},{"content":"ADI provides underlying models already trained on<br>\nthousands of form examples","children":[],"payload":{"tag":"li","lines":"9576,9579"}}],"payload":{"tag":"li","lines":"9562,9579"}},{"content":"\n<p data-lines=\"9579,9580\">Document Intelligence service components</p>","children":[{"content":"Document analysis models","children":[{"content":"Extract text, structure, tables, and selection marks from documents","children":[],"payload":{"tag":"li","lines":"9581,9582"}},{"content":"The read model extracts text and detects languages","children":[],"payload":{"tag":"li","lines":"9582,9583"}},{"content":"The layout model adds table and structure extraction","children":[],"payload":{"tag":"li","lines":"9583,9584"}}],"payload":{"tag":"li","lines":"9580,9584"}},{"content":"Prebuilt models","children":[{"content":"Extract information from common document types<br>\nwithout any training required","children":[{"content":"Invoices","children":[],"payload":{"tag":"li","lines":"9587,9588"}},{"content":"Receipts","children":[],"payload":{"tag":"li","lines":"9588,9589"}},{"content":"Tax forms","children":[],"payload":{"tag":"li","lines":"9589,9590"}},{"content":"ID documents","children":[],"payload":{"tag":"li","lines":"9590,9591"}},{"content":"And more","children":[],"payload":{"tag":"li","lines":"9591,9592"}}],"payload":{"tag":"li","lines":"9585,9592"}}],"payload":{"tag":"li","lines":"9584,9592"}},{"content":"Custom models","children":[{"content":"Extract data from forms specific to your business<br>\nusing your own labeled datasets.","children":[],"payload":{"tag":"li","lines":"9593,9595"}},{"content":"Options","children":[{"content":"Custom template models<br>\nfast and cost-effective for fixed layouts","children":[],"payload":{"tag":"li","lines":"9596,9598"}},{"content":"Custom neural models<br>\nhigher accuracy for varying layouts","children":[],"payload":{"tag":"li","lines":"9598,9600"}},{"content":"Composed models","children":[],"payload":{"tag":"li","lines":"9600,9601"}},{"content":"Custom classifiers","children":[],"payload":{"tag":"li","lines":"9601,9603"}}],"payload":{"tag":"li","lines":"9595,9603"}}],"payload":{"tag":"li","lines":"9592,9603"}}],"payload":{"tag":"li","lines":"9579,9603"}},{"content":"\n<p data-lines=\"9603,9604\">Access Document Intelligence (DI) services</p>","children":[{"content":"REST API<br>\nCall the service directly using HTTP requests.","children":[],"payload":{"tag":"li","lines":"9604,9606"}},{"content":"Client library SDKs<br>\nUse SDKs for Python, C#, Java, and JavaScript.","children":[],"payload":{"tag":"li","lines":"9606,9608"}},{"content":"Document Intelligence Studio<br>\nAn online tool for visually exploring, testing, and building DI solutions.","children":[],"payload":{"tag":"li","lines":"9608,9610"}},{"content":"Microsoft Foundry portal<br>\nIntegrate DI with other Foundry tools.","children":[],"payload":{"tag":"li","lines":"9610,9613"}}],"payload":{"tag":"li","lines":"9603,9613"}},{"content":"\n<p data-lines=\"9613,9614\">Create a Document Intelligence resource</p>","children":[{"content":"A Foundry resource<br>\nA multi-service subscription that provides access to multiple AI<br>\nservices under a single endpoint and key.","children":[],"payload":{"tag":"li","lines":"9614,9617"}},{"content":"An Azure Document Intelligence resource<br>\nA single-service resource used only with Document Intelligence.","children":[],"payload":{"tag":"li","lines":"9617,9619"}},{"content":"<span>&#x1f4a1;</span> <mark>Create a Foundry resource if you plan to access multiple Foundry<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;tools under a single endpoint and key.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;For Document Intelligence access only, create a dedicated DI resource.</mark>","children":[],"payload":{"tag":"li","lines":"9619,9623"}}],"payload":{"tag":"li","lines":"9613,9623"}},{"content":"\n<p data-lines=\"9623,9624\">Input requirements</p>","children":[{"content":"Format must be<br>\n(The read model also accepts Microsoft Office file formats)","children":[{"content":"JPEG","children":[],"payload":{"tag":"li","lines":"9626,9627"}},{"content":"PNG","children":[],"payload":{"tag":"li","lines":"9627,9628"}},{"content":"BMP","children":[],"payload":{"tag":"li","lines":"9628,9629"}},{"content":"PDF (text or scanned)","children":[],"payload":{"tag":"li","lines":"9629,9630"}},{"content":"TIFF","children":[],"payload":{"tag":"li","lines":"9630,9631"}}],"payload":{"tag":"li","lines":"9624,9631"}},{"content":"File size must be","children":[{"content":"Less than 500 MB for the standard tier","children":[],"payload":{"tag":"li","lines":"9632,9633"}},{"content":"4 MB for the free tier.","children":[],"payload":{"tag":"li","lines":"9633,9634"}}],"payload":{"tag":"li","lines":"9631,9634"}},{"content":"Image dimensions must be between 50 x 50 pixels and 10,000 x 10,000 pixels.","children":[],"payload":{"tag":"li","lines":"9634,9635"}},{"content":"PDF documents must have dimensions less than 17 x 17 inches (A3 paper size).","children":[],"payload":{"tag":"li","lines":"9635,9636"}},{"content":"PDF documents must not be password-protected.","children":[],"payload":{"tag":"li","lines":"9636,9638"}}],"payload":{"tag":"li","lines":"9623,9638"}},{"content":"\n<p data-lines=\"9638,9639\">Learn more</p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview\">What is Azure Document Intelligence?</a>","children":[],"payload":{"tag":"li","lines":"9639,9640"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/model-overview\">Azure Document Intelligence model overview</a>","children":[],"payload":{"tag":"li","lines":"9640,9642"}}],"payload":{"tag":"li","lines":"9638,9642"}}],"payload":{"tag":"li","lines":"9560,9642"}},{"content":"\n<p data-lines=\"9642,9643\"><strong>Use the Document Intelligence Studio</strong></p>","children":[{"content":"\n<p data-lines=\"9644,9645\">What is Document Intelligence Studio</p>","children":[{"content":"Is an online tool for visually exploring, understanding, and<br>\nintegrating features from the Document Intelligence service","children":[],"payload":{"tag":"li","lines":"9645,9647"}},{"content":"Use to","children":[{"content":"Analyze form layouts","children":[],"payload":{"tag":"li","lines":"9648,9649"}},{"content":"Extract data from prebuilt models","children":[],"payload":{"tag":"li","lines":"9649,9650"}},{"content":"Train custom models","children":[],"payload":{"tag":"li","lines":"9650,9651"}}],"payload":{"tag":"li","lines":"9647,9651"}},{"content":"Access at <a href=\"https://documentintelligence.ai.azure.com/\">documentintelligence.ai.azure.com</a>","children":[],"payload":{"tag":"li","lines":"9651,9653"}}],"payload":{"tag":"li","lines":"9644,9653"}},{"content":"\n<p data-lines=\"9653,9654\">Studio capabilities</p>","children":[{"content":"Document analysis models<br>\nTest the read and layout models against your own documents to see extracted text,<br>\ntables, and structure.","children":[],"payload":{"tag":"li","lines":"9654,9657"}},{"content":"Prebuilt models<br>\nAnalyze documents using any available prebuilt model, such as invoices, receipts,<br>\nID documents, and tax forms.","children":[],"payload":{"tag":"li","lines":"9657,9660"}},{"content":"Custom models<br>\nBuild, label, train, and test custom extraction models and custom classifiers.","children":[],"payload":{"tag":"li","lines":"9660,9663"}}],"payload":{"tag":"li","lines":"9653,9663"}},{"content":"\n<p data-lines=\"9663,9664\">Analyze documents with prebuilt models</p>","children":[{"content":"1. Create an Azure Document Intelligence or Foundry Tools resource in the Azure portal.","children":[],"payload":{"tag":"li","lines":"9664,9665","listIndex":1}},{"content":"2. Open the Document Intelligence Studio and select a prebuilt model<br>\n(for example, Invoice, Receipt, or ID Document).","children":[],"payload":{"tag":"li","lines":"9665,9667","listIndex":2}},{"content":"3. Provide your resource endpoint and key.","children":[],"payload":{"tag":"li","lines":"9667,9668","listIndex":3}},{"content":"4. Upload or provide a URL to the document you want to analyze.","children":[],"payload":{"tag":"li","lines":"9668,9669","listIndex":4}},{"content":"5. Review the extracted fields and their confidence scores.","children":[],"payload":{"tag":"li","lines":"9669,9671","listIndex":5}}],"payload":{"tag":"li","lines":"9663,9671"}},{"content":"\n<p data-lines=\"9671,9672\">Build custom model projects</p>","children":[{"content":"The Studio generates the required<br>\nfiles automatically","children":[{"content":"<code>ocr.json</code>","children":[],"payload":{"tag":"li","lines":"9674,9675"}},{"content":"<code>labels.json</code>","children":[],"payload":{"tag":"li","lines":"9675,9676"}},{"content":"<code>fields.json</code>","children":[],"payload":{"tag":"li","lines":"9676,9677"}}],"payload":{"tag":"li","lines":"9672,9677"}},{"content":"High-level workflow","children":[{"content":"1. Create an Azure Document Intelligence or Foundry resource.","children":[],"payload":{"tag":"li","lines":"9678,9679","listIndex":1}},{"content":"2. Upload at least 5-6 sample forms to an Azure Blob Storage container.","children":[],"payload":{"tag":"li","lines":"9679,9680","listIndex":2}},{"content":"3. Configure cross-origin resource sharing (CORS) so the Studio can access your storage container.","children":[],"payload":{"tag":"li","lines":"9680,9681","listIndex":3}},{"content":"4. Create a custom model project in the Studio, linking your storage container and Document Intelligence resource.","children":[],"payload":{"tag":"li","lines":"9681,9682","listIndex":4}},{"content":"5. Label fields in your sample documents using the Studio&apos;s visual interface.","children":[],"payload":{"tag":"li","lines":"9682,9683","listIndex":5}},{"content":"6. Train your model and review accuracy metrics.","children":[],"payload":{"tag":"li","lines":"9683,9684","listIndex":6}},{"content":"7. Test the model against a new document that wasn&apos;t used during training.","children":[],"payload":{"tag":"li","lines":"9684,9685","listIndex":7}}],"payload":{"tag":"li","lines":"9677,9685"}}],"payload":{"tag":"li","lines":"9671,9685"}},{"content":"\n<p data-lines=\"9685,9686\">Add-on capabilities</p>\n<table data-lines=\"9686,9695\">\n<thead data-lines=\"9686,9687\">\n<tr data-lines=\"9686,9687\">\n<th style=\"text-align:left\">Capability</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"9688,9695\">\n<tr data-lines=\"9688,9689\">\n<td style=\"text-align:left\">High resolution extraction</td>\n<td style=\"text-align:left\">Extract text from high-resolution documents with greater accuracy</td>\n</tr>\n<tr data-lines=\"9689,9690\">\n<td style=\"text-align:left\">Formula extraction</td>\n<td style=\"text-align:left\">Detect and extract mathematical formulas from documents</td>\n</tr>\n<tr data-lines=\"9690,9691\">\n<td style=\"text-align:left\">Font property extraction</td>\n<td style=\"text-align:left\">Extract font information such as style, weight, and color</td>\n</tr>\n<tr data-lines=\"9691,9692\">\n<td style=\"text-align:left\">Barcode extraction</td>\n<td style=\"text-align:left\">Detect and read barcodes in documents</td>\n</tr>\n<tr data-lines=\"9692,9693\">\n<td style=\"text-align:left\">Searchable PDF</td>\n<td style=\"text-align:left\">Convert scanned documents into searchable PDF files</td>\n</tr>\n<tr data-lines=\"9693,9694\">\n<td style=\"text-align:left\">Query fields</td>\n<td style=\"text-align:left\">Use natural language queries to extract specific fields from documents</td>\n</tr>\n<tr data-lines=\"9694,9695\">\n<td style=\"text-align:left\">Key-value pairs</td>\n<td style=\"text-align:left\">Extract key-value pair relationships from documents using the layout model</td>\n</tr>\n</tbody>\n</table>\n  <br>\n<p data-lines=\"9698,9700\"><span>&#x1f4a1;</span> <mark>Some add-on capabilities are premium features that incur extra costs.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Check the <a href=\"https://azure.microsoft.com/pricing/details/ai-document-intelligence/\">pricing page</a> for details.</mark></p>","children":[],"payload":{"tag":"li","lines":"9685,9701"}},{"content":"\n<p data-lines=\"9701,9702\">Learn more</p>","children":[{"content":"<a href=\"https://documentintelligence.ai.azure.com/\">Document Intelligence Studio</a>","children":[],"payload":{"tag":"li","lines":"9702,9703"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/concept-add-on-capabilities\">Document Intelligence add-on capabilities</a>","children":[],"payload":{"tag":"li","lines":"9703,9705"}}],"payload":{"tag":"li","lines":"9701,9705"}}],"payload":{"tag":"li","lines":"9642,9705"}},{"content":"\n<p data-lines=\"9705,9706\"><strong>Use prebuilt models</strong></p>","children":[{"content":"\n<p data-lines=\"9707,9708\">Document analysis models</p>","children":[{"content":"Prebuilt models in Azure Document Intelligence enables to<br>\nextract data from common form types without training your own models","children":[],"payload":{"tag":"li","lines":"9708,9710"}},{"content":"Read model","children":[{"content":"Extracts printed and handwritten text from documents and images","children":[],"payload":{"tag":"li","lines":"9711,9712"}},{"content":"Detects the language of each text line","children":[],"payload":{"tag":"li","lines":"9712,9713"}},{"content":"Classifies whether text is handwritten or printed","children":[],"payload":{"tag":"li","lines":"9713,9714"}},{"content":"Is the foundation for text extraction in all other Document Intelligence models","children":[],"payload":{"tag":"li","lines":"9714,9715"}},{"content":"Multi-page PDF or TIFF files use the <code>pages</code> parameter in<br>\nrequest to specify a page range for analysis","children":[],"payload":{"tag":"li","lines":"9715,9717"}},{"content":"Ideal to extract words and lines from documents<br>\nwith no fixed or predictable structure","children":[],"payload":{"tag":"li","lines":"9717,9719"}}],"payload":{"tag":"li","lines":"9710,9719"}},{"content":"Layout model","children":[{"content":"Extends the read model&apos;s text<br>\nextraction with","children":[{"content":"Detection of selection marks","children":[],"payload":{"tag":"li","lines":"9722,9723"}},{"content":"Tables","children":[],"payload":{"tag":"li","lines":"9723,9724"}},{"content":"Document structure information","children":[],"payload":{"tag":"li","lines":"9724,9725"}},{"content":"Supports <code>keyValuePairs</code> feature to<br>\nextract key-value pairs","children":[],"payload":{"tag":"li","lines":"9725,9727"}},{"content":"Can handle","children":[{"content":"Angled documents","children":[],"payload":{"tag":"li","lines":"9728,9729"}},{"content":"Tables with complex structures","children":[{"content":"Merged cells","children":[],"payload":{"tag":"li","lines":"9730,9731"}},{"content":"Incomplete rows","children":[],"payload":{"tag":"li","lines":"9731,9732"}}],"payload":{"tag":"li","lines":"9729,9732"}}],"payload":{"tag":"li","lines":"9727,9732"}},{"content":"Each table cell is<br>\nextracted with","children":[{"content":"Its content","children":[],"payload":{"tag":"li","lines":"9734,9735"}},{"content":"Bounding box position","children":[],"payload":{"tag":"li","lines":"9735,9736"}},{"content":"Row/column indexes","children":[],"payload":{"tag":"li","lines":"9736,9737"}}],"payload":{"tag":"li","lines":"9732,9737"}},{"content":"Selection marks<br>\n(checkboxes and radio buttons) are extracted","children":[{"content":"Bounding box","children":[],"payload":{"tag":"li","lines":"9739,9740"}},{"content":"Confidence level","children":[],"payload":{"tag":"li","lines":"9740,9741"}},{"content":"Whether they&apos;re selected.","children":[],"payload":{"tag":"li","lines":"9741,9742"}}],"payload":{"tag":"li","lines":"9737,9742"}},{"content":"<span>&#x1f4a1;</span> <mark>The <em>general document model</em> was available in earlier versions of Document Intelligence,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;but was deprecated in the <code>2023-10-31-preview</code> release.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Its functionality for key-value pair and entity extraction has been incorporated into the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;layout model and other features.</mark>","children":[],"payload":{"tag":"li","lines":"9742,9747"}}],"payload":{"tag":"li","lines":"9720,9747"}}],"payload":{"tag":"li","lines":"9719,9747"}}],"payload":{"tag":"li","lines":"9707,9747"}},{"content":"\n<p data-lines=\"9747,9748\">Prebuilt models for specific document types</p>","children":[{"content":"\n<p data-lines=\"9748,9749\">Financial and legal documents</p>\n<table data-lines=\"9749,9758\">\n<thead data-lines=\"9749,9750\">\n<tr data-lines=\"9749,9750\">\n<th style=\"text-align:left\">Model</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"9751,9758\">\n<tr data-lines=\"9751,9752\">\n<td style=\"text-align:left\">Invoice</td>\n<td style=\"text-align:left\">Extracts customer name, vendor details, purchase order number,<br>invoice and due dates, billing and shipping addresses, line items, and totals</td>\n</tr>\n<tr data-lines=\"9752,9753\">\n<td style=\"text-align:left\">Receipt</td>\n<td style=\"text-align:left\">Extracts merchant details, transaction date and time, line items,<br>and totals. Supports single-page hotel receipt processing</td>\n</tr>\n<tr data-lines=\"9753,9754\">\n<td style=\"text-align:left\">Bank<br>statement</td>\n<td style=\"text-align:left\">Extracts account information, beginning and ending balances, and<br>transaction details</td>\n</tr>\n<tr data-lines=\"9754,9755\">\n<td style=\"text-align:left\">Check</td>\n<td style=\"text-align:left\">Extracts payee, amount, date, and other relevant information</td>\n</tr>\n<tr data-lines=\"9755,9756\">\n<td style=\"text-align:left\">Pay stub</td>\n<td style=\"text-align:left\">Extracts wages, hours, deductions, net pay, and<br>other common pay stub fields</td>\n</tr>\n<tr data-lines=\"9756,9757\">\n<td style=\"text-align:left\">Credit card</td>\n<td style=\"text-align:left\">Extracts payment card information</td>\n</tr>\n<tr data-lines=\"9757,9758\">\n<td style=\"text-align:left\">Contract</td>\n<td style=\"text-align:left\">Extracts agreement and party details</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"9748,9758"}},{"content":"\n<p data-lines=\"9758,9759\">US tax documents</p>\n<table data-lines=\"9759,9766\">\n<thead data-lines=\"9759,9760\">\n<tr data-lines=\"9759,9760\">\n<th style=\"text-align:left\">Model</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"9761,9766\">\n<tr data-lines=\"9761,9762\">\n<td style=\"text-align:left\">Unified US tax</td>\n<td style=\"text-align:left\">A single model that extracts from any supported US tax form type</td>\n</tr>\n<tr data-lines=\"9762,9763\">\n<td style=\"text-align:left\">W-2</td>\n<td style=\"text-align:left\">Extracts taxable compensation detail</td>\n</tr>\n<tr data-lines=\"9763,9764\">\n<td style=\"text-align:left\">1098 and variations</td>\n<td style=\"text-align:left\">Extracts mortgage interest and related details</td>\n</tr>\n<tr data-lines=\"9764,9765\">\n<td style=\"text-align:left\">1099 and variations</td>\n<td style=\"text-align:left\">Extracts income from various sources</td>\n</tr>\n<tr data-lines=\"9765,9766\">\n<td style=\"text-align:left\">1040 and variations</td>\n<td style=\"text-align:left\">Extracts individual income tax return details</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"9758,9766"}},{"content":"\n<p data-lines=\"9766,9767\">US mortgage documents</p>\n<table data-lines=\"9767,9774\">\n<thead data-lines=\"9767,9768\">\n<tr data-lines=\"9767,9768\">\n<th style=\"text-align:left\">Model</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"9769,9774\">\n<tr data-lines=\"9769,9770\">\n<td style=\"text-align:left\">1003 (URLA)</td>\n<td style=\"text-align:left\">Extracts loan application details.</td>\n</tr>\n<tr data-lines=\"9770,9771\">\n<td style=\"text-align:left\">1004 (URAR)</td>\n<td style=\"text-align:left\">Extracts information from property appraisals.</td>\n</tr>\n<tr data-lines=\"9771,9772\">\n<td style=\"text-align:left\">1005</td>\n<td style=\"text-align:left\">Extracts validation-of-employment information.</td>\n</tr>\n<tr data-lines=\"9772,9773\">\n<td style=\"text-align:left\">1008</td>\n<td style=\"text-align:left\">Extracts loan transmittal details.</td>\n</tr>\n<tr data-lines=\"9773,9774\">\n<td style=\"text-align:left\">Closing disclosure</td>\n<td style=\"text-align:left\">Extracts final closing loan terms.</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"9766,9774"}},{"content":"\n<p data-lines=\"9774,9775\">Personal identification documents</p>\n<table data-lines=\"9775,9780\">\n<thead data-lines=\"9775,9776\">\n<tr data-lines=\"9775,9776\">\n<th style=\"text-align:left\">Model</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"9777,9780\">\n<tr data-lines=\"9777,9778\">\n<td style=\"text-align:left\">ID document</td>\n<td style=\"text-align:left\">Extracts details from US driver&apos;s licenses, European Union IDs and<br>driver&apos;s licenses, and international passports. Includes names, dates of birth,<br>document numbers, and endorsements or restrictions.</td>\n</tr>\n<tr data-lines=\"9778,9779\">\n<td style=\"text-align:left\">Health<br>insurance card</td>\n<td style=\"text-align:left\">Extracts common fields from US health insurance cards.</td>\n</tr>\n<tr data-lines=\"9779,9780\">\n<td style=\"text-align:left\">Marriage<br>certificate</td>\n<td style=\"text-align:left\">Extracts certified marriage information.</td>\n</tr>\n</tbody>\n</table>\n  <br>\n<p data-lines=\"9783,9787\"><span>&#x26a0;</span><mark>The ID document model extracts personal information covered by data protection laws in<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;most jurisdictions.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Ensure you have the individual&apos;s permission to store their data and that you comply<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;with all applicable legal requirements.</mark></p>","children":[],"payload":{"tag":"li","lines":"9774,9788"}}],"payload":{"tag":"li","lines":"9747,9788"}},{"content":"\n<p data-lines=\"9788,9789\">Features of prebuilt models</p>","children":[{"content":"Text extraction<br>\nAll prebuilt models extract lines and words from handwritten and printed text.","children":[],"payload":{"tag":"li","lines":"9789,9791"}},{"content":"Key-value pairs<br>\nSpans of text that identify a label and its response.<br>\nFor example, Weight and 31 kg.","children":[],"payload":{"tag":"li","lines":"9791,9794"}},{"content":"Selection marks","children":[{"content":"Checkboxes","children":[],"payload":{"tag":"li","lines":"9795,9796"}},{"content":"Radio buttons","children":[],"payload":{"tag":"li","lines":"9796,9797"}},{"content":"Whether they&apos;re selected or not.","children":[],"payload":{"tag":"li","lines":"9797,9798"}}],"payload":{"tag":"li","lines":"9794,9798"}},{"content":"Tables","children":[{"content":"Data in cells","children":[],"payload":{"tag":"li","lines":"9799,9800"}},{"content":"Number of columns and row","children":[],"payload":{"tag":"li","lines":"9800,9801"}},{"content":"Column and row headings","children":[],"payload":{"tag":"li","lines":"9801,9802"}},{"content":"Merged cells.","children":[],"payload":{"tag":"li","lines":"9802,9803"}}],"payload":{"tag":"li","lines":"9798,9803"}},{"content":"Fields<br>\nModels trained for a specific form type identify a fixed set of fields.<br>\nFor example, the invoice model extracts <code>CustomerName</code> and <code>InvoiceTotal</code>.","children":[],"payload":{"tag":"li","lines":"9803,9807"}}],"payload":{"tag":"li","lines":"9788,9807"}},{"content":"\n<p data-lines=\"9807,9809\">When to use prebuilt vs. custom models<br>\n(Custom model)</p>","children":[{"content":"Industry-specific","children":[],"payload":{"tag":"li","lines":"9809,9810"}},{"content":"Unique form type","children":[],"payload":{"tag":"li","lines":"9810,9811"}},{"content":"Require time and sample data to train","children":[],"payload":{"tag":"li","lines":"9811,9812"}},{"content":"Always check whether a prebuilt model<br>\nexists for your scenario","children":[],"payload":{"tag":"li","lines":"9812,9815"}}],"payload":{"tag":"li","lines":"9807,9815"}},{"content":"\n<p data-lines=\"9815,9816\">Learn more</p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/model-overview\">Azure Document Intelligence prebuilt models</a>","children":[],"payload":{"tag":"li","lines":"9816,9817"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/read\">Azure Document Intelligence read model</a>","children":[],"payload":{"tag":"li","lines":"9817,9818"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout\">Azure Document Intelligence layout model</a>","children":[],"payload":{"tag":"li","lines":"9818,9819"}},{"content":"[Azure Document Intelligence invoice model](Azure Document Intelligence invoice model)","children":[],"payload":{"tag":"li","lines":"9819,9820"}},{"content":"[Azure Document Intelligence receipt model](Azure Document Intelligence receipt model)","children":[],"payload":{"tag":"li","lines":"9820,9821"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/id-document\">Azure Document Intelligence ID document model</a>","children":[],"payload":{"tag":"li","lines":"9821,9823"}}],"payload":{"tag":"li","lines":"9815,9823"}}],"payload":{"tag":"li","lines":"9705,9823"}},{"content":"\n<p data-lines=\"9823,9824\"><strong>Train and use custom models</strong></p>","children":[{"content":"\n<p data-lines=\"9825,9826\">Custom model types</p>","children":[{"content":"Custom template models<br>\n(extraction model)","children":[{"content":"Rely on a consistent visual template to<br>\nextract labeled data","children":[],"payload":{"tag":"li","lines":"9828,9830"}},{"content":"Work best for structured forms where the<br>\nlayout is static from one document<br>\ninstance to the next","children":[{"content":"Questionnaires","children":[],"payload":{"tag":"li","lines":"9833,9834"}},{"content":"Applications","children":[],"payload":{"tag":"li","lines":"9834,9835"}},{"content":"Standard government forms","children":[],"payload":{"tag":"li","lines":"9835,9836"}}],"payload":{"tag":"li","lines":"9830,9836"}}],"payload":{"tag":"li","lines":"9826,9836"}},{"content":"Template models extract","children":[{"content":"Labeled key-value pairs","children":[],"payload":{"tag":"li","lines":"9837,9838"}},{"content":"Selection marks","children":[],"payload":{"tag":"li","lines":"9838,9839"}},{"content":"Tables","children":[],"payload":{"tag":"li","lines":"9839,9840"}},{"content":"Regions","children":[],"payload":{"tag":"li","lines":"9840,9841"}},{"content":"Signatures","children":[],"payload":{"tag":"li","lines":"9841,9842"}},{"content":"Training takes only a few minutes","children":[],"payload":{"tag":"li","lines":"9842,9843"}},{"content":"More than 100 languages supported","children":[],"payload":{"tag":"li","lines":"9843,9844"}},{"content":"Fast to train","children":[],"payload":{"tag":"li","lines":"9844,9845"}},{"content":"Cost-effective to run","children":[],"payload":{"tag":"li","lines":"9845,9846"}},{"content":"Good starting point when<br>\ndocuments have a uniform visual layout","children":[],"payload":{"tag":"li","lines":"9846,9849"}}],"payload":{"tag":"li","lines":"9836,9849"}}],"payload":{"tag":"li","lines":"9825,9849"}},{"content":"\n<p data-lines=\"9849,9850\">Custom neural models</p>","children":[{"content":"Use deep learning and are<br>\nfine-tuned on your labeled data","children":[],"payload":{"tag":"li","lines":"9850,9852"}},{"content":"Combine layout and language<br>\nfeatures to extract fields from","children":[{"content":"Structured","children":[],"payload":{"tag":"li","lines":"9854,9855"}},{"content":"Semi-structured","children":[],"payload":{"tag":"li","lines":"9855,9856"}},{"content":"Unstructured documents","children":[],"payload":{"tag":"li","lines":"9856,9857"}}],"payload":{"tag":"li","lines":"9852,9857"}},{"content":"Neural models support","children":[{"content":"Overlapping fields","children":[],"payload":{"tag":"li","lines":"9858,9859"}},{"content":"Signature detection","children":[],"payload":{"tag":"li","lines":"9859,9860"}},{"content":"Table, row, and cell level confidence","children":[],"payload":{"tag":"li","lines":"9860,9861"}}],"payload":{"tag":"li","lines":"9857,9861"}},{"content":"Deliver higher accuracy than<br>\ntemplate models for","children":[{"content":"Semi-structured","children":[],"payload":{"tag":"li","lines":"9863,9864"}},{"content":"Unstructured documents","children":[],"payload":{"tag":"li","lines":"9864,9865"}}],"payload":{"tag":"li","lines":"9861,9865"}},{"content":"Take longer to train","children":[],"payload":{"tag":"li","lines":"9865,9866"}},{"content":"Consume more resources","children":[],"payload":{"tag":"li","lines":"9866,9868"}}],"payload":{"tag":"li","lines":"9849,9868"}},{"content":"\n<p data-lines=\"9868,9869\">Choose between template and neural models</p>\n<table data-lines=\"9869,9877\">\n<thead data-lines=\"9869,9870\">\n<tr data-lines=\"9869,9870\">\n<th style=\"text-align:left\">Factor</th>\n<th style=\"text-align:left\">Custom template</th>\n<th style=\"text-align:left\">Custom neural</th>\n</tr>\n</thead>\n<tbody data-lines=\"9871,9877\">\n<tr data-lines=\"9871,9872\">\n<td style=\"text-align:left\">Best for</td>\n<td style=\"text-align:left\">Structured forms with a consistent<br>visual layout</td>\n<td style=\"text-align:left\">Semi-structured or unstructured documents<br>with varying layouts</td>\n</tr>\n<tr data-lines=\"9872,9873\">\n<td style=\"text-align:left\">Training time</td>\n<td style=\"text-align:left\">Minutes</td>\n<td style=\"text-align:left\">Longer<br>(depends on dataset size)</td>\n</tr>\n<tr data-lines=\"9873,9874\">\n<td style=\"text-align:left\">Training cost</td>\n<td style=\"text-align:left\">Lower</td>\n<td style=\"text-align:left\">Higher</td>\n</tr>\n<tr data-lines=\"9874,9875\">\n<td style=\"text-align:left\">Accuracy</td>\n<td style=\"text-align:left\">High for fixed-layout forms;<br>decreases when layout varies</td>\n<td style=\"text-align:left\">Higher overall, especially for documents<br>with format variation</td>\n</tr>\n<tr data-lines=\"9875,9876\">\n<td style=\"text-align:left\">Language support</td>\n<td style=\"text-align:left\">100+ languages</td>\n<td style=\"text-align:left\">Fewer languages<br>(check <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/language-support/custom\">documentation</a> for current support)</td>\n</tr>\n<tr data-lines=\"9876,9877\">\n<td style=\"text-align:left\">Feature support</td>\n<td style=\"text-align:left\">Key-value pairs, selection marks,<br>tables, regions, signatures</td>\n<td style=\"text-align:left\">Overlapping fields, signature detection,<br>table/row/cell confidence</td>\n</tr>\n</tbody>\n</table>\n  <br>\n<p data-lines=\"9880,9884\"><span>&#x1f4a1;</span> <mark>Start with a custom template model if your forms have a consistent<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;visual layout. It&apos;s faster and cheaper to train.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;If accuracy is insufficient or your documents vary in format, switch to a<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;custom neural model.</mark></p>","children":[],"payload":{"tag":"li","lines":"9868,9885"}},{"content":"\n<p data-lines=\"9885,9886\">Custom classifiers</p>","children":[{"content":"Identify the type of a document<br>\nbefore invoking an extraction model","children":[],"payload":{"tag":"li","lines":"9886,9888"}},{"content":"Use a classifier to route incoming<br>\ndocuments to the appropriate extraction model","children":[],"payload":{"tag":"li","lines":"9888,9891"}}],"payload":{"tag":"li","lines":"9885,9891"}},{"content":"\n<p data-lines=\"9891,9892\">Train a custom model</p>","children":[{"content":"1. Store sample forms in an Azure blob container,<br>\nalong with JSON files containing layout and label field information:","children":[{"content":"An <code>ocr.json</code> file for each sample form (generated using the Analyze document function).","children":[],"payload":{"tag":"li","lines":"9894,9895"}},{"content":"A single <code>fields.json</code> file describing the fields you want to extract.","children":[],"payload":{"tag":"li","lines":"9895,9896"}},{"content":"A <code>labels.json</code> file for each sample form, mapping fields to their location in the form.","children":[],"payload":{"tag":"li","lines":"9896,9897"}}],"payload":{"tag":"li","lines":"9892,9897","listIndex":1}},{"content":"2. Generate a shared access signature (SAS) URL for the container.","children":[],"payload":{"tag":"li","lines":"9897,9898","listIndex":2}},{"content":"3. Use the Build model REST API function or the equivalent SDK method.","children":[],"payload":{"tag":"li","lines":"9898,9899","listIndex":3}},{"content":"4. Use the Get model REST API function to retrieve the trained model ID.<br>\n<br><br>\n<span>&#x1f4a1;</span> <mark>Use at least five to six sample forms for training.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;A larger and more varied dataset produces more accurate models.</mark>","children":[],"payload":{"tag":"li","lines":"9899,9904","listIndex":4}}],"payload":{"tag":"li","lines":"9891,9904"}},{"content":"\n<p data-lines=\"9904,9905\">Use a custom model</p>","children":[{"content":"Call the <strong>Analyze document</strong> function with your model ID","children":[],"payload":{"tag":"li","lines":"9905,9906"}},{"content":"Example  <pre><code>\n  endpoint = &quot;YOUR_DOC_INTELLIGENCE_ENDPOINT&quot;\n  key = &quot;YOUR_DOC_INTELLIGENCE_KEY&quot;\n  &#xa0;\n  model_id = &quot;YOUR_CUSTOM_BUILT_MODEL_ID&quot;\n  formUrl = &quot;YOUR_DOCUMENT&quot;\n  &#xa0;\n  document_analysis_client = DocumentAnalysisClient(\n      endpoint=endpoint, credential=AzureKeyCredential(key)\n  )\n  &#xa0;\n  task = document_analysis_client.begin_analyze_document_from_url(model_id, formUrl)\n  result = task.result()\n  </code></pre>","children":[{"content":"Result","children":[{"content":"Successful response contains an<br>\n<code>analyzeResult</code> object","children":[],"payload":{"tag":"li","lines":"9922,9924"}},{"content":"Extracted content","children":[],"payload":{"tag":"li","lines":"9924,9925"}},{"content":"An array of pages containing<br>\ninformation about the document","children":[],"payload":{"tag":"li","lines":"9925,9928"}}],"payload":{"tag":"li","lines":"9921,9928"}}],"payload":{"tag":"li","lines":"9906,9928"}}],"payload":{"tag":"li","lines":"9904,9928"}},{"content":"\n<p data-lines=\"9928,9929\">Composed models</p>","children":[{"content":"Combine multiple custom models<br>\ninto a single <strong>composed model</strong>","children":[],"payload":{"tag":"li","lines":"9929,9931"}},{"content":"Submit a document to a composed model","children":[],"payload":{"tag":"li","lines":"9931,9932"}},{"content":"DI classifies it to determine the<br>\nappropriate component model","children":[],"payload":{"tag":"li","lines":"9932,9934"}},{"content":"Returns the extraction results<br>\nfrom that model","children":[],"payload":{"tag":"li","lines":"9934,9937"}}],"payload":{"tag":"li","lines":"9928,9937"}},{"content":"\n<p data-lines=\"9937,9938\">Learn more</p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/train/custom-model\">Document Intelligence custom models</a>","children":[],"payload":{"tag":"li","lines":"9938,9939"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/train/custom-neural\">Custom neural models</a>","children":[],"payload":{"tag":"li","lines":"9939,9940"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/train/custom-template\">Custom template models</a>","children":[],"payload":{"tag":"li","lines":"9940,9941"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/train/composed-models\">Composed models</a>","children":[],"payload":{"tag":"li","lines":"9941,9943"}}],"payload":{"tag":"li","lines":"9937,9943"}}],"payload":{"tag":"li","lines":"9823,9943"}},{"content":"\n<p data-lines=\"9943,9944\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview\">What is Azure Document Intelligence?</a>","children":[],"payload":{"tag":"li","lines":"9944,9945"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/model-overview\">Azure Document Intelligence model overview</a>","children":[],"payload":{"tag":"li","lines":"9945,9946"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/train/custom-model\">Document Intelligence custom models</a>","children":[],"payload":{"tag":"li","lines":"9946,9947"}},{"content":"<a href=\"https://documentintelligence.ai.azure.com/\">Document Intelligence Studio</a>","children":[],"payload":{"tag":"li","lines":"9947,9948"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/language-support\">Language support for Azure Document Intelligence</a>","children":[],"payload":{"tag":"li","lines":"9948,9950"}}],"payload":{"tag":"li","lines":"9943,9950"}},{"content":"\n<p data-lines=\"9950,9952\"><strong>Exercise -  Analyze documents with Document Intelligence</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-information-extraction/Instructions/Exercises/03-document-intelligence.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"9950,9954"}}],"payload":{"tag":"h3","lines":"9536,9537"}},{"content":"8. <a href=\"https://learn.microsoft.com/en-us/training/modules/ai-knowldge-mining/\">Create a knowledge mining solution with Azure AI Search</a>","children":[{"content":"\n<p data-lines=\"9956,9957\"><strong>Introduction</strong></p>","children":[{"content":"Microsoft Azure AI Search is a cloud-based service designed for<br>\nintelligent search and knowledge mining solutions.","children":[],"payload":{"tag":"li","lines":"9957,9959"}},{"content":"The platform enables organizations to extract, enrich, and<br>\nexplore information from multiple data sources.","children":[],"payload":{"tag":"li","lines":"9959,9961"}},{"content":"Azure AI Search helps transform raw and unstructured data<br>\ninto searchable and actionable insights.","children":[],"payload":{"tag":"li","lines":"9961,9963"}},{"content":"Core capabilities include","children":[{"content":"Connecting to diverse data sources","children":[],"payload":{"tag":"li","lines":"9964,9965"}},{"content":"Creating search indexes","children":[],"payload":{"tag":"li","lines":"9965,9966"}},{"content":"Managing searchable content efficiently","children":[],"payload":{"tag":"li","lines":"9966,9967"}}],"payload":{"tag":"li","lines":"9963,9967"}},{"content":"The indexing process organizes data to support fast and<br>\naccurate search experiences.","children":[],"payload":{"tag":"li","lines":"9967,9969"}},{"content":"AI enrichment features enhance data with additional insights such as","children":[{"content":"Language detection","children":[],"payload":{"tag":"li","lines":"9970,9971"}},{"content":"Key phrase extraction","children":[],"payload":{"tag":"li","lines":"9971,9972"}},{"content":"Image analysis","children":[],"payload":{"tag":"li","lines":"9972,9973"}}],"payload":{"tag":"li","lines":"9969,9973"}},{"content":"AI skills improve the quality and intelligence of<br>\nsearch results by adding contextual understanding to content.","children":[],"payload":{"tag":"li","lines":"9973,9975"}},{"content":"Azure AI Search supports powerful querying and<br>\nfiltering through full-text search capabilities.","children":[],"payload":{"tag":"li","lines":"9975,9977"}},{"content":"The knowledge store feature allows enriched data to be persisted for","children":[{"content":"Advanced analytics","children":[],"payload":{"tag":"li","lines":"9978,9979"}},{"content":"Reporting","children":[],"payload":{"tag":"li","lines":"9979,9980"}},{"content":"Integration with external systems","children":[],"payload":{"tag":"li","lines":"9980,9981"}}],"payload":{"tag":"li","lines":"9977,9981"}},{"content":"Azure AI Search enables the development of scalable, AI-powered<br>\napplications that improve information discovery and decision-making.","children":[],"payload":{"tag":"li","lines":"9981,9984"}}],"payload":{"tag":"li","lines":"9956,9984"}},{"content":"\n<p data-lines=\"9984,9985\"><strong>What is Azure AI Search?</strong></p>","children":[{"content":"Provides a cloud-based solution for<br>\nindexing and querying a wide range of data sources","children":[],"payload":{"tag":"li","lines":"9986,9988"}},{"content":"Create comprehensive and high-scale search solutions","children":[],"payload":{"tag":"li","lines":"9988,9989"}},{"content":"Can","children":[{"content":"Index documents and data from a range of sources","children":[],"payload":{"tag":"li","lines":"9990,9991"}},{"content":"Use AI skills to enrich index data.","children":[],"payload":{"tag":"li","lines":"9991,9992"}},{"content":"Store extracted insights in a knowledge store for<br>\nanalysis and integration.","children":[],"payload":{"tag":"li","lines":"9992,9994"}}],"payload":{"tag":"li","lines":"9989,9994"}},{"content":"Insights extracted from data","children":[{"content":"Text inferred","children":[],"payload":{"tag":"li","lines":"9995,9996"}},{"content":"OCR from images","children":[],"payload":{"tag":"li","lines":"9996,9997"}},{"content":"Entities and key phrases detection through <strong>text analytics</strong>","children":[],"payload":{"tag":"li","lines":"9997,9998"}}],"payload":{"tag":"li","lines":"9994,9998"}},{"content":"Applications","children":[{"content":"Implementing an enterprise search solution to help employees or<br>\ncustomers find information in websites or applications.","children":[],"payload":{"tag":"li","lines":"9999,10001"}},{"content":"Supporting retrieval augmented generation (RAG) in generative AI<br>\napplications by using vector-based indexes for prompt grounding data.","children":[],"payload":{"tag":"li","lines":"10001,10003"}},{"content":"Creating knowledge mining solutions in which the indexing process is<br>\nused to infer insights and extract granular data assets from documents to<br>\nsupport data analytics.","children":[],"payload":{"tag":"li","lines":"10003,10007"}}],"payload":{"tag":"li","lines":"9998,10007"}}],"payload":{"tag":"li","lines":"9984,10007"}},{"content":"\n<p data-lines=\"10007,10008\"><strong>Extract data with an indexer</strong></p>","children":[{"content":"\n<p data-lines=\"10009,10010\">Concepts</p>","children":[{"content":"The indexing process begins with a <strong>data source</strong>, which stores the<br>\noriginal content to be processed and searched.","children":[],"payload":{"tag":"li","lines":"10010,10012"}},{"content":"Data sources can include:","children":[{"content":"Azure Blob Storage containers","children":[],"payload":{"tag":"li","lines":"10013,10014"}},{"content":"Databases","children":[],"payload":{"tag":"li","lines":"10014,10015"}},{"content":"Other structured or unstructured storage systems","children":[],"payload":{"tag":"li","lines":"10015,10016"}}],"payload":{"tag":"li","lines":"10012,10016"}},{"content":"An <strong>Indexer</strong> automates the extraction and processing of<br>\ndata from the source content.","children":[],"payload":{"tag":"li","lines":"10016,10018"}},{"content":"The indexing workflow uses an <strong>enrichment pipeline</strong> to transform raw<br>\ncontent into searchable information.","children":[],"payload":{"tag":"li","lines":"10018,10020"}},{"content":"Document cracking techniques are applied to extract text and<br>\ncontent from documents automatically.","children":[],"payload":{"tag":"li","lines":"10020,10022"}},{"content":"The enrichment process incrementally builds a hierarchical <strong>JSON-based document structure</strong><br>\naligned with the index definition.","children":[],"payload":{"tag":"li","lines":"10022,10024"}},{"content":"Processed and enriched data is stored in a searchable index for<br>\nefficient retrieval.","children":[],"payload":{"tag":"li","lines":"10024,10026"}},{"content":"The resulting index enables fast querying and filtering of<br>\ndocuments based on specific search criteria.","children":[],"payload":{"tag":"li","lines":"10026,10028"}},{"content":"Automated indexing improves scalability, reduces manual<br>\ndata preparation, and enhances search accuracy.","children":[],"payload":{"tag":"li","lines":"10028,10030"}},{"content":"Microsoft Azure AI Search simplifies the creation of intelligent and<br>\nsearchable data solutions.","children":[],"payload":{"tag":"li","lines":"10030,10033"}}],"payload":{"tag":"li","lines":"10009,10033"}},{"content":"\n<p data-lines=\"10033,10034\">How documents are constructed during indexing</p>","children":[{"content":"Process works by creating a<br>\ndocument for each indexed entity","children":[],"payload":{"tag":"li","lines":"10034,10036"}},{"content":"An <em>enrichment pipeline</em> iteratively builds the documents","children":[],"payload":{"tag":"li","lines":"10036,10037"}},{"content":"Combine metadata from the data source with enriched<br>\nfields extracted or generated by <em>skills</em>","children":[],"payload":{"tag":"li","lines":"10037,10039"}},{"content":"Structure of text document","children":[{"content":"Document","children":[{"content":"metadata_storage_name","children":[],"payload":{"tag":"li","lines":"10041,10042"}},{"content":"metadata_author","children":[],"payload":{"tag":"li","lines":"10042,10043"}},{"content":"content","children":[],"payload":{"tag":"li","lines":"10043,10044"}}],"payload":{"tag":"li","lines":"10040,10044"}}],"payload":{"tag":"li","lines":"10039,10044"}},{"content":"Documents in the data<br>\nsource contain images","children":[{"content":"Document","children":[{"content":"metadata_storage_name","children":[],"payload":{"tag":"li","lines":"10047,10048"}},{"content":"metadata_author","children":[],"payload":{"tag":"li","lines":"10048,10049"}},{"content":"content","children":[],"payload":{"tag":"li","lines":"10049,10050"}},{"content":"normalized_images<br>\n(collection)","children":[{"content":"image0","children":[],"payload":{"tag":"li","lines":"10052,10053"}},{"content":"image1","children":[],"payload":{"tag":"li","lines":"10053,10054"}}],"payload":{"tag":"li","lines":"10050,10054"}}],"payload":{"tag":"li","lines":"10046,10054"}}],"payload":{"tag":"li","lines":"10044,10054"}},{"content":"Each skill adds fields to the <strong>document</strong>","children":[],"payload":{"tag":"li","lines":"10054,10055"}},{"content":"Skill detects <em>language</em> used in document","children":[{"content":"Document","children":[{"content":"metadata_storage_name","children":[],"payload":{"tag":"li","lines":"10057,10058"}},{"content":"metadata_author","children":[],"payload":{"tag":"li","lines":"10058,10059"}},{"content":"content","children":[],"payload":{"tag":"li","lines":"10059,10060"}},{"content":"normalized_images<br>\n(collection)","children":[{"content":"image0","children":[],"payload":{"tag":"li","lines":"10062,10063"}},{"content":"image1","children":[],"payload":{"tag":"li","lines":"10063,10064"}}],"payload":{"tag":"li","lines":"10060,10064"}},{"content":"language","children":[],"payload":{"tag":"li","lines":"10064,10065"}}],"payload":{"tag":"li","lines":"10056,10065"}}],"payload":{"tag":"li","lines":"10055,10065"}},{"content":"Document is structured hierarchically","children":[],"payload":{"tag":"li","lines":"10065,10066"}},{"content":"Skills are applied to a<br>\nspecific context within the hierarchy","children":[],"payload":{"tag":"li","lines":"10066,10068"}},{"content":"Optical character recognition (OCR) skill","children":[{"content":"document","children":[{"content":"metadata_storage_name","children":[],"payload":{"tag":"li","lines":"10070,10071"}},{"content":"metadata_author","children":[],"payload":{"tag":"li","lines":"10071,10072"}},{"content":"content","children":[],"payload":{"tag":"li","lines":"10072,10073"}},{"content":"normalized_images","children":[{"content":"image0","children":[{"content":"Text","children":[],"payload":{"tag":"li","lines":"10075,10076"}}],"payload":{"tag":"li","lines":"10074,10076"}},{"content":"image1","children":[{"content":"Text","children":[],"payload":{"tag":"li","lines":"10077,10078"}}],"payload":{"tag":"li","lines":"10076,10078"}}],"payload":{"tag":"li","lines":"10073,10078"}},{"content":"language","children":[],"payload":{"tag":"li","lines":"10078,10079"}}],"payload":{"tag":"li","lines":"10069,10079"}}],"payload":{"tag":"li","lines":"10068,10079"}},{"content":"Output fields from each skill can be used as<br>\ninputs for other skills later in the pipeline","children":[],"payload":{"tag":"li","lines":"10079,10081"}},{"content":"<em>Merge skill</em><br>\n(combine the original text content with the text extracted from each image)","children":[{"content":"document","children":[{"content":"metadata_storage_name","children":[],"payload":{"tag":"li","lines":"10084,10085"}},{"content":"metadata_author","children":[],"payload":{"tag":"li","lines":"10085,10086"}},{"content":"content","children":[],"payload":{"tag":"li","lines":"10086,10087"}},{"content":"normalized_images","children":[{"content":"image0","children":[{"content":"Text","children":[],"payload":{"tag":"li","lines":"10089,10090"}}],"payload":{"tag":"li","lines":"10088,10090"}},{"content":"image1","children":[{"content":"Text","children":[],"payload":{"tag":"li","lines":"10091,10092"}}],"payload":{"tag":"li","lines":"10090,10092"}}],"payload":{"tag":"li","lines":"10087,10092"}},{"content":"language","children":[],"payload":{"tag":"li","lines":"10092,10093"}},{"content":"merged_content<br>\n(new field)","children":[],"payload":{"tag":"li","lines":"10093,10095"}}],"payload":{"tag":"li","lines":"10083,10095"}}],"payload":{"tag":"li","lines":"10081,10095"}},{"content":"Mapping fields by indexer","children":[{"content":"Fields extracted directly from the<br>\nsource data are all mapped to index fields.","children":[{"content":"Implicit mapping<br>\n(fields are automatically mapped to in fields with the<br>\nsame name in the index)","children":[],"payload":{"tag":"li","lines":"10098,10101"}},{"content":"Explicit mapping<br>\n(a mapping is defined to match a source field to an index field,<br>\noften to rename the field to something more useful or to<br>\napply a function to the data value as it is mapped).","children":[],"payload":{"tag":"li","lines":"10101,10105"}}],"payload":{"tag":"li","lines":"10096,10105"}},{"content":"Output fields from the skills in the skillset are<br>\nexplicitly mapped from their hierarchical location in the<br>\noutput to the target field in the index.","children":[],"payload":{"tag":"li","lines":"10105,10109"}}],"payload":{"tag":"li","lines":"10095,10109"}}],"payload":{"tag":"li","lines":"10033,10109"}}],"payload":{"tag":"li","lines":"10007,10109"}},{"content":"\n<p data-lines=\"10109,10110\"><strong>Enrich extracted data with AI skills</strong></p>","children":[{"content":"\n<p data-lines=\"10111,10112\">Built-in skills</p>","children":[{"content":"The enrichment pipeline uses a skillset of<br>\nAI skills to create AI-enriched fields","children":[],"payload":{"tag":"li","lines":"10112,10114"}},{"content":"Indexer applies each skill in order,<br>\nrefining the index document at each step","children":[],"payload":{"tag":"li","lines":"10114,10116"}},{"content":"Skills","children":[{"content":"Detecting the language that text is written in.","children":[],"payload":{"tag":"li","lines":"10117,10118"}},{"content":"Detecting and extracting places, locations, and<br>\nother entities in the text.","children":[],"payload":{"tag":"li","lines":"10118,10120"}},{"content":"Determining and extracting key phrases within a body of text.","children":[],"payload":{"tag":"li","lines":"10120,10121"}},{"content":"Translating text.","children":[],"payload":{"tag":"li","lines":"10121,10122"}},{"content":"Identifying and extracting (or removing) personally identifiable<br>\ninformation (PII) within the text.","children":[],"payload":{"tag":"li","lines":"10122,10124"}},{"content":"Extracting text from images.","children":[],"payload":{"tag":"li","lines":"10124,10125"}},{"content":"Generating captions and tags to describe images.","children":[],"payload":{"tag":"li","lines":"10125,10126"}}],"payload":{"tag":"li","lines":"10116,10126"}},{"content":"To use the built-in skills, indexer must have<br>\naccess to a Foundry Tools resource","children":[],"payload":{"tag":"li","lines":"10126,10128"}},{"content":"Can","children":[{"content":"Use a restricted Azure AI search resource<br>\n(limited to indexing 20 or fewer documents)","children":[],"payload":{"tag":"li","lines":"10129,10131"}},{"content":"Attach a Foundry Tools resource in your Azure subscription<br>\n(must be in the same region as your Azure AI Search resource)","children":[],"payload":{"tag":"li","lines":"10131,10134"}}],"payload":{"tag":"li","lines":"10128,10134"}}],"payload":{"tag":"li","lines":"10111,10134"}},{"content":"\n<p data-lines=\"10134,10135\">Custom skills.</p>","children":[{"content":"Perform custom logic on input<br>\ndata from your index document","children":[],"payload":{"tag":"li","lines":"10135,10137"}},{"content":"Are &quot;wrappers&quot; around services that are<br>\nspecifically designed to extract data from documents","children":[],"payload":{"tag":"li","lines":"10137,10139"}},{"content":"Example","children":[{"content":"Implement a custom skill as an Azure Function","children":[],"payload":{"tag":"li","lines":"10140,10141"}},{"content":"Use it to pass data from your index document to an<br>\nAzure Document Intelligence model","children":[],"payload":{"tag":"li","lines":"10141,10143"}},{"content":"Can extract fields from a form","children":[],"payload":{"tag":"li","lines":"10143,10144"}}],"payload":{"tag":"li","lines":"10139,10144"}},{"content":"<span>&#x1f4a1;</span> <mark>To learn more about using custom skills with Azure AI Search,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;see <a href=\"https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-interface\">Add a custom skill to an Azure AI Search enrichment pipeline</a><br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;in the Azure AI Search documentation.</mark>","children":[],"payload":{"tag":"li","lines":"10144,10148"}}],"payload":{"tag":"li","lines":"10134,10148"}}],"payload":{"tag":"li","lines":"10109,10148"}},{"content":"\n<p data-lines=\"10148,10149\"><strong>Search an index</strong></p>","children":[{"content":"\n<p data-lines=\"10150,10151\">What is an index</p>","children":[{"content":"Index is the searchable result of the<br>\nindexing process","children":[],"payload":{"tag":"li","lines":"10151,10153"}},{"content":"It&apos;s a collection of JSON documents","children":[],"payload":{"tag":"li","lines":"10153,10154"}},{"content":"Documents that contain fields that contain<br>\nthe values extracted during indexing","children":[],"payload":{"tag":"li","lines":"10154,10156"}},{"content":"Client applications can query the index to retrieve,<br>\nfilter, and sort information","children":[],"payload":{"tag":"li","lines":"10156,10158"}},{"content":"Each index field can have the<br>\nfollowing attributes","children":[{"content":"key<br>\nFields that define a unique key for index records.","children":[],"payload":{"tag":"li","lines":"10160,10162"}},{"content":"searchable<br>\nFields that can be queried using full-text search.","children":[],"payload":{"tag":"li","lines":"10162,10164"}},{"content":"filterable<br>\nFields that can be included in filter expressions to return<br>\nonly documents that match specified constraints.","children":[],"payload":{"tag":"li","lines":"10164,10167"}},{"content":"sortable<br>\nFields that can be used to order the results.","children":[],"payload":{"tag":"li","lines":"10167,10169"}},{"content":"facetable<br>\nFields that can be used to determine values for facets<br>\n(user interface elements used to filter the results based on a<br>\nlist of known field values).","children":[],"payload":{"tag":"li","lines":"10169,10173"}},{"content":"retrievable<br>\nFields that can be included in search results<br>\n(by default, all fields are retrievable unless<br>\nthis attribute is explicitly removed).","children":[],"payload":{"tag":"li","lines":"10173,10178"}}],"payload":{"tag":"li","lines":"10158,10178"}}],"payload":{"tag":"li","lines":"10150,10178"}},{"content":"\n<p data-lines=\"10178,10179\">Full-text search</p>","children":[{"content":"Describes search solutions that parse text-based<br>\ndocument contents to find query terms","children":[],"payload":{"tag":"li","lines":"10179,10181"}},{"content":"Are based on the Lucene query syntax","children":[],"payload":{"tag":"li","lines":"10181,10182"}},{"content":"Azure AI Search supports two variants","children":[{"content":"Simple<br>\nAn intuitive syntax that makes it easy to perform basic<br>\nsearches that match literal query terms submitted by a user.","children":[],"payload":{"tag":"li","lines":"10183,10186"}},{"content":"Full<br>\nAn extended syntax that supports complex filtering,<br>\nregular expressions, and other more sophisticated queries.","children":[],"payload":{"tag":"li","lines":"10186,10189"}}],"payload":{"tag":"li","lines":"10182,10189"}},{"content":"Parameters submitted with a query","children":[{"content":"search<br>\nA search expression that includes the terms to be found.","children":[],"payload":{"tag":"li","lines":"10190,10192"}},{"content":"queryType<br>\nThe Lucene syntax to be evaluated (<em>simple</em> or <em>full</em>).","children":[],"payload":{"tag":"li","lines":"10192,10194"}},{"content":"searchFields<br>\nThe index fields to be searched.","children":[],"payload":{"tag":"li","lines":"10194,10196"}},{"content":"select<br>\nThe fields to be included in the results.","children":[],"payload":{"tag":"li","lines":"10196,10198"}},{"content":"searchMode<br>\nCriteria for including results based on multiple search terms.","children":[{"content":"Example<br>\nSuppose you search an index of travel-related documents for comfortable hotel.<br>\nA <code>searchMode</code> value of <em>Any</em> returns documents that contain<br>\n&quot;comfortable&quot;, &quot;hotel&quot;, or both;<br>\nwhile a <code>searchMode</code> value of <em>All</em> restricts results to documents that<br>\ncontain both &quot;comfortable&quot; and &quot;hotel&quot;.","children":[],"payload":{"tag":"li","lines":"10200,10206"}}],"payload":{"tag":"li","lines":"10198,10206"}}],"payload":{"tag":"li","lines":"10189,10206"}},{"content":"Query processing","children":[{"content":"1. \n<p data-lines=\"10207,10208\">Query parsing</p>","children":[{"content":"Search expression is evaluated and reconstructed as a<br>\ntree of appropriate subqueries.","children":[],"payload":{"tag":"li","lines":"10208,10210"}},{"content":"Subqueries might include","children":[{"content":"Term queries<br>\n(finding specific individual words in the search expression - for example hotel)","children":[],"payload":{"tag":"li","lines":"10211,10213"}},{"content":"Phrase queries<br>\n(finding multi-term phrases specified in quotation marks in the search expression - for example, &quot;free parking&quot;)","children":[],"payload":{"tag":"li","lines":"10213,10215"}},{"content":"Prefix queries<br>\n(finding terms with a specified prefix - for example air*, which would match airway, air-conditioning, and airport).","children":[],"payload":{"tag":"li","lines":"10215,10217"}}],"payload":{"tag":"li","lines":"10210,10217"}}],"payload":{"tag":"li","lines":"10207,10217","listIndex":1}},{"content":"2. \n<p data-lines=\"10217,10218\">Lexical analysis</p>","children":[{"content":"Query terms are analyzed and refined based on linguistic rules.<br>\nFor example, text is converted to lower case and nonessential stopwords<br>\n(such as &quot;the&quot;, &quot;a&quot;, &quot;is&quot;, and so on) are removed.","children":[],"payload":{"tag":"li","lines":"10218,10221"}},{"content":"Words are converted to their root form<br>\n(for example, &quot;comfortable&quot; might be simplified to &quot;comfort&quot;)","children":[],"payload":{"tag":"li","lines":"10221,10223"}},{"content":"Composite words are split into their constituent terms.","children":[],"payload":{"tag":"li","lines":"10223,10224"}}],"payload":{"tag":"li","lines":"10217,10224","listIndex":2}},{"content":"3. \n<p data-lines=\"10224,10225\">Document retrieval</p>","children":[{"content":"Query terms are matched against the indexed terms","children":[],"payload":{"tag":"li","lines":"10225,10226"}},{"content":"Set of matching documents is identified.","children":[],"payload":{"tag":"li","lines":"10226,10227"}}],"payload":{"tag":"li","lines":"10224,10227","listIndex":3}},{"content":"4. \n<p data-lines=\"10227,10230\">Scoring<br>\nA relevance score is assigned to each result based on a<br>\nterm frequency/inverse document frequency (TF/IDF) calculation.</p>\n <br>\n<p data-lines=\"10233,10235\"><span>&#x1f4a1;</span> <mark>For more information about querying an index, and details about simple and full syntax,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;see <a href=\"https://learn.microsoft.com/en-us/azure/search/search-query-overview\">Query types and composition in Azure AI Search</a> in the Azure AI Search documentation.</mark></p>","children":[],"payload":{"tag":"li","lines":"10227,10236","listIndex":4}}],"payload":{"tag":"li","lines":"10206,10236"}}],"payload":{"tag":"li","lines":"10178,10236"}},{"content":"\n<p data-lines=\"10236,10237\">Filtering results</p>","children":[{"content":"Apply filters by","children":[{"content":"Including filter criteria in a <em>simple</em> <strong>search</strong> expression.","children":[],"payload":{"tag":"li","lines":"10238,10239"}},{"content":"Providing an OData filter expression as a <code>&#x24;filter</code> parameter<br>\nwith a full syntax search expression.","children":[],"payload":{"tag":"li","lines":"10239,10241"}}],"payload":{"tag":"li","lines":"10237,10241"}},{"content":"Can apply a filter to any filterable field in the index","children":[],"payload":{"tag":"li","lines":"10241,10242"}},{"content":"Example","children":[{"content":"\n<p data-lines=\"10243,10245\">Find documents containing the text <em>London</em> that have an<br>\n<strong>author</strong> field value of <em>Reviewer</em></p>","children":[],"payload":{"tag":"li","lines":"10243,10246"}},{"content":"\n<p data-lines=\"10246,10247\">Search expression</p>\n  <pre><code>\n  search=London+author=&apos;Reviewer&apos;\n  queryType=Simple\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"10246,10251"}},{"content":"\n<p data-lines=\"10251,10253\">OData filter in a <code>&#x24;filter</code> parameter with a<br>\n<em>full</em> Lucene search expression</p>\n  <pre><code>\n  search=London\n  &#x24;filter=author eq &apos;Reviewer&apos;\n  queryType=Full\n  </code></pre>\n  <br>\n<p data-lines=\"10261,10262\"><span>&#x2690;</span> <mark>OData &#x24;filter expressions are case-sensitive!</mark></p>","children":[],"payload":{"tag":"li","lines":"10251,10263"}}],"payload":{"tag":"li","lines":"10242,10263"}}],"payload":{"tag":"li","lines":"10236,10263"}},{"content":"\n<p data-lines=\"10263,10264\">Filtering with facets</p>","children":[{"content":"Work best when a field has a<br>\nsmall number of discrete values","children":[],"payload":{"tag":"li","lines":"10264,10266"}},{"content":"Must specify facetable fields for which you want to<br>\nretrieve the possible values in an initial query","children":[],"payload":{"tag":"li","lines":"10266,10268"}},{"content":"Example<br>\n(use the following parameters to return all of the<br>\npossible values for the author field)  <pre>\n  search=*\n  facet=author\n  </pre>","children":[],"payload":{"tag":"li","lines":"10268,10275"}},{"content":"Example<br>\n(subsequent query)  <pre>\n  search=*\n  &#x24;filter=author eq &apos;selected-facet-value-here&apos;\n</pre>","children":[],"payload":{"tag":"li","lines":"10275,10280"}}],"payload":{"tag":"li","lines":"10263,10282"}},{"content":"\n<p data-lines=\"10282,10283\">Sorting results</p>","children":[{"content":"\n<p data-lines=\"10283,10285\">By default, results are sorted based on the<br>\nrelevancy score assigned by the query process</p>","children":[],"payload":{"tag":"li","lines":"10283,10285"}},{"content":"\n<p data-lines=\"10285,10287\">Can override this sort order by including an OData <code>orderby</code> parameter<br>\nthat specifies one or more <em>sortable</em> fields and a sort order (<em>asc</em> or <em>desc</em>)</p>","children":[],"payload":{"tag":"li","lines":"10285,10287"}},{"content":"\n<p data-lines=\"10287,10288\">Example</p>\n  <pre><code>\n  search=*\n  &#x24;orderby=last_modified desc\n  </code></pre>\n  <br>\n<p data-lines=\"10295,10297\"><span>&#x1f4a1;</span> <mark>For more information about using filters, see<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/search/search-filters\">Filters in Azure AI Search</a> in the Azure AI Search documentation.</mark></p>","children":[],"payload":{"tag":"li","lines":"10287,10298"}}],"payload":{"tag":"li","lines":"10282,10298"}}],"payload":{"tag":"li","lines":"10148,10298"}},{"content":"\n<p data-lines=\"10298,10299\"><strong>Persist extracted information in a knowledge store</strong></p>","children":[{"content":"How to use enriched data","children":[{"content":"Since the index is essentially a collection of JSON objects,<br>\neach representing an indexed record, it might be useful to export the<br>\nobjects as JSON files for integration into a data orchestration process for<br>\nextract, transform, and load (ETL) operations.","children":[],"payload":{"tag":"li","lines":"10301,10305"}},{"content":"You may want to normalize the index records into a relational schema of<br>\ntables for analysis and reporting.","children":[],"payload":{"tag":"li","lines":"10305,10307"}},{"content":"Having extracted embedded images from documents during the<br>\nindexing process, you might want to save those images as files.","children":[],"payload":{"tag":"li","lines":"10307,10309"}},{"content":"Azure AI Search supports these scenarios by enabling you to<br>\ndefine a <em>knowledge store</em> in the skillset","children":[],"payload":{"tag":"li","lines":"10309,10311"}},{"content":"Knowledge store consists of projections of the enriched data","children":[{"content":"JSON objects","children":[],"payload":{"tag":"li","lines":"10312,10313"}},{"content":"Tables","children":[],"payload":{"tag":"li","lines":"10313,10314"}},{"content":"Image files","children":[],"payload":{"tag":"li","lines":"10314,10315"}}],"payload":{"tag":"li","lines":"10311,10315"}},{"content":"<span>&#x1f4a1;</span> <mark>To learn more about using a knowledge store, see<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/search/knowledge-store-concept-intro\">Knowledge store in Azure AI Search</a> in the Azure AI Search documentation.</mark>","children":[],"payload":{"tag":"li","lines":"10315,10318"}}],"payload":{"tag":"li","lines":"10300,10318"}}],"payload":{"tag":"li","lines":"10298,10318"}},{"content":"\n<p data-lines=\"10318,10319\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/search/\">Azure AI Search documentation</a>","children":[],"payload":{"tag":"li","lines":"10319,10321"}}],"payload":{"tag":"li","lines":"10318,10321"}},{"content":"\n<p data-lines=\"10321,10323\"><strong>Exercise -  Create a knowledge mining solution</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-information-extraction/Instructions/Exercises/04-knowledge-mining.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"10321,10323"}}],"payload":{"tag":"h3","lines":"9954,9955"}}],"payload":{"tag":"h2","lines":"8125,8126"}}],"payload":{"tag":"h1","lines":"6,7"}},{"initialExpandLevel":0,"spacingVertical":30})</script>
