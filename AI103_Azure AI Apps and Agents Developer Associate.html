br>\nThe API endpoint where your application sends requests","children":[],"payload":{"tag":"li","lines":"507,509"}},{"content":"Authentication key<br>\nThe secret key or token your application presents to authenticate requests","children":[],"payload":{"tag":"li","lines":"509,511"}},{"content":"Deployment name<br>\nThe name specified during deployment","children":[],"payload":{"tag":"li","lines":"511,514"}}],"payload":{"tag":"li","lines":"506,514"}}],"payload":{"tag":"li","lines":"403,514"}},{"content":"\n<p data-lines=\"514,515\"><strong>Evaluate model performance</strong></p>","children":[{"content":"\n<p data-lines=\"516,517\">Why evaluate models</p>","children":[{"content":"Quality assurance<br>\nIdentifies issues and ensures your model provides accurate, relevant responses","children":[],"payload":{"tag":"li","lines":"517,519"}},{"content":"User satisfaction<br>\nImproves when models consistently deliver helpful, appropriate responses","children":[],"payload":{"tag":"li","lines":"519,521"}},{"content":"Continuous improvement<br>\nAnalyze evaluation results to identify enhancement opportunities","children":[],"payload":{"tag":"li","lines":"521,523"}},{"content":"Compliance and safety<br>\nVerification confirms your model<br>\n- Adheres to policies<br>\n- Avoid generating harmful content<br>\n- Respect user privacy<br>\n- Respect data protection requirements","children":[],"payload":{"tag":"li","lines":"523,530"}}],"payload":{"tag":"li","lines":"516,530"}},{"content":"\n<p data-lines=\"530,531\">Manual evaluation</p>","children":[{"content":"Manual evaluation involves human reviewers assessing model responses","children":[],"payload":{"tag":"li","lines":"531,532"}},{"content":"Interactive testing in the playground lets explore model behavior qualitatively","children":[],"payload":{"tag":"li","lines":"532,533"}},{"content":"Structured review involves creating a set of<br>test cases representing your application&apos;s use cases based on criteria","children":[{"content":"Relevance :: Does the response address the question or request?","children":[],"payload":{"tag":"li","lines":"534,535"}},{"content":"Informativeness :: Does it provide sufficient detail and useful information?","children":[],"payload":{"tag":"li","lines":"535,536"}},{"content":"Engagement :: Is the response interesting and appropriately conversational?","children":[],"payload":{"tag":"li","lines":"536,537"}},{"content":"Accuracy :: Are facts and statements correct?","children":[],"payload":{"tag":"li","lines":"537,538"}},{"content":"Safety :: Does the response avoid harmful, biased, or inappropriate content?","children":[],"payload":{"tag":"li","lines":"538,539"}},{"content":"Aggregate ratings across multiple test cases provide quantitative measures of overall quality","children":[],"payload":{"tag":"li","lines":"539,540"}}],"payload":{"tag":"li","lines":"533,540"}},{"content":"User studies collect fedback from actual or<br>representative users interacting with the application","children":[],"payload":{"tag":"li","lines":"540,541"}},{"content":"Manual evaluation is a complements automated approaches","children":[],"payload":{"tag":"li","lines":"541,542"}},{"content":"Manual evaluation capture subjectivity","children":[{"content":"User satisfaction","children":[],"payload":{"tag":"li","lines":"543,544"}},{"content":"Contextual appropriateness","children":[],"payload":{"tag":"li","lines":"544,545"}},{"content":"Brand alignment","children":[],"payload":{"tag":"li","lines":"545,547"}}],"payload":{"tag":"li","lines":"542,547"}}],"payload":{"tag":"li","lines":"530,547"}},{"content":"\n<p data-lines=\"547,548\">Automated evaluation metrics</p>","children":[{"content":"Uses standard metrics to assess model outputs automatically","children":[],"payload":{"tag":"li","lines":"548,549"}},{"content":"Scale efficiently","children":[],"payload":{"tag":"li","lines":"549,550"}},{"content":"Provide consistent, objective measurements","children":[],"payload":{"tag":"li","lines":"550,551"}},{"content":"Generation quality metrics","children":[{"content":"Groundedness<br>\nDetermines whether responses are based on provided context<br>rather than speculation<br>\nGroundedness Pro offers binary assessment (grounded or not grounded)<br>useful for factual accuracy requirements.","children":[],"payload":{"tag":"li","lines":"552,555"}},{"content":"Relevance<br>\nMeasures whether responses address the user&apos;s question or request appropriately","children":[],"payload":{"tag":"li","lines":"555,557"}},{"content":"Coherence<br>\nAssesses whether responses flow logically and maintain consistent ideas.","children":[],"payload":{"tag":"li","lines":"557,559"}},{"content":"Fluency<br>\nEvaluates linguistic correctness and natural language quality","children":[],"payload":{"tag":"li","lines":"559,561"}}],"payload":{"tag":"li","lines":"551,561"}},{"content":"Risk and safeety metrics","children":[{"content":"Self-harm content<br>\nDetects responses discussing or encouraging self-harm","children":[],"payload":{"tag":"li","lines":"562,564"}},{"content":"Hateful and unfair content<br>\nIdentifies bias, discrimination, or hateful statements","children":[],"payload":{"tag":"li","lines":"564,566"}},{"content":"Violent content<br>\nFlags responses containing or promoting violence","children":[],"payload":{"tag":"li","lines":"566,568"}},{"content":"Sexual content<br>\nDetects inappropriate sexual content","children":[],"payload":{"tag":"li","lines":"568,570"}},{"content":"Protected material<br>\nIdentifies potential copyright or proprietary content reproduction","children":[],"payload":{"tag":"li","lines":"570,572"}},{"content":"Indirect attack (jailbreak)<br>\nAssesses vulnerability to manipulation attempts","children":[],"payload":{"tag":"li","lines":"572,574"}},{"content":"For content harm metrics, results aggregate as <strong>defect rate</strong><br>\nPercentage of responses exceeding a severity threshold (typically Medium)","children":[],"payload":{"tag":"li","lines":"574,576"}},{"content":"For protected material and indirect attack<br>\ndefect rate <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mo fence=\"false\" stretchy=\"true\" minsize=\"1.8em\" maxsize=\"1.8em\">(</mo><mfrac><mtext>true&#xa0;instances</mtext><mtext>total&#xa0;instances</mtext></mfrac><mo fence=\"false\" stretchy=\"true\" minsize=\"1.8em\" maxsize=\"1.8em\">)</mo><mo>&#xd7;</mo><mn>100</mn></mrow><annotation encoding=\"application/x-tex\"> = \\Big(\\frac{\\text{true instances}}{\\text{total instances}}\\Big) \\times 100</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.3669em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1.8em;vertical-align:-0.65em;\"></span><span class=\"mord\"><span class=\"delimsizing size2\">(</span></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8615em;\"><span style=\"top:-2.655em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord text mtight\"><span class=\"mord mtight\">total&#xa0;instances</span></span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.394em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord text mtight\"><span class=\"mord mtight\">true&#xa0;instances</span></span></span></span></span></span><span class=\"vlist-s\">&#x200b;</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.345em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mord\"><span class=\"delimsizing size2\">)</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#xd7;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">100</span></span></span></span>","children":[],"payload":{"tag":"li","lines":"576,578"}},{"content":"AI-assisted evaluation need to specify a GPT model to perform the assessment","children":[],"payload":{"tag":"li","lines":"578,580"}}],"payload":{"tag":"li","lines":"561,580"}}],"payload":{"tag":"li","lines":"547,580"}},{"content":"\n<p data-lines=\"580,581\">Natural Language Processing (NLP) metrics</p>","children":[{"content":"Are mathmatical-based evaluation","children":[],"payload":{"tag":"li","lines":"581,582"}},{"content":"Need ground truth data &#x2014; expected or correct responses for comparison","children":[],"payload":{"tag":"li","lines":"582,583"}},{"content":"F1-score<br>\nMeasures the ratio of shared words between generated and ground truth answers<br>\nBalancing precision (avoiding incorrect words) and recall (including important words)<br>\nIs valuable for tasks like text classification and information retrieval","children":[],"payload":{"tag":"li","lines":"583,587"}},{"content":"Bilingual Evaluation Understudy (BLEU)<br>\nCompares n-grams (word sequences) between generated and reference texts, commonly used for machine translation evaluation","children":[],"payload":{"tag":"li","lines":"587,589"}},{"content":"Metric for Evaluation of Translation with Explicit Ordering (METEOR)<br>\nExtends BLEU by accounting for <code>synonyms</code>, <code>stemming</code>, and <code>paraphrasing</code>, providing more flexible comparison","children":[],"payload":{"tag":"li","lines":"589,591"}},{"content":"Recall-Oriented Understudy for Gisting Evaluation (ROUGE)<br>\nEmphasizes recall over precision<br>\nUseful for summarization tasks where covering key points matters more than avoiding extra words","children":[],"payload":{"tag":"li","lines":"591,594"}},{"content":"Google-BLEU (GLEU)<br>\nis a variant of BLEU designed for sentence-level evaluation","children":[],"payload":{"tag":"li","lines":"594,596"}},{"content":"NLP metrics work well when you have definitive correct answers or reference texts","children":[],"payload":{"tag":"li","lines":"596,598"}}],"payload":{"tag":"li","lines":"580,598"}},{"content":"\n<p data-lines=\"598,599\">Create comprehensive evaluations</p>","children":[{"content":"<strong>Evaluation</strong> feature lets you run systematic evaluations<br>using test datasets and multiple metrics simultaneously","children":[],"payload":{"tag":"li","lines":"599,600"}},{"content":"Evaluation can be one of the following","children":[{"content":"Model<br>\nEvaluate a deployed model with prompts you specify<br>\nThe system generates outputs during evaluation","children":[],"payload":{"tag":"li","lines":"601,604"}},{"content":"Agent<br>\nEvaluate an agent&apos;s responses with user-defined prompts.","children":[],"payload":{"tag":"li","lines":"604,606"}},{"content":"Dataset<br>\nEvaluate pre-generated outputs already present in your test dataset","children":[],"payload":{"tag":"li","lines":"606,608"}}],"payload":{"tag":"li","lines":"600,608"}},{"content":"Dataset to provide inputs for assessment can be","children":[{"content":"Upload new dataset<br>\nProvide a CSV or JSONL file containing test cases from your local storage.","children":[],"payload":{"tag":"li","lines":"609,611"}},{"content":"Use existing dataset<br>\nSelect from datasets you&apos;ve previously uploaded to your project.","children":[],"payload":{"tag":"li","lines":"611,613"}},{"content":"Generate synthetic dataset<br>\nThe system can generate sample data based on a topic description you provide.","children":[],"payload":{"tag":"li","lines":"613,615"}},{"content":"Pre-generated outputs<br>\nselect or upload your dataset containing both inputs and model-generated responses","children":[],"payload":{"tag":"li","lines":"615,618"}}],"payload":{"tag":"li","lines":"608,618"}}],"payload":{"tag":"li","lines":"598,618"}},{"content":"\n<p data-lines=\"618,619\">Review evaluation results</p>","children":[{"content":"The results show aggregate scores for the metrics you selected and details of each test prompt","children":[],"payload":{"tag":"li","lines":"619,621"}}],"payload":{"tag":"li","lines":"618,621"}},{"content":"\n<p data-lines=\"621,622\">Explore the evaluator library</p>","children":[{"content":"Provides a centralized location to view and manage all available evaluators","children":[],"payload":{"tag":"li","lines":"622,623"}},{"content":"Supports version management","children":[{"content":"Letting you compare different versions","children":[],"payload":{"tag":"li","lines":"624,625"}},{"content":"Restore previous versions if needed","children":[],"payload":{"tag":"li","lines":"625,626"}},{"content":"Collaborate with others on custom evaluators","children":[],"payload":{"tag":"li","lines":"626,627"}}],"payload":{"tag":"li","lines":"623,627"}},{"content":"Access from project&apos;s <code>Evaluation</code> page by selecting the<br> <code>Evaluator library</code> tab","children":[],"payload":{"tag":"li","lines":"627,628"}},{"content":"We can","children":[{"content":"View MS-curated evaluators for quality, safety, and performance","children":[],"payload":{"tag":"li","lines":"629,630"}},{"content":"Examine evaluator details including name, description, parameters, and associated files","children":[],"payload":{"tag":"li","lines":"630,631"}},{"content":"Review annotation prompts for quality evaluators to understand how metrics are calculated","children":[],"payload":{"tag":"li","lines":"631,632"}},{"content":"Check definitions and "}},{"content":"Send prompts to deployed models and see responses in real time","children":[],"payload":{"tag":"li","lines":"692,693"}},{"content":"Adjust settings like temperature and max tokens","children":[],"payload":{"tag":"li","lines":"693,694"}},{"content":"Add system messages to customize model behavior","children":[],"payload":{"tag":"li","lines":"694,695"}},{"content":"Experiment with different models and configurations","children":[],"payload":{"tag":"li","lines":"695,697"}}],"payload":{"tag":"li","lines":"690,697"}},{"content":"\n<p data-lines=\"697,698\">Generating code samples</p>","children":[{"content":"API<br>Using Responses API, or another API like ChatCompletions","children":[],"payload":{"tag":"li","lines":"698,699"}},{"content":"Language<br>Select you preferred programming language","children":[],"payload":{"tag":"li","lines":"699,700"}},{"content":"SDK<br>Choose which SDK you want to see a sample of","children":[],"payload":{"tag":"li","lines":"700,701"}},{"content":"Samples are populated with","children":[{"content":"Project endpoint","children":[],"payload":{"tag":"li","lines":"702,703"}},{"content":"Model deployment name","children":[],"payload":{"tag":"li","lines":"703,704"}},{"content":"Current settings","children":[],"payload":{"tag":"li","lines":"704,706"}}],"payload":{"tag":"li","lines":"701,706"}}],"payload":{"tag":"li","lines":"697,706"}},{"content":"\n<p data-lines=\"706,707\">From playground to code</p>","children":[{"content":"Explore in the playground<br>Test prompts, adjust settings, and find what works","children":[],"payload":{"tag":"li","lines":"707,708"}},{"content":"Generate code samples<br>Use the Code tab to get SDK samples","children":[],"payload":{"tag":"li","lines":"708,709"}},{"content":"Develop your application<br>Take the generated code and customize it for your specific needs","children":[],"payload":{"tag":"li","lines":"709,710"}},{"content":"Iterate and refine<br>Return to the playground to test new ideas, then update your code","children":[],"payload":{"tag":"li","lines":"710,712"}}],"payload":{"tag":"li","lines":"706,712"}}],"payload":{"tag":"li","lines":"688,712"}},{"content":"\n<p data-lines=\"712,713\"><strong>Choose an endpoint and SDK</strong></p>","children":[{"content":"\n<p data-lines=\"713,714\">Considerations for<br>developing an application</p>","children":[{"content":"Endpoints<br>\nEach MS Foundry project has both a Project endpoint and an Azure OpenAI endpoint.","children":[],"payload":{"tag":"li","lines":"714,716"}},{"content":"Client SDK<br>\nDepending on the endpoint you can choose to use the MS Foundry SDK or<br>the OpenAI SDK to develop a generative AI chat application","children":[],"payload":{"tag":"li","lines":"716,718"}},{"content":"Authentication<br>\nProduction applications should use MS Entra ID authentication, which requires the application to be running in the context of a specific identity<br>\nOr can also use key-based or token-based authentication.","children":[],"payload":{"tag":"li","lines":"718,721"}},{"content":"Chat API (OpenAI client API)","children":[{"content":"ChatCompletions API<br>Is well-established and compatible across many generative AI models and platforms","children":[],"payload":{"tag":"li","lines":"722,723"}},{"content":"Responses API<br>Recommended for most new development projects","children":[],"payload":{"tag":"li","lines":"723,725"}}],"payload":{"tag":"li","lines":"721,725"}}],"payload":{"tag":"li","lines":"713,725"}},{"content":"\n<p data-lines=\"725,726\">Using the Foundry SDK with the project endpoint</p>","children":[{"content":"<a href=\"https://pypi.org/project/azure-ai-projects\">Azure AI Projects for Python</a>","children":[],"payload":{"tag":"li","lines":"726,727"}},{"content":"<a href=\"https://www.nuget.org/packages/Azure.AI.Projects\">Azure AI Projects for MS .NET</a>","children":[],"payload":{"tag":"li","lines":"727,728"}},{"content":"<a href=\"https://www.npmjs.com/package/@azure/ai-projects\">Azure AI Projects for JavaScript</a>","children":[],"payload":{"tag":"li","lines":"728,730"}}],"payload":{"tag":"li","lines":"725,730"}},{"content":"\n<p data-lines=\"730,732\">Installing the SDK(Python)<br>\n<code>pip install azure-ai-projects azure-identity openai</code></p>","children":[],"payload":{"tag":"li","lines":"730,733"}},{"content":"\n<p data-lines=\"733,734\">Connecting to the project endpoint</p>","children":[{"content":"\n<p data-lines=\"734,736\">Format<br>\n<code>https://{resource-name}.services.ai.azure.com/api/projects/&lt;project-name&gt;</code></p>","children":[],"payload":{"tag":"li","lines":"734,736"}},{"content":"\n<p data-lines=\"736,737\">Create <strong>AIProjectClient</strong> object</p>\n  <pre><code>\n      from azure.identity import DefaultAzureCredential\n      from azure.ai.projects import AIProjectClient\n      project_endpoint = &quot;https://{resource-name}.services.ai.azure.com/api/projects/<project-name>&quot;\n      project_client = AIProjectClient(\n          credential=DefaultAzureCredential(),\n          endpoint=project_endpoint\n      )\n  </project-name></code></pre>\n  <br>\n<p data-lines=\"748,749\"><span>&#x26a0;</span> <mark>Need to install the <code>azure-identity</code> package</mark></p>","children":[],"payload":{"tag":"li","lines":"736,749"}},{"content":"\n<p data-lines=\"749,750\">The projet client (<code>AIProjectClient</code>) can</p>","children":[{"content":"Retrieve resource connections","children":[],"payload":{"tag":"li","lines":"750,751"}},{"content":"Access project configuration","children":[],"payload":{"tag":"li","lines":"751,752"}},{"content":"Enable tracing","children":[],"payload":{"tag":"li","lines":"752,753"}},{"content":"Manage datasets and indexes","children":[],"payload":{"tag":"li","lines":"753,755"}}],"payload":{"tag":"li","lines":"749,755"}}],"payload":{"tag":"li","lines":"733,755"}},{"content":"\n<p data-lines=\"755,756\">Creating a chat client</p>","children":[{"content":"\n<p data-lines=\"756,759\">Use OpenAI-compatible client object <strong>get_openai_client()</strong><br>\n<code>openai_client = project_client.get_openai_client(api_version=&quot;2024-10-21&quot;)</code><br>\n<br></p>\n<p data-lines=\"760,761\"><span>&#x26a0;</span> <mark>Need to install the <code>openai</code> package</mark></p>","children":[],"payload":{"tag":"li","lines":"756,762"}}],"payload":{"tag":"li","lines":"755,762"}},{"content":"\n<p data-lines=\"762,763\">Install SDK</p>","children":[{"content":"\n<p data-lines=\"763,766\">From PyPI<br>\n<code>pip install openai azure-identity</code><br>\n<br></p>\n<p data-lines=\"767,768\"><span>&#x26a0;</span> <mark>The <code>azure-identity</code> package is required if you intend to use token-based authentication to<br>&#xa0;&#xa0;&#xa0;&#xa0;connect to the endpoint using MS Entra ID credentials</mark></p>","children":[],"payload":{"tag":"li","lines":"763,769"}}],"payload":{"tag":"li","lines":"762,769"}},{"content":"\n<p data-lines=\"769,770\">Connecting to The Azure OpenAI endpoint</p>","children":[{"content":"\n<p data-lines=\"770,771\"><strong>Overview</strong> page to get the endpoint at <a href=\"https://ai.azure.com\">https://ai.azure.com</a></p>","children":[],"payload":{"tag":"li","lines":"770,771"}},{"content":"\n<p data-lines=\"771,773\">Format<br>\n<code>https://{resource-name}.openai.azure.com/openai/v1</code></p>","children":[],"payload":{"tag":"li","lines":"771,773"}},{"content":"\n<p data-lines=\"773,774\">Create an OpenAI client with your endpoint and Azure credentials</p>\n  <pre><code>\n      from openai import OpenAI\n      from azure.identity import DefaultAzureCredential, get_bearer_token_provider\n      token_provider = get_bearer_token_provider(\n          DefaultAzureCredential(), &quot;https://ai.azure.com/.default&quot;\n      )\n      openai_client = OpenAI(  \n      base_url = &quot;https://{resource-name}.openai.azure.com/openai/v1/&quot;,  \n      api_key=token_provider,\n      )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"773,785"}},{"content":"\n<p data-lines=\"785,786\">API key authentication</p>\n  <pre><code>\n  import os\n  from openai import OpenAI\n  openai_client = OpenAI(\n      api_key=os.getenv(&quot;AZURE_OPENAI_API_KEY&quot;),\n      base_url=&quot;https://{resource-name}.openai.azure.com/openai/v1/&quot;\n  )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"785,794"}},{"content":"\n<p data-lines=\"794,797\">Environment variables<br>\n<span>&#x26a0;</span> <mark>Need to set <code>OPENAI_BASE_URL</code> and <code>OPENAI_API_KEY</code> environment variables</mark><br>\n<br></p>\n  <pre><code>\n      from openai import OpenAI\n      openai_client = OpenAI()  # Uses environment variables\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"794,802"}},{"content":"\n<p data-lines=\"802,803\">OpenAI client handles<br>model inference operations</p>","children":[{"content":"Generating responses with the Responses API","children":[],"payload":{"tag":"li","lines":"803,804"}},{"content":"Chat completions and image generation","children":[],"payload":{"tag":"li","lines":"804,805"}},{"content":"Accessing Foundry direct models (non-Azure OpenAI models)","children":[],"payload":{"tag":"li","lines":"805,807"}}],"payload":{"tag":"li","lines":"802,807"}},{"content":"\n<p data-lines=\"807,808\">Using an AzureOpenAI client object</p>","children":[{"content":"if you need to use functionality from a<br>specific version of the Azure OpenAI API","children":[],"payload":{"tag":"li","lines":"808,809"}},{"content":"Must specify the API version","children":[],"payload":{"tag":"li","lines":"809,810"}},{"content":"Must specify the Azure endpoint","children":[],"payload":{"tag":"li","lines":"810,811"}},{"content":"Example  <pre><code>\n      import os\n      from openai import AzureOpenAI\n      openai_client = AzureOpenAI(\n          azure_endpoint = &quot;https://{resource-name}.openai.azure.com&quot;\n          api_key=os.getenv(&quot;AZURE_OPENAI_KEY&quot;),  \n          api_version=&quot;2024-10-21&quot;,\n      )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"811,822"}}],"payload":{"tag":"li","lines":"807,822"}},{"content":"\n<p data-lines=\"822,823\">When to use the Foundry SDK</p>","children":[{"content":"Foundry Agent Service for building and managing AI agents","children":[],"payload":{"tag":"li","lines":"823,824"}},{"content":"Tool invocation and approval workflows","children":[],"payload":{"tag":"li","lines":"824,825"}},{"content":"Cloud evaluations for testing and validating AI responses","children":[],"payload":{"tag":"li","lines":"825,826"}},{"content":"Tracing and observability for monitoring application behavior","children":[],"payload":{"tag":"li","lines":"826,827"}},{"content":"Foundry direct models (non-Azure OpenAI models available through the model catalog)","children":[],"payload":{"tag":"li","lines":"827,828"}},{"content":"Project metadata, connections, and governance features","children":[],"payload":{"tag":"li","lines":"828,829"}},{"content":"MS recommends","children":[{"content":"When building apps with agents","children":[],"payload":{"tag":"li","lines":"830,831"}},{"content":"Evaluations","children":[],"payload":{"tag":"li","lines":"831,832"}},{"content":"Foundry-specific features","children":[],"payload":{"tag":"li","lines":"832,834"}}],"payload":{"tag":"li","lines":"829,834"}}],"payload":{"tag":"li","lines":"822,834"}},{"content":"\n<p data-lines=\"834,835\">When to use the OpenAI SDK</p>","children":[{"content":"Full OpenAI API compatibility for existing code and tooling","children":[],"payload":{"tag":"li","lines":"835,836"}},{"content":"Portability between OpenAI and Azure OpenAI deployments","children":[],"payload":{"tag":"li","lines":"836,837"}},{"content":"Chat Completions, Responses, and Images APIs","children":[],"payload":{"tag":"li","lines":"837,838"}},{"content":"Minimal dependency on Foundry-specific concepts","children":[],"payload":{"tag":"li","lines":"838,839"}},{"content":"Ideal for model inference workloads","children":[],"payload":{"tag":"li","lines":"839,841"}}],"payload":{"tag":"li","lines":"834,841"}}],"payload":{"tag":"li","lines":"769,841"}}],"payload":{"tag":"li","lines":"712,841"}},{"content":"\n<p data-lines=\"841,842\"><strong>Generate responses with the Responses API</strong></p>","children":[{"content":"\n<p data-lines=\"843,844\">Responses API unifies</p>","children":[{"content":"ChatCompletions API","children":[],"payload":{"tag":"li","lines":"844,845"}},{"content":"Assistants API","children":[],"payload":{"tag":"li","lines":"845,846"}},{"content":"Accessible","children":[{"content":"Foundry SDK","children":[],"payload":{"tag":"li","lines":"847,848"}},{"content":"OpenAI SDK","children":[],"payload":{"tag":"li","lines":"848,850"}}],"payload":{"tag":"li","lines":"846,850"}}],"payload":{"tag":"li","lines":"843,850"}},{"content":"\n<p data-lines=\"850,851\">Responses API offers</p>","children":[{"content":"Stateful conversations<br>\nMaintains conversation context across multiple turns","children":[],"payload":{"tag":"li","lines":"851,853"}},{"content":"Unified experience<br>\nCombines chat completions and Assistants API patterns","children":[],"payload":{"tag":"li","lines":"853,855"}},{"content":"Foundry direct models<br>\nWorks with models hosted directly in MS Foundry,<br>not just Azure OpenAI models","children":[],"payload":{"tag":"li","lines":"855,857"}},{"content":"Simple integration<br>\nAccess through the OpenAI-compatible client","children":[],"payload":{"tag":"li","lines":"857,860"}}],"payload":{"tag":"li","lines":"850,860"}},{"content":"\n<p data-lines=\"860,861\">Generatins a simple response</p>","children":[{"content":"Generate responses using <code>responses.create()</code> method  <pre><code>\n      # Generate a response using the OpenAI-compatible client\n      response = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,  # Your model deployment name\n          input=&quot;What is MS Foundry?&quot;\n      )\n      # Display the response\n      print(response.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"861,872"}}],"payload":{"tag":"li","lines":"860,872"}},{"content":"\n<p data-lines=\"872,873\">Understand response structure</p>","children":[{"content":"Output_text<br>\nThe generated text response","children":[],"payload":{"tag":"li","lines":"873,875"}},{"content":"Id<br>\nUnique identifier for this response","children":[],"payload":{"tag":"li","lines":"875,877"}},{"content":"Status<br>\nResponse status (for example, &quot;completed&quot;)","children":[],"payload":{"tag":"li","lines":"877,879"}},{"content":"Usage<br>\nToken usage information (input, output, and total tokens)","children":[],"payload":{"tag":"li","lines":"879,881"}},{"content":"Model<br>\nThe model used to generate the response","children":[],"payload":{"tag":"li","lines":"881,883"}},{"content":"How to access  <pre><code>\n      response = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          input=&quot;Explain machine learning in simple terms.&quot;\n      )\n      print(f&quot;Response: {response.output_text}&quot;)\n      print(f&quot;Response ID: {response.id}&quot;)\n      print(f&quot;Tokens used: {response.usage.total_tokens}&quot;)\n      print(f&quot;Status: {response.status}&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"883,895"}}],"payload":{"tag":"li","lines":"872,895"}},{"content":"\n<p data-lines=\"895,896\">Adding instructions</p>","children":[{"content":"Instructions are often referred to as a <em>system prompt</em>  <pre><code>\n      response = client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          instructions=&quot;You are a helpful AI assistant that answers questions clearly and concisely.&quot;,\n          input=&quot;Explain neural networks.&quot;\n      )\n      print(response.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"896,906"}}],"payload":{"tag":"li","lines":"895,906"}},{"content":"\n<p data-lines=\"906,907\">Controlling response geeneration</p>","children":[{"content":"Additonal parameters  <pre><code>\n      response = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          instructions=&quot;You are a helpful AI assistant that answers questions clearly and concisely.&quot;,\n          input=&quot;Write a creative story about AI.&quot;,\n          temperature=0.8,  # Higher temperature for more creativity\n          max_output_tokens=200  # Limit response length\n      )\n      print(response.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"907,918"}},{"content":"Temperature<br>\nControls randomness (0.0-2.0). Higher values make output more creative and varied","children":[],"payload":{"tag":"li","lines":"918,920"}},{"content":"Max_output_tokens<br>\nLimits the maximum number of tokens in the response","children":[],"payload":{"tag":"li","lines":"920,922"}},{"content":"Top_p<br>\nAlternative to temperature for controlling randomness","children":[],"payload":{"tag":"li","lines":"922,925"}}],"payload":{"tag":"li","lines":"906,925"}},{"content":"\n<p data-lines=\"925,926\">Working with Foundry direct models</p>","children":[{"content":"MS Phi","children":[],"payload":{"tag":"li","lines":"926,927"}},{"content":"DeepSeek","children":[],"payload":{"tag":"li","lines":"927,928"}},{"content":"Other models hosted in Foundry","children":[],"payload":{"tag":"li","lines":"928,929"}},{"content":"Example  <pre><code>\n      # Using a Foundry direct model\n      response = openai_client.responses.create(\n          model=&quot;MS-phi-4&quot;,  # Example Foundry direct model\n          instructions=&quot;You are a helpful AI assistant that answers questions clearly and concisely.&quot;,\n          input=&quot;What are the benefits of small language models?&quot;\n      )\n      print(response.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"929,940"}}],"payload":{"tag":"li","lines":"925,940"}},{"content":"\n<p data-lines=\"940,941\">Creating conversational experiences</p>","children":[{"content":"\n<p data-lines=\"941,942\">For complex scenarios we can provide</p>","children":[{"content":"System instructions","children":[],"payload":{"tag":"li","lines":"942,943"}},{"content":"Build multi-turn conversations","children":[],"payload":{"tag":"li","lines":"943,944"}}],"payload":{"tag":"li","lines":"941,944"}},{"content":"\n<p data-lines=\"944,945\">Example</p>\n  <pre><code>\n      # First turn in the conversation\n      response1 = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          instructions=&quot;You are a helpful AI assistant that explains technology concepts clearly.&quot;,\n          input=&quot;What is machine learning?&quot;\n      )\n      print(&quot;Assistant:&quot;, response1.output_text)\n      # Continue the conversation\n      response2 = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          instructions=&quot;You are a helpful AI assistant that explains technology concepts clearly.&quot;,\n          input=&quot;Can you give me an example?&quot;,\n          previous_response_id=response1.id\n      )\n      print(&quot;Assistant:&quot;, response2.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"944,962"}},{"content":"\n<p data-lines=\"962,963\">Example using a <em>loop</em></p>\n  <pre><code>\n      # Track responses\n      last_response_id = None\n      # Loop until the user wants to quit\n      print(&quot;Assistant: Enter a prompt (or type &apos;quit&apos; to exit)&quot;)\n      while True:\n          input_text = input(&apos;\\nYou: &apos;)\n          if input_text.lower() == &quot;quit&quot;:\n              print(&quot;Assistant: Goodbye!&quot;)\n              break\n          # Get a response\n          response = openai_client.responses.create(\n                      model=model_name,\n                      instructions=&quot;You are a helpful AI assistant that explains technology concepts clearly.&quot;,\n                      input=input_text,\n                      previous_response_id=last_response_id\n          )\n          assistant_text = response.output_text\n          print(&quot;\\nAssistant:&quot;, assistant_text)\n          last_response_id = response.id\n  </code></pre>","children":[{"content":"\n<p data-lines=\"985,986\">Output</p>\n  <pre>\n<pre data-lines=\"989,1008\"><code>  Assistant: Enter a prompt (or type &apos;quit&apos; to exit)\n\n  You: What is machine learning?\n\n  Assistant: Machine learning is a type of artificial intelligence (AI) that enables computers to learn from data and improve their performance over time without being explicitly programmed.\n  It involves training algorithms on large datasets to recognize patterns, make predictions, or take actions based on those patterns.\n  This allows machines to become more accurate and efficient in their tasks as they are exposed to more data.\n\n  You: Can you give me an example?\n\n  Assistant: Certainly! Let&apos;s look at a simple example of supervised learning&#x2014;predicting house prices based on features like size, location, and number of rooms.\n  Imagine you want to build a machine learning model that can predict the price of a house based on various factors.\n  ...\n      { the example provided in the model response may be extensive}\n  ...\n\n  You: quit\n\n  Assistant: Goodbye!\n</code></pre>\n  </pre>\n<p data-lines=\"1010,1014\"><span>&#x26a0;</span> <mark>As the user enters new input in each turn, the data sent to the model includes:<br>\n&#xa0;&#xa0;&#xa0;&#xa0;Instructions system message<br>\n&#xa0;&#xa0;&#xa0;&#xa0;The input from the user<br>\n&#xa0;&#xa0;&#xa0;&#xa0;The previous response received from the model</mark></p>","children":[],"payload":{"tag":"li","lines":"985,1015"}}],"payload":{"tag":"li","lines":"962,1015"}}],"payload":{"tag":"li","lines":"940,1015"}},{"content":"\n<p data-lines=\"1015,1016\">Alternative: Manual conversation chaining</p>","children":[{"content":"\n<p data-lines=\"1016,1017\">Example</p>\n  <pre><code>\n      try:\n          # Start with initial message\n          conversation_history = [\n              {\n                  &quot;type&quot;: &quot;message&quot;,\n                  &quot;role&quot;: &quot;user&quot;,\n                  &quot;content&quot;: &quot;What is machine learning?&quot;\n              }\n          ]\n<pre data-lines=\"1028,1052\"><code>      # First response\n      response1 = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          input=conversation_history\n      )\n      print(&quot;Assistant:&quot;, response1.output_text)\n\n      # Add assistant response to history\n      conversation_history += response1.output\n      # Add new user message\n      conversation_history.append({\n          &quot;type&quot;: &quot;message&quot;,\n          &quot;role&quot;: &quot;user&quot;, \n          &quot;content&quot;: &quot;Can you give me an example?&quot;\n      })\n\n      # Second response with full history\n      response2 = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          input=conversation_history\n      )\n      print(&quot;Assistant:&quot;, response2.output_text)\n  except Exception as ex:\n      print(f&quot;Error: {ex}&quot;)\n</code></pre>\n<p data-lines=\"1052,1053\"></p></code></pre><p></p>","children":[],"payload":{"tag":"li","lines":"1016,1053"}},{"content":"\n<p data-lines=\"1053,1054\">Useful when you need to:</p>","children":[{"content":"Customize which messages are included in context","children":[],"payload":{"tag":"li","lines":"1054,1055"}},{"content":"Implement conversation pruning to manage token limits","children":[],"payload":{"tag":"li","lines":"1055,1056"}},{"content":"Store and restore conversation history from a database","children":[],"payload":{"tag":"li","lines":"1056,1058"}}],"payload":{"tag":"li","lines":"1053,1058"}}],"payload":{"tag":"li","lines":"1015,1058"}},{"content":"\n<p data-lines=\"1058,1059\">Retrieving specific previous responses</p>","children":[{"content":"Response API maintains response history  <pre><code>\n      try:   \n          # Retrieve a previous response\n          response_id = &quot;resp_67cb61fa3a448190bcf2c42d96f0d1a8&quot;  # Example ID\n          previous_response = openai_client.responses.retrieve(response_id)\n          print(f&quot;Previous response: {previous_response.output_text}&quot;)\n      except Exception as ex:\n          print(f&quot;Error: {ex}&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1059,1070"}}],"payload":{"tag":"li","lines":"1058,1070"}},{"content":"\n<p data-lines=\"1070,1071\">Context window considerations</p>","children":[{"content":"The <code>previous_response_id</code> parameter links responses together,<br>\nmaintaining conversation context across multiple API calls.","children":[],"payload":{"tag":"li","lines":"1071,1073"}},{"content":"For a single run, the active context window can include","children":[{"content":"System instructions (instructions, safety rules)","children":[],"payload":{"tag":"li","lines":"1074,1075"}},{"content":"Your current prompt","children":[],"payload":{"tag":"li","lines":"1075,1076"}},{"content":"Conversation history (previous user + assistant messages)","children":[],"payload":{"tag":"li","lines":"1076,1077"}},{"content":"Tool schemas (functions, OpenAPI specs, MCP tools, etc.)","children":[],"payload":{"tag":"li","lines":"1077,1078"}},{"content":"Tool outputs (search results, code interpreter output, files)","children":[],"payload":{"tag":"li","lines":"1078,1079"}},{"content":"Retrieved memory or documents (from memory stores, RAG, file search)","children":[],"payload":{"tag":"li","lines":"1079,1080"}}],"payload":{"tag":"li","lines":"1073,1080"}},{"content":"All of these are concatenated, tokenized, and sent to the model together on every request","children":[],"payload":{"tag":"li","lines":"1080,1082"}}],"payload":{"tag":"li","lines":"1070,1082"}},{"content":"\n<p data-lines=\"1082,1083\">Creating responsive chat apps</p>","children":[{"content":"\n<p data-lines=\"1083,1084\">Responses time depends</p>","children":[{"content":"Specific model","children":[],"payload":{"tag":"li","lines":"1084,1085"}},{"content":"Context windoe size","children":[],"payload":{"tag":"li","lines":"1085,1086"}},{"content":"Size of the prompt","children":[],"payload":{"tag":"li","lines":"1086,1088"}}],"payload":{"tag":"li","lines":"1083,1088"}},{"content":"\n<p data-lines=\"1088,1089\">Streaming responses</p>","children":[{"content":"Example of streaming output  <pre><code>\n      stream = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          input=&quot;Write a short story about a robot learning to paint.&quot;,\n          stream=True\n      )\n      for event in stream:\n          print(event, end=&quot;&quot;, flush=True)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1089,1099"}},{"content":"Tracking conversation history (response ID)  <pre><code>\n      stream = openai_client.responses.create(\n          model=&quot;gpt-4.1&quot;,\n          input=&quot;Write a short story about a robot learning to paint.&quot;,\n          stream=True\n      )\n      for event in stream:\n          if event.type == &quot;response.output_text.delta&quot;:\n              print(event.delta, end=&quot;&quot;)\n          elif event.type == &quot;response.completed&quot;:\n              response_id = event.response.id\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1099,1113"}}],"payload":{"tag":"li","lines":"1088,1113"}},{"content":"\n<p data-lines=\"1113,1114\">Async usage</p>","children":[{"content":"\n<p data-lines=\"1114,1115\">Asynchronos client allows making non-blocking API calls</p>","children":[],"payload":{"tag":"li","lines":"1114,1115"}},{"content":"\n<p data-lines=\"1115,1116\">Ideal for long-running requests</p>","children":[],"payload":{"tag":"li","lines":"1115,1116"}},{"content":"\n<p data-lines=\"1116,1118\">Ideal to handle multiple request concurrently<br>\nwithout block the application</p>","children":[],"payload":{"tag":"li","lines":"1116,1118"}},{"content":"\n<p data-lines=\"1118,1120\">How to use<br>\n<code>import asyncio</code> and use <code>await</code>with each API call</p>","children":[],"payload":{"tag":"li","lines":"1118,1120"}},{"content":"\n<p data-lines=\"1120,1121\">Example</p>\n  <pre><code>\n      import asyncio\n      from openai import AsyncOpenAI\n      client = AsyncOpenAI(\n          base_url=&quot;https://<resource-name>.openai.azure.com/openai/v1/&quot;,\n          api_key=token_provider,\n      )\n      async def main():\n          response = await client.responses.create(\n              model=&quot;gpt-4.1&quot;,\n              input=&quot;Explain quantum computing briefly.&quot;\n          )\n          print(response.output_text)\n<pre data-lines=\"1135,1136\"><code>  asyncio.run(main())\n</code></pre>\n<p data-lines=\"1136,1137\"></p></resource-name></code></pre><p></p>","children":[],"payload":{"tag":"li","lines":"1120,1137"}},{"content":"\n<p data-lines=\"1137,1138\">Async stream example</p>\n  <pre><code>\n      async def stream_response():\n          stream = await client.responses.create(\n              model=&quot;gpt-4.1&quot;,\n              input=&quot;Write a haiku about coding.&quot;,\n              stream=True\n          )\n          async for event in stream:\n              print(event, end=&quot;&quot;, flush=True)\n      asyncio.run(stream_response())\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1137,1150"}}],"payload":{"tag":"li","lines":"1113,1150"}}],"payload":{"tag":"li","lines":"1082,1150"}}],"payload":{"tag":"li","lines":"841,1150"}},{"content":"\n<p data-lines=\"1150,1151\"><strong>Generate responses with the ChatCompletions API</strong></p>","children":[{"content":"\n<p data-lines=\"1152,1153\">ChatCompletions API is useful for</p>","children":[{"content":"Code maintenance","children":[],"payload":{"tag":"li","lines":"1153,1154"}},{"content":"Cross-platform compatibility","children":[],"payload":{"tag":"li","lines":"1154,1156"}}],"payload":{"tag":"li","lines":"1152,1156"}},{"content":"\n<p data-lines=\"1156,1157\">Submitting a prompt</p>","children":[{"content":"\n<p data-lines=\"1157,1159\">Uses collections of message objects in JSON format to<br>\nencapsulate prompts</p>","children":[],"payload":{"tag":"li","lines":"1157,1159"}},{"content":"\n<p data-lines=\"1159,1160\">Example</p>\n  <pre><code>\n      completion = openai_client.chat.completions.create(\n          model=&quot;gpt-4o&quot;,  # Your model deployment name\n          messages=[\n              {&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;You are a helpful assistant.&quot;},\n              {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;When was MS founded?&quot;}\n          ]\n      )\n      print(completion.choices[0].message.content)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1159,1171"}},{"content":"\n<p data-lines=\"1171,1172\">Retaining conversational context</p>","children":[{"content":"\n<p data-lines=\"1172,1173\">ChatCompletions API doesn&apos;t provide statful response tracking feature</p>","children":[],"payload":{"tag":"li","lines":"1172,1173"}},{"content":"\n<p data-lines=\"1173,1174\">Must write previous prompts and responses</p>","children":[],"payload":{"tag":"li","lines":"1173,1174"}},{"content":"\n<p data-lines=\"1174,1175\">Example</p>\n  <pre><code>\n  # Initial messages\n  conversation_messages=[\n      {\n          &quot;role&quot;: &quot;system&quot;,\n          &quot;content&quot;: &quot;You are a helpful AI assistant that answers questions and provides information.&quot;\n      }\n  ]\n  # Add the first user message\n  conversation_messages.append(\n      {&quot;role&quot;: &quot;user&quot;,\n      &quot;content&quot;: &quot;When was MS founded?&quot;}\n  )\n  # Get a completion\n  completion = openai_client.chat.completions.create(\n      model=&quot;gpt-4o&quot;,\n      messages=conversation_messages\n  )\n  assistant_message = completion.choices[0].message.content\n  print(&quot;Assistant:&quot;, assistant_text)\n  # Append the response to the conversation\n  conversation_messages.append(\n      {&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: assistant_text}\n  )\n  # Add the next user message\n  conversation_messages.append(\n      {&quot;role&quot;: &quot;user&quot;,\n      &quot;content&quot;: &quot;Who founded it?&quot;}\n  )\n  # Get a completion\n  completion = openai_client.chat.completions.create(\n      model=&quot;gpt-4o&quot;,\n      messages=conversation_messages\n  )\n  assistant_message = completion.choices[0].message.content\n  print(&quot;Assistant:&quot;, assistant_text)\n  # and so on...\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1174,1213"}},{"content":"\n<p data-lines=\"1213,1214\">Example using a <em>loop</em></p>\n  <pre><code>\n      # Initial messages\n      conversation_messages=[\n          {\n              &quot;role&quot;: &quot;system&quot;,\n              &quot;content&quot;: &quot;You are a helpful AI assistant that answers questions and provides information.&quot;\n          }\n      ]\n      # Loop until the user wants to quit\n      print(&quot;Assistant: Enter a prompt (or type &apos;quit&apos; to exit)&quot;)\n      while True:\n          input_text = input(&apos;\\nYou: &apos;)\n          if input_text.lower() == &quot;quit&quot;:\n              print(&quot;Assistant: Goodbye!&quot;)\n              break\n          # Add the user message\n          conversation_messages.append(\n              {&quot;role&quot;: &quot;user&quot;,\n              &quot;content&quot;: input_text}\n          )\n<pre data-lines=\"1235,1247\"><code>      # Get a completion\n      completion = openai_client.chat.completions.create(\n          model=&quot;gpt-4o&quot;,\n          messages=conversation_messages\n      )\n      assistant_message = completion.choices[0].message.content\n      print(&quot;\\nAssistant:&quot;, assistant_message)\n\n      # Append the response to the conversation\n      conversation_messages.append(\n          {&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: assistant_message}\n      )\n</code></pre>\n<p data-lines=\"1247,1248\"></p></code></pre><p></p>","children":[{"content":"\n<p data-lines=\"1249,1250\">Output</p>\n  <pre>\n<pre data-lines=\"1253,1266\"><code>  Assistant: Enter a prompt (or type &apos;quit&apos; to exit)\n\n  You: When was MS founded?\n\n  Assistant: MS was founded on April 4, 1975 in Albuquerque, New Mexico, USA.\n\n  You: Who founded it?\n\n  Assistant: MS was founded by Bill Gates and Paul Allen.\n\n  You: quit\n\n  Assistant: Goodbye!\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"1249,1268"}}],"payload":{"tag":"li","lines":"1213,1268"}}],"payload":{"tag":"li","lines":"1171,1268"}}],"payload":{"tag":"li","lines":"1156,1268"}}],"payload":{"tag":"li","lines":"1150,1268"}},{"content":"\n<p data-lines=\"1268,1269\"><strong>Key takeaways</strong></p>","children":[{"content":"Use the Foundry SDK with the Foundry project endpoint to access<br>\nproject configuration, connections, tracing, and datasets","children":[],"payload":{"tag":"li","lines":"1269,1271"}},{"content":"Use the OpenAI SDK with the Foundry project and Azure OpenAI endpoints for model inferencing","children":[],"payload":{"tag":"li","lines":"1271,1272"}},{"content":"Generate responses with the Responses and ChatCompletions APIs and manage conversations","children":[],"payload":{"tag":"li","lines":"1272,1274"}}],"payload":{"tag":"li","lines":"1268,1274"}},{"content":"\n<p data-lines=\"1274,1275\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview\">MS Foundry SDK overview</a>","children":[],"payload":{"tag":"li","lines":"1275,1276"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/openai/how-to/responses\">Responses API documentation</a>","children":[],"payload":{"tag":"li","lines":"1276,1277"}},{"content":"<a href=\"https://aka.ms/azureaifoundry/discord\">MS Foundry Discord</a>","children":[],"payload":{"tag":"li","lines":"1277,1278"}},{"content":"<a href=\"https://aka.ms/azureaifoundry/forum\">MS Foundry Developer Forum</a>","children":[],"payload":{"tag":"li","lines":"1278,1280"}}],"payload":{"tag":"li","lines":"1274,1280"}},{"content":"\n<p data-lines=\"1280,1282\"><strong>Exercise - Create a generative AI chat app</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-studio/Instructions/Exercises/03-foundry-sdk.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"1280,1285"}}],"payload":{"tag":"h3","lines":"686,687"}},{"content":"4. <a href=\"https://learn.MS.com/en-us/training/modules/use-generative-ai-tools/\">Develop generative AI apps that use tools</a>","children":[{"content":"\n<p data-lines=\"1287,1288\"><strong>Introduction</strong></p>","children":[{"content":"Tools enable GenAI apps","children":[{"content":"Access real-time information<br>\nFetch current data, weather, stock prices, or API responses that weren&apos;t in the model&apos;s training data","children":[],"payload":{"tag":"li","lines":"1289,1291"}},{"content":"Take actions<br>\nPerform tasks like sending emails, creating database records, or triggering workflows based on AI decisions","children":[],"payload":{"tag":"li","lines":"1291,1293"}},{"content":"Ground responses in facts<br>\nRetrieve specific, authoritative information to reduce incorrect information and improve accuracy","children":[],"payload":{"tag":"li","lines":"1293,1295"}},{"content":"Extend functionality<br>\nConnect to your existing systems, databases, and business logic seamlessly","children":[],"payload":{"tag":"li","lines":"1295,1297"}},{"content":"Build intelligent workflows<br>\nChain multiple operations together so AI coordinates complex, multi-step processes","children":[],"payload":{"tag":"li","lines":"1297,1299"}},{"content":"Without tools, generative AI works in isolation","children":[],"payload":{"tag":"li","lines":"1299,1300"}},{"content":"With tools the agent can","children":[{"content":"Observe","children":[],"payload":{"tag":"li","lines":"1301,1302"}},{"content":"Reason","children":[],"payload":{"tag":"li","lines":"1302,1303"}},{"content":"Act on the world around","children":[],"payload":{"tag":"li","lines":"1303,1305"}}],"payload":{"tag":"li","lines":"1300,1305"}}],"payload":{"tag":"li","lines":"1288,1305"}}],"payload":{"tag":"li","lines":"1287,1305"}},{"content":"\n<p data-lines=\"1305,1306\"><strong>What are tools?</strong></p>","children":[{"content":"\n<p data-lines=\"1307,1309\"><span>&#x26a0;</span> <mark>By default, the model chooses when to use a tool (and which one), based on the prompt<br>\n&#xa0;&#xa0;&#xa0;&#xa0;You can configure tool selection rules and use the Instructions (system prompt) parameter to guide this choice.</mark></p>","children":[],"payload":{"tag":"li","lines":"1307,1310"}},{"content":"\n<p data-lines=\"1310,1311\">Tools extend Foundry models capabilities</p>","children":[{"content":"Find information","children":[],"payload":{"tag":"li","lines":"1311,1312"}},{"content":"Perform tasks","children":[],"payload":{"tag":"li","lines":"1312,1314"}}],"payload":{"tag":"li","lines":"1310,1314"}},{"content":"\n<p data-lines=\"1314,1315\">(<em>Some</em>) Tools available in the Responses API</p>","children":[{"content":"code_interpreter<br>\nA Python environment in which the model can generate and run code.","children":[],"payload":{"tag":"li","lines":"1315,1317"}},{"content":"web_search<br>\nA tool that enables the model to find general information on the Internet, which allows it to base responses on more current data than it was trained on.","children":[],"payload":{"tag":"li","lines":"1317,1319"}},{"content":"file_search<br>\nA tool that enables the model to search specific files that you upload to a dedicated vector search index - enabling it to ground responses in specific knowledge.","children":[],"payload":{"tag":"li","lines":"1319,1321"}},{"content":"function<br>\nA tool that enables the model to call custom functions in your application code.","children":[],"payload":{"tag":"li","lines":"1321,1324"}}],"payload":{"tag":"li","lines":"1314,1324"}},{"content":"\n<p data-lines=\"1324,1325\">Specifying tools in the Responses API</p>","children":[{"content":"Call one or more tools with <code>responses.crate()</code> method","children":[],"payload":{"tag":"li","lines":"1325,1326"}},{"content":"Example  <pre><code>\n      from openai import OpenAI\n      client = OpenAI(\n          base_url={openai_endpoint},\n          api_key={auth_key_or_token}\n      )\n      response = client.responses.create(\n          model={model_deployment},\n          instructions=&quot;You are a helpful AI assistant.&quot;,\n          input=&quot;Find me some information about vintage computers.&quot;,\n          # Specify available tools as a JSON list\n          tools=[\n              { \n                  # A tool definition\n                  &quot;type&quot;: &quot;{tool_type}&quot;,\n                  &quot;{tool-specific-setting}&quot;: &quot;{value}&quot;,\n                      ...\n              },\n              { \n                  # Another tool definition\n                  &quot;type&quot;: &quot;{another_tool_type}&quot;,\n                  &quot;{tool-specific-setting}&quot;: &quot;{value}&quot;,\n                      ...\n              }\n          ]\n      )\n      print(response.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1326,1356"}}],"payload":{"tag":"li","lines":"1324,1356"}}],"payload":{"tag":"li","lines":"1305,1356"}},{"content":"\n<p data-lines=\"1356,1357\"><strong>Use the <code>code_interpreter</code> tool</strong></p>","children":[{"content":"\n<p data-lines=\"1358,1359\">What is the code_interpreter tool?</p>","children":[{"content":"Enables GenAI models write and run Python code","children":[],"payload":{"tag":"li","lines":"1359,1360"}},{"content":"The model dinamically","children":[{"content":"Test its logic","children":[],"payload":{"tag":"li","lines":"1361,1362"}},{"content":"Process data","children":[],"payload":{"tag":"li","lines":"1362,1363"}},{"content":"Return actual results from code","children":[],"payload":{"tag":"li","lines":"1363,1364"}}],"payload":{"tag":"li","lines":"1360,1364"}},{"content":"Key features","children":[{"content":"Dynamic Python Execution<br>\nThe model writes and runs Python code in a sandboxed environment","children":[],"payload":{"tag":"li","lines":"1365,1367"}},{"content":"File Handling<br>\nUpload, process, and download files (CSV, JSON, images, and so on)","children":[],"payload":{"tag":"li","lines":"1367,1369"}},{"content":"Data Analysis<br>\nPerform calculations, statistical analysis, and data transformations on the fly","children":[],"payload":{"tag":"li","lines":"1369,1371"}},{"content":"Real-time Feedback<br>\nThe model sees code execution results and can iterate or fix errors","children":[],"payload":{"tag":"li","lines":"1371,1373"}},{"content":"Complex Problem Solving<br>\nTackle math problems, simulations, and logic puzzles through executable code","children":[],"payload":{"tag":"li","lines":"1373,1376"}}],"payload":{"tag":"li","lines":"1364,1376"}}],"payload":{"tag":"li","lines":"1358,1376"}},{"content":"\n<p data-lines=\"1376,1377\">Common use cases</p>\n<table data-lines=\"1377,1383\">\n<thead data-lines=\"1377,1378\">\n<tr data-lines=\"1377,1378\">\n<th>Use Case</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody data-lines=\"1379,1383\">\n<tr data-lines=\"1379,1380\">\n<td>Data Analysis</td>\n<td>Parse a CSV file and generate summary statistics</td>\n</tr>\n<tr data-lines=\"1380,1381\">\n<td>Math &amp; Physics</td>\n<td>Solve differential equations or simulate physics scenarios</td>\n</tr>\n<tr data-lines=\"1381,1382\">\n<td>File Conversion</td>\n<td>Convert between data formats (JSON &#x2194; CSV, and so on)</td>\n</tr>\n<tr data-lines=\"1382,1383\">\n<td>Prototyping</td>\n<td>Test algorithms and ideas before formal implementation</td>\n</tr>\n</tbody>\n</table>\n  <br>","children":[],"payload":{"tag":"li","lines":"1376,1385"}},{"content":"\n<p data-lines=\"1385,1386\">Example</p>\n  <pre><code>\n      from openai import OpenAI\n      client = OpenAI(\n          base_url={openai_endpoint},\n          api_key={auth_key_or_token}\n      )\n      # Get response using the code_interpreter tool\n      response = client.responses.create(\n          model={model_deployment},\n          instructions=&quot;You are an AI assistant that provides information. Use the python tool to run code for math problems.&quot;,\n          input=&quot;What is the square root of 16?&quot;,\n          tools=[{&quot;type&quot;: &quot;code_interpreter&quot;,\n                  &quot;container&quot;: {&quot;type&quot;: &quot;auto&quot;}}]\n      )\n      print(response.output_text)\n  </code></pre>","children":[{"content":"\n<p data-lines=\"1403,1404\">Output</p>\n  <pre>\n<pre data-lines=\"1406,1407\"><code>  The square root of 16 is 4.\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"1403,1409"}},{"content":"\n<p data-lines=\"1409,1410\">Model generated Python code</p>\n  <pre><code>\n      import math\n      # Calculate the square root of 16\n      square_root = math.sqrt(16)\n      square_root\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1409,1417"}}],"payload":{"tag":"li","lines":"1385,1417"}},{"content":"\n<p data-lines=\"1417,1418\">How the code_interpreter tool works</p>","children":[{"content":"You send a request<br>\nInclude code_interpreter in your tools array.","children":[],"payload":{"tag":"li","lines":"1418,1420"}},{"content":"Model analyzes the task<br>\nThe model determines if code execution is needed.","children":[],"payload":{"tag":"li","lines":"1420,1422"}},{"content":"Model generates code<br>\nThe model writes Python code to accomplish the task.","children":[],"payload":{"tag":"li","lines":"1422,1424"}},{"content":"Code runs<br>\nThe code runs in a sandboxed environment with access to<br>\ncommon libraries (for example: pandas, numpy, and math).","children":[],"payload":{"tag":"li","lines":"1424,1427"}},{"content":"Results returned<br>\nThe model receives the output and incorporates it into its response.","children":[],"payload":{"tag":"li","lines":"1427,1430"}}],"payload":{"tag":"li","lines":"1417,1430"}},{"content":"\n<p data-lines=\"1430,1431\">Best practices</p>","children":[{"content":"Be specific<br>\nDescribe the data format and expected output clearly.<br>\nMany models internally use the name python tool to identify the code_interpreter tool - so use this language in your instructions.","children":[],"payload":{"tag":"li","lines":"1431,1434"}},{"content":"Provide context<br>\nInclude relevant domain knowledge in your prompts","children":[],"payload":{"tag":"li","lines":"1434,1436"}},{"content":"Validate results<br>\nAlways review AI-generated code for correctness before using in production","children":[],"payload":{"tag":"li","lines":"1436,1438"}},{"content":"Monitor costs<br>\nCode execution adds tokens<br>\nComplex operations may use more resources","children":[],"payload":{"tag":"li","lines":"1438,1441"}},{"content":"Leverage libraries<br>\nCommon packages like pandas, numpy, and matplotlib are pre-installed","children":[],"payload":{"tag":"li","lines":"1441,1443"}},{"content":"Error handling<br>\nThe model can see errors and will attempt to fix them automatically","children":[],"payload":{"tag":"li","lines":"1443,1446"}}],"payload":{"tag":"li","lines":"1430,1446"}},{"content":"\n<p data-lines=\"1446,1447\">Limitations</p>","children":[{"content":"Executions run in a sandboxed environment with no external network access","children":[],"payload":{"tag":"li","lines":"1447,1448"}},{"content":"Some libraries may not be available; let the model know if a standard library fails","children":[],"payload":{"tag":"li","lines":"1448,1449"}},{"content":"Timeout limits apply to long-running operations","children":[],"payload":{"tag":"li","lines":"1449,1450"}},{"content":"Code runs with memory constraints&#x2014;massive datasets may need streaming or chunking","children":[],"payload":{"tag":"li","lines":"1450,1452"}}],"payload":{"tag":"li","lines":"1446,1452"}}],"payload":{"tag":"li","lines":"1356,1452"}},{"content":"\n<p data-lines=\"1452,1453\"><strong>Use the <code>web_search</code>tool</strong></p>","children":[{"content":"What is the web_search tool?","children":[{"content":"\n<p data-lines=\"1455,1456\">Gives a GenAI model access to current, external information at runtime.</p>","children":[],"payload":{"tag":"li","lines":"1455,1456"}},{"content":"\n<p data-lines=\"1456,1457\">Model can</p>","children":[{"content":"Search query","children":[],"payload":{"tag":"li","lines":"1457,1458"}},{"content":"Review relevant sources","children":[],"payload":{"tag":"li","lines":"1458,1459"}},{"content":"Produce an answer in up-to-date content","children":[],"payload":{"tag":"li","lines":"1459,1460"}}],"payload":{"tag":"li","lines":"1456,1460"}},{"content":"\n<p data-lines=\"1460,1461\">Useful for</p>","children":[{"content":"Price changes","children":[],"payload":{"tag":"li","lines":"1461,1462"}},{"content":"Product releases","children":[],"payload":{"tag":"li","lines":"1462,1463"}},{"content":"Policy updates","children":[],"payload":{"tag":"li","lines":"1463,1464"}},{"content":"Current events","children":[],"payload":{"tag":"li","lines":"1464,1465"}}],"payload":{"tag":"li","lines":"1460,1465"}},{"content":"\n<p data-lines=\"1465,1466\">Key features</p>","children":[{"content":"Live information retrieval<br>\nGet recent information not available in static model training data","children":[],"payload":{"tag":"li","lines":"1466,1468"}},{"content":"Source-grounded responses<br>\nBuild answers from retrieved web content","children":[],"payload":{"tag":"li","lines":"1468,1470"}},{"content":"Reduced hallucination risk<br>\nImprove reliability by checking external sources","children":[],"payload":{"tag":"li","lines":"1470,1472"}},{"content":"Automatic query generation<br>\nThe model decides when and how to search based on user intent","children":[],"payload":{"tag":"li","lines":"1472,1474"}},{"content":"Seamless user experience<br>\nSearch and response generation happen in one flow","children":[],"payload":{"tag":"li","lines":"1474,1476"}}],"payload":{"tag":"li","lines":"1465,1476"}},{"content":"\n<p data-lines=\"1476,1477\">Common use cases</p>\n<table data-lines=\"1477,1483\">\n<thead data-lines=\"1477,1478\">\n<tr data-lines=\"1477,1478\">\n<th>Use Case</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody data-lines=\"1479,1483\">\n<tr data-lines=\"1479,1480\">\n<td>Current Events</td>\n<td>Summarize key updates on a breaking technology announcement</td>\n</tr>\n<tr data-lines=\"1480,1481\">\n<td>Market Research</td>\n<td>Compare recent product features or pricing across vendors</td>\n</tr>\n<tr data-lines=\"1481,1482\">\n<td>Policy Monitoring</td>\n<td>Check whether regulations or guidance have changed</td>\n</tr>\n<tr data-lines=\"1482,1483\">\n<td>Fact Verification</td>\n<td>Validate claims against reputable public sources</td>\n</tr>\n</tbody>\n</table>\n  <br>","children":[],"payload":{"tag":"li","lines":"1476,1486"}},{"content":"\n<p data-lines=\"1486,1487\">Example</p>\n  <pre><code>\n      from openai import OpenAI\n      client = OpenAI(\n          base_url={openai_endpoint},\n          api_key={auth_key_or_token}\n      )\n      # Get response using the web_search tool\n      response = client.responses.create(\n          model={model_deployment},\n          instructions=&quot;You are an AI assistant. Use web search when current information is required.&quot;,\n          input=&quot;What are three major announcements from MS Build this week?&quot;,\n          tools=[{&quot;type&quot;: &quot;web_search&quot;}]\n      )\n      print(response.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1486,1503"}},{"content":"\n<p data-lines=\"1503,1504\">How the <code>web_search</code> tool works</p>","children":[{"content":"You send a request<br>\nInclude a web search tool in the tools array.","children":[],"payload":{"tag":"li","lines":"1504,1506"}},{"content":"Model evaluates the question<br>\nIt decides whether fresh web data is needed.","children":[],"payload":{"tag":"li","lines":"1506,1508"}},{"content":"Search is performed<br>\nThe model issues one or more search queries.","children":[],"payload":{"tag":"li","lines":"1508,1510"}},{"content":"Results are reviewed<br>\nRelevant pages are selected and summarized.","children":[],"payload":{"tag":"li","lines":"1510,1512"}},{"content":"Response is generated<br>\nThe model combines search findings into the final answer.","children":[],"payload":{"tag":"li","lines":"1512,1515"}}],"payload":{"tag":"li","lines":"1503,1515"}},{"content":"\n<p data-lines=\"1515,1516\">Best practices</p>","children":[{"content":"Ask time-aware questions clearly<br>\nInclude words like &quot;latest&quot;, &quot;current&quot;, or date ranges when needed","children":[],"payload":{"tag":"li","lines":"1516,1518"}},{"content":"Set expectations for sources<br>\nPrompt for reputable or official sources when accuracy matters","children":[],"payload":{"tag":"li","lines":"1518,1520"}},{"content":"Request concise outputs<br>\nAsk for short summaries with key points to reduce noise","children":[],"payload":{"tag":"li","lines":"1520,1522"}},{"content":"Verify critical facts<br>\nFor high-stakes scenarios, independently validate important claims","children":[],"payload":{"tag":"li","lines":"1522,1524"}},{"content":"Track usage and latency<br>\nWeb retrieval can increase response time and token usage","children":[],"payload":{"tag":"li","lines":"1524,1527"}}],"payload":{"tag":"li","lines":"1515,1527"}},{"content":"\n<p data-lines=\"1527,1528\">Limitations</p>","children":[{"content":"Results depend on what is publicly available and indexable at query time","children":[],"payload":{"tag":"li","lines":"1528,1529"}},{"content":"Source quality can vary, so output may still require human review","children":[],"payload":{"tag":"li","lines":"1529,1530"}},{"content":"Retrieved content may change over time, so repeated runs can produce different answers","children":[],"payload":{"tag":"li","lines":"1530,1531"}},{"content":"Some environments may apply regional, policy, or network restrictions to web access","children":[],"payload":{"tag":"li","lines":"1531,1533"}}],"payload":{"tag":"li","lines":"1527,1533"}}],"payload":{"tag":"li","lines":"1454,1533"}}],"payload":{"tag":"li","lines":"1452,1533"}},{"content":"\n<p data-lines=\"1533,1534\"><strong>Use the <code>file_search</code>tool</strong></p>","children":[{"content":"What is the <code>file_search</code> tool?","children":[{"content":"\n<p data-lines=\"1536,1538\">Lets the selected model retrieve relevant information from<br>\nyour own uploaded documents during a response</p>","children":[],"payload":{"tag":"li","lines":"1536,1538"}},{"content":"\n<p data-lines=\"1538,1539\">Model can</p>","children":[{"content":"Search private or domain-specific files","children":[{"content":"Policy documents","children":[],"payload":{"tag":"li","lines":"1540,1541"}},{"content":"Manuals","children":[],"payload":{"tag":"li","lines":"1541,1542"}},{"content":"Contracts","children":[],"payload":{"tag":"li","lines":"1542,1543"}},{"content":"Internal knowledge bases","children":[],"payload":{"tag":"li","lines":"1543,1544"}}],"payload":{"tag":"li","lines":"1539,1544"}},{"content":"Return grounded answers","children":[],"payload":{"tag":"li","lines":"1544,1546"}}],"payload":{"tag":"li","lines":"1538,1546"}},{"content":"\n<p data-lines=\"1546,1547\">Key features</p>","children":[{"content":"Document-grounded answers<br>\nResponses are based on your uploaded files","children":[],"payload":{"tag":"li","lines":"1547,1549"}},{"content":"Semantic retrieval<br>\nFinds relevant passages by meaning, not only exact keyword matches","children":[],"payload":{"tag":"li","lines":"1549,1551"}},{"content":"Vector store integration<br>\nSearch across one or more indexed document collections","children":[],"payload":{"tag":"li","lines":"1551,1553"}},{"content":"Citations and transparency<br>\nInclude matched results for debugging and traceability","children":[],"payload":{"tag":"li","lines":"1553,1555"}},{"content":"Better enterprise relevance<br>\nUse organization-specific knowledge in model outputs","children":[],"payload":{"tag":"li","lines":"1555,1558"}}],"payload":{"tag":"li","lines":"1546,1558"}},{"content":"\n<p data-lines=\"1558,1559\">Common use cases</p>\n<table data-lines=\"1559,1565\">\n<thead data-lines=\"1559,1560\">\n<tr data-lines=\"1559,1560\">\n<th>Use Case</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody data-lines=\"1561,1565\">\n<tr data-lines=\"1561,1562\">\n<td>Policy Q&amp;A</td>\n<td>Answer employee questions from HR policy PDFs</td>\n</tr>\n<tr data-lines=\"1562,1563\">\n<td>Support Assistants</td>\n<td>Retrieve product steps from internal troubleshooting guides</td>\n</tr>\n<tr data-lines=\"1563,1564\">\n<td>Legal Review</td>\n<td>Locate specific clauses across contract documents</td>\n</tr>\n<tr data-lines=\"1564,1565\">\n<td>Knowledge Discovery</td>\n<td>Summarize answers from technical documentation sets</td>\n</tr>\n</tbody>\n</table>\n  <br>","children":[],"payload":{"tag":"li","lines":"1558,1568"}},{"content":"\n<p data-lines=\"1568,1569\">Example</p>\n  <pre><code>\n      from openai import OpenAI\n      client = OpenAI(\n          base_url={openai_endpoint},\n          api_key={auth_key_or_token}\n      )\n      # Create vector store and upload a file\n      vector_store = client.vector_stores.create(name=&quot;policy-docs&quot;)\n      client.vector_stores.files.upload_and_poll(\n          vector_store_id=vector_store.id,\n          file=open(&quot;expenses_policy.pdf&quot;, &quot;rb&quot;)\n      )\n      # Get response using the file_search tool\n      response = client.responses.create(\n          model=model_deployment,\n          instructions=&quot;You are an AI assistant that provides information from HR policy documents.&quot;,\n          input=&quot;What&apos;s the maximum amount I can claim for a taxi ride?&quot;,\n          tools=[{\n              &quot;type&quot;: &quot;file_search&quot;,\n              &quot;vector_store_ids&quot;: [vector_store.id]\n          }],\n          include=[&quot;file_search_call.results&quot;]\n      )\n      print(response.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"1568,1595"}},{"content":"\n<p data-lines=\"1595,1596\">How the <code>file_search tool</code> works</p>","children":[{"content":"You prepare files<br>\nUpload documents to a vector store.","children":[],"payload":{"tag":"li","lines":"1596,1598"}},{"content":"You send a request<br>\nInclude file_search in the tools array with vector store IDs.","children":[],"payload":{"tag":"li","lines":"1598,1600"}},{"content":"Model performs retrieval<br>\nIt searches indexed chunks for relevant content.","children":[],"payload":{"tag":"li","lines":"1600,1602"}},{"content":"Results are injected<br>\nMatching passages are provided to the model.","children":[],"payload":{"tag":"li","lines":"1602,1604"}},{"content":"Response is generated<br>\nThe model answers using retrieved document context.","children":[],"payload":{"tag":"li","lines":"1604,1607"}}],"payload":{"tag":"li","lines":"1595,1607"}},{"content":"\n<p data-lines=\"1607,1608\">Best practices</p>","children":[{"content":"Use high-quality source files<br>\nClean, current documents improve retrieval accuracy","children":[],"payload":{"tag":"li","lines":"1608,1610"}},{"content":"Write focused prompts<br>\nAsk specific questions to reduce ambiguous matches","children":[],"payload":{"tag":"li","lines":"1610,1612"}},{"content":"Scope vector stores carefully<br>\nSeparate domains (HR, legal, finance) when helpful","children":[],"payload":{"tag":"li","lines":"1612,1614"}},{"content":"Include retrieval results in development<br>\nUse response includes for troubleshooting","children":[],"payload":{"tag":"li","lines":"1614,1616"}},{"content":"Review answers for critical workflows<br>\nKeep human validation in high-stakes scenarios","children":[],"payload":{"tag":"li","lines":"1616,1619"}}],"payload":{"tag":"li","lines":"1607,1619"}},{"content":"\n<p data-lines=\"1619,1620\">Limitations</p>","children":[{"content":"Answer quality depends on document quality, coverage, and chunk relevance","children":[],"payload":{"tag":"li","lines":"1620,1621"}},{"content":"Very large or mixed-domain stores can return less focused context","children":[],"payload":{"tag":"li","lines":"1621,1622"}},{"content":"Updated source files may require re-indexing before new content is searchable","children":[],"payload":{"tag":"li","lines":"1622,1623"}},{"content":"Retrieval improves grounding but doesn&apos;t replace human review for sensitive decisions","children":[],"payload":{"tag":"li","lines":"1623,1625"}}],"payload":{"tag":"li","lines":"1619,1625"}},{"content":"\n<p data-lines=\"1625,1629\"><span>&#x26a0;</span> <mark>For enterprise-scale agents that need to access large quantities of<br>\n&#xa0;&#xa0;&#xa0;&#xa0;data in multiple data stores, you should consider using the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;Foundry IQ knowledge store solution with a MS Foundry agent<br>\n&#xa0;&#xa0;&#xa0;&#xa0;Build knowledge-enhanced AI agents with Foundry IQ <a href=\"https://learn.MS.com/en-us/training/modules/introduction-foundry-iq\">&#x2192; saber +</a></mark></p>","children":[],"payload":{"tag":"li","lines":"1625,1630"}}],"payload":{"tag":"li","lines":"1535,1630"}}],"payload":{"tag":"li","lines":"1533,1630"}},{"content":"\n<p data-lines=\"1630,1631\"><strong>Use the <code>function</code> tool</strong></p>","children":[{"content":"What is the <code>function</code> tool?","children":[{"content":"\n<p data-lines=\"1633,1635\">Lets the selected model call developer-defined functions to<br>\nretrieve data or trigger actions during a response</p>","children":[],"payload":{"tag":"li","lines":"1633,1635"}},{"content":"\n<p data-lines=\"1635,1636\">The model doesn&apos;t run the business login diretly</p>","children":[],"payload":{"tag":"li","lines":"1635,1636"}},{"content":"\n<p data-lines=\"1636,1637\">Returns a structured function call</p>","children":[],"payload":{"tag":"li","lines":"1636,1637"}},{"content":"\n<p data-lines=\"1637,1638\">The code runs the functions</p>","children":[],"payload":{"tag":"li","lines":"1637,1638"}},{"content":"\n<p data-lines=\"1638,1639\">The function output is passed to the model</p>","children":[],"payload":{"tag":"li","lines":"1638,1639"}},{"content":"\n<p data-lines=\"1639,1640\">Ideal to connect reasoning model to real-world systems</p>","children":[{"content":"APIs","children":[],"payload":{"tag":"li","lines":"1640,1641"}},{"content":"Databases","children":[],"payload":{"tag":"li","lines":"1641,1642"}},{"content":"Business workflows","children":[],"payload":{"tag":"li","lines":"1642,1643"}},{"content":"Utility functions","children":[],"payload":{"tag":"li","lines":"1643,1645"}}],"payload":{"tag":"li","lines":"1639,1645"}},{"content":"\n<p data-lines=\"1645,1646\">Key features</p>","children":[{"content":"Structured tool calls<br>\nThe model emits explicit function-call requests","children":[],"payload":{"tag":"li","lines":"1646,1648"}},{"content":"Developer-controlled execution<br>\nYour application decides how and where functions run","children":[],"payload":{"tag":"li","lines":"1648,1650"}},{"content":"Reliable integration pattern<br>\nCall APIs, internal services, or helper utilities safely","children":[],"payload":{"tag":"li","lines":"1650,1652"}},{"content":"Multi-turn orchestration<br>\nReturn tool output and let the model continue reasoning","children":[],"payload":{"tag":"li","lines":"1652,1654"}},{"content":"Grounded responses<br>\nAnswers can include live, system-generated data","children":[],"payload":{"tag":"li","lines":"1654,1657"}}],"payload":{"tag":"li","lines":"1645,1657"}},{"content":"\n<p data-lines=\"1657,1658\">Common use cases</p>\n<table data-lines=\"1658,1663\">\n<thead data-lines=\"1658,1659\">\n<tr data-lines=\"1658,1659\">\n<th>Use Case</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody data-lines=\"1660,1663\">\n<tr data-lines=\"1660,1661\">\n<td>System Integration</td>\n<td>Call an internal API for account or order details</td>\n</tr>\n<tr data-lines=\"1661,1662\">\n<td>Task Automation</td>\n<td>Trigger workflows like ticket creation or notifications</td>\n</tr>\n<tr data-lines=\"1662,1663\">\n<td>Data Lookup</td>\n<td>Query business rules or reference tables before answering</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"1657,1664"}},{"content":"\n<p data-lines=\"1664,1665\">Example that exposes a <code>get_time</code> function</p>\n  <pre><code>\n      import time\n      from openai import OpenAI\n      # Function to get the current time\n      def get_time():\n          return f&quot;The time is {time.strftime(&apos;%Y-%m-%d %H:%M:%S&apos;, time.localtime())}&quot;\n      # Main function\n      def main():\n          client = OpenAI(\n              base_url={openai_endpoint},\n              api_key={auth_key_or_token}\n          )\n          function_tools = [\n              {\n                  &quot;type&quot;: &quot;function&quot;,\n                  &quot;name&quot;: &quot;get_time&quot;,\n                  &quot;description&quot;: &quot;Get the current time&quot;\n              }\n
