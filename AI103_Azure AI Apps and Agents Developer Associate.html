hildren":[],"payload":{"tag":"li","lines":"3739,3740"}},{"content":"Maintaining search infrastructure","children":[],"payload":{"tag":"li","lines":"3740,3742"}}],"payload":{"tag":"li","lines":"3736,3742"}},{"content":"\n<p data-lines=\"3742,3743\">What is Foundry IQ?</p>","children":[{"content":"Is a managed knowledge platform for AI agents","children":[],"payload":{"tag":"li","lines":"3743,3744"}},{"content":"Is built on Azure AI Search","children":[],"payload":{"tag":"li","lines":"3744,3745"}},{"content":"Provides the retrieval capabilities","children":[],"payload":{"tag":"li","lines":"3745,3746"}},{"content":"Shared service (of  knowledge bases) that multiple agents can use<br>\nTo agents appears as one unified knowledge source<br>\nFor developers it means connecting data sources to knowledge bases","children":[],"payload":{"tag":"li","lines":"3746,3750"}}],"payload":{"tag":"li","lines":"3742,3750"}},{"content":"\n<p data-lines=\"3750,3751\">How knowledge bases organize information</p>","children":[{"content":"Knowledge bases in Foundry IQ organize information by business domain","children":[{"content":"Like","children":[{"content":"Product Documentation","children":[],"payload":{"tag":"li","lines":"3753,3754"}},{"content":"HR Policies","children":[],"payload":{"tag":"li","lines":"3754,3755"}}],"payload":{"tag":"li","lines":"3752,3755"}},{"content":"Not like","children":[{"content":"SharePoint Site A","children":[],"payload":{"tag":"li","lines":"3756,3757"}},{"content":"Blob Container B","children":[],"payload":{"tag":"li","lines":"3757,3758"}}],"payload":{"tag":"li","lines":"3755,3758"}}],"payload":{"tag":"li","lines":"3751,3758"}},{"content":"Example of a Product Documentation knowledge base","children":[{"content":"Technical specifications from SharePoint","children":[],"payload":{"tag":"li","lines":"3759,3760"}},{"content":"API documentation from Azure Blob Storage","children":[],"payload":{"tag":"li","lines":"3760,3761"}},{"content":"Usage analytics from OneLake","children":[],"payload":{"tag":"li","lines":"3761,3762"}},{"content":"Support tickets from your existing search index","children":[],"payload":{"tag":"li","lines":"3762,3764"}}],"payload":{"tag":"li","lines":"3758,3764"}}],"payload":{"tag":"li","lines":"3750,3764"}},{"content":"\n<p data-lines=\"3764,3765\">Connecting data sources</p>","children":[{"content":"Foundry IQ connects &#x2014; once per data source &#x2014; to existing<br>\nstorage through data source integrations","children":[],"payload":{"tag":"li","lines":"3765,3767"}},{"content":"There&apos;s no need to write retrieval logic or<br>\nmanage search infrastructure","children":[],"payload":{"tag":"li","lines":"3767,3769"}},{"content":"Just point at","children":[{"content":"SharePoint sites","children":[],"payload":{"tag":"li","lines":"3770,3771"}},{"content":"Blob containers","children":[],"payload":{"tag":"li","lines":"3771,3772"}},{"content":"OneLake instances","children":[],"payload":{"tag":"li","lines":"3772,3773"}}],"payload":{"tag":"li","lines":"3769,3773"}},{"content":"Foundry IQ handles automatically","children":[{"content":"Indexing","children":[],"payload":{"tag":"li","lines":"3774,3775"}},{"content":"Embedding generation","children":[],"payload":{"tag":"li","lines":"3775,3776"}},{"content":"Search optimization","children":[],"payload":{"tag":"li","lines":"3776,3778"}}],"payload":{"tag":"li","lines":"3773,3778"}}],"payload":{"tag":"li","lines":"3764,3778"}},{"content":"\n<p data-lines=\"3778,3779\">Built-in retrieval intelligence</p>","children":[{"content":"When an agent queries a<br>\nknowledge base, Foundry IQ","children":[{"content":"Analyzes the question to understand what<br>\ninformation the agent needs.<br>\nA question like &quot;What&apos;s our return policy for damaged items?&quot; requires<br>\ndifferent retrieval than &quot;List all return policies.&quot;","children":[],"payload":{"tag":"li","lines":"3781,3785"}},{"content":"Selects retrieval strategies based on the query.<br>\nSimple factual questions use keyword search.<br>\nComplex questions combine semantic search with query expansion.","children":[],"payload":{"tag":"li","lines":"3785,3788"}},{"content":"Ranks results using relevance scoring<br>\nThe most contextually appropriate information<br>\nsurfaces first, reducing the tokens needed for agent responses.","children":[],"payload":{"tag":"li","lines":"3788,3791"}},{"content":"Provides citations so agents can reference source documents.<br>\nThis builds trust and lets users verify information.","children":[],"payload":{"tag":"li","lines":"3791,3794"}}],"payload":{"tag":"li","lines":"3779,3794"}}],"payload":{"tag":"li","lines":"3778,3794"}},{"content":"\n<p data-lines=\"3794,3795\">Connecting agents to knowledge</p>","children":[{"content":"Example  <pre><code>\n      from azure.ai.projects        import AIProjectClient\n      from azure.ai.projects.models import PromptAgentDefinition, MCPTool\n      &#xa0;\n      project_client = AIProjectClient(endpoint=project_endpoint, credential=credential)\n      &#xa0;\n      # Connect to the product documentation knowledge base\n      knowledge_tool = MCPTool(\n          server_label=&quot;product-docs&quot;,\n          server_url=f&quot;{search_endpoint}/knowledgebases/product-documentation/mcp&quot;\n      )\n      &#xa0;\n      # Create an agent with knowledge access\n      agent = project_client.agents.create_version(\n          agent_name=&quot;product-support-agent&quot;,\n          definition=PromptAgentDefinition(\n              model=&quot;gpt-4o-mini&quot;,\n              instructions=&quot;Answer product questions using the knowledge base. Always cite your sources.&quot;,\n              tools=[knowledge_tool]\n          )\n      )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"3795,3819"}}],"payload":{"tag":"li","lines":"3794,3819"}},{"content":"\n<p data-lines=\"3819,3820\">The shared knowledge advantage</p>","children":[{"content":"If the organization needs","children":[{"content":"A support agent answering customer questions","children":[],"payload":{"tag":"li","lines":"3821,3822"}},{"content":"An employee assistant helping with HR policies","children":[],"payload":{"tag":"li","lines":"3822,3823"}},{"content":"A developer agent explaining API usage","children":[],"payload":{"tag":"li","lines":"3823,3824"}}],"payload":{"tag":"li","lines":"3820,3824"}},{"content":"Traditional RAG need to build and maintain three retrieval systems","children":[],"payload":{"tag":"li","lines":"3824,3825"}},{"content":"Foundry IQ create knowledge bases that multiple agents share","children":[{"content":"The Product Documentation knowledge base serves<br>\nboth the support agent and developer agent","children":[],"payload":{"tag":"li","lines":"3826,3828"}},{"content":"The HR Policies knowledge base serves<br>\nonly the employee assistant","children":[],"payload":{"tag":"li","lines":"3828,3830"}},{"content":"Each agent accesses exactly the knowledge it needs","children":[],"payload":{"tag":"li","lines":"3830,3831"}}],"payload":{"tag":"li","lines":"3825,3831"}},{"content":"<span>&#x1f4a1;</span><mark>Foundry IQ uses the Model Context Protocol (MCP) to<br>\n&#xa0;&#xa0;&#xa0;&#xa0;connect agents to knowledge bases.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;MCP provides a standardized way for AI agents to access<br>\n&#xa0;&#xa0;&#xa0;&#xa0;external tools and data sources securely.</mark>","children":[],"payload":{"tag":"li","lines":"3831,3836"}}],"payload":{"tag":"li","lines":"3819,3836"}}],"payload":{"tag":"li","lines":"3734,3836"}},{"content":"\n<p data-lines=\"3836,3837\"><strong>Configure data sources for knowledge bases</strong>~</p>","children":[{"content":"\n<p data-lines=\"3838,3839\">Foundry IQ supports six primary data source types</p>\n<table data-lines=\"3839,3847\">\n<thead data-lines=\"3839,3840\">\n<tr data-lines=\"3839,3840\">\n<th style=\"text-align:left\">Data Source</th>\n<th style=\"text-align:left\">Access Type</th>\n<th style=\"text-align:left\">Best For</th>\n</tr>\n</thead>\n<tbody data-lines=\"3841,3847\">\n<tr data-lines=\"3841,3842\">\n<td style=\"text-align:left\">Azure AI Search Index</td>\n<td style=\"text-align:left\">Indexed</td>\n<td style=\"text-align:left\">Enterprise search with custom pipelines</td>\n</tr>\n<tr data-lines=\"3842,3843\">\n<td style=\"text-align:left\">Azure Blob Storage</td>\n<td style=\"text-align:left\">Direct</td>\n<td style=\"text-align:left\">Document files in Azure Storage</td>\n</tr>\n<tr data-lines=\"3843,3844\">\n<td style=\"text-align:left\">Web</td>\n<td style=\"text-align:left\">Real-time</td>\n<td style=\"text-align:left\">Current, public information via Bing</td>\n</tr>\n<tr data-lines=\"3844,3845\">\n<td style=\"text-align:left\">SharePoint (Remote)</td>\n<td style=\"text-align:left\">Real-time</td>\n<td style=\"text-align:left\">Live SharePoint content with MS 365 governance</td>\n</tr>\n<tr data-lines=\"3845,3846\">\n<td style=\"text-align:left\">SharePoint (Indexed)</td>\n<td style=\"text-align:left\">Indexed</td>\n<td style=\"text-align:left\">Advanced search on SharePoint with custom pipelines</td>\n</tr>\n<tr data-lines=\"3846,3847\">\n<td style=\"text-align:left\">OneLake</td>\n<td style=\"text-align:left\">Direct</td>\n<td style=\"text-align:left\">Unstructured data in MS Fabric</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"3838,3848"}},{"content":"\n<p data-lines=\"3848,3849\">Azure AI Search Index</p>","children":[{"content":"Ideal when already invested in Azure AI Search and<br>\nwant to use existing search indexes","children":[],"payload":{"tag":"li","lines":"3849,3851"}},{"content":"Connect directly to your Azure AI Search index","children":[],"payload":{"tag":"li","lines":"3851,3852"}},{"content":"Key benefits","children":[{"content":"Semantic ranking<br>\nFinds contextually relevant results, not just keyword matches","children":[],"payload":{"tag":"li","lines":"3853,3855"}},{"content":"Custom scoring<br>\nPrioritizes results based on your business logic","children":[],"payload":{"tag":"li","lines":"3855,3857"}},{"content":"Faceted navigation<br>\nFilters results by categories or attributes","children":[],"payload":{"tag":"li","lines":"3857,3859"}},{"content":"Multi-language support<br>\nHandles content in different languages","children":[],"payload":{"tag":"li","lines":"3859,3861"}}],"payload":{"tag":"li","lines":"3852,3861"}},{"content":"<span>&#x1f4a1;</span><mark>Learn more about <a href=\"https://learn.MS.com/en-us/azure/search/search-what-is-azure-search\">Azure AI Search</a></mark>","children":[],"payload":{"tag":"li","lines":"3861,3863"}}],"payload":{"tag":"li","lines":"3848,3863"}},{"content":"\n<p data-lines=\"3863,3864\">Azure Blob Storage</p>","children":[{"content":"Retrieve documents and files directly from your blob containers","children":[],"payload":{"tag":"li","lines":"3864,3865"}},{"content":"Is possible organize blobs into containers based on<br>\ntopics or access levels","children":[],"payload":{"tag":"li","lines":"3865,3867"}},{"content":"Common file types","children":[{"content":"PDF documents","children":[],"payload":{"tag":"li","lines":"3868,3869"}},{"content":"MS Word files (.docx)","children":[],"payload":{"tag":"li","lines":"3869,3870"}},{"content":"Text files (.txt)","children":[],"payload":{"tag":"li","lines":"3870,3871"}},{"content":"Markdown files (.md)","children":[],"payload":{"tag":"li","lines":"3871,3872"}},{"content":"HTML files","children":[],"payload":{"tag":"li","lines":"3872,3873"}}],"payload":{"tag":"li","lines":"3867,3873"}},{"content":"<span>&#x1f4a1;</span><mark>Blob Storage provides a more direct path from your files to your knowledge base</mark>","children":[],"payload":{"tag":"li","lines":"3873,3875"}}],"payload":{"tag":"li","lines":"3863,3875"}},{"content":"\n<p data-lines=\"3875,3876\">Web</p>","children":[{"content":"Grounds your agent with real-time content<br>\nfrom the internet via Bing","children":[],"payload":{"tag":"li","lines":"3876,3878"}},{"content":"Agent can search for current information<br>\nwhen answering questions","children":[],"payload":{"tag":"li","lines":"3878,3880"}},{"content":"Important when users ask about","children":[{"content":"Recent events or news","children":[],"payload":{"tag":"li","lines":"3881,3882"}},{"content":"Current pricing or availability","children":[],"payload":{"tag":"li","lines":"3882,3883"}},{"content":"Frequently changing information","children":[],"payload":{"tag":"li","lines":"3883,3884"}},{"content":"Topics outside your internal knowledge base","children":[],"payload":{"tag":"li","lines":"3884,3885"}}],"payload":{"tag":"li","lines":"3880,3885"}},{"content":"You can combine web grounding with internal data sources,<br>\nusing web access as a supplementary source when<br>\ninternal knowledge doesn&apos;t provide an answer","children":[],"payload":{"tag":"li","lines":"3885,3888"}},{"content":"<span>&#x26a0;</span> <mark>With web grounding, you&apos;re relying on Bing&apos;s search results,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;which means less control over the specific sources your agent references.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;When accuracy and source verification are critical, consider using indexed,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;controlled data sources instead</mark>","children":[],"payload":{"tag":"li","lines":"3888,3893"}}],"payload":{"tag":"li","lines":"3875,3893"}},{"content":"\n<p data-lines=\"3893,3894\">MS SharePoint options</p>\n<table data-lines=\"3894,3902\">\n<thead data-lines=\"3894,3895\">\n<tr data-lines=\"3894,3895\">\n<th style=\"text-align:left\">Feature</th>\n<th style=\"text-align:left\">Remote</th>\n<th style=\"text-align:left\">Indexed</th>\n</tr>\n</thead>\n<tbody data-lines=\"3896,3902\">\n<tr data-lines=\"3896,3897\">\n<td style=\"text-align:left\">Access method</td>\n<td style=\"text-align:left\">Real-time queries</td>\n<td style=\"text-align:left\">Preprocessed index</td>\n</tr>\n<tr data-lines=\"3897,3898\">\n<td style=\"text-align:left\">Response time</td>\n<td style=\"text-align:left\">Depends on SharePoint</td>\n<td style=\"text-align:left\">Faster</td>\n</tr>\n<tr data-lines=\"3898,3899\">\n<td style=\"text-align:left\">Maintenance</td>\n<td style=\"text-align:left\">No index to maintain</td>\n<td style=\"text-align:left\">Requires index updates</td>\n</tr>\n<tr data-lines=\"3899,3900\">\n<td style=\"text-align:left\">Advanced search</td>\n<td style=\"text-align:left\">Limited</td>\n<td style=\"text-align:left\">Full Azure AI Search capabilities</td>\n</tr>\n<tr data-lines=\"3900,3901\">\n<td style=\"text-align:left\">Data freshness</td>\n<td style=\"text-align:left\">Always current</td>\n<td style=\"text-align:left\">Depends on indexing schedule</td>\n</tr>\n<tr data-lines=\"3901,3902\">\n<td style=\"text-align:left\">Permission handling</td>\n<td style=\"text-align:left\">Respects SharePoint permissions</td>\n<td style=\"text-align:left\">Configured during indexing</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"3893,3903"}},{"content":"\n<p data-lines=\"3903,3904\">SharePoint Remote</p>","children":[{"content":"Provides search capabilities with MS 365 governance","children":[],"payload":{"tag":"li","lines":"3904,3905"}},{"content":"Retrieves content directly from SharePoint without preindexing","children":[],"payload":{"tag":"li","lines":"3905,3906"}},{"content":"Agent searches SharePoint sites and libraries in real-time","children":[],"payload":{"tag":"li","lines":"3906,3907"}},{"content":"Benefits","children":[{"content":"No index maintenance required","children":[],"payload":{"tag":"li","lines":"3908,3909"}},{"content":"Always accesses current SharePoint content","children":[],"payload":{"tag":"li","lines":"3909,3910"}},{"content":"Automatically respects existing SharePoint permissions","children":[],"payload":{"tag":"li","lines":"3910,3911"}},{"content":"Simpler setup and configuration","children":[],"payload":{"tag":"li","lines":"3911,3912"}}],"payload":{"tag":"li","lines":"3907,3912"}},{"content":"<span>&#x1f4a1;</span><mark>Use SharePoint Remote when you need the simplest path to<br>\n&#xa0;&#xa0;&#xa0;&#xa0;SharePoint data and don&apos;t require advanced search features</mark>","children":[],"payload":{"tag":"li","lines":"3912,3915"}}],"payload":{"tag":"li","lines":"3903,3915"}},{"content":"\n<p data-lines=\"3915,3916\">SharePoint Indexed</p>","children":[{"content":"Processes your SharePoint content in advance","children":[],"payload":{"tag":"li","lines":"3916,3917"}},{"content":"Preprocessing means","children":[{"content":"Faster response times","children":[],"payload":{"tag":"li","lines":"3918,3919"}},{"content":"More sophisticated search capabilities","children":[],"payload":{"tag":"li","lines":"3919,3920"}}],"payload":{"tag":"li","lines":"3917,3920"}},{"content":"With indexed content","children":[{"content":"Apply custom analyzers for specialized terminology","children":[],"payload":{"tag":"li","lines":"3921,3922"}},{"content":"Build enrichment pipelines with AI services","children":[],"payload":{"tag":"li","lines":"3922,3923"}},{"content":"Combine SharePoint data with other sources","children":[],"payload":{"tag":"li","lines":"3923,3924"}},{"content":"Create specialized search experiences","children":[],"payload":{"tag":"li","lines":"3924,3925"}}],"payload":{"tag":"li","lines":"3920,3925"}},{"content":"<span>&#x1f4a1;</span><mark>Indexed SharePoint works best when you need advanced search features or<br>\n&#xa0;&#xa0;&#xa0;&#xa0;when you&apos;re integrating SharePoint data with other sources in your Azure AI Search index.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;SharePoint data and don&apos;t require advanced search features</mark>","children":[],"payload":{"tag":"li","lines":"3925,3929"}}],"payload":{"tag":"li","lines":"3915,3929"}},{"content":"\n<p data-lines=\"3929,3930\">MS OneLake</p>","children":[{"content":"Provides access to unstructured data<br>\nstored in your MS Fabric data lakehouse","children":[],"payload":{"tag":"li","lines":"3930,3932"}},{"content":"This option matters when your organization uses<br>\nMS Fabric for data analytics and storage","children":[],"payload":{"tag":"li","lines":"3932,3934"}},{"content":"The agent can reference this information when answering<br>\nbusiness questions, providing data-driven responses grounded in<br>\nyour organization&apos;s analytical work","children":[],"payload":{"tag":"li","lines":"3934,3937"}},{"content":"Use cases","children":[{"content":"Business intelligence reports<br>\nReference analytical findings in agent responses","children":[],"payload":{"tag":"li","lines":"3938,3940"}},{"content":"Data documentation<br>\nProvide context about datasets and metrics","children":[],"payload":{"tag":"li","lines":"3940,3942"}},{"content":"Analytical findings<br>\nShare insights from data science work","children":[],"payload":{"tag":"li","lines":"3942,3944"}},{"content":"Research outputs<br>\nMake research accessible through conversational AI","children":[],"payload":{"tag":"li","lines":"3944,3947"}}],"payload":{"tag":"li","lines":"3937,3947"}}],"payload":{"tag":"li","lines":"3929,3947"}},{"content":"\n<p data-lines=\"3947,3948\">Choose the right data source</p>\n<table data-lines=\"3948,3956\">\n<thead data-lines=\"3948,3949\">\n<tr data-lines=\"3948,3949\">\n<th style=\"text-align:left\">If your data is...</th>\n<th style=\"text-align:left\">And you need...</th>\n<th style=\"text-align:left\">Choose...</th>\n</tr>\n</thead>\n<tbody data-lines=\"3950,3956\">\n<tr data-lines=\"3950,3951\">\n<td style=\"text-align:left\">In SharePoint</td>\n<td style=\"text-align:left\">Simple setup, always current</td>\n<td style=\"text-align:left\">SharePoint Remote</td>\n</tr>\n<tr data-lines=\"3951,3952\">\n<td style=\"text-align:left\">In SharePoint</td>\n<td style=\"text-align:left\">Advanced search, custom pipelines</td>\n<td style=\"text-align:left\">SharePoint Indexed</td>\n</tr>\n<tr data-lines=\"3952,3953\">\n<td style=\"text-align:left\">Files in Azure</td>\n<td style=\"text-align:left\">Direct file access</td>\n<td style=\"text-align:left\">Azure Blob Storage</td>\n</tr>\n<tr data-lines=\"3953,3954\">\n<td style=\"text-align:left\">In MS Fabric</td>\n<td style=\"text-align:left\">Data lakehouse content</td>\n<td style=\"text-align:left\">OneLake</td>\n</tr>\n<tr data-lines=\"3954,3955\">\n<td style=\"text-align:left\">Already indexed</td>\n<td style=\"text-align:left\">Existing Azure AI Search investment</td>\n<td style=\"text-align:left\">Azure AI Search Index</td>\n</tr>\n<tr data-lines=\"3955,3956\">\n<td style=\"text-align:left\">Public, current information</td>\n<td style=\"text-align:left\">Real-time web content</td>\n<td style=\"text-align:left\">Web</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"3947,3957"}},{"content":"\n<p data-lines=\"3957,3960\"><span>&#x1f4a1;</span><mark>You can combine multiple sources in a single knowledge base<br>\n&#xa0;&#xa0;&#xa0;&#xa0;use internal SharePoint data as the primary knowledge base<br>\n&#xa0;&#xa0;&#xa0;&#xa0;while enabling web grounding for current events or supplementary information</mark></p>","children":[],"payload":{"tag":"li","lines":"3957,3961"}}],"payload":{"tag":"li","lines":"3836,3961"}},{"content":"\n<p data-lines=\"3961,3962\"><strong>Configure retrieval with Foundry IQ</strong></p>","children":[{"content":"\n<p data-lines=\"3963,3964\">The retrieval behavior problem</p>","children":[{"content":"Example","children":[{"content":"\n<p data-lines=\"3965,3967\">Question to agent<br>\n&quot;What&apos;s our vacation policy?&quot;</p>","children":[],"payload":{"tag":"li","lines":"3965,3968"}},{"content":"\n<p data-lines=\"3968,3969\">Possible behaviors</p>\n<table data-lines=\"3969,3974\">\n<thead data-lines=\"3969,3970\">\n<tr data-lines=\"3969,3970\">\n<th style=\"text-align:left\">Behavior</th>\n<th style=\"text-align:left\">Example Response</th>\n<th style=\"text-align:left\">Problem</th>\n</tr>\n</thead>\n<tbody data-lines=\"3971,3974\">\n<tr data-lines=\"3971,3972\">\n<td style=\"text-align:left\">Answers from training data</td>\n<td style=\"text-align:left\">&quot;Most companies offer 2-3 weeks of<br> vacation annually&quot;</td>\n<td style=\"text-align:left\">Generic information,<br> not your actual policy</td>\n</tr>\n<tr data-lines=\"3972,3973\">\n<td style=\"text-align:left\">Searches but doesn&apos;t cite</td>\n<td style=\"text-align:left\">&quot;You get 15 days of PTO annually&quot;</td>\n<td style=\"text-align:left\">Correct but unverifiable,<br> no accountability</td>\n</tr>\n<tr data-lines=\"3973,3974\">\n<td style=\"text-align:left\">Searches, cites, and grounds</td>\n<td style=\"text-align:left\">&quot;You receive 15 days of paid time off annually<br>&#x3010;doc_id:1&#x2020;Employee Handbook 2024&#x3011;&quot;</td>\n<td style=\"text-align:left\">This is what you want</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"3968,3975"}}],"payload":{"tag":"li","lines":"3964,3975"}}],"payload":{"tag":"li","lines":"3963,3975"}},{"content":"\n<p data-lines=\"3975,3976\">Controlling retrieval with instructions</p>","children":[{"content":"Agent instructions determine retrieval behavior","children":[],"payload":{"tag":"li","lines":"3976,3977"}},{"content":"Example  <pre><code>\n      agent = project_client.agents.create_version(\n          agent_name=&quot;hr-assistant&quot;,\n          definition=PromptAgentDefinition(\n              model=&quot;gpt-4o-mini&quot;,\n              instructions=&quot;Answer HR questions using the knowledge base.&quot;,\n              tools=[knowledge_tool]\n          )\n      )\n  </code></pre>","children":[{"content":"Instruction too vague","children":[],"payload":{"tag":"li","lines":"3988,3989"}},{"content":"Doesn&apos;t specify <em>when</em> to use or <em>how</em> to present results","children":[],"payload":{"tag":"li","lines":"3989,3991"}}],"payload":{"tag":"li","lines":"3977,3991"}}],"payload":{"tag":"li","lines":"3975,3991"}},{"content":"\n<p data-lines=\"3991,3992\">Writing effective retrieval instructions</p>","children":[{"content":"Effective instructions specify three critical behaviors","children":[{"content":"1. When to retrieve<br>\nTell the agent to always use the knowledge base, never rely on training data","children":[],"payload":{"tag":"li","lines":"3993,3995","listIndex":1}},{"content":"2. How to cite<br>\nSpecify the exact format for source attribution","children":[],"payload":{"tag":"li","lines":"3995,3997","listIndex":2}},{"content":"3. What to do when unsure<br>\nDefine fallback behavior when information isn&apos;t found","children":[],"payload":{"tag":"li","lines":"3997,3999","listIndex":3}}],"payload":{"tag":"li","lines":"3992,3999"}},{"content":"Example  <pre><code>\n      retrieval_instructions = &quot;&quot;&quot;You are a helpful HR assistant.\n      &#xa0;\n      CRITICAL RULES:\n      - You must ALWAYS search the knowledge base before answering any question\n      - You must NEVER answer from your own knowledge or training data\n      - Every answer must include citations in this format: &#x3010;doc_id:search_id&#x2020;source_name&#x3011;\n      - If the knowledge base doesn&apos;t contain the answer, respond with &quot;I don&apos;t have that information in our current documentation. Please contact HR directly at hr@company.com&quot;\n      &#xa0;\n      Your role is to provide accurate, verifiable information from company documentation.&quot;&quot;&quot;\n      &#xa0;\n      agent = project_client.agents.create_version(\n          agent_name=&quot;hr-assistant&quot;,\n          definition=PromptAgentDefinition(\n              model=&quot;gpt-4o-mini&quot;,\n              instructions=retrieval_instructions,\n              tools=[knowledge_tool]\n          )\n      )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"3999,4020"}},{"content":"Result<br>\nThese instructions create consistent behavior","children":[{"content":"1. The agent knows exactly when to search","children":[],"payload":{"tag":"li","lines":"4022,4023","listIndex":1}},{"content":"2. how to format responses","children":[],"payload":{"tag":"li","lines":"4023,4024","listIndex":2}},{"content":"3. what to do when information isn&apos;t available.","children":[],"payload":{"tag":"li","lines":"4024,4026","listIndex":3}}],"payload":{"tag":"li","lines":"4020,4026"}}],"payload":{"tag":"li","lines":"3991,4026"}},{"content":"\n<p data-lines=\"4026,4027\">Testing retrieval behavior</p>","children":[{"content":"Setting up a test conversation","children":[{"content":"Example  <pre><code>\n  openai_client = project_client.get_openai_client()\n  conversation = openai_client.conversations.create()\n  &#xa0;\n  # Test query that should trigger retrieval\n  response = openai_client.responses.create(\n      conversation=conversation.id,\n      input=&quot;How many vacation days do I get?&quot;,\n      extra_body={&quot;agent&quot;: {&quot;name&quot;: agent.name, &quot;type&quot;: &quot;agent_reference&quot;}}\n  )\n  &#xa0;\n  print(response.output_text)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"4028,4043"}}],"payload":{"tag":"li","lines":"4027,4043"}}],"payload":{"tag":"li","lines":"4026,4043"}},{"content":"\n<p data-lines=\"4043,4044\">What to test</p>\n<table data-lines=\"4044,4050\">\n<thead data-lines=\"4044,4045\">\n<tr data-lines=\"4044,4045\">\n<th style=\"text-align:left\">Query Type</th>\n<th style=\"text-align:left\">Example Questions</th>\n<th style=\"text-align:left\">Expected Behavior</th>\n</tr>\n</thead>\n<tbody data-lines=\"4046,4050\">\n<tr data-lines=\"4046,4047\">\n<td style=\"text-align:left\">Straightforward factual</td>\n<td style=\"text-align:left\">&quot;What is our vacation policy?&quot;<br>&quot;Where can I find the security guidelines?&quot;</td>\n<td style=\"text-align:left\">Direct retrieval with citations</td>\n</tr>\n<tr data-lines=\"4047,4048\">\n<td style=\"text-align:left\">Questions requiring<br>synthesis</td>\n<td style=\"text-align:left\">&quot;What are the differences between our leave types?&quot;<br>&quot;How do I request time off?&quot;</td>\n<td style=\"text-align:left\">Multiple document retrieval,<br> synthesized answer with multiple citations</td>\n</tr>\n<tr data-lines=\"4048,4049\">\n<td style=\"text-align:left\">Questions outside knowledge base</td>\n<td style=\"text-align:left\">&quot;What&apos;s the weather like today?&quot;<br>&quot;Tell me about machine learning&quot;</td>\n<td style=\"text-align:left\">Graceful fallback<br>(&quot;I don&apos;t have that information...&quot;)</td>\n</tr>\n<tr data-lines=\"4049,4050\">\n<td style=\"text-align:left\">Ambiguous questions</td>\n<td style=\"text-align:left\">&quot;What about benefits?&quot;<br>&quot;Tell me more about that&quot;</td>\n<td style=\"text-align:left\">Clarifying questions or focused search on most<br> relevant topic</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"4043,4051"}},{"content":"\n<p data-lines=\"4051,4053\">Evaluating response quality<br>\nCharacteristics of good responses</p>","children":[{"content":"Grounding<br>\nInformation comes from knowledge base, not training data","children":[],"payload":{"tag":"li","lines":"4053,4055"}},{"content":"Citation<br>\nEvery factual claim includes source references","children":[],"payload":{"tag":"li","lines":"4055,4057"}},{"content":"Relevance<br>\nRetrieved content actually answers the question","children":[],"payload":{"tag":"li","lines":"4057,4059"}},{"content":"Completeness<br>\nAll necessary information is provided, not just fragments","children":[],"payload":{"tag":"li","lines":"4059,4062"}}],"payload":{"tag":"li","lines":"4051,4062"}},{"content":"\n<p data-lines=\"4062,4064\">Retrieval strategies for<br>\ndifferent agent types</p>","children":[{"content":"\n<p data-lines=\"4064,4065\">Customer-facing support agents</p>","children":[{"content":"\n<p data-lines=\"4065,4066\">Agents need high accuracy</p>","children":[],"payload":{"tag":"li","lines":"4065,4066"}},{"content":"\n<p data-lines=\"4066,4067\">Must never provide uncertain information</p>","children":[],"payload":{"tag":"li","lines":"4066,4067"}},{"content":"\n<p data-lines=\"4067,4068\">Example</p>\n  <pre>\n  \n<pre data-lines=\"4071,4078\"><code>  support_instructions = &quot;&quot;&quot;You provide customer support using our product documentation.\n\n  Rules:\n  - Search the knowledge base for every product question\n  - Cite documentation for all technical answers\n  - If documentation doesn&apos;t cover a question, say &quot;Let me connect you with a specialist&quot; rather than guessing\n  - Focus on official product information, not general knowledge&quot;&quot;&quot;\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"4067,4079"}}],"payload":{"tag":"li","lines":"4064,4079"}},{"content":"\n<p data-lines=\"4079,4080\">Internal research assistants</p>","children":[{"content":"\n<p data-lines=\"4080,4081\">Can synthesize across documents</p>","children":[],"payload":{"tag":"li","lines":"4080,4081"}},{"content":"\n<p data-lines=\"4081,4082\">Provide broader context</p>","children":[],"payload":{"tag":"li","lines":"4081,4082"}},{"content":"\n<p data-lines=\"4082,4083\">Example</p>\n  <pre>\n  \n<pre data-lines=\"4086,4094\"><code>  research_instructions = &quot;&quot;&quot;You help employees research topics across company documentation.\n\n  Rules:\n  - Search all relevant knowledge bases for comprehensive answers\n  - Synthesize information from multiple sources when helpful\n  - Always cite all sources used\n  - Indicate confidence level when synthesizing across documents\n  - Suggest related topics that might be useful&quot;&quot;&quot;\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"4082,4095"}}],"payload":{"tag":"li","lines":"4079,4095"}},{"content":"\n<p data-lines=\"4095,4096\">Specialized domain experts</p>","children":[{"content":"\n<p data-lines=\"4096,4097\">Focus deeply on specific knowledge domains</p>","children":[],"payload":{"tag":"li","lines":"4096,4097"}},{"content":"\n<p data-lines=\"4097,4098\">Example</p>\n  <pre>\n<pre data-lines=\"4101,4109\"><code>  compliance_instructions = &quot;&quot;&quot;You are a compliance documentation assistant.\n\n  Rules:\n  - Only answer questions about compliance policies and procedures\n  - Always cite the specific policy document and section\n  - If a question involves interpretation or legal advice, refer to the compliance team\n  - Keep answers strictly factual based on written policies\n  - Note the effective date of any policy you reference&quot;&quot;&quot;\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"4097,4111"}}],"payload":{"tag":"li","lines":"4095,4111"}},{"content":"\n<p data-lines=\"4111,4112\">The pattern</p>","children":[{"content":"Define the agent&apos;s scope","children":[],"payload":{"tag":"li","lines":"4112,4113"}},{"content":"Specify retrieval requirements","children":[],"payload":{"tag":"li","lines":"4113,4114"}},{"content":"Establish citation standards","children":[],"payload":{"tag":"li","lines":"4114,4115"}},{"content":"Handle edge cases explicitly","children":[],"payload":{"tag":"li","lines":"4115,4117"}}],"payload":{"tag":"li","lines":"4111,4117"}}],"payload":{"tag":"li","lines":"4062,4117"}},{"content":"\n<p data-lines=\"4117,4118\">Moving from testing to production</p>","children":[{"content":"\n<p data-lines=\"4118,4119\">New challenges</p>","children":[{"content":"Users ask questions differently than your test scenarios","children":[],"payload":{"tag":"li","lines":"4119,4120"}},{"content":"Some questions hit edge cases you didn&apos;t anticipate","children":[],"payload":{"tag":"li","lines":"4120,4121"}},{"content":"Others reveal gaps in your knowledge base content","children":[],"payload":{"tag":"li","lines":"4121,4123"}}],"payload":{"tag":"li","lines":"4118,4123"}},{"content":"\n<p data-lines=\"4123,4124\">Patterns to track</p>","children":[{"content":"Citation frequency<br>\nAre agents consistently citing sources?","children":[],"payload":{"tag":"li","lines":"4124,4126"}},{"content":"Fallback frequency<br>\nHow often do agents say &quot;I don&apos;t know&quot;?","children":[],"payload":{"tag":"li","lines":"4126,4128"}},{"content":"Query types<br>\nWhat categories of questions appear most often?","children":[],"payload":{"tag":"li","lines":"4128,4130"}},{"content":"Retrieval accuracy<br>\nDo retrieved documents actually contain answers?","children":[],"payload":{"tag":"li","lines":"4130,4132"}}],"payload":{"tag":"li","lines":"4123,4132"}},{"content":"\n<p data-lines=\"4132,4133\">Use this information to</p>","children":[{"content":"Refine instructions","children":[],"payload":{"tag":"li","lines":"4133,4134"}},{"content":"Improve knowledge base content","children":[],"payload":{"tag":"li","lines":"4134,4135"}},{"content":"Adjust search configurations","children":[],"payload":{"tag":"li","lines":"4135,4136"}}],"payload":{"tag":"li","lines":"4132,4136"}},{"content":"\n<p data-lines=\"4136,4137\"><span>&#x1f4a1;</span><mark>Retrieval quality improves through iteration based on real-world usage</mark></p>","children":[],"payload":{"tag":"li","lines":"4136,4139"}}],"payload":{"tag":"li","lines":"4117,4139"}}],"payload":{"tag":"li","lines":"3961,4139"}},{"content":"\n<p data-lines=\"4139,4140\"><strong>Key takeaways</strong></p>","children":[{"content":"RAG solves the knowledge problem","children":[{"content":"Connect agents to real-time knowledge sources","children":[],"payload":{"tag":"li","lines":"4141,4142"}},{"content":"RAG-enabled agents","children":[{"content":"Retrieve relevant information","children":[],"payload":{"tag":"li","lines":"4143,4144"}},{"content":"Augment queries with factual context","children":[],"payload":{"tag":"li","lines":"4144,4145"}},{"content":"Generate responses grounded in your organizational content","children":[],"payload":{"tag":"li","lines":"4145,4146"}}],"payload":{"tag":"li","lines":"4142,4146"}},{"content":"This provides","children":[{"content":"Real-time updates","children":[],"payload":{"tag":"li","lines":"4147,4148"}},{"content":"Source transparency","children":[],"payload":{"tag":"li","lines":"4148,4149"}},{"content":"Factual grounding","children":[],"payload":{"tag":"li","lines":"4149,4150"}}],"payload":{"tag":"li","lines":"4146,4150"}}],"payload":{"tag":"li","lines":"4140,4150"}},{"content":"Foundry IQ provides a shared knowledge platform","children":[{"content":"Foundry IQ eliminates the need to b<br>\nbuild custom RAG infrastructure for every agent","children":[],"payload":{"tag":"li","lines":"4151,4153"}},{"content":"Create knowledge bases<br>\nThat any agent can access them","children":[{"content":"Organized by business domain","children":[],"payload":{"tag":"li","lines":"4155,4156"}},{"content":"Connect data sources from","children":[{"content":"SharePoint","children":[],"payload":{"tag":"li","lines":"4157,4158"}},{"content":"Azure Blob Storage","children":[],"payload":{"tag":"li","lines":"4158,4159"}},{"content":"OneLake","children":[],"payload":{"tag":"li","lines":"4159,4160"}},{"content":"Azure AI Search indexes","children":[],"payload":{"tag":"li","lines":"4160,4161"}}],"payload":{"tag":"li","lines":"4156,4161"}},{"content":"This shared approach scales knowledge<br>\naccess across your organization","children":[],"payload":{"tag":"li","lines":"4161,4163"}}],"payload":{"tag":"li","lines":"4153,4163"}}],"payload":{"tag":"li","lines":"4150,4163"}},{"content":"Data quality determines retrieval effectiveness<br>\nImprove retrieval through three techniques","children":[{"content":"Scoring profiles<br>\nBoost specific fields or<br>\nattributes to surface more relevant results","children":[],"payload":{"tag":"li","lines":"4165,4168"}},{"content":"Semantic ranking<br>\nUses AI models to understand meaning and<br>\ncontext beyond keywords","children":[],"payload":{"tag":"li","lines":"4168,4171"}},{"content":"Custom analyzers<br>\nHandle specialized content like HTML,<br>\nproduct codes, or technical terminology","children":[],"payload":{"tag":"li","lines":"4171,4174"}}],"payload":{"tag":"li","lines":"4163,4174"}},{"content":"Instructions control agent behavior<br>\nEffective agent instructions specify","children":[{"content":"When to retrieve<br>\nAlways use the knowledge base","children":[],"payload":{"tag":"li","lines":"4176,4178"}},{"content":"How to cite<br>\nExact format for source attribution","children":[],"payload":{"tag":"li","lines":"4178,4180"}},{"content":"What to do when unsure<br>\nGraceful fallback","children":[],"payload":{"tag":"li","lines":"4180,4182"}}],"payload":{"tag":"li","lines":"4174,4182"}},{"content":"Next steps","children":[{"content":"Start with a high-value knowledge domain where accurate<br>\nCited information provides immediate business impact.","children":[],"payload":{"tag":"li","lines":"4183,4185"}},{"content":"Build your first knowledge base","children":[],"payload":{"tag":"li","lines":"4185,4186"}},{"content":"Configure data quality settings","children":[],"payload":{"tag":"li","lines":"4186,4187"}},{"content":"Create an agent with clear retrieval instructions","children":[],"payload":{"tag":"li","lines":"4187,4188"}},{"content":"Test systematically before deploying to users","children":[],"payload":{"tag":"li","lines":"4188,4192"}}],"payload":{"tag":"li","lines":"4182,4192"}}],"payload":{"tag":"li","lines":"4139,4192"}},{"content":"\n<p data-lines=\"4192,4194\"><strong>Exercise - Integrate an AI agent with Foundry IQ</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-agents/Instructions/09-integrate-agent-with-foundry-iq.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"4192,4198"}}],"payload":{"tag":"h3","lines":"3674,3675"}},{"content":"5. <a href=\"https://learn.MS.com/en-us/training/modules/integrate-foundry-agent-with-m365/\">Integrate your agent with MS 365</a>","children":[{"content":"\n<p data-lines=\"4200,4201\"><strong>Introduction</strong></p>","children":[{"content":"The User Environment Gap<br>\nWhile AI agents may perform perfectly in a testing environment like the<br>\nFoundry playground, friction occurs when users have to leave their<br>\nprimary collaboration tools to interact with them.","children":[],"payload":{"tag":"li","lines":"4201,4205"}},{"content":"Native Channels Integration<br>\nMS Foundry solves this by providing built-in capabilities to<br>\npublish custom AI agents directly into MS Teams and<br>\nMS 365 Copilot.","children":[],"payload":{"tag":"li","lines":"4205,4209"}},{"content":"Practical Workstream Deployment<br>\nThis allows you to surface specialized assistants&#x2014;such as IT support desks,<br>\nHR onboarding companions, or domain-specific advisors&#x2014;exactly where your team<br>\nalready communicates and works.","children":[],"payload":{"tag":"li","lines":"4209,4213"}},{"content":"Objectives<br>\nLearn to navigate the publishing workflow in the Foundry portal, evaluate advanced<br>\nintegration paths, and utilize Work IQ to grant agents secure access to MS 365 data sources,<br>\nincluding emails, meetings, and documents.","children":[],"payload":{"tag":"li","lines":"4213,4218"}}],"payload":{"tag":"li","lines":"4200,4218"}},{"content":"\n<p data-lines=\"4218,4219\"><strong>Understand Foundry agent publishing options</strong></p>","children":[{"content":"\n<p data-lines=\"4220,4223\">Understanding agent applications<br>\nAfteer publishing an agent Foundry creates an<br>\n<strong>Agent Application</strong> resource with</p>","children":[{"content":"Dedicated invocation URL<br>\nA stable endpoint that remains consistent as you update agent versions","children":[],"payload":{"tag":"li","lines":"4223,4225"}},{"content":"Agent identity<br>\nA distinct Microsoft Entra identity separate from your development project","children":[],"payload":{"tag":"li","lines":"4225,4227"}},{"content":"User data isolation<br>\nInputs and interactions from one user aren&apos;t available to other users","children":[],"payload":{"tag":"li","lines":"4227,4230"}}],"payload":{"tag":"li","lines":"4220,4230"}},{"content":"\n<p data-lines=\"4230,4231\">Publishing to Microsoft 365</p>","children":[{"content":"Creates an Azure Bot Service resource that routes messages between Microsoft 365 and your agent","children":[],"payload":{"tag":"li","lines":"4231,4232"}},{"content":"Generates a Microsoft 365 publishing package for distribution","children":[],"payload":{"tag":"li","lines":"4232,4233"}},{"content":"Registers a Microsoft Entra ID application for authentication","children":[],"payload":{"tag":"li","lines":"4233,4234"}},{"content":"Makes your agent discoverable in the Teams agent store","children":[],"payload":{"tag":"li","lines":"4234,4236"}}],"payload":{"tag":"li","lines":"4230,4236"}},{"content":"\n<p data-lines=\"4236,4237\">Direct publishing from Foundry portal</p>","children":[{"content":"Creates an Azure Bot Service resource in your subscription","children":[],"payload":{"tag":"li","lines":"4237,4238"}},{"content":"Registers a Microsoft Entra ID application","children":[],"payload":{"tag":"li","lines":"4238,4239"}},{"content":"Generates a Microsoft 365 publishing package","children":[],"payload":{"tag":"li","lines":"4239,4240"}},{"content":"Prepares your agent for distribution","children":[],"payload":{"tag":"li","lines":"4240,4241"}},{"content":"Ideal when you want to","children":[{"content":"Deploy quickly","children":[],"payload":{"tag":"li","lines":"4242,4243"}},{"content":"Keep your agent logic entirely within Foundry","children":[],"payload":{"tag":"li","lines":"4243,4245"}}],"payload":{"tag":"li","lines":"4241,4245"}}],"payload":{"tag":"li","lines":"4236,4245"}},{"content":"\n<p data-lines=\"4245,4246\">Microsoft 365 Agents Toolkit</p>","children":[{"content":"For complex scenarios","children":[],"payload":{"tag":"li","lines":"4246,4247"}},{"content":"Use the Microsoft 365 Agents Toolkit to<br>\ncreate a proxy application that connects to your Foundry agent","children":[],"payload":{"tag":"li","lines":"4247,4249"}},{"content":"When you need custom single sign-on (SSO)","children":[],"payload":{"tag":"li","lines":"4249,4250"}},{"content":"Advanced middleware logic","children":[],"payload":{"tag":"li","lines":"4250,4251"}},{"content":"Multi-environment deployment pipelines","children":[],"payload":{"tag":"li","lines":"4251,4253"}}],"payload":{"tag":"li","lines":"4245,4253"}},{"content":"\n<p data-lines=\"4253,4254\">Publish scopes</p>\n<table data-lines=\"4254,4258\">\n<thead data-lines=\"4254,4255\">\n<tr data-lines=\"4254,4255\">\n<th style=\"text-align:left\">Scope</th>\n<th style=\"text-align:left\">Description</th>\n<th style=\"text-align:left\">Best for</th>\n</tr>\n</thead>\n<tbody data-lines=\"4256,4258\">\n<tr data-lines=\"4256,4257\">\n<td style=\"text-align:left\">Shared</td>\n<td style=\"text-align:left\">Available immediately without admin approval.<br> Appears under Your agents in Teams.</td>\n<td style=\"text-align:left\">Personal testing,<br> small team pilots</td>\n</tr>\n<tr data-lines=\"4257,4258\">\n<td style=\"text-align:left\">Organization</td>\n<td style=\"text-align:left\">Available to everyone in your tenant under <strong>Built by your org</strong>.<br> Requires admin approval.</td>\n<td style=\"text-align:left\">Production deployments</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"4253,4259"}},{"content":"\n<p data-lines=\"4259,4260\">Other publishing channels</p>","children":[{"content":"Web application preview<br>\nBrowser-based interface for demos and stakeholder testing","children":[],"payload":{"tag":"li","lines":"4260,4262"}},{"content":"Stable API endpoint<br>\nREST API for embedding in custom applications","children":[],"payload":{"tag":"li","lines":"4262,4264"}},{"content":"Azure Bot Service channels<br>\nSlack, Telegram, Twilio (SMS), Facebook, and others","children":[],"payload":{"tag":"li","lines":"4264,4267"}}],"payload":{"tag":"li","lines":"4259,4267"}},{"content":"\n<p data-lines=\"4267,4270\">Agent identity and permissions<br>\nWhen you publish an agent, the<br>\nsystem creates a distinct agent identity</p>","children":[{"content":"The agent authenticates to Azure resources using its own identity","children":[],"payload":{"tag":"li","lines":"4270,4271"}},{"content":"Development-time permissions on your project identity don&apos;t transfer automatically","children":[],"payload":{"tag":"li","lines":"4271,4272"}},{"content":"Tools that access Azure services need permissions reconfigured after publishing","children":[],"payload":{"tag":"li","lines":"4272,4274"}}],"payload":{"tag":"li","lines":"4267,4274"}},{"content":"\n<p data-lines=\"4274,4275\">Prerequisites for publishing to Microsoft 365</p>","children":[{"content":"Azure AI Project Manager role on your Foundry project","children":[],"payload":{"tag":"li","lines":"4275,4276"}},{"content":"Azure AI User role on the agent application scope","children":[],"payload":{"tag":"li","lines":"4276,4277"}},{"content":"An Azure subscription where you can create Azure Bot Service resources","children":[],"payload":{"tag":"li","lines":"4277,4278"}},{"content":"Permissions to register applications in Microsoft Entra ID","children":[],"payload":{"tag":"li","lines":"4278,4279"}},{"content":"A Microsoft 365 tenant that allows custom apps and bots","children":[],"payload":{"tag":"li","lines":"4279,4281"}}],"payload":{"tag":"li","lines":"4274,4281"}}],"payload":{"tag":"li","lines":"4218,4281"}},{"content":"\n<p data-lines=\"4281,4282\"><strong>Publish an agent from Foundry portal to Teams</strong></p>","children":[{"content":"\n<p data-lines=\"4283,4284\">Before begin</p>","children":[{"content":"Test your agent thoroughly","children":[{"content":"Use the Foundry playground","children":[],"payload":{"tag":"li","lines":"4285,4286"}},{"content":"Test various user inputs","children":[],"payload":{"tag":"li","lines":"4286,4287"}},{"content":"Confirm any configured tools work correctly","children":[],"payload":{"tag":"li","lines":"4287,4288"}},{"content":"Check that responses are appropriate for your use case","children":[],"payload":{"tag":"li","lines":"4288,4289"}}],"payload":{"tag":"li","lines":"4284,4289"}},{"content":"Verify your permissions","children":[{"content":"Azure AI Project Manager role on your Foundry project to publish agents","children":[],"payload":{"tag":"li","lines":"4290,4291"}},{"content":"Azure AI User role to invoke or chat with published agents","children":[],"payload":{"tag":"li","lines":"4291,4292"}},{"content":"Permissions to create resources in your Azure subscription","children":[],"payload":{"tag":"li","lines":"4292,4293"}},{"content":"Permissions to register applications in Microsoft Entra ID","children":[],"payload":{"tag":"li","lines":"4293,4294"}}],"payload":{"tag":"li","lines":"4289,4294"}},{"content":"Register the Bot Service provider","children":[{"content":"Ensure the <code>Microsoft.BotService</code> provider is<br>\nregistered in your Azure subscription","children":[],"payload":{"tag":"li","lines":"4295,4297"}},{"content":"Check in the Azure portal under subscription&apos;s <strong>Resource providers</strong> section","children":[],"payload":{"tag":"li","lines":"4297,4298"}}],"payload":{"tag":"li","lines":"4294,4298"}},{"content":"Prepare metadata","children":[{"content":"A display name for your agent (appears in the Teams agent store)","children":[],"payload":{"tag":"li","lines":"4299,4300"}},{"content":"A brief description of what your agent does","children":[],"payload":{"tag":"li","lines":"4300,4301"}},{"content":"Small (32x32 pixels) and large (192x192 pixels) icons in PNG format","children":[],"payload":{"tag":"li","lines":"4301,4302"}},{"content":"Your organization&apos;s name and contact details","children":[],"payload":{"tag":"li","lines":"4302,4303"}},{"content":"URLs for your privacy policy and terms of use","children":[],"payload":{"tag":"li","lines":"4303,4305"}}],"payload":{"tag":"li","lines":"4298,4305"}}],"payload":{"tag":"li","lines":"4283,4305"}},{"content":"\n<p data-lines=\"4305,4306\">Publish your agent</p>","children":[{"content":"1. Select your agent version","children":[{"content":"Open the <a href=\"https://ai.azure.com/\">Microsoft Foundry portal</a> and navigate to your project.","children":[],"payload":{"tag":"li","lines":"4307,4308"}},{"content":"Select the agent you want to publish from your agent list.","children":[],"payload":{"tag":"li","lines":"4308,4309"}},{"content":"Review the agent configuration to confirm it&apos;s ready for publishing.","children":[],"payload":{"tag":"li","lines":"4309,4310"}}],"payload":{"tag":"li","lines":"4306,4310","listIndex":1}},{"content":"2. Start the publishing process","children":[{"content":"Select <strong>Publish</strong> to open the publishing dialog.","children":[],"payload":{"tag":"li","lines":"4311,4312"}},{"content":"Select <strong>Publish</strong> again, then choose <strong>Publish to Teams and Microsoft 365 Copilot</strong>.","children":[],"payload":{"tag":"li","lines":"4312,4313"}},{"content":"The Microsoft 365 publishing configuration window opens.","children":[],"payload":{"tag":"li","lines":"4313,4314"}}],"payload":{"tag":"li","lines":"4310,4314","listIndex":2}},{"content":"3. Configure Azure Bot Service","children":[{"content":"The portal automatically generates an application ID and tenant ID.<br>\nNote these values for troubleshooting.","children":[],"payload":{"tag":"li","lines":"4315,4317"}},{"content":"In the Azure Bot Service dropdown,<br>\nselect Create an Azure Bot Service to provision a new bot resource.","children":[],"payload":{"tag":"li","lines":"4317,4319"}},{"content":"Wait for the portal to create the Bot Service resource in your subscription.","children":[],"payload":{"tag":"li","lines":"4319,4320"}}],"payload":{"tag":"li","lines":"4314,4320","listIndex":3}},{"content":"4. Complete the metadata\n<table data-lines=\"4321,4329\">\n<thead data-lines=\"4321,4322\">\n<tr data-lines=\"4321,4322\">\n<th style=\"text-align:left\">Field</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"4323,4329\">\n<tr data-lines=\"4323,4324\">\n<td style=\"text-align:left\">Name</td>\n<td style=\"text-align:left\">Display name for your agent in the Teams store</td>\n</tr>\n<tr data-lines=\"4324,4325\">\n<td style=\"text-align:left\">Description</td>\n<td style=\"text-align:left\">Brief explanation of what your agent does</td>\n</tr>\n<tr data-lines=\"4325,4326\">\n<td style=\"text-align:left\">Icons</td>\n<td style=\"text-align:left\">Upload small and large PNG icons</td>\n</tr>\n<tr data-lines=\"4326,4327\">\n<td style=\"text-align:left\">Publisher information</td>\n<td style=\"text-align:left\">Your organization name and contact details</td>\n</tr>\n<tr data-lines=\"4327,4328\">\n<td style=\"text-align:left\">Privacy policy</td>\n<td style=\"text-align:left\">URL to your organization&apos;s privacy policy</td>\n</tr>\n<tr data-lines=\"4328,4329\">\n<td style=\"text-align:left\">Terms of use</td>\n<td style=\"text-align:left\">URL to your terms of service</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"4320,4329","listIndex":4}},{"content":"5. Choose your publish scope","children":[{"content":"Shared scope<br>\nAgent appears under &quot;Your agents&quot; in the store.<br>\nAvailable immediately.<br>\nBest for testing and small teams.","children":[],"payload":{"tag":"li","lines":"4330,4334"}},{"content":"Organization scope<br>\nAgent appears under &quot;Built by your org&quot; in the store.<br>\nRequires admin approval.<br>\nBest for production deployments.","children":[],"payload":{"tag":"li","lines":"4334,4338"}}],"payload":{"tag":"li","lines":"4329,4338","listIndex":5}},{"content":"6. Prepare and optionally download the package","children":[{"content":"Select <strong>Prepare Agent</strong> to start packaging your agent.","children":[],"payload":{"tag":"li","lines":"4339,4340"}},{"content":"Wait for the packaging process to complete (typically 1-2 minutes).","children":[],"payload":{"tag":"li","lines":"4340,4341"}},{"content":"When ready, you can either:","children":[{"content":"<strong>Download the package</strong> to test locally before distribution","children":[],"payload":{"tag":"li","lines":"4342,4343"}},{"content":"<strong>Continue the in-product publishing flow</strong> for direct distribution","children":[],"payload":{"tag":"li","lines":"4343,4345"}}],"payload":{"tag":"li","lines":"4341,4345"}}],"payload":{"tag":"li","lines":"4338,4345","listIndex":6}}],"payload":{"tag":"li","lines":"4305,4345"}},{"content":"\n<p data-lines=\"4345,4346\">Test the publishing package in Teams</p>","children":[{"content":"1. Open Microsoft Teams.","children":[],"payload":{"tag":"li","lines":"4346,4347","listIndex":1}},{"content":"2. Navigate to <strong>Apps &gt; Manage your apps &gt; Upload an app</strong>.","children":[],"payload":{"tag":"li","lines":"4347,4348","listIndex":2}},{"content":"3. Select <strong>Upload a custom app</strong> and choose the downloaded .zip file.","children":[],"payload":{"tag":"li","lines":"4348,4349","listIndex":3}},{"content":"4. Teams installs the app and shows it in your apps list.","children":[],"payload":{"tag":"li","lines":"4349,4350","listIndex":4}},{"content":"5. Open the agent and send a test message.","children":[],"payload":{"tag":"li","lines":"4350,4351","listIndex":5}},{"content":"6. Verify<br>\n[ ] The agent responds to messages<br>\n[ ] Response content is accurate and appropriate<br>\n[ ] Response times are acceptable<br>\n[ ] Any configured tools work correctly","children":[],"payload":{"tag":"li","lines":"4351,4357","listIndex":6}}],"payload":{"tag":"li","lines":"4345,4357"}},{"content":"\n<p data-lines=\"4357,4360\">Request admin approval for organization scope<br>\nAn admin must approve your agent before it&apos;s available organization-wide<br>\nOnce approved, the agent appears in the <strong>Built by your org</strong> section of the Teams agent store</p>","children":[{"content":"1. Direct your Microsoft 365 administrator to the Microsoft 365 admin center.","children":[],"payload":{"tag":"li","lines":"4360,4361","listIndex":1}},{"content":"2. Navigate to <strong>Agents &gt; All &gt; Requested</strong>.","children":[],"payload":{"tag":"li","lines":"4361,4362","listIndex":2}},{"content":"3. Find your agent in the list of pending requests.","children":[],"payload":{"tag":"li","lines":"4362,4363","listIndex":3}},{"content":"4. The administrator selects <strong>Approve request and activate</strong>.","children":[],"payload":{"tag":"li","lines":"4363,4365","listIndex":4}}],"payload":{"tag":"li","lines":"4357,4365"}},{"content":"\n<p data-lines=\"4365,4368\">Reassign permissions after publishing<br>\nIf your agent uses tools that access Azure resources,<br>\nyou need to grant permissions to this new identity</p>","children":[{"content":"1. In the Foundry portal, go to your published agent and note the agent application&apos;s identity information.","children":[],"payload":{"tag":"li","lines":"4368,4369","listIndex":1}},{"content":"2. In the Azure portal, navigate to the resources your agent accesses<br>\n(for example, Azure AI Search, storage accounts, or Cosmos DB).","children":[],"payload":{"tag":"li","lines":"4369,4371","listIndex":2}},{"content":"3. Assign the appropriate RBAC roles to the published agent identity.","children":[],"payload":{"tag":"li","lines":"4371,4373","listIndex":3}}],"payload":{"tag":"li","lines":"4365,4373"}},{"content":"\n<p data-lines=\"4373,4374\">Update a published agent</p>","children":[{"content":"1. Make your changes in the Foundry portal.","children":[],"payload":{"tag":"li","lines":"4374,4375","listIndex":1}},{"content":"2. Test the changes in the Foundry playground.","children":[],"payload":{"tag":"li","lines":"4375,4376","listIndex":2}},{"content":"3. Repeat the publishing process to create a new package.","children":[],"payload":{"tag":"li","lines":"4376,4377","listIndex":3}},{"content":"4. For shared scope, upload the new package to Teams.","children":[],"payload":{"tag":"li","lines":"4377,4378","listIndex":4}},{"content":"5. For organization scope, the update might require re-approval depending on your organization&apos;s policies.","children":[],"payload":{"tag":"li","lines":"4378,4380","listIndex":5}}],"payload":{"tag":"li","lines":"4373,4380"}}],"payload":{"tag":"li","lines":"4281,4380"}},{"content":"\n<p data-lines=\"4380,4381\"><strong>Advanced - Use Microsoft 365 Agents Toolkit</strong></p>","children":[{"content":"\n<p data-lines=\"4382,4383\">When to consider the Agents Toolkit</p>","children":[{"content":"When the agent requires custom single sign-on (SSO) configuration","children":[],"payload":{"tag":"li","lines":"4383,4384"}},{"content":"When you need to add middleware logic for custom processing","children":[],"payload":{"tag":"li","lines":"4384,4385"}},{"content":"Logging","children":[],"payload":{"tag":"li","lines":"4385,4386"}},{"content":"Transformation between Teams and Foundry agent","children":[],"payload":{"tag":"li","lines":"4386,4387"}},{"content":"Organizations that require multi-environment<br>\ndeployment configurations","children":[],"payload":{"tag":"li","lines":"4387,4389"}},{"content":"Advanced debugging capabilities with detailed tracing","children":[],"payload":{"tag":"li","lines":"4389,4390"}},{"content":"Integrates with CI/CD pipelines","children":[{"content":"GitHub Actions","children":[],"payload":{"tag":"li","lines":"4391,4392"}},{"content":"Azure DevOps","children":[],"payload":{"tag":"li","lines":"4392,4394"}}],"payload":{"tag":"li","lines":"4390,4394"}}],"payload":{"tag":"li","lines":"4382,4394"}},{"content":"\n<p data-lines=\"4394,4395\">How the Agents Toolkit approach works</p>","children":[{"content":"\n<pre>Teams/Copilot &#x2192; Proxy App (Agents Toolkit) &#x2192; Foundry Agent</pre>","children":[],"payload":{"tag":"li","lines":"4395,4396"}},{"content":"The proxy application receives messages from<br>\nTeams or Copilot through Azure Bot Service","children":[],"payload":{"tag":"li","lines":"4396,4398"}},{"content":"Processes them through custom configured middleware","children":[],"payload":{"tag":"li","lines":"4398,4399"}},{"content":"Forwards the request to the Foundry agent","children":[],"payload":{"tag":"li","lines":"4399,4400"}},{"content":"Returns the response through the same path","children":[],"payload":{"tag":"li","lines":"4400,4401"}},{"content":"The proxy approach gives you control but<br>\nadds complexity to deployment.","children":[],"payload":{"tag":"li","lines":"4401,4404"}}],"payload":{"tag":"li","lines":"4394,4404"}},{"content":"\n<p data-lines=\"4404,4405\">Getting started with the Agents Toolkit</p>","children":[{"content":"Standalone agent","children":[{"content":"Install the VS Code Microsoft 365 Agents Toolkit extension","children":[],"payload":{"tag":"li","lines":"4406,4407"}},{"content":"Open the extension panel and select <strong>Create a New Agent/App</strong>","children":[],"payload":{"tag":"li","lines":"4407,4408"}},{"content":"Choose <strong>Custom Engine Agent</strong> as the project type","children":[],"payload":{"tag":"li","lines":"4408,4409"}},{"content":"The wizard guides you through configuration options","children":[],"payload":{"tag":"li","lines":"4409,4410"}}],"payload":{"tag":"li","lines":"4405,4410"}},{"content":"Connect to an existing Foundry agent","children":[{"content":"Configure the project to call your Foundry agent&apos;s endpoint","children":[],"payload":{"tag":"li","lines":"4411,4412"}},{"content":"Set up authentication using the agent&apos;s credentials","children":[],"payload":{"tag":"li","lines":"4412,4413"}},{"content":"Implement any middleware logic you need","children":[],"payload":{"tag":"li","lines":"4413,4414"}}],"payload":{"tag":"li","lines":"4410,4414"}},{"content":"Includes the Microsoft 365 Agents Playground","children":[],"payload":{"tag":"li","lines":"4414,4415"}},{"content":"Test","children":[],"payload":{"tag":"li","lines":"4415,4416"}},{"content":"Use the toolkit to provision Azure resources","children":[],"payload":{"tag":"li","lines":"4416,4417"}},{"content":"Deploy your proxy application","children":[],"payload":{"tag":"li","lines":"4417,4418"}},{"content":"Register it in Teams","children":[],"payload":{"tag":"li","lines":"4418,4420"}}],"payload":{"tag":"li","lines":"4404,4420"}},{"content":"\n<p data-lines=\"4420,4421\">Comparison summary</p>\n<table data-lines=\"4421,4428\">\n<thead data-lines=\"4421,4422\">\n<tr data-lines=\"4421,4422\">\n<th style=\"text-align:left\">Aspect</th>\n<th style=\"text-align:left\">Direct Foundry publishing</th>\n<th style=\"text-align:left\">Agents toolkit proxy</th>\n</tr>\n</thead>\n<tbody data-lines=\"4423,4428\">\n<tr data-lines=\"4423,4424\">\n<td style=\"text-align:left\">Setup time</td>\n<td style=\"text-align:left\">Minutes</td>\n<td style=\"text-align:left\">Hours to days</td>\n</tr>\n<tr data-lines=\"4424,4425\">\n<td style=\"text-align:left\">Code required</td>\n<td style=\"text-align:left\">None</td>\n<td style=\"text-align:left\">Proxy application</td>\n</tr>\n<tr data-lines=\"4425,4426\">\n<td style=\"text-align:left\">Customization</td>\n<td style=\"text-align:left\">Limited</td>\n<td style=\"text-align:left\">Extensive</td>\n</tr>\n<tr data-lines=\"4426,4427\">\n<td style=\"text-align:left\">Debugging</td>\n<td style=\"text-align:left\">Foundry portal</td>\n<td style=\"text-align:left\">Full IDE debugging</td>\n</tr>\n<tr data-lines=\"4427,4428\">\n<td style=\"text-align:left\">Best for</td>\n<td style=\"text-align:left\">Standard deployments</td>\n<td style=\"text-align:left\">Complex enterprise needs</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"4420,4429"}},{"content":"\n<p data-lines=\"4429,4430\">Learn more</p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/microsoftteams/platform/toolkit/overview-agents-toolkit\">Microsoft 365 Agents Toolkit documentation</a>","children":[],"payload":{"tag":"li","lines":"4430,4431"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/microsoft-365/agents-sdk/create-new-toolkit-project-vsc\">Create custom engine agents with the Agents Toolkit</a>","children":[],"payload":{"tag":"li","lines":"4431,4432"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/microsoft-365/agents-sdk/agents-sdk-overview\">Microsoft 365 Agents SDK overview</a>","children":[],"payload":{"tag":"li","lines":"4432,4434"}}],"payload":{"tag":"li","lines":"4429,4434"}}],"payload":{"tag":"li","lines":"4380,4434"}},{"content":"\n<p data-lines=\"4434,4435\"><strong>Access Microsoft 365 data with Work IQ</strong></p>","children":[{"content":"\n<p data-lines=\"4436,4437\">What is Work IQ?</p>","children":[{"content":"Is a command-line interface (CLI)","children":[],"payload":{"tag":"li","lines":"4437,4438"}},{"content":"Is a server that connects AI assistants to Microsoft 365 Copilot data","children":[],"payload":{"tag":"li","lines":"4438,4439"}},{"content":"Enables agents to query workplace information using NLP","children":[],"payload":{"tag":"li","lines":"4439,4440"}},{"content":"Provides rich context that helps agents give more<br>\nrelevant and accurate responses","children":[],"payload":{"tag":"li","lines":"4440,4442"}},{"content":"With Work IQ, your agents can answer","children":[{"content":"&quot;What did my manager say about the project deadline?&quot;","children":[],"payload":{"tag":"li","lines":"4443,4444"}},{"content":"&quot;Find my recent documents about Q4 planning&quot;","children":[],"payload":{"tag":"li","lines":"4444,4445"}},{"content":"&quot;Summarize today&apos;s messages in the Engineering channel&quot;","children":[],"payload":{"tag":"li","lines":"4445,4446"}},{"content":"&quot;Who is working on Project Alpha?&quot;","children":[],"payload":{"tag":"li","lines":"4446,4447"}}],"payload":{"tag":"li","lines":"4442,4447"}},{"content":"Work IQ accesses data across multiple Microsoft 365 services\n<table data-lines=\"4448,4455\">\n<thead data-lines=\"4448,4449\">\n<tr data-lines=\"4448,4449\">\n<th style=\"text-align:left\">Data type</th>\n<th style=\"text-align:left\">Example capabilities</th>\n</tr>\n</thead>\n<tbody data-lines=\"4450,4455\">\n<tr data-lines=\"4450,4451\">\n<td style=\"text-align:left\">Emails</td>\n<td style=\"text-align:left\">Search messages, find communications from specific people</td>\n</tr>\n<tr data-lines=\"4451,4452\">\n<td style=\"text-align:left\">Meetings</td>\n<td style=\"text-align:left\">Check calendar, retrieve meeting notes and decisions</td>\n</tr>\n<tr data-lines=\"4452,4453\">\n<td style=\"text-align:left\">Documents</td>\n<td style=\"text-align:left\">Find files in SharePoint and OneDrive, search content</td>\n</tr>\n<tr data-lines=\"4453,4454\">\n<td style=\"text-align:left\">Teams messages</td>\n<td style=\"text-align:left\">Summarize channel discussions, find specific conversations</td>\n</tr>\n<tr data-lines=\"4454,4455\">\n<td style=\"text-align:left\">People</td>\n<td style=\"text-align:left\">Identify team members, find collaborators on projects</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"4447,4456"}}],"payload":{"tag":"li","lines":"4436,4456"}},{"content":"\n<p data-lines=\"4456,4457\">Understanding MCP servers</p>","children":[{"content":"Work IQ is built on the Model Context Protocol (MCP)","children":[],"payload":{"tag":"li","lines":"4457,4458"}},{"content":"An MCP server exposes capabilities that AI agents can use","children":[],"payload":{"tag":"li","lines":"4458,4459"}},{"content":"Work IQ is an MCP server specifically designed for Microsoft 365 data","children":[],"payload":{"tag":"li","lines":"4459,4460"}},{"content":"Capabilities","children":[{"content":"Tools<br>\nActions the agent can take, like searching for documents or sending messages","children":[],"payload":{"tag":"li","lines":"4461,4463"}},{"content":"Resources<br>\nData sources the agent can query","children":[],"payload":{"tag":"li","lines":"4463,4465"}},{"content":"Prompts<br>\nPredefined templates for common queries","children":[],"payload":{"tag":"li","lines":"4465,4468"}}],"payload":{"tag":"li","lines":"4460,4468"}}],"payload":{"tag":"li","lines":"4456,4468"}},{"content":"\n<p data-lines=\"4468,4469\">How Work IQ operates</p>","children":[{"content":"CLI mode","children":[{"content":"Example  <pre>workiq ask -q &quot;What requirements did Sarah share about the authentication feature?&quot;</pre>","children":[],"payload":{"tag":"li","lines":"4470,4472"}},{"content":"Useful for","children":[{"content":"Quick queries during development","children":[],"payload":{"tag":"li","lines":"4473,4474"}},{"content":"Scripts that need to retrieve workplace information","children":[],"payload":{"tag":"li","lines":"4474,4475"}}],"payload":{"tag":"li","lines":"4472,4475"}}],"payload":{"tag":"li","lines":"4469,4475"}},{"content":"MCP server mode","children":[{"content":"Work IQ integrates with AI assistants (Github Copilot VS Code)","children":[],"payload":{"tag":"li","lines":"4476,4477"}},{"content":"The AI assistant can automatically access workplace context when relevant","children":[],"payload":{"tag":"li","lines":"4477,4478"}},{"content":"Example  <pre>\n      If you&apos;re implementing a feature that was discussed in a recent meeting, \n      your AI assistant can access that meeting context to provide more relevant suggestions\n  </pre>","children":[],"payload":{"tag":"li","lines":"4478,4484"}}],"payload":{"tag":"li","lines":"4475,4484"}}],"payload":{"tag":"li","lines":"4468,4484"}},{"content":"\n<p data-lines=\"4484,4485\">Installing Work IQ</p>","children":[{"content":"\n<p data-lines=\"4485,4486\">Using <code>npm</code></p>\n  <pre>\n  # Global installation\n  npm install -g @microsoft/workiq\n  &#xa0;\n  # Or run directly without installation\n  npx -y @microsoft/workiq mcp\n  </pre>","children":[],"payload":{"tag":"li","lines":"4485,4493"}},{"content":"\n<p data-lines=\"4493,4494\">Using GitHub Copilot CLI as a plugin</p>","children":[{"content":"Open GitHub Copilot CLI by running <code>copilot</code>.","children":[],"payload":{"tag":"li","lines":"4494,4495"}},{"content":"Add the plugins marketplace (one-time setup): <code>/plugin marketplace add github/copilot-plugins</code>","children":[],"payload":{"tag":"li","lines":"4495,4496"}},{"content":"Install Work IQ: <code>/plugin install workiq@copilot-plugins</code>","children":[],"payload":{"tag":"li","lines":"4496,4497"}},{"content":"Restart Copilot CLI and start querying your Microsoft 365 data.","children":[],"payload":{"tag":"li","lines":"4497,4498"}}],"payload":{"tag":"li","lines":"4493,4498"}},{"content":"\n<p data-lines=\"4498,4499\">Using VS Code (as an MCP server)</p>\n  <pre>\n  {\n      &quot;workiq&quot;: {\n          &quot;command&quot;: &quot;npx&quot;,\n          &quot;args&quot;: [\n          &quot;-y&quot;,\n          &quot;@microsoft/workiq&quot;,\n          &quot;mcp&quot;\n          ],\n          &quot;tools&quot;: [\n          &quot;*&quot;\n          ]\n      }\n  }\n  </pre>","children":[],"payload":{"tag":"li","lines":"4498,4514"}},{"content":"\n<p data-lines=\"4514,4515\">Before first use, accept the End User License Agreement</p>\n  <pre>\n      workiq accept-eula\n  </pre>","children":[],"payload":{"tag":"li","lines":"4514,4519"}},{"content":"\n<p data-lines=\"4519,4520\">Prerequisites for Work IQ</p>","children":[{"content":"Node.js installed on your machine (if using the CLI locally)","children":[],"payload":{"tag":"li","lines":"4520,4521"}},{"content":"A Microsoft 365 subscription with a Copilot license","children":[],"payload":{"tag":"li","lines":"4521,4522"}},{"content":"Administrative consent for the Work IQ application in your Microsoft Entra tenant","children":[],"payload":{"tag":"li","lines":"4522,4524"}}],"payload":{"tag":"li","lines":"4519,4524"}},{"content":"\n<p data-lines=\"4524,4525\">Security and data access</p>","children":[{"content":"Permission-based access<br>\nWork IQ can only access data you already have permission to view","children":[],"payload":{"tag":"li","lines":"4525,4527"}},{"content":"No data storage<br>\nWork IQ doesn&apos;t store your Microsoft 365 data<br>\nIt retrieves information on-demand","children":[],"payload":{"tag":"li","lines":"4527,4530"}},{"content":"Enterprise security<br>\nAll data access follows your organization&apos;s security policies","children":[],"payload":{"tag":"li","lines":"4530,4532"}},{"content":"Admin visibility<br>\nAdministrators can monitor and control Work IQ usage","children":[],"payload":{"tag":"li","lines":"4532,4534"}},{"content":"When you query Work IQ<br>\nI               It accesses data through Microsoft Graph<br>with your authenticated identity","children":[{"content":"You can&apos;t access documents you don&apos;t have permission to view","children":[],"payload":{"tag":"li","lines":"4536,4537"}},{"content":"Queries are auditable by your organization","children":[],"payload":{"tag":"li","lines":"4537,4538"}},{"content":"Data protection policies apply to Work IQ queries","children":[],"payload":{"tag":"li","lines":"4538,4540"}}],"payload":{"tag":"li","lines":"4534,4540"}}],"payload":{"tag":"li","lines":"4524,4540"}},{"content":"\n<p data-lines=\"4540,4541\">Using Work IQ with agent development</p>","children":[{"content":"\n<p data-lines=\"4541,4542\">CLI is useful</p>","children":[{"content":"For quick, ad-hoc queries during development","children":[],"payload":{"tag":"li","lines":"4542,4543"}},{"content":"For scripts","children":[],"payload":{"tag":"li","lines":"4543,4544"}},{"content":"One-off queries","children":[],"payload":{"tag":"li","lines":"4544,4545"}},{"content":"When you need quick answers without opening an IDE","children":[],"payload":{"tag":"li","lines":"4545,4546"}},{"content":"Example  <pre><code>\n  # Find project context\n  workiq ask -q &quot;What were the key decisions in last week&apos;s architecture review meeting?&quot;\n  &#xa0;\n  # Understand requirements from documents\n  workiq ask -q &quot;Summarize the requirements in the user portal spec document&quot;\n  &#xa0;\n  # Check team communications\n  workiq ask -q &quot;What has the engineering team discussed about the API changes?&quot;\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"4546,4558"}}],"payload":{"tag":"li","lines":"4541,4558"}},{"content":"\n<p data-lines=\"4558,4559\">MCP server approach</p>","children":[{"content":"Example","children":[{"content":"Ask Copilot: &quot;What requirements did Sarah share about the authentication feature?&quot;","children":[],"payload":{"tag":"li","lines":"4560,4561"}},{"content":"Copilot uses Work IQ&apos;s MCP tools to query your Microsoft 365 data","children":[],"payload":{"tag":"li","lines":"4561,4562"}},{"content":"You receive the answer in the chat without running any commands","children":[],"payload":{"tag":"li","lines":"4562,4564"}}],"payload":{"tag":"li","lines":"4559,4564"}}],"payload":{"tag":"li","lines":"4558,4564"}}],"payload":{"tag":"li","lines":"4540,4564"}}],"payload":{"tag":"li","lines":"4484,4564"}}],"payload":{"tag":"li","lines":"4434,4564"}},{"content":"\n<p data-lines=\"4564,4565\"><strong>Test and iterate your integrated agent</strong></p>","children":[{"content":"Testing beyond the Foundry playground","children":[{"content":"\n<p data-lines=\"4567,4568\">Test your agent in Microsoft Teams to verify</p>","children":[{"content":"The Teams user interface renders responses correctly","children":[],"payload":{"tag":"li","lines":"4568,4569"}},{"content":"Authentication flows work as expected","children":[],"payload":{"tag":"li","lines":"4569,4570"}},{"content":"Response times are acceptable in production","children":[],"payload":{"tag":"li","lines":"4570,4571"}},{"content":"The published agent identity has necessary permissions","children":[],"payload":{"tag":"li","lines":"4571,4572"}}],"payload":{"tag":"li","lines":"4567,4572"}},{"content":"\n<p data-lines=\"4572,4573\">Testing with multiple users</p>","children":[{"content":"Different users phrase questions differently","children":[],"payload":{"tag":"li","lines":"4573,4574"}},{"content":"Fresh perspectives identify confusing responses","children":[],"payload":{"tag":"li","lines":"4574,4575"}},{"content":"Test across differente Teams clients<br>\nReveal platform-specific issues","children":[],"payload":{"tag":"li","lines":"4575,4577"}}],"payload":{"tag":"li","lines":"4572,4577"}},{"content":"\n<p data-lines=\"4577,4578\">Common troubleshooting scenarios</p>","children":[{"content":"Agent doesn&apos;t respond in Teams","children":[{"content":"Possible causes","children":[{"content":"Azure Bot Service isn&apos;t running","children":[],"payload":{"tag":"li","lines":"4580,4581"}},{"content":"Bot Service configuration is incorrect","children":[],"payload":{"tag":"li","lines":"4581,4582"}},{"content":"Network issues between Teams and your agent","children":[],"payload":{"tag":"li","lines":"4582,4583"}}],"payload":{"tag":"li","lines":"4579,4583"}},{"content":"Resolution","children":[{"content":"Verify the Bot Service resource exists in the Azure portal.","children":[],"payload":{"tag":"li","lines":"4584,4585"}},{"content":"Check Bot Service logs for errors.","children":[],"payload":{"tag":"li","lines":"4585,4586"}},{"content":"Confirm the agent is published and the package was uploaded correctly.","children":[],"payload":{"tag":"li","lines":"4586,4587"}}],"payload":{"tag":"li","lines":"4583,4587"}}],"payload":{"tag":"li","lines":"4578,4587"}},{"content":"Tools work in Foundry but fail in Teams","children":[{"content":"Possible cause","children":[{"content":"The published agent identity doesn&apos;t have the required permissions.","children":[],"payload":{"tag":"li","lines":"4589,4590"}}],"payload":{"tag":"li","lines":"4588,4590"}},{"content":"Resolution","children":[{"content":"Find the published agent&apos;s identity in the Foundry portal.","children":[],"payload":{"tag":"li","lines":"4591,4592"}},{"content":"In the Azure portal, locate the resources your tools access.","children":[],"payload":{"tag":"li","lines":"4592,4593"}},{"content":"Assign appropriate RBAC roles to the published agent identity.","children":[],"payload":{"tag":"li","lines":"4593,4594"}}],"payload":{"tag":"li","lines":"4590,4594"}}],"payload":{"tag":"li","lines":"4587,4594"}},{"content":"Users can&apos;t find the agent","children":[{"content":"Possible causes","children":[{"content":"Wrong publish scope selected","children":[],"payload":{"tag":"li","lines":"4596,4597"}},{"content":"Admin approval pending (for organization scope)","children":[],"payload":{"tag":"li","lines":"4597,4598"}},{"content":"Tenant policies block custom apps","children":[],"payload":{"tag":"li","lines":"4598,4599"}}],"payload":{"tag":"li","lines":"4595,4599"}},{"content":"Resolution","children":[{"content":"For shared scope<br>\nShare the direct link with users.","children":[],"payload":{"tag":"li","lines":"4600,4602"}},{"content":"For organization scope<br>\nVerify admin approval in the Microsoft 365 admin center.","children":[],"payload":{"tag":"li","lines":"4602,4604"}},{"content":"Check tenant settings for custom app permissions.","children":[],"payload":{"tag":"li","lines":"4604,4605"}}],"payload":{"tag":"li","lines":"4599,4605"}}],"payload":{"tag":"li","lines":"4594,4605"}},{"content":"Slow response times","children":[{"content":"Possible causes","children":[{"content":"Complex agent instructions requiring extended processing","children":[],"payload":{"tag":"li","lines":"4607,4608"}},{"content":"Tools that query large data sets","children":[],"payload":{"tag":"li","lines":"4608,4609"}},{"content":"Network latency","children":[],"payload":{"tag":"li","lines":"4609,4610"}}],"payload":{"tag":"li","lines":"4606,4610"}},{"conten
