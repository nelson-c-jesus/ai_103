r Forum</a>","children":[],"payload":{"tag":"li","lines":"2607,2609"}}],"payload":{"tag":"li","lines":"2604,2609"}},{"content":"\n<p data-lines=\"2609,2611\"><strong>Exercise - Apply guardrails to prevent the output of harmful content</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-studio/Instructions/Exercises/06-Explore-content-filters.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"2609,2613"}}],"payload":{"tag":"h3","lines":"2397,2398"}}],"payload":{"tag":"h2","lines":"8,9"}},{"content":"Develop AI agents on Azure","children":[{"content":"1. <a href=\"https://learn.MS.com/en-us/training/modules/develop-ai-agents-azure-vs-code/\">Develop AI agents with MS Foundry and Visual Studio Code</a>","children":[{"content":"\n<p data-lines=\"2619,2620\"><strong>MS Foundry Agent Service</strong></p>","children":[{"content":"Allows","children":[{"content":"Build","children":[],"payload":{"tag":"li","lines":"2621,2622"}},{"content":"Deploy","children":[],"payload":{"tag":"li","lines":"2622,2623"}},{"content":"Scale AI agents","children":[],"payload":{"tag":"li","lines":"2623,2624"}},{"content":"Create tailored agents","children":[],"payload":{"tag":"li","lines":"2624,2625"}}],"payload":{"tag":"li","lines":"2620,2625"}},{"content":"Without managing","children":[{"content":"Compute resources","children":[],"payload":{"tag":"li","lines":"2626,2627"}},{"content":"Storage resources","children":[],"payload":{"tag":"li","lines":"2627,2629"}}],"payload":{"tag":"li","lines":"2625,2629"}}],"payload":{"tag":"li","lines":"2619,2629"}},{"content":"\n<p data-lines=\"2629,2631\"><strong>Understand AI agents and<br>\nMS Foundry Agent Service</strong></p>","children":[{"content":"\n<p data-lines=\"2632,2633\">AI Agent is</p>","children":[{"content":"1. Software service that<br>uses generative AI to","children":[{"content":"Understand","children":[],"payload":{"tag":"li","lines":"2634,2635"}},{"content":"Perform tasks on behalf of users","children" ,"payload":{"tag":"li","lines":"2658,2659"}},{"content":"Gather data","children":[],"payload":{"tag":"li","lines":"2659,2660"}},{"content":"Generate reports","children":[],"payload":{"tag":"li","lines":"2660,2661"}},{"content":"Track stock performance","children":[],"payload":{"tag":"li","lines":"2661,2662"}},{"content":"Update medical research","children":[],"payload":{"tag":"li","lines":"2662,2663"}},{"content":"Analyze consumer behaviour","children":[],"payload":{"tag":"li","lines":"2663,2664"}}],"payload":{"tag":"li","lines":"2657,2664"}},{"content":"Sales","children":[{"content":"Automate lead generation","children":[],"payload":{"tag":"li","lines":"2665,2666"}},{"content":"Automate lead qualification","children":[],"payload":{"tag":"li","lines":"2666,2667"}},{"content":"Research potential leads","children":[],"payload":{"tag":"li","lines":"2667,2668"}},{"content":"Send personalized follow-up messages","children":[],"payload":{"tag":"li","lines":"2668,2669"}},{"content":"Schedule sales calls","children":[],"payload":{"tag":"li","lines":"2669,2670"}}],"payload":{"tag":"li","lines":"2664,2670"}},{"content":"Customer service","children":[{"content":"Routine enquiries","children":[],"payload":{"tag":"li","lines":"2671,2672"}},{"content":"Provide information","children":[],"payload":{"tag":"li","lines":"2672,2673"}},{"content":"Resolve common issues","children":[],"payload":{"tag":"li","lines":"2673,2674"}},{"content":"Instant support throught chatbots","children":[],"payload":{"tag":"li","lines":"2674,2675"}}],"payload":{"tag":"li","lines":"2670,2675"}},{"content":"Developer","children":[{"content":"Code review","children":[],"payload":{"tag":"li","lines":"2676,2677"}},{"content":"Bug fixing","children":[],"payload":{"tag":"li","lines":"2677,2678"}},{"content":"Repository management","children":[],"payload":{"tag":"li","lines":"2678,2679"}},{"content":"Update codebases","children":[],"payload":{"tag":"li","lines":"2679,2680"}},{"content":"Suggest improvements","children":[],"payload":{"tag":"li","lines":"2680,2681"}},{"content":"Maintain coding standards","children":[],"payload":{"tag":"li","lines":"2681,2683"}}],"payload":{"tag":"li","lines":"2675,2683"}}],"payload":{"tag":"li","lines":"2648,2683"}},{"content":"\n<p data-lines=\"2683,2684\">Security considerations</p>","children":[{"content":"Data leakage and privacy exposure","children":[],"payload":{"tag":"li","lines":"2684,2685"}},{"content":"Prompt injection and manipulation attacks","children":[],"payload":{"tag":"li","lines":"2685,2686"}},{"content":"Unauthorized access and privilege escalation","children":[],"payload":{"tag":"li","lines":"2686,2687"}},{"content":"Data poisoning","children":[],"payload":{"tag":"li","lines":"2687,2688"}},{"content":"Supply chain vulnerabilities","children":[],"payload":{"tag":"li","lines":"2688,2689"}},{"content":"Over-reliance on autonomous tasks","children":[],"payload":{"tag":"li","lines":"2689,2690"}},{"content":"Inadequate auditability and logging","children":[],"payload":{"tag":"li","lines":"2690,2691"}},{"content":"Model inversion and output leakage","children":[],"payload":{"tag":"li","lines":"2691,2693"}}],"payload":{"tag":"li","lines":"2683,2693"}},{"content":"\n<p data-lines=\"2693,2694\">Security-by-design<br>(mitigation)</p>","children":[{"content":"Enforcing <strong>role-based access controls</strong> (RBAC) and<br> <strong>least privilege</strong> permissions","children":[],"payload":{"tag":"li","lines":"2694,2695"}},{"content":"<strong>Prompt filtering</strong> and <strong>validation layers</strong> to<br>prevent injection attacks","children":[],"payload":{"tag":"li","lines":"2695,2696"}},{"content":"Sandboxing or gating sensitive operations behind<br><strong>human-in-the-loop approvals</strong>","children":[],"payload":{"tag":"li","lines":"2696,2697"}},{"content":"Mintaining comprehensive logging and traceability<br>for all agents actions","children":[],"payload":{"tag":"li","lines":"2697,2698"}},{"content":"Auditing third-party dependencies and integrations<br>regularly","children":[],"payload":{"tag":"li","lines":"2698,2699"}},{"content":"Retaining and validating models to detect <strong>data drift</strong><br> or <strong>poisoning attempts</strong>","children":[],"payload":{"tag":"li","lines":"2699,2701"}}],"payload":{"tag":"li","lines":"2693,2701"}},{"content":"\n<p data-lines=\"2701,2702\">Agent types</p>","children":[{"content":"Declarative<br>Agents defined through configuration","children":[{"content":"Prompt-based agents<br>Single agent configured","children":[{"content":"Model","children":[],"payload":{"tag":"li","lines":"2704,2705"}},{"content":"Instructions","children":[],"payload":{"tag":"li","lines":"2705,2706"}},{"content":"Tools","children":[],"payload":{"tag":"li","lines":"2706,2707"}},{"content":"Prompts","children":[],"payload":{"tag":"li","lines":"2707,2708"}}],"payload":{"tag":"li","lines":"2703,2708"}},{"content":"Workflow-agents<br>Multi-agents orchestrations,<br>enabling complex scenarios and collaboration<br>between agents","children":[],"payload":{"tag":"li","lines":"2708,2709"}}],"payload":{"tag":"li","lines":"2702,2709"}},{"content":"Hosted agents<br>Containerized agents that are created and<br>deployed in code, then hosted by Foundy","children":[],"payload":{"tag":"li","lines":"2709,2711"}}],"payload":{"tag":"li","lines":"2701,2711"}},{"content":"\n<p data-lines=\"2711,2712\">Key features of MS Foundry Agent Service</p>","children":[{"content":"Automatic tool calling","children":[],"payload":{"tag":"li","lines":"2712,2713"}},{"content":"Securely managed data","children":[],"payload":{"tag":"li","lines":"2713,2714"}},{"content":"Extensive tool catalog","children":[],"payload":{"tag":"li","lines":"2714,2715"}},{"content":"Model selection","children":[],"payload":{"tag":"li","lines":"2715,2716"}},{"content":"Enterprise-grade security","children":[],"payload":{"tag":"li","lines":"2716,2717"}},{"content":"Customizable storage solutions","children":[],"paylo ontent":"Controls diversity by limiting vocabulary choices during generation","children":[],"payload":{"tag":"li","lines":"2865,2866"}},{"content":"Lower values<br>More predictable outputs&#xb4;","children":[],"payload":{"tag":"li","lines":"2866,2867"}},{"content":"Default value of 1.0","children":[],"payload":{"tag":"li","lines":"2867,2869"}}],"payload":{"tag":"li","lines":"2864,2869"}},{"content":"\n<p data-lines=\"2869,2890\">Agent YAML structure<br>\n<code><br>\n# yaml-language-server: &#x24;schema=https://aka.ms/ai-foundry-vsc/agent/1.0.0<br>\nversion: 1.0.0<br>\nname: healthcare-assistant<br>\ndescription: Assists healthcare staff with patient appointment scheduling and information retrieval<br>\nid: &apos;agent-abc123xyz&apos;<br>\nmetadata:<br>\nauthors:<br>\n- developer-name<br>\ntags:<br>\n- healthcare<br>\n- customer-service<br>\n- scheduling<br>\nmodel:<br>\nid: &apos;gpt-4.1&apos;<br>\noptions:<br>\ntemperature: 0.5<br>\ntop_p: 1<br>\ninstructions: |<br>\nYou&apos;re a healthcare assistant helping staff schedule patient appointments and retrieve information.</code></p>\n<pre data-lines=\"2891,2903\"><code>  Your responsibilities:\n  - Help staff find available appointment slots\n  - Answer questions about patient scheduling policies\n  - Provide information about different appointment types\n  - Assist with rescheduling and cancellations\n\n  Important guidelines:\n  - Never access or share patient medical information\n  - Always verify appointment details before confirming\n  - Be professional but friendly in all interactions\n  - If you&apos;re unsure about policies, advise staff to check with management\n  tools: []\n</code></pre>","children":[],"payload":{"tag":"li","lines":"2869,2904"}},{"content":"\n<p data-lines=\"2904,2905\">Benefits of YAML config</p>","children":[{"content":"Version control","children":[],"payload":{"tag":"li","lines":"2905,2906"}},{"content":"Bulk updates","children":[],"payload":{"tag":"li","lines":"2906,2907"}},{"content":"Templates","children":[],"payload":{"tag":"li","lines":"2907,2908"}},{"content":"Code review","children":[],"payload":{"tag":"li","lines":"2908,2909"}},{"content":"Automation","children":[],"payload":{"tag":"li","lines":"2909,2910"}}],"payload":{"tag":"li","lines":"2904,2910"}},{"content":"\n<p data-lines=\"2910,2911\">Best practices for agent config</p>","children":[{"content":"Version control YAML files","children":[],"payload":{"tag":"li","lines":"2911,2912"}},{"content":"Use descriptive names and tags","children":[],"payload":{"tag":"li","lines":"2912,2913"}},{"content":"Document complez instructions","children":[],"payload":{"tag":"li","lines":"2913,2914"}},{"content":"Test after every change","children":[],"payload":{"tag":"li","lines":"2914,2915"}},{"content":"Start simple, then iterate","children":[],"payload":{"tag":"li","lines":"2915,2916"}},{"content":"Keep instructions focused","children":[],"payload":{"tag":"li","lines":"2916,2918"}}],"payload":{"tag":"li","lines":"2910,2918"}}],"payload":{"tag":"li","lines":"2859,2918"}}],"payload":{"tag":"li","lines":"2847,2918"}},{"content":"\n<p data-lines=\"2918,2919\"><strong>Extend agent capabilities with tools</strong></p>","children":[{"content":"\n<p data-lines=\"2920,2921\">Tool-calling lifecycle</p>","children":[{"content":"1. User sends a message to the agent","children":[],"payload":{"tag":"li","lines":"2921,2922","listIndex":1}},{"content":"2. Agent analyzes the request and determine wich tools are needed","children":[],"payload":{"tag":"li","lines":"2922,2923","listIndex":2}},{"content":"3. Agent invokes the appropriate tools with relevant parameters","children":[],"payload":{"tag":"li","lines":"2923,2924","listIndex":3}},{"content":"4. Tools execute and return results","children":[],"payload":{"tag":"li","lines":"2924,2925","listIndex":4}},{"content":"5. Agent incorporates results into natural language response","children":[],"payload":{"tag":"li","lines":"2925,2926","listIndex":5}},{"content":"6. Response is returned to the user","children":[],"payload":{"tag":"li","lines":"2926,2928","listIndex":6}}],"payload":{"tag":"li","lines":"2920,2928"}},{"content":"\n<p data-lines=\"2928,2929\">Built-in tools</p>","children":[{"content":"Configured<br>Ready-to-use built-in tools","children":[],"payload":{"tag":"li","lines":"2929,2930"}},{"content":"Catalog<br>Additional tools you can add including MCP servers","children":[],"payload":{"tag":"li","lines":"2930,2931"}},{"content":"Custom<br>Own tools via OpenAPI specifications or<br>custom implementations","children":[],"payload":{"tag":"li","lines":"2931,2933"}}],"payload":{"tag":"li","lines":"2928,2933"}},{"content":"\n<p data-lines=\"2933,2934\">Common tools</p>","children":[{"content":"Code interpreter<br>Enables agents to writee and execute Python code in a<br>sandboxed environment","children":[{"content":"Math calculations","children":[],"payload":{"tag":"li","lines":"2935,2936"}},{"content":"Data analysis","children":[],"payload":{"tag":"li","lines":"2936,2937"}},{"content":"Chart generation","children":[],"payload":{"tag":"li","lines":"2937,2938"}},{"content":"File processing","children":[],"payload":{"tag":"li","lines":"2938,2939"}},{"content":"Complex-problem solving","children":[],"payload":{"tag":"li","lines":"2939,2940"}}],"payload":{"tag":"li","lines":"2934,2940"}},{"content":"File search<br>Provides RAG by allowing agents to search through uploaded<br>documents. Supports","children":[{"content":"PDF","children":[],"payload":{"tag":"li","lines":"2941,2942"}},{"content":"Word","children":[],"payload":{"tag":"li","lines":"2942,2943"}},{"content":"Plain text","children":[],"payload":{"tag":"li","lines":"2943,2944"}},{"content":"Markdown","children":[],"payload":{"tag":"li","lines":"2944,2945"}}],"payload":{"tag":"li","lines":"2940,2945"}},{"content":"Bing Web Search<br>Connects the agent do real-time internet information","children":[],"payload":{"tag":"li","lines":"2945,2946"}},{"content":"Azure AI Search<br>Connects to enterprise-scale indexed data sources for<br>structured and unstructured search scenarios","children":[],"payload":{"tag":"li","lines":"2946,2947"}},{"content":"OpenAPI tools<br>Based on OpenAPI 3.0 specifications, MS Foundry handles parameter mapping and response parsing","children":[],"payload":{"tag":"li","lines":"2947,2948"}},{"content":"Additional tools","children":[{"content":"Browser automation<br>Interact with web pages, fill forms, and extract content","children":[],"payload":{"tag":"li","lines":"2949,2950"}},{"content":"Computer use<br>Interact with desktop applications","children":[],"payload":{"tag":"li","lines":"2950,2951"}},{"content":"Image generation<br>Create images based on text descriptions","children":[],"payload":{"tag":"li","lines":"2951,2952"}},{"content":"SharePoint<br>Access SharePoint content and document libraries","children":[],"payload":{"tag":"li","lines":"2952,2953"}},{"content":"MS Fabric<br>Connect to Fabric data agents for data analytics","children":[],"payload":{"tag":"li","lines":"2953,2954"}},{"content":"Deep Research<br>Perform in-depth research across multiple sources","children":[],"payload":{"tag":"li","lines":"2954,2955"}},{"content":"Agent-to-Agent<br>Delegate tasks to other agents","children":[],"payload":{"tag":"li","lines":"2955,2956"}},{"content":"Custom code interpreter<br>Customizable code execution for specialized environments","children":[],"payload":{"tag":"li","lines":"2956,2958"}}],"payload":{"tag":"li","lines":"2948,2958"}}],"payload":{"tag":"li","lines":"2933,2958"}},{"content":"\n<p data-lines=\"2958,2959\">Adding tools in VS Code</p>","children":[{"content":"1. Open your agent in the Agent Designer","children":[],"payload":{"tag":"li","lines":"2959,2960","listIndex":1}},{"content":"2. Navigate to the Tools section in the configuration panel","children":[],"payload":{"tag":"li","lines":"2960,2961","listIndex":2}},{"content":"3. Select Add Tool or the + icon","children":[],"payload":{"tag":"li","lines":"2961,2962","listIndex":3}},{"content":"4. Browse the available tools in the tool library","children":[],"payload":{"tag":"li","lines":"2962,2963","listIndex":4}},{"content":"5. Select the tool you want to add","children":[],"payload":{"tag":"li","lines":"2963,2964","listIndex":5}},{"content":"6. Configure tool-specific settings if required","children":[],"payload":{"tag":"li","lines":"2964,2965","listIndex":6}},{"content":"7. Save your changes","children":[],"payload":{"tag":"li","lines":"2965,2967","listIndex":7}}],"payload":{"tag":"li","lines":"2958,2967"}},{"content":"\n<p data-lines=\"2967,2987\">YAML tools config<br>\n<code><br>\nversion: 1.0.0<br>\nname: research-assistant<br>\ndescription: Helps with research tasks using code analysis and web search<br>\nmodel:<br>\nid: &apos;gpt-4o-deployment&apos;<br>\ninstructions: |<br>\nYou&apos;re a research assistant helping users gather and analyze information.<br>\nUse Code Interpreter for data analysis and Bing Search for current information.<br>\ntools:<br>\n- type: code_interpreter<br>\n- type: bing_grounding<br>\nbing_grounding:<br>\nconnection_id: &quot;your-connection-id&quot;<br>\n- type: file_search<br>\nfile_search:<br>\nvector_store_ids:<br>\n- &quot;vectorstore-123&quot;<br>\n</code></p>","children":[],"payload":{"tag":"li","lines":"2967,2987"}},{"content":"\n<p data-lines=\"2987,2988\"><span>&#x26a0;</span> <mark>Some tools require additional parameters like connection IDs or<br>vector stores references</mark></p>","children":[],"payload":{"tag":"li","lines":"2987,2989"}},{"content":"\n<p data-lines=\"2989,2990\">MCP servers</p>","children":[{"content":"\n<p data-lines=\"2991,2992\">Types of MCP servers</p>","children":[{"content":"Remote<br>Hosted externally and accessed over the network.<br>Most common type for production scenarios.","children":[],"payload":{"tag":"li","lines":"2992,2993"}},{"content":"Local<br>Run on local machine during development.<br>Useful for testing custom tools befor deploying.","children":[],"payload":{"tag":"li","lines":"2993,2994"}},{"content":"Custom<br>Owno MCP server implementations tailored to speecific needs.","children":[],"payload":{"tag":"li","lines":"2994,2996"}}],"payload":{"tag":"li","lines":"2991,2996"}},{"content":"\n<p data-lines=\"2996,2997\">Benefits of MCP servers</p>","children":[{"content":"Standarized protocol<br>Consistent tool communication patterns make intgration predictable and reliable.","children":[],"payload":{"tag":"li","lines":"2997,2998"}},{"content":"Reusable components<br>Build tools once and use them across multiple agents and projects.","children":[],"payload":{"tag":"li","lines":"2998,2999"}},{"content":"Community-driven tools<br>Acess tools built by the communities expanding capabilities without<br>custom development.","children":[],"payload":{"tag":"li","lines":"2999,3000"}},{"content":"Simplified integration<br>Consistent interfaces reduce integration complexity and<br>maintenance burden.~","children":[],"payload":{"tag":"li","lines":"3000,3002"}}],"payload":{"tag":"li","lines":"2996,3002"}},{"content":"\n<p data-lines=\"3002,3003\">Using MCP servers on VS Code</p>","children":[{"content":"","children":[{"content":"1. Browse available MCP servers through the extension&apos;s tool registry","children":[],"payload":{"tag":"li","lines":"3004,3005","listIndex":1}},{"content":"2. Add MCP servers to your agent configuration","children":[],"payload":{"tag":"li","lines":"3005,3006","listIndex":2}},{"content":"3. Configure server-specific settings and parameters","children":[],"payload":{"tag":"li","lines":"3006,3007","listIndex":3}},{"content":"4. Test MCP server functionality in the integrated playground","children":[],"payload":{"tag":"li","lines":"3007,3008","listIndex":4}},{"content":"5. Deploy agents with MCP server integrations to production","children":[],"payload":{"tag":"li","lines":"3008,3009","listIndex":5}}],"payload":{"tag":"ol","lines":"3004,3009"}},{"content":"<span>&#x26a0;</span> <mark>MCP servers extend agents capabilities with specialized functions while maintaing a<br>consistent development experience</mark>","children":[],"payload":{"tag":"li","lines":"3009,3011"}}],"payload":{"tag":"li","lines":"3002,3011"}},{"content":"\n<p data-lines=\"3011,3012\">Tools configuration</p>","children":[{"content":"Start with built-in tools before building custom solutions.","children":[],"payload":{"tag":"li","lines":"3012,3013"}},{"content":"Match tools to requirements.","children":[],"payload":{"tag":"li","lines":"3013,3014"}},{"content":"Provide clear instructions.","children":[],"payload":{"tag":"li","lines":"3014,3015"}},{"content":"Keep knowledge bases current.","children":[],"payload":{"tag":"li","lines":"3015,3016"}},{"content":"Test tool behaviour thoroghly using playground.","children":[],"payload":{"tag":"li","lines":"3016,3018"}}],"payload":{"tag":"li","lines":"3011,3018"}}],"payload":{"tag":"li","lines":"2989,3018"}}],"payload":{"tag":"li","lines":"2918,3018"}},{"content":"\n<p data-lines=\"3018,3019\"><strong>Test, deploy and integratee agents</strong></p>","children":[{"content":"\n<p data-lines=\"3020,3021\">Testing strategies for agents on playground</p>","children":[{"content":"Happy path<br>Verify the agent handles common, expected request correctly","children":[],"payload":{"tag":"li","lines":"3021,3022"}},{"content":"Edge case<br>Try ambiguous inputs, incomplete information and unsual requests<br>to reveal how agents handle uncertainty","children":[],"payload":{"tag":"li","lines":"3022,3023"}},{"content":"Boundary<br>Confirma the agent respects boundaries defined in its instructions<br>by yeesting out-of-scope requests.","children":[],"payload":{"tag":"li","lines":"3023,3024"}},{"content":"Multi-turn conversation<br>Vereify the agent maintains context across multiple exchages and<br>buils in previous responses","children":[],"payload":{"tag":"li","lines":"3024,3025"}},{"content":"Tool invocation<br>Verify agents call the right tools at the right times and incorporate<br>results correctly.","children":[],"payload":{"tag":"li","lines":"3025,3026"}},{"content":"<span>&#x26a0;</span> <mark>Record test results to track improvements and catch regressions</mark>","children":[],"payload":{"tag":"li","lines":"3026,3028"}}],"payload":{"tag":"li","lines":"3020,3028"}},{"content":"\n<p data-lines=\"3028,3029\">Deploying agents to project</p>","children":[{"content":"From Foundry portal","children":[{"content":"1. Navigate to your agent in the Foundry portal","children":[],"payload":{"tag":"li","lines":"3030,3031","listIndex":1}},{"content":"2. Verify configuration and test results are satisfactory","children":[],"payload":{"tag":"li","lines":"3031,3032","listIndex":2}},{"content":"3. Select <strong>Save</strong> from the agent&apos;s page","children":[],"payload":{"tag":"li","lines":"3032,3033","listIndex":3}},{"content":"4. Confirm version and deployment settings","children":[],"payload":{"tag":"li","lines":"3033,3034","listIndex":4}}],"payload":{"tag":"li","lines":"3029,3034"}},{"content":"From VS Code","children":[{"content":"1. Open your agent in the AI Toolkit","children":[],"payload":{"tag":"li","lines":"3035,3036","listIndex":1}},{"content":"2. Select <strong>Save to Foundry</strong> to push configuration changes","children":[],"payload":{"tag":"li","lines":"3036,3037","listIndex":2}},{"content":"3. For hosted agents, open the <strong>+Build</strong> menu in the developer tools and select <strong>Deploy to MS Foundry</strong>","children":[],"payload":{"tag":"li","lines":"3037,3038","listIndex":3}},{"content":"4. Select your container configuration and confirm","children":[],"payload":{"tag":"li","lines":"3038,3040","listIndex":4}}],"payload":{"tag":"li","lines":"3034,3040"}}],"payload":{"tag":"li","lines":"3028,3040"}},{"content":"\n<p data-lines=\"3040,3041\">Publishing agent version Foundry creates</p>","children":[{"content":"1. Agent application<br>An Azure resource with","children":[{"content":"Invocation URL","children":[],"payload":{"tag":"li","lines":"3042,3043"}},{"content":"Authentication policy","children":[],"payload":{"tag":"li","lines":"3043,3044"}},{"content":"Entra agent identity","children":[],"payload":{"tag":"li","lines":"3044,3045"}}],"payload":{"tag":"li","lines":"3041,3045","listIndex":1}},{"content":"2. Deployment<br> A running instance of a specific agent version inside the application","children":[],"payload":{"tag":"li","lines":"3045,3047","listIndex":2}}],"payload":{"tag":"li","lines":"3040,3047"}},{"content":"\n<p data-lines=\"3047,3051\">Agent application endpoint<br>\n<code><br>\nhttps://<strong>&lt;foundry-resource-name&gt;</strong>.services.ai.azure.com/api/projects/<strong>&lt;project-name&gt;</strong>/applications/<strong>&lt;app-name&gt;</strong>/protocols/openai/responses<br>\n</code></p>","children":[],"payload":{"tag":"li","lines":"3047,3052"}},{"content":"\n<p data-lines=\"3052,3054\">Authentication and identity<br>\n<span>&#x26a0;</span> <mark>When you publish an agent, it receives its own dedicated Entra identity, separate from the project&apos;s shared identity.<br>&#xa0;&#xa0;&#xa0;&#xa0;Permissions don&apos;t transfer automatically.<br>&#xa0;&#xa0;&#xa0;&#xa0;You must reassign RBAC roles to the new agent identity for any resources the agent accesses.<br>&#xa0;&#xa0;&#xa0;&#xa0;If you skip this step, tool calls that work during development fail with authorization errors once the agent is published.</mark></p>","children":[{"content":"Verifying the endpoint","children":[{"content":"1. \n<p data-lines=\"3055,3057\">Get an access token<br>\n<code>az account get-access-token --resource https://ai.azure.com</code></p>","children":[],"payload":{"tag":"li","lines":"3055,3058","listIndex":1}},{"content":"2. \n<p data-lines=\"3058,3059\">Call the Agent application endpoint</p>\n <pre><code>\n     curl -X POST \\\n     &quot;https://**&lt;foundry-resource-name&gt;**.services.ai.azure.com/api/projects/**&lt;project-name&gt;**/applications/**&lt;app-name&gt;**/protocols/openai/responses?api-version=2025-11-15-preview&quot; \\\n     -H &quot;Authorization: Bearer **&lt;access-token&gt;**&quot; \\\n     -H &quot;Content-Type: application/json&quot; \\\n     -d &apos;{&quot;input&quot;:&quot;Say hello&quot;}&apos;\n </code></pre>\n <br>\n<p data-lines=\"3068,3069\"><span>&#x26a0;</span> <mark>If you receive <strong>403 Forbidden</strong>, confirm the caller has the Azure AI User role on the Agent Application resource.</mark></p>","children":[],"payload":{"tag":"li","lines":"3058,3070","listIndex":2}}],"payload":{"tag":"li","lines":"3054,3070"}}],"payload":{"tag":"li","lines":"3052,3070"}},{"content":"\n<p data-lines=\"3070,3071\">Integration patterns</p>","children":[{"content":"Web applications","children":[{"content":"Send user messages to the Responses API endpoint and display responses in your UI.","children":[],"payload":{"tag":"li","lines":"3072,3073"}},{"content":"Store conversation history client-side for multi-turn interactions.","children":[],"payload":{"tag":"li","lines":"3073,3074"}}],"payload":{"tag":"li","lines":"3071,3074"}},{"content":"API-driven workflows","children":[{"content":"Call the agent endpoint from backend services triggered by events or schedules.","children":[],"payload":{"tag":"li","lines":"3075,3076"}},{"content":"Process responses programmatically to drive downstream actions.","children":[],"payload":{"tag":"li","lines":"3076,3077"}}],"payload":{"tag":"li","lines":"3074,3077"}},{"content":"Chatbot interfaces","children":[{"content":"Map user sessions to conversations.","children":[],"payload":{"tag":"li","lines":"3078,3079"}},{"content":"Handle real-time message exchange through the endpoint.","children":[],"payload":{"tag":"li","lines":"3079,3080"}}],"payload":{"tag":"li","lines":"3077,3080"}},{"content":"Background automation","children":[{"content":"Schedule agent calls for recurring tasks.","children":[],"payload":{"tag":"li","lines":"3081,3082"}},{"content":"Feed system data into agents and process outputs to update business systems.","children":[],"payload":{"tag":"li","lines":"3082,3084"}}],"payload":{"tag":"li","lines":"3080,3084"}}],"payload":{"tag":"li","lines":"3070,3084"}},{"content":"\n<p data-lines=\"3084,3085\">Product considerations</p>","children":[{"content":"Monitoring","children":[{"content":"1. Track response times","children":[],"payload":{"tag":"li","lines":"3086,3087","listIndex":1}},{"content":"2. Tool invocation success rates","children":[],"payload":{"tag":"li","lines":"3087,3088","listIndex":2}},{"content":"3. Error patterns","children":[],"payload":{"tag":"li","lines":"3088,3089","listIndex":3}},{"content":"4. Token consumption using Application Insights integration.","children":[],"payload":{"tag":"li","lines":"3089,3090","listIndex":4}}],"payload":{"tag":"li","lines":"3085,3090"}},{"content":"Security","children":[{"content":"1. Use managed identities for authentication","children":[],"payload":{"tag":"li","lines":"3091,3092","listIndex":1}},{"content":"2. Apply least-privilege access","children":[],"payload":{"tag":"li","lines":"3092,3093","listIndex":2}},{"content":"3. Define data retention policies.","children":[],"payload":{"tag":"li","lines":"3093,3094","listIndex":3}}],"payload":{"tag":"li","lines":"3090,3094"}},{"content":"Cost management","children":[{"content":"1. Monitor token usage","children":[],"payload":{"tag":"li","lines":"3095,3096","listIndex":1}},{"content":"2. Set response length limits","children":[],"payload":{"tag":"li","lines":"3096,3097","listIndex":2}},{"content":"3. Implement rate limiting to prevent unexpected spikes.","children":[],"payload":{"tag":"li","lines":"3097,3098","listIndex":3}}],"payload":{"tag":"li","lines":"3094,3098"}},{"content":"Error handling","children":[{"content":"1. Implement retry logic with exponential backoff for transient failures","children":[],"payload":{"tag":"li","lines":"3099,3100","listIndex":1}},{"content":"2. Handle rate limiting with backoff strategies","children":[],"payload":{"tag":"li","lines":"3100,3101","listIndex":2}},{"content":"3. Validate inputs before sending to agents.","children":[],"payload":{"tag":"li","lines":"3101,3102","listIndex":3}}],"payload":{"tag":"li","lines":"3098,3102"}},{"content":"Conversational management","children":[{"content":"1. Agent Application endpoints currently support only the stateless Responses API.","children":[],"payload":{"tag":"li","lines":"3103,3104","listIndex":1}},{"content":"2. Store conversation history in your client for multi-turn experiences.","children":[],"payload":{"tag":"li","lines":"3104,3106","listIndex":2}}],"payload":{"tag":"li","lines":"3102,3106"}}],"payload":{"tag":"li","lines":"3084,3106"}}],"payload":{"tag":"li","lines":"3018,3106"}},{"content":"\n<p data-lines=\"3106,3107\"><strong>Key takeaways</strong></p>","children":[{"content":"\n<p data-lines=\"3107,3108\">Development &amp; Deployment</p>","children":[{"content":"Flexible Environments","children":[{"content":"Develop agents using the Foundry portal (visual designer)","children":[],"payload":{"tag":"li","lines":"3109,3110"}},{"content":"Develop agents using the Visual Studio Code (developer-focused extension)","children":[],"payload":{"tag":"li","lines":"3110,3111"}},{"content":"Allowing you to choose the environment that best fits your workflow.","children":[],"payload":{"tag":"li","lines":"3111,3112"}}],"payload":{"tag":"li","lines":"3108,3112"}},{"content":"Seamless Integration<br>\nThe service provides tools to generate integration code, making it easy to<br>\nconnect agents to existing applications and production environments.","children":[],"payload":{"tag":"li","lines":"3112,3115"}},{"content":"Testing Lifecycle<br>\nIntegrated playgrounds allow for iterative testing before moving agents into production.","children":[],"payload":{"tag":"li","lines":"3115,3118"}}],"payload":{"tag":"li","lines":"3107,3118"}},{"content":"\n<p data-lines=\"3118,3119\">Agent Architecture</p>","children":[{"content":"\n<p data-lines=\"3119,3120\">Two Primary Types</p>","children":[{"content":"Declarative Agents<br>\nConfigured primarily through visual designers and YAML files.","children":[],"payload":{"tag":"li","lines":"3120,3122"}},{"content":"Hosted Agents<br>\nBuilt and deployed through a code-centric approach.","children":[],"payload":{"tag":"li","lines":"3122,3125"}}],"payload":{"tag":"li","lines":"3119,3125"}},{"content":"\n<p data-lines=\"3125,3128\">Behavioral Control<br>\nAgents are shaped by clear instructions that define their<br>\nspecific personality, boundaries, and operational behavior.</p>","children":[],"payload":{"tag":"li","lines":"3125,3129"}}],"payload":{"tag":"li","lines":"3118,3129"}},{"content":"\n<p data-lines=\"3129,3130\">Extensibility &amp; Capabilities</p>","children":[{"content":"Tool Catalog<br>\nYou can transform simple chat interfaces into<br>\ncomplex automation systems by integrating built-in tools such as:","children":[{"content":"Code Interpreter for logic and calculations.","children":[],"payload":{"tag":"li","lines":"3133,3134"}},{"content":"File Search &amp; Azure AI Search for data retrieval.","children":[],"payload":{"tag":"li","lines":"3134,3135"}},{"content":"Bing Web Search for real-time information.","children":[],"payload":{"tag":"li","lines":"3135,3136"}}],"payload":{"tag":"li","lines":"3130,3136"}},{"content":"Automation Focus<br>\nThese agents are designed to handle complex tasks, access real-time data, and<br>\nsupport decision-making across various domains like customer service,<br>\nresearch, and developer productivity.","children":[],"payload":{"tag":"li","lines":"3136,3141"}}],"payload":{"tag":"li","lines":"3129,3141"}}],"payload":{"tag":"li","lines":"3106,3141"}},{"content":"\n<p data-lines=\"3141,3142\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.MS.com/en-us/training/modules/ai-agent-fundamentals\">Fundamentals of AI agents</a><br>\nDeepen your understanding of agent concepts and architectures","children":[],"payload":{"tag":"li","lines":"3142,3144"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/\">MS Foundry documentation</a><br>\nExplore detailed guides and API references","children":[],"payload":{"tag":"li","lines":"3144,3146"}},{"content":"<a href=\"https://learn.MS.com/en-us/training/paths/copilot/\">GitHub Copilot fundamentals</a><br>\nLearn about AI agent applications in software development","children":[],"payload":{"tag":"li","lines":"3146,3149"}}],"payload":{"tag":"li","lines":"3141,3149"}},{"content":"\n<p data-lines=\"3149,3151\"><strong>Exercise - Build and deploy an AI agent</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-agents/Instructions/Exercises/01-build-agent-portal-and-vscode.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"3149,3153"}}],"payload":{"tag":"h3","lines":"2617,2618"}},{"content":"2. <a href=\"https://learn.MS.com/en-us/training/modules/build-agent-with-custom-tools/\">Integrate custom tools into your agent</a>","children":[{"content":"\n<p data-lines=\"3155,3156\"><strong>Introduction</strong></p>","children":[{"content":"Accessible AI Development<br>\nBuild intelligent agents without requiring extensive artificial intelligence or machine learning expertise.","children":[],"payload":{"tag":"li","lines":"3156,3158"}},{"content":"The Power of Custom Tools<br>\nWhile built-in tools handle knowledge retrieval and code generation, custom tools (built from your own code or third-party APIs) enable agents to execute specific, complex actions that models cannot do alone.","children":[],"payload":{"tag":"li","lines":"3158,3160"}},{"content":"Practical Use Case (Retail Example)<br>\nDeploy an FAQ agent equipped with custom tools to automatically look up customer orders, reducing response delays and freeing up support teams for complex issues.","children":[],"payload":{"tag":"li","lines":"3160,3162"}},{"content":"Module Objectives<br>\nLearn to utilize custom tools to enhance productivity, improve task accuracy, and create tailored solutions for specific business needs.","children":[],"payload":{"tag":"li","lines":"3162,3165"}}],"payload":{"tag":"li","lines":"3155,3165"}},{"content":"\n<p data-lines=\"3165,3166\"><strong>Why use custom tools</strong></p>","children":[{"content":"\n<p data-lines=\"3167,3168\">Why use custom tools</p>","children":[{"content":"Enhance productivity<br>\nAutomate repetitive tasks and streamline workflows","children":[],"payload":{"tag":"li","lines":"3168,3170"}},{"content":"Improve accuracy<br>\nProvide precise and consistent outputs, reducing human error","children":[],"payload":{"tag":"li","lines":"3170,3172"}},{"content":"Tailored solutions<br>\nAddress specific business needs and optimize processes","children":[],"payload":{"tag":"li","lines":"3172,3174"}},{"content":"Process of an agent choosing to use the custom tool","children":[{"content":"1. A user asks an agent about the<br>\nweather conditions in a ski resort.","children":[],"payload":{"tag":"li","lines":"3175,3177","listIndex":1}},{"content":"2. The agent determines that it has access to a<br>\ntool that can use an API to get meteorological information, and calls it.","children":[],"payload":{"tag":"li","lines":"3177,3179","listIndex":2}},{"content":"3. The tool returns the weather report, and the<br>\nagent informs the user.","children":[],"payload":{"tag":"li","lines":"3179,3182","listIndex":3}}],"payload":{"tag":"li","lines":"3174,3182"}}],"payload":{"tag":"li","lines":"3167,3182"}},{"content":"\n<p data-lines=\"3182,3183\">Common scenarios for custom tools in agents</p>","children":[{"content":"\n<p data-lines=\"3183,3184\">Customer support automation</p>","children":[{"content":"Scenario<br>\nA retail company integrates a custom tool that<br>\nconnects the Azure AI Agent to their customer<br>\nrelationship management (CRM) system.","children":[],"payload":{"tag":"li","lines":"3184,3188"}},{"content":"Functionality<br>\nThe AI agent can retrieve customer order<br>\nhistories, process refunds, and provide<br>\nreal-time updates on shipping statuses.","children":[],"payload":{"tag":"li","lines":"3188,3192"}},{"content":"Outcome<br>\nFaster resolution of customer queries,<br>\nreduced workload for support teams, and<br>\nimproved customer satisfaction.","children":[],"payload":{"tag":"li","lines":"3192,3197"}}],"payload":{"tag":"li","lines":"3183,3197"}},{"content":"\n<p data-lines=\"3197,3198\">Inventory management</p>","children":[{"content":"Scenario<br>\nA manufacturing company develops a<br>\ncustom tool to link the AI agent with their<br>\ninventory management system.","children":[],"payload":{"tag":"li","lines":"3198,3202"}},{"content":"Functionality<br>\nThe AI agent can check stock levels, predict restocking<br>\nneeds using historical data, and place orders with suppliers automatically.","children":[],"payload":{"tag":"li","lines":"3202,3205"}},{"content":"Outcome<br>\nStreamlined inventory processes and optimized supply chain operations.","children":[],"payload":{"tag":"li","lines":"3205,3208"}}],"payload":{"tag":"li","lines":"3197,3208"}},{"content":"\n<p data-lines=\"3208,3209\">Healthcare appointment scheduling</p>","children":[{"content":"Scenario<br>\nA healthcare provider integrates a custom scheduling tool with the AI agent.","children":[],"payload":{"tag":"li","lines":"3209,3211"}},{"content":"Functionality<br>\nThe AI agent can access patient records, suggest available appointment slots, and<br>\nsend reminders to patients.","children":[],"payload":{"tag":"li","lines":"3211,3214"}},{"content":"Outcome<br>\nReduced administrative burden, improved patient experience, and<br>\nbetter resource utilization.","children":[],"payload":{"tag":"li","lines":"3214,3218"}}],"payload":{"tag":"li","lines":"3208,3218"}},{"content":"\n<p data-lines=\"3218,3219\">IT Helpdesk support</p>","children":[{"content":"Scenario<br>\nAn IT department develops a custom tool to integrate the<br>\nAI agent with their ticketing and knowledge base systems.","children":[],"payload":{"tag":"li","lines":"3219,3222"}},{"content":"Functionality<br>\nThe AI agent can troubleshoot common technical issues,<br>\nescalate complex problems, and track ticket statuses.","children":[],"payload":{"tag":"li","lines":"3222,3225"}},{"content":"Outcome<br>\nFaster issue resolution, reduced downtime, and<br>\nimproved employee productivity.","children":[],"payload":{"tag":"li","lines":"3225,3229"}}],"payload":{"tag":"li","lines":"3218,3229"}},{"content":"\n<p data-lines=\"3229,3230\">E-learning and training</p>","children":[{"content":"Scenario<br>\nAn educational institution creates a custom tool to<br>\nconnect the AI agent with their learning management system (LMS).","children":[],"payload":{"tag":"li","lines":"3230,3233"}},{"content":"Functionality<br>\nThe AI agent can recommend courses, track student progress, and<br>\nanswer questions about course content.","children":[],"payload":{"tag":"li","lines":"3233,3236"}},{"content":"Outcome<br>\nEnhanced learning experiences, increased student engagement, and<br>\nstreamlined administrative tasks.","children":[],"payload":{"tag":"li","lines":"3236,3240"}}],"payload":{"tag":"li","lines":"3229,3240"}}],"payload":{"tag":"li","lines":"3182,3240"}}],"payload":{"tag":"li","lines":"3165,3240"}},{"content":"\n<p data-lines=\"3240,3241\"><strong>Options for implementing custom tools</strong></p>","children":[{"content":"Custom tool options available in<br>\nMS Foundry Agent Service","children":[{"content":"Custom function<br>\nFunction calling allows you to describe the structure of custom functions to an<br>\nagent and return the functions that need to be called along with their arguments.<br>\nThe agent can dynamically identify appropriate functions based on their definitions.<br>\nThis feature is useful for integrating custom logic and workflows, in a selection of<br>\nprogramming languages, into your AI agents.","children":[],"payload":{"tag":"li","lines":"3244,3250"}},{"content":"Azure Functions<br>\nAzure Functions enable you to create intelligent, event-driven applications with minimal overhead.<br>\nThey support triggers and bindings, which simplify how your AI Agents interact with external<br>\nsystems and services.<br>\nTriggers determine when a function executes, while bindings facilitate streamlined connections to<br>\ninput or output data sources.","children":[],"payload":{"tag":"li","lines":"3250,3256"}},{"content":"OpenAPI specification tools<br>\nThese tools allow you to connect your Azure AI Agent to an external API using an OpenAPI 3.0 specification.<br>\nThis provides standardized, automated, and scalable API integrations that enhance the capabilities of your agent.<br>\nOpenAPI specifications describe HTTP APIs, enabling people to understand how an API works, generate client<br>\ncode, create tests, and apply design standards.","children":[],"payload":{"tag":"li","lines":"3256,3261"}},{"content":"Azure Logic Apps<br>\nThis action provides low-code/no-code solutions to add workflows and connects apps, data, and<br>\nservices with the low-code Logic App.","children":[],"payload":{"tag":"li","lines":"3261,3265"}}],"payload":{"tag":"li","lines":"3242,3265"}}],"payload":{"tag":"li","lines":"3240,3265"}},{"content":"\n<p data-lines=\"3265,3266\"><strong>How to integrate custom tools</strong></p>","children":[{"content":"\n<p data-lines=\"3267,3268\">Function Calling</p>","children":[{"content":"Allows agents to execute predefined<br>\nfunctions dynamically based on user input","children":[],"payload":{"tag":"li","lines":"3268,3270"}},{"content":"Example","children":[{"content":"Define a function that the agent can call  <pre><code>\n      import json\n      def recent_snowfall(location: str) -&gt; str:\n          &quot;&quot;&quot;\n          Fetches recent snowfall totals for a given location.\n          :param location: The city name.\n          :return: Snowfall details as a JSON string.\n          &quot;&quot;&quot;\n          mock_snow_data = {&quot;Seattle&quot;: &quot;0 inches&quot;, &quot;Denver&quot;: &quot;2 inches&quot;}\n          snow = mock_snow_data.get(location, &quot;Data not available.&quot;)\n          return json.dumps({&quot;location&quot;: location, &quot;snowfall&quot;: snow})\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"3271,3284"}},{"content":"Register the function with your agent using the Azure AI SDK  <pre><code>\n      # Define a function tool for the model to use\n      function_tool = FunctionTool(\n          name=&quot;recent_snowfall&quot;,\n          parameters={\n              &quot;type&quot;: &quot;object&quot;,\n              &quot;properties&quot;: {\n                  &quot;location&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;The city name to check snowfall for.&quot;},\n              },\n              &quot;required&quot;: [&quot;location&quot;],\n              &quot;additionalProperties&quot;: False\n          },\n          description=&quot;Get recent snowfall totals for a given location.&quot;,\n          strict=True,\n      )\n      # Add the function tool to a list of tools for the agent\n      tools: list[Tool] = [function_tool]\n      # Create your agent with the toolset\n      agent = project_client.agents.create_version(\n          name=&quot;snowfall-agent&quot;,\n          definition=PromptAgentDefinition(\n              model=&quot;gpt-4.1&quot;,\n              instructions=&quot;You are a weather assistant tracking snowfall. Use the provided functions to answer questions.&quot;,\n              tools=tools,\n          )\n      )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"3284,3313"}}],"payload":{"tag":"li","lines":"3270,3313"}}],"payload":{"tag":"li","lines":"3267,3313"}},{"content":"\n<p data-lines=\"3313,3314\">Azure functions</p>","children":[{"content":"Provide serverless computing capabilities for<br>\nreal-time processing","children":[],"payload":{"tag":"li","lines":"3314,3316"}},{"content":"Ideal for event-driven workflows, enabling agents to<br>\nrespond to triggers such as HTTP requests or<br>\nqueue messages","children":[],"payload":{"tag":"li","lines":"3316,3319"}},{"content":"Example","children":[{"content":"\n<p data-lines=\"3320,3321\">Develop</p>","children":[],"payload":{"tag":"li","lines":"3320,3321"}},{"content":"\n<p data-lines=\"3321,3322\">Deploy</p>","children":[],"payload":{"tag":"li","lines":"3321,3322"}},{"content":"\n<p data-lines=\"3322,3324\">Integrate into Agent definition as<br>\nan Azure Function tool</p>\n  <pre><code>\n<p data-lines=\"3326,3350\">tool = AzureFunctionTool(<br>\nazure_function=AzureFunctionDefinition(<br>\ninput_binding=AzureFunctionBinding(<br>\nstorage_queue=AzureFunctionStorageQueue(<br>\nqueue_name=&quot;STORAGE_INPUT_QUEUE_NAME&quot;,<br>\nqueue_service_endpoint=&quot;STORAGE_QUEUE_SERVICE_ENDPOINT&quot;,<br>\n)<br>\n),<br>\noutput_binding=AzureFunctionBinding(<br>\nstorage_queue=AzureFunctionStorageQueue(<br>\nqueue_name=&quot;STORAGE_OUTPUT_QUEUE_NAME&quot;,<br>\nqueue_service_endpoint=&quot;STORAGE_QUEUE_SERVICE_ENDPOINT&quot;,<br>\n)<br>\n),<br>\nfunction=AzureFunctionDefinitionFunction(<br>\nname=&quot;queue_trigger&quot;,<br>\ndescription=&quot;Get weather for a given location&quot;,<br>\nparameters={<br>\n&quot;type&quot;: &quot;object&quot;,<br>\n&quot;properties&quot;: {&quot;location&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;location to determine weather for&quot;}},<br>\n},<br>\n),<br>\n)<br>\n)</p>\n<pre data-lines=\"3351,3359\"><code>  agent = project_client.agents.create_version(\n      agent_name=&quot;MyAgent&quot;,\n      definition=PromptAgentDefinition(\n          model=&quot;gpt-4.1&quot;,\n          instructions=&quot;You are a helpful weather assistant. Use the provided Azure Function to get weather information for a location when needed.&quot;,\n          tools=[tool],\n      ),\n  )\n</code></pre>\n<p data-lines=\"3359,3360\"></p></code></pre><p></p>","children":[],"payload":{"tag":"li","lines":"3322,3361"}}],"payload":{"tag":"li","lines":"3319,3361"}}],"payload":{"tag":"li","lines":"3313,3361"}},{"content":"\n<p data-lines=\"3361,3362\">OpenAPI specification</p>","children":[{"content":"\n<p data-lines=\"3362,3364\">OpenAPI defined tools allow agents to<br>\ninteract with external APIs using standardized specifications</p>","children":[],"payload":{"tag":"li","lines":"3362,3364"}},{"content":"\n<p data-lines=\"3364,3365\">The Foundry Agent Service uses OpenAPI 3.0 specified tools</p>","children":[],"payload":{"tag":"li","lines":"3364,3365"}},{"content":"\n<p data-lines=\"3365,3367\"><span>&#x1f4a1;</span> <mark>Authentication types are supported with OpenAPI 3.0 tools<br>\n&#xa0;&#xa0;&#xa0;&#xa0;<code>anonymous</code>, <code>API ke</code>y, and <code>managed identity</code></mark></p>","children":[],"payload":{"tag":"li","lines":"3365,3367"}},{"content":"\n<p data-lines=\"3367,3368\">Example (a JSON file &#x2014; called weather_openapi.json &#x2014; describing the API)</p>\n  <pre><code>\n      {\n          &quot;openapi&quot;: &quot;3.1.0&quot;,\n          &quot;info&quot;: {\n              &quot;title&quot;: &quot;get weather data&quot;,\n              &quot;description&quot;: &quot;Retrieves current weather data for a location based on wttr.in.&quot;,\n              &quot;version&quot;: &quot;v1.0.0&quot;\n          },\n          &quot;servers&quot;: [\n              {\n              &quot;url&quot;: &quot;https://wttr.in&quot;\n              }\n          ],\n          &quot;auth&quot;: [],\n          &quot;paths&quot;: {\n              &quot;/{location}&quot;: {\n              &quot;get&quot;: {\n                  &quot;description&quot;: &quot;Get weather information for a specific location&quot;,\n                  &quot;operationId&quot;: &quot;GetCurrentWeather&quot;,\n                  &quot;parameters&quot;: [\n                  {\n                      &quot;name&quot;: &quot;location&quot;,\n                      &quot;in&quot;: &quot;path&quot;,\n                      &quot;description&quot;: &quot;City or location to retrieve the weather for&quot;,\n                      &quot;required&quot;: true,\n                      &quot;schema&quot;: {\n                          &quot;type&quot;: &quot;string&quot;\n                      }\n                  },\n                  {\n                  &quot;name&quot;: &quot;format&quot;,\n                  &quot;in&quot;: &quot;query&quot;,\n                  &quot;description&quot;: &quot;Always use j1 value for this parameter&quot;,\n                  &quot;required&quot;: true,\n                  &quot;schema&quot;: {\n                      &quot;type&quot;: &quot;string&quot;,\n                      &quot;default&quot;: &quot;j1&quot;\n                  }\n                  }\n                  ],\n                  &quot;responses&quot;: {\n                  &quot;200&quot;: {\n                      &quot;description&quot;: &quot;Successful response&quot;,\n                      &quot;content&quot;: {\n                      &quot;text/plain&quot;: {\n                          &quot;schema&quot;: {\n                              &quot;type&quot;: &quot;string&quot;\n                          }\n                      }\n                      }\n                  },\n                  &quot;404&quot;: {\n                      &quot;description&quot;: &quot;Location not found&quot;\n                      }\n                  },\n                  &quot;deprecated&quot;: false\n              }\n              }\n          },\n          &quot;components&quot;: {\n              &quot;schemes&quot;: {}\n          }\n      }\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"3367,3432"}},{"content":"\n<p data-lines=\"3432,3433\">Example (register the OpenAPI tool in the agent defintion)</p>\n  <pre><code>\n     from azure.ai.projects.models import OpenApiTool, OpenApiAnonymousAuthDetails\n<pre data-lines=\"3436,3456\"><code>      with open(weather_asset_file_path, &quot;r&quot;) as f:\n          openapi_weather = cast(dict[str, Any], jsonref.loads(f.read()))\n\n      tool = OpenApiTool(\n          openapi=OpenApiFunctionDefinition(\n              name=&quot;get_weather&quot;,\n              spec=openapi_weather,\n              description=&quot;Retrieve weather information for a location.&quot;,\n              auth=OpenApiAnonymousAuthDetails(),\n          )\n      )\n\n      agent = project_client.agents.create_version(\n          agent_name=&quot;openapi-agent&quot;,\n          definition=PromptAgentDefinition(\n              model=&quot;gpt-4.1&quot;,\n              instructions=&quot;You are a weather assistant. Use the API to fetch weather data.&quot;,\n              tools=[openapi_tool],\n          ),\n      )\n</code></pre>\n<p data-lines=\"3456,3457\"></p></code></pre><p></p>","children":[],"payload":{"tag":"li","lines":"3432,3457"}},{"content":"\n<p data-lines=\"3457,3464\"><span>&#x1f4a1;</span> <mark>One of the concepts related to agents and custom tools that developers<br>\n&#xa0;&#xa0;&#xa0;&#xa0;often have difficulty with is the declarative nature of the solution.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;You don&apos;t need to write code that explicitly calls your custom tool functions,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;the agent itself decides to call tool functions based on messages in prompts.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;By providing the agent with functions that have meaningful names and<br>\n&#xa0;&#xa0;&#xa0;&#xa0;well-documented parameters, the agent can &quot;figure out&quot; when and how to<br>\n&#xa0;&#xa0;&#xa0;&#xa0;call the function all by itself!</mark></p>","children":[],"payload":{"tag":"li","lines":"3457,3465"}}],"payload":{"tag":"li","lines":"3361,3465"}}],"payload":{"tag":"li","lines":"3265,3465"}},{"content":"\n<p data-lines=\"3465,3466\"><strong>Key Takeaways</strong></p>","children":[{"content":"Enhanced Performance &amp; Productivity<br>\nIntegrating custom tools optimizes internal processes to meet specific business needs,<br>\nresulting in higher-quality, more accurate agent responses.","children":[],"payload":{"tag":"li","lines":"3466,3469"}},{"content":"Versatile Business Use Cases<br>\nThese tool integration techniques empower businesses to effectively automate marketing<br>\nmaterial generation, streamline communications, and analyze market trends.","children":[],"payload":{"tag":"li","lines":"3469,3472"}},{"content":"Flexible Integration Paths<br>\nThe AI Agent Service supports diverse integration options, including Azure Functions and<br>\nOpenAPI specifications, allowing you to leverage existing code and APIs.","children":[],"payload":{"tag":"li","lines":"3472,3475"}},{"content":"Enterprise-Ready Architecture<br>\nEnables the creation of intelligent, event-driven applications that seamlessly align with<br>\nwell-established patterns already used in modern business infrastructure.","children":[],"payload":{"tag":"li","lines":"3475,3479"}}],"payload":{"tag":"li","lines":"3465,3479"}},{"content":"\n<p data-lines=\"3479,3480\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://github.com/MS/ai-agents-for-beginners/blob/main/04-tool-use/README.md\">AI Agents for beginners tool use</a>","children":[],"payload":{"tag":"li","lines":"3480,3481"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-services/agents/how-to/tools/function-calling\">MS Foundry Agent Service function calling</a>","children":[],"payload":{"tag":"li","lines":"3481,3482"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/azure-functions/functions-overview\">Introduction to Azure Functions</a>","children":[],"payload":{"tag":"li","lines":"3482,3483"}},{"content":"<a href=\"https://swagger.io/specification/\">OpenAPI Specification</a>","children":[],"payload":{"tag":"li","lines":"3483,3485"}}],"payload":{"tag":"li","lines":"3479,3485"}},{"content":"\n<p data-lines=\"3485,3487\"><strong>Exercise - Build an agent with custom tools</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-agents/Instructions/Exercises/02-agent-custom-tools.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"3485,3489"}}],"payload":{"tag":"h3","lines":"3153,3154"}},{"content":"3. <a href=\"https://learn.MS.com/en-us/training/modules/connect-agent-to-mcp-tools/\">Integrate MCP Tools with Azure AI Agents</a>","children":[{"content":"\n<p data-lines=\"3491,3492\"><strong>Introduction</strong></p>","children":[{"content":"The Integration Challenge<br>\nWhile AI agents are highly capable, manually connecting and<br>\nmaintaining external dependencies (APIs, databases, and internal services)<br>\nquickly becomes complex and brittle as systems scale.","children":[],"payload":{"tag":"li","lines":"3492,3496"}},{"content":"The MCP Solution<br>\nIntegrating an Azure AI Agent with a Model Context Protocol (MCP) server<br>\nprovides an on-demand tool catalog.<br>\nThis architectural pattern makes AI solutions significantly more robust,<br>\nscalable, and easier to maintain.","children":[],"payload":{"tag":"li","lines":"3496,3501"}},{"content":"Real-World Scenario<br>\nFor instance, a cosmetics retail assistant can leverage an MCP server to<br>\nsecurely bridge the LLM with live stock databases and sales trend systems,<br>\nallowing it to make real-time inventory assessments.","children":[],"payload":{"tag":"li","lines":"3501,3505"}},{"content":"Module Objectives<br>\nLearn to set up an MCP server and client infrastructure, dynamically connect<br>\nexternal tools to an Azure AI Agent, and build a complete solution<br>\nusing MS Foundry Agent Service.","children":[],"payload":{"tag":"li","lines":"3505,3510"}}],"payload":{"tag":"li","lines":"3491,3510"}},{"content":"\n<p data-lines=\"3510,3511\"><strong>Understand MCP tool discovery</strong></p>","children":[{"content":"\n<p data-lines=\"3512,3513\">Advantages of the Model Context Protocol for AI agents</p>","children":[{"content":"Dynamic Tool Discovery<br>\nAI agents can automatically receive a list of available tools from a server,<br>\nalong with descriptions of their functions. Unlike traditional APIs, which<br>\noften require manual coding for each integration and updates whenever the API changes,<br>\nMCP enables an &#x201c;integrate once&#x201d; approach that improves adaptability and reduces maintenance.","children":[],"payload":{"tag":"li","lines":"3513,3518"}},{"content":"Interoperability Across LLMs<br>\nMCP works seamlessly with different large language models (LLMs), allowing developers to<br>\nswitch or evaluate core models for improved performance without reworking integrations.","children":[],"payload":{"tag":"li","lines":"3518,3521"}},{"content":"Standardized Security<br>\nMCP provides a consistent authentication method, simplifying secure access across multiple MCP servers.<br>\nThis eliminates the need to manage separate keys or authentication protocols for each API, making it<br>\neasier to scale AI agent deployments.","children":[],"payload":{"tag":"li","lines":"3521,3526"}}],"payload":{"tag":"li","lines":"3512,3526"}},{"content":"\n<p data-lines=\"3526,3527\">What is dynamic tool discovery?</p>","children":[{"content":"Is a mechanism that allows an AI agent to<br>\ndiscover available external tools without needing<br>\nhardcoded knowledge of each one","children":[],"payload":{"tag":"li","lines":"3527,3530"}},{"content":"The agent queries a centralized Model Context Protocol (MCP) server","children":[],"payload":{"tag":"li","lines":"3530,3531"}},{"content":"This server acts as a live catalog, exposing tools that the<br>\nagent can understand and call","children":[],"payload":{"tag":"li","lines":"3531,3533"}},{"content":"Means","children":[{"content":"Tools can be added, updated, or removed centrally<br>\nwithout modifying the agent code.","children":[],"payload":{"tag":"li","lines":"3534,3536"}},{"content":"Agents can always use the latest version of a tool,<br>\nimproving accuracy and reliability.","children":[],"payload":{"tag":"li","lines":"3536,3538"}},{"content":"The complexity of managing tools shifts away from the agent and<br>\ninto a dedicated service.","children":[],"payload":{"tag":"li","lines":"3538,3541"}}],"payload":{"tag":"li","lines":"3533,3541"}}],"payload":{"tag":"li","lines":"3526,3541"}},{"content":"\n<p data-lines=\"3541,3542\">How does MCP enable dynamic tool discovery?</p>","children":[{"content":"The MCP server hosts available tools exposed<br>\nusing the <code>@mcp.tool</code> decorator","children":[],"payload":{"tag":"li","lines":"3542,3544"}},{"content":"The MCP client dynamically discovers the tools","children":[],"payload":{"tag":"li","lines":"3544,3545"}},{"content":"The Azure AI Agent uses the available tools to<br>\nrespond to user requests","children":[],"payload":{"tag":"li","lines":"3545,3548"}}],"payload":{"tag":"li","lines":"3541,3548"}},{"content":"\n<p data-lines=\"3548,3549\">Why use dynamic tool discovery with MCP?</p>","children":[{"content":"Scalability<br>\nEasily add new tools or update existing ones without redeploying agents.","children":[],"payload":{"tag":"li","lines":"3549,3551"}},{"content":"Modularity<br>\nAgents can remain simple, focusing on delegation rather than managing tool details.","children":[],"payload":{"tag":"li","lines":"3551,3553"}},{"content":"Maintainability<br>\nCentralized tool management reduces duplication and errors.","children":[],"payload":{"tag":"li","lines":"3553,3555"}},{"content":"Flexibility<br>\nSupports diverse tool types and complex workflows by aggregating capabilities.","children":[],"payload":{"tag":"li","lines":"3555,3557"}},{"content":"Dynamic tool discovery is especially useful in environments where tools evolve rapidly or<br>\nwhere many teams manage different APIs and services.","children":[],"payload":{"tag":"li","lines":"3557,3559"}},{"content":"Using tools allows AI agents to adapt to changing capabilities in real time, interact with<br>\nexternal systems securely, and perform actions that go beyond language generation.","children":[],"payload":{"tag":"li","lines":"3559,3562"}}],"payload":{"tag":"li","lines":"3548,3562"}}],"payload":{"tag":"li","lines":"3510,3562"}},{"content":"\n<p data-lines=\"3562,3563\"><strong>Integrate agent tools using an MCP server and client</strong></p>","children":[{"content":"\n<p data-lines=\"3564,3565\">Model Context Protocol (MCP) setup</p>","children":[{"content":"MCP server<br>\nWhich hosts your tool catalog","children":[],"payload":{"tag":"li","lines":"3565,3567"}},{"content":"MCP client<br>\nWhich fetches those tools and makes them usable by your agent","children":[],"payload":{"tag":"li","lines":"3567,3570"}}],"payload":{"tag":"li","lines":"3564,3570"}},{"content":"\n<p data-lines=\"3570,3571\">What is the MCP Server?</p>","children":[{"content":"The MCP server acts as a registry for tools your agent can use","children":[],"payload":{"tag":"li","lines":"3571,3572"}},{"content":"Initialize the MCP server using FastMCP(&quot;server-name&quot;)","children":[],"payload":{"tag":"li","lines":"3572,3573"}},{"content":"FastMCP class uses Python type hints and document strings to<br>\nautomatically generate tool definitions, making it easy to create and<br>\nmaintain MCP tools","children":[],"payload":{"tag":"li","lines":"3573,3576"}},{"content":"Definitions are then served over HTTP when requested by the client","children":[],"payload":{"tag":"li","lines":"3576,3577"}},{"content":"Tool definitions live on the server, so update or add new tools<br>\ndoesn&apos;t need to modify or redeploy the agent","children":[],"payload":{"tag":"li","lines":"3577,3580"}}],"payload":{"tag":"li","lines":"3570,3580"}},{"content":"\n<p data-lines=\"3580,3581\">What is the MCP Client?</p>","children":[{"content":"A MCP client acts as a bridge between<br>\nMCP server and the Azure AI Agent Service","children":[],"payload":{"tag":"li","lines":"3581,3583"}},{"content":"The client initializes an MCP client session and<br>\nconnects to the server","children":[],"payload":{"tag":"li","lines":"3583,3585"}},{"content":"The client performs the following tasks","children":[{"content":"Discovers available tools from the MCP server using <code>session.list_tools()</code>.","children":[],"payload":{"tag":"li","lines":"3586,3587"}},{"content":"Generates Python function stubs that wrap the tools.","children":[],"payload":{"tag":"li","lines":"3587,3588"}},{"content":"Registers those functions with your agent.","children":[],"payload":{"tag":"li","lines":"3588,3590"}}],"payload":{"tag":"li","lines":"3585,3590"}}],"payload":{"tag":"li","lines":"3580,3590"}},{"content":"\n<p data-lines=\"3590,3591\">Register tools with an Azure AI Agent</p>","children":[{"content":"An MCP tool can be invoked using <code>session.call_tool(tool_name, tool_args)</code>","children":[],"payload":{"tag":"li","lines":"3591,3592"}},{"content":"The tools are wrapped in an async function so that the agent is able to invoke them","children":[],"payload":{"tag":"li","lines":"3592,3593"}},{"content":"Those functions are bundled together and become part of the agent&apos;s toolset","children":[],"payload":{"tag":"li","lines":"3593,3594"}},{"content":"They are available during runtime for any user request","children":[],"payload":{"tag":"li","lines":"3594,3596"}}],"payload":{"tag":"li","lines":"3590,3596"}},{"content":"\n<p data-lines=\"3596,3597\">Overview of MCP agent tool integration</p>","children":[{"content":"The MCP server hosts tool definitions decorated with <code>@mcp.tool</code>.","children":[],"payload":{"tag":"li","lines":"3597,3598"}},{"content":"The MCP client initializes an MCP client connection to the server.","children":[],"payload":{"tag":"li","lines":"3598,3599"}},{"content":"The MCP client fetches the available tool definitions with <code>session.list_tools()</code>.","children":[],"payload":{"tag":"li","lines":"3599,3600"}},{"content":"Each tool is wrapped in an async function that invokes <code>session.call_tool</code>","children":[],"payload":{"tag":"li","lines":"3600,3601"}},{"content":"The tool functions are bundled into <code>FunctionTool</code> that makes them usable by the agent.","children":[],"payload":{"tag":"li","lines":"3601,3602"}},{"content":"The <code>FunctionTool</code> is registered to the agent&apos;s toolset.","children":[],"payload":{"tag":"li","lines":"3602,3603"}},{"content":"The agent can access and invoke your tools through natural language interaction","children":[],"payload":{"tag":"li","lines":"3603,3604"}},{"content":"<span>&#x1f4a1;</span><mark>Setting up the MCP server and client, you create a clean separation between<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;tool management and agent logic&#x2014;enabling your system to adapt quickly as<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;new tools become available</mark>","children":[],"payload":{"tag":"li","lines":"3604,3608"}}],"payload":{"tag":"li","lines":"3596,3608"}}],"payload":{"tag":"li","lines":"3562,3608"}},{"content":"\n<p data-lines=\"3608,3609\"><strong>Use Azure AI agents with MCP servers</strong></p>","children":[{"content":"\n<p data-lines=\"3610,3611\">Integrating remote MCP servers is needed</p>","children":[{"content":"A remote MCP server endpoint &#x2014; <a href=\"https://api.githubcopilot.com/mcp/\">https://api.githubcopilot.com/mcp/</a>","children":[],"payload":{"tag":"li","lines":"3611,3612"}},{"content":"A MS Foundry agent configured to use the MCP tool","children":[],"payload":{"tag":"li","lines":"3612,3613"}},{"content":"Is possible to connect to multiple MCP servers by<br>\nadding them to the agent as separate tools.","children":[{"content":"Parameters for the <code>MCPTool</code>","children":[{"content":"<code>server_label</code><br>\nA unique identifier for the MCP server (e.g., GitHub).","children":[],"payload":{"tag":"li","lines":"3616,3618"}},{"content":"<code>server_url</code><br>\nThe MCP server&#x2019;s URL.","children":[],"payload":{"tag":"li","lines":"3618,3620"}},{"content":"<code>allowed_tools</code> (optional)<br>\nA list of specific tools the agent is allowed to access.","children":[],"payload":{"tag":"li","lines":"3620,3622"}},{"content":"<code>require_approval</code> (optional)<br>\nA boolean that determines whether tool invocations require human approval.<br>\nIf set to true, the agent will pause and wait for approval before invoking any<br>\ntools on the MCP server.","children":[],"payload":{"tag":"li","lines":"3622,3626"}}],"payload":{"tag":"li","lines":"3615,3626"}},{"content":"Custom headers","children":[{"content":"Authentication keys (API keys, OAuth tokens).","children":[],"payload":{"tag":"li","lines":"3627,3628"}},{"content":"Other required headers for the MCP server","children":[],"payload":{"tag":"li","lines":"3628,3630"}}],"payload":{"tag":"li","lines":"3626,3630"}}],"payload":{"tag":"li","lines":"3613,3630"}}],"payload":{"tag":"li","lines":"3610,3630"}},{"content":"\n<p data-lines=\"3630,3631\">Invoking tools</p>","children":[{"content":"Using the Azure MCP Tool object we don&apos;t need","children":[{"content":"Wrap function tools","children":[],"payload":{"tag":"li","lines":"3632,3633"}},{"content":"Invoke <code>session.call_tool</code>","children":[],"payload":{"tag":"li","lines":"3633,3634"}}],"payload":{"tag":"li","lines":"3631,3634"}},{"content":"Tools are automatically invoked during an agent run","children":[],"payload":{"tag":"li","lines":"3634,3635"}},{"content":"Automatically invoke MCP tools","children":[{"content":"Create the <code>MCPTool</code> object with the server label and url.","children":[],"payload":{"tag":"li","lines":"3636,3637"}},{"content":"Use <code>update_headers</code> to apply any headers required by the server.","children":[],"payload":{"tag":"li","lines":"3637,3638"}},{"content":"Use the <code>require_approval</code> parameter to determine whether approval is required.<br>\nSupported values are:","children":[{"content":"always<br>\nA developer needs to provide approval for every call.<br>\nIf you don&apos;t provide a value, this one is the default.","children":[],"payload":{"tag":"li","lines":"3640,3643"}},{"content":"never<br>\nNo approval is required.","children":[],"payload":{"tag":"li","lines":"3643,3645"}}],"payload":{"tag":"li","lines":"3638,3645"}},{"content":"Create an agent and add the <code>MCPTool</code> object to its tools list","children":[],"payload":{"tag":"li","lines":"3645,3646"}},{"content":"Invoke a prompt on the agent, you should see the results of any invoked tools in the response.","children":[],"payload":{"tag":"li","lines":"3646,3647"}}],"payload":{"tag":"li","lines":"3635,3647"}},{"content":"If the tool invoked has MCP server with approval required","children":[{"content":"You get an <code>mcp_approval_request</code> in the agent response","children":[],"payload":{"tag":"li","lines":"3648,3649"}},{"content":"To approve use <code>mcp_approval_response</code> object with","children":[{"content":"<code>approval_request_id</code> value","children":[],"payload":{"tag":"li","lines":"3650,3651"}},{"content":"<code>approve</code> boolean","children":[],"payload":{"tag":"li","lines":"3651,3653"}}],"payload":{"tag":"li","lines":"3649,3653"}}],"payload":{"tag":"li","lines":"3647,3653"}}],"payload":{"tag":"li","lines":"3630,3653"}}],"payload":{"tag":"li","lines":"3608,3653"}},{"content":"\n<p data-lines=\"3653,3654\"><strong>Key takeaways</strong></p>","children":[{"content":"Dynamic Runtime Discovery<br>\nConnecting an agent to a Model Context Protocol (MCP) server allows it to<br>\ndiscover and register tools dynamically at runtime.<br>\nThis eliminates the need to hardcode APIs or redeploy the agent when underlying tools change.","children":[],"payload":{"tag":"li","lines":"3654,3658"}},{"content":"Automated Client-Side Mapping<br>\nThe MCP client acts as an intelligent bridge, automatically generating function wrappers from the<br>\ndiscovered tools and connecting them directly to the agent&apos;s execution layer.","children":[],"payload":{"tag":"li","lines":"3658,3661"}},{"content":"Architectural Agility &amp; Scalability<br>\nThis decoupled pattern ensures that AI solutions remain flexible and resilient.<br>\nThe agent can seamlessly adapt to evolving toolsets and scale alongside growing enterprise<br>\napplications without breaking existing infrastructure.","children":[],"payload":{"tag":"li","lines":"3661,3666"}}],"payload":{"tag":"li","lines":"3653,3666"}},{"content":"\n<p data-lines=\"3666,3667\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://modelcontextprotocol.io/introduction\">Model Context Protocol User Guide</a>","children":[],"payload":{"tag":"li","lines":"3667,3668"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol?view=foundry&amp;preserve-view=true&amp;pivots=python\">Connect to Model Context Protocol servers</a>","children":[],"payload":{"tag":"li","lines":"3668,3670"}}],"payload":{"tag":"li","lines":"3666,3670"}},{"content":"\n<p data-lines=\"3670,3672\"><strong>Exercise - Connect MCP tools to Azure AI Agents</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-agents/Instructions/Exercises/03-mcp-integration.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"3670,3674"}}],"payload":{"tag":"h3","lines":"3489,3490"}},{"content":"4. <a href=\"https://learn.MS.com/en-us/training/modules/introduction-foundry-iq/\">Build knowledge-enhanced AI agents with Foundry IQ</a>","children":[{"content":"\n<p data-lines=\"3676,3677\"><strong>Introduction</strong></p>","children":[{"content":"The Scaling Challenge<br>\nWhile organizations are eager to adopt AI agents to automate tasks,<br>\nthey quickly hit a fundamental wall:<br>\nscaling agents beyond simple, predefined workflows.","children":[],"payload":{"tag":"li","lines":"3678,3682"}},{"content":"The Value of Organizational Knowledge<br>\nThe true power of an AI agent is unlocked only when it can access<br>\ninternal company data&#x2014;such as policies, procedures, product documentation, and domain expertise.","children":[],"payload":{"tag":"li","lines":"3682,3685"}},{"content":"Limitations of Traditional Agents<br>\nStandard agents are restricted by knowledge cutoff dates, lack access to private data, and<br>\nproduce generic responses or flat-out incorrect information (hallucinations) due to a lack of factual grounding.","children":[],"payload":{"tag":"li","lines":"3685,3688"}},{"content":"Complex Engineering Hurdles<br>\nManually building knowledge-enabled agents requires teams to repeatedly tackle complex infrastructure challenges,<br>\nincluding data ingestion, chunking strategies, vector database maintenance, and access controls.","children":[],"payload":{"tag":"li","lines":"3688,3691"}},{"content":"The Solution (Foundry IQ)<br>\nMS Foundry IQ serves as a unified knowledge platform that eliminates the need to build custom<br>\nRetrieval-Augmented Generation (RAG) pipelines from scratch for every project, allowing multiple agents to<br>\nsecurely share and instantly benefit from centralized knowledge bases.","children":[],"payload":{"tag":"li","lines":"3691,3695"}},{"content":"Objectives","children":[{"content":"Explain how RAG solves the knowledge problem by connecting agents to real-time information","children":[],"payload":{"tag":"li","lines":"3696,3697"}},{"content":"Describe how Foundry IQ provides a shared knowledge platform that multiple agents can access","children":[],"payload":{"tag":"li","lines":"3697,3698"}},{"content":"Configure data sources for knowledge bases including Azure AI Search, Blob Storage, SharePoint, and OneLake","children":[],"payload":{"tag":"li","lines":"3698,3699"}},{"content":"Configure agent instructions to control retrieval behavior and ensure consistent citations","children":[],"payload":{"tag":"li","lines":"3699,3700"}},{"content":"Test and monitor agent retrieval to maintain quality in production","children":[],"payload":{"tag":"li","lines":"3700,3702"}}],"payload":{"tag":"li","lines":"3695,3702"}}],"payload":{"tag":"li","lines":"3676,3702"}},{"content":"\n<p data-lines=\"3702,3703\"><strong>Understanding RAG for agents</strong></p>","children":[{"content":"\n<p data-lines=\"3703,3704\">Simple AI agent limitations</p>\n<table data-lines=\"3704,3711\">\n<thead data-lines=\"3704,3705\">\n<tr data-lines=\"3704,3705\">\n<th style=\"text-align:left\">Limitation</th>\n<th style=\"text-align:left\">Impact</th>\n<th style=\"text-align:left\">Example</th>\n</tr>\n</thead>\n<tbody data-lines=\"3706,3711\">\n<tr data-lines=\"3706,3707\">\n<td style=\"text-align:left\">Knowledge cutoff dates</td>\n<td style=\"text-align:left\">No access to recent<br> information</td>\n<td style=\"text-align:left\">Can&apos;t help with newly released features or<br> updated policies</td>\n</tr>\n<tr data-lines=\"3707,3708\">\n<td style=\"text-align:left\">Private data access</td>\n<td style=\"text-align:left\">Generic responses only</td>\n<td style=\"text-align:left\">Missing company procedures, support knowledge,<br> product specs</td>\n</tr>\n<tr data-lines=\"3708,3709\">\n<td style=\"text-align:left\">Lack of context</td>\n<td style=\"text-align:left\">Irrelevant advice</td>\n<td style=\"text-align:left\">Ignores specific security requirements or<br> approval workflows</td>\n</tr>\n<tr data-lines=\"3709,3710\">\n<td style=\"text-align:left\">Fabricated responses</td>\n<td style=\"text-align:left\">Compliance and security risks</td>\n<td style=\"text-align:left\">Confident-sounding but<br> incorrect information</td>\n</tr>\n<tr data-lines=\"3710,3711\">\n<td style=\"text-align:left\">Scalability issues</td>\n<td style=\"text-align:left\">Duplicated engineering effort</td>\n<td style=\"text-align:left\">Every team rebuilds the same<br> RAG infrastructure</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"3703,3712"}},{"content":"\n<p data-lines=\"3712,3713\">How RAG solves these problems</p>","children":[{"content":"RAG process","children":[{"content":"1. Retrieve<br>\nSystem searches knowledge bases for<br>\nrelevant content related to the query","children":[],"payload":{"tag":"li","lines":"3714,3717","listIndex":1}},{"content":"2. Augment<br>\nCombines retrieved content with the<br>\nuser&apos;s question to provide factual context","children":[],"payload":{"tag":"li","lines":"3717,3720","listIndex":2}},{"content":"3. Generate<br>\nAgent creates response using both<br>\ntraining data and retrieved information","children":[],"payload":{"tag":"li","lines":"3720,3723","listIndex":3}}],"payload":{"tag":"li","lines":"3713,3723"}},{"content":"RAG advantages","children":[{"content":"Real-time updates<br>\nKeep agents current with policies and<br>\nprocedures without requiring retraining","children":[],"payload":{"tag":"li","lines":"3724,3727"}},{"content":"Source transparency<br>\nShows users exactly which documents informed each<br>\nresponse to build trust and enable verification","children":[],"payload":{"tag":"li","lines":"3727,3730"}},{"content":"Factual grounding<br>\nanchors responses in actual organizational content to<br>\neliminate fabricated information and ensure compliance","children":[],"payload":{"tag":"li","lines":"3730,3734"}}],"payload":{"tag":"li","lines":"3723,3734"}}],"payload":{"tag":"li","lines":"3712,3734"}}],"payload":{"tag":"li","lines":"3702,3734"}},{"content":"\n<p data-lines=\"3734,3735\"><strong>Explore Foundry IQ</strong></p>","children":[{"content":"\n<p data-lines=\"3736,3737\">Challenges of build a RAG system</p>","children":[{"content":"Configuring vector databases","children":[],"payload":{"tag":"li","lines":"3737,3738"}},{"content":"Implementing embedding pipelines","children":[],"payload":{"tag":"li","lines":"3738,3739"}},{"content":"Tuning retrieval algorithms","c
