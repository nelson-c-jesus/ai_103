<tr data-lines=\"8541,8542\">\n<td style=\"text-align:left\"><code>failed</code></td>\n<td style=\"text-align:left\">Generation failed (check <code>video.error</code> for details<br>about what went wrong)</td>\n</tr>\n<tr data-lines=\"8542,8543\">\n<td style=\"text-align:left\"><code>cancelled</code></td>\n<td style=\"text-align:left\">Job was canceled</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"8535,8544"}},{"content":"\n<p data-lines=\"8544,8545\">Key considerations</p>","children":[{"content":"Rate limits<br>\nYou can run up to two video creation jobs simultaneously","children":[],"payload":{"tag":"li","lines":"8545,8547"}},{"content":"Job expiration<br>\nCompleted videos are available for download for 24 hours","children":[],"payload":{"tag":"li","lines":"8547,8549"}},{"content":"Resolution requirements<br>\nReference images must match the target video resolution exactly","children":[],"payload":{"tag":"li","lines":"8549,8551"}},{"content":"Content filtering<br>\nPrompts are subject to content moderation; harmful content won&apos;t generate","children":[],"payload":{"tag":"li","lines":"8551,8554"}}],"payload":{"tag":"li","lines":"8544,8554"}}],"payload":{"tag":"li","lines":"8470,8554"}},{"content":"\n<p data-lines=\"8554,8555\"><strong>Key takeaways</strong></p>","children":[{"content":"Deploy a Sora 2 video generation model in Microsoft Foundry","children":[],"payload":{"tag":"li","lines":"8555,8556"}},{"content":"Write effective prompts that describe camera framing, subject details, action, and lighting","children":[],"payload":{"tag":"li","lines":"8556,8557"}},{"content":"Use the Video playground to test video generation with different settings","children":[],"payload":{"tag":"li","lines":"8557,8558"}},{"content":"Generate videos from reference images and remix existing videos","children":[],"payload":{"tag":"li","lines":"8558,8559"}},{"content":"Build a Python application that creates videos programmatically using the OpenAI SDK","children":[],"payload":{"tag":"li","lines":"8559,8561"}}],"payload":{"tag":"li","lines":"8554,8561"}},{"content":"\n<p data-lines=\"8561,8562\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/video-generation\">Video generation with Sora</a>","children":[],"payload":{"tag":"li","lines":"8562,8564"}}],"payload":{"tag":"li","lines":"8561,8564"}},{"content":"\n<p data-lines=\"8564,8566\"><strong>Exercise - Generate video with Sora 2 in Microsoft Foundry</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-vision/Instructions/Exercises/03-generate-video.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"8564,8568"}}],"payload":{"tag":"h3","lines":"8301,8302"}},{"content":"4. <a href=\"https://learn.microsoft.com/en-us/training/modules/analyze-images-with-content-understanding/\">Analyze images with Content Understanding</a>","children":[{"content":"\n<p data-lines=\"8570,8571\"><strong>Introduction</strong></p>","children":[{"content":"Images, documents, and other unstructured content often<br>\ncontain valuable business information that is difficult to process automatically.","children":[],"payload":{"tag":"li","lines":"8571,8573"}},{"content":"Microsoft Azure Content Understanding uses generative AI to<br>\nanalyze and interpret unstructured data.","children":[],"payload":{"tag":"li","lines":"8573,8575"}},{"content":"The service transforms raw content into <strong>structured and usable information</strong>.","children":[],"payload":{"tag":"li","lines":"8575,8576"}},{"content":"Developers can define a custom <strong>schema</strong> that specifies the exact data to<br>\nextract from documents and images.","children":[],"payload":{"tag":"li","lines":"8576,8578"}},{"content":"Azure Content Understanding automatically identifies and extracts the<br>\nrequested information based on the defined schema.","children":[],"payload":{"tag":"li","lines":"8578,8580"}},{"content":"Structured outputs can be integrated directly into:","children":[{"content":"Automation workflows","children":[],"payload":{"tag":"li","lines":"8581,8582"}},{"content":"Analytics platforms","children":[],"payload":{"tag":"li","lines":"8582,8583"}},{"content":"Search applications","children":[],"payload":{"tag":"li","lines":"8583,8584"}},{"content":"Enterprise business processes","children":[],"payload":{"tag":"li","lines":"8584,8585"}}],"payload":{"tag":"li","lines":"8580,8585"}},{"content":"Generative AI simplifies the extraction of insights from complex visual and<br>\ndocument-based content.","children":[],"payload":{"tag":"li","lines":"8585,8587"}},{"content":"The platform helps organizations improve efficiency, reduce manual data<br>\nprocessing, and accelerate decision-making.","children":[],"payload":{"tag":"li","lines":"8587,8589"}},{"content":"Content Understanding enables scalable document and image processing for<br>\nmodern AI-powered applications.","children":[],"payload":{"tag":"li","lines":"8589,8592"}}],"payload":{"tag":"li","lines":"8570,8592"}},{"content":"\n<p data-lines=\"8592,8593\"><strong>What is Content Understanding?</strong></p>","children":[{"content":"\n<p data-lines=\"8594,8595\">Why use Content Understanding?</p>","children":[{"content":"Is a Foundry Tool that uses generative AI to<br>\nprocess and extract insights from many types of content","children":[{"content":"Documents","children":[],"payload":{"tag":"li","lines":"8597,8598"}},{"content":"Images","children":[],"payload":{"tag":"li","lines":"8598,8599"}},{"content":"Videos","children":[],"payload":{"tag":"li","lines":"8599,8600"}},{"content":"Audio","children":[],"payload":{"tag":"li","lines":"8600,8601"}}],"payload":{"tag":"li","lines":"8595,8601"}},{"content":"Transforms unstructured data into structured,<br>\nactionable output that you can integrate into<br>\nautomation and analytical workflows","children":[],"payload":{"tag":"li","lines":"8601,8604"}},{"content":"Key benifits","children":[{"content":"Simplified workflows<br>\nStandardizes extraction and classification of content from<br>\nvarious content types into a unified process","children":[],"payload":{"tag":"li","lines":"8605,8608"}},{"content":"Easy field extraction<br>\nDefine a schema to extract, classify, or generate field values<br>\nwithout complex prompt engineering","children":[],"payload":{"tag":"li","lines":"8608,8611"}},{"content":"Enhanced accuracy<br>\nUses multiple AI models to analyze and cross-validate<br>\ninformation simultaneously","children":[],"payload":{"tag":"li","lines":"8611,8614"}},{"content":"Confidence scores and grounding<br>\nEnsures accuracy of extracted values while minimizing the<br>\ncost of human review","children":[],"payload":{"tag":"li","lines":"8614,8617"}},{"content":"Content classification<br>\nCategorize document types to streamline processing and<br>\nroute content to appropriate analyzers","children":[],"payload":{"tag":"li","lines":"8617,8621"}}],"payload":{"tag":"li","lines":"8604,8621"}}],"payload":{"tag":"li","lines":"8594,8621"}},{"content":"\n<p data-lines=\"8621,8622\">Content Understanding components</p>\n<table data-lines=\"8622,8631\">\n<thead data-lines=\"8622,8623\">\n<tr data-lines=\"8622,8623\">\n<th style=\"text-align:left\">Components</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"8624,8631\">\n<tr data-lines=\"8624,8625\">\n<td style=\"text-align:left\">Inputs</td>\n<td style=\"text-align:left\">Source content including documents, images,<br>video, and audio</td>\n</tr>\n<tr data-lines=\"8625,8626\">\n<td style=\"text-align:left\">Analyzer</td>\n<td style=\"text-align:left\">Defines how content is processed, including<br>extraction settings and field schema</td>\n</tr>\n<tr data-lines=\"8626,8627\">\n<td style=\"text-align:left\">Content<br>extraction</td>\n<td style=\"text-align:left\">Transforms unstructured input into normalized text and<br>metadata using OCR, speech transcription, and layout detection</td>\n</tr>\n<tr data-lines=\"8627,8628\">\n<td style=\"text-align:left\">Field<br>extraction</td>\n<td style=\"text-align:left\">Generates structured key-value pairs based on your defined schema</td>\n</tr>\n<tr data-lines=\"8628,8629\">\n<td style=\"text-align:left\">Confidence scores</td>\n<td style=\"text-align:left\">Provides reliability estimates from 0 to 1 for<br>each extracted field value</td>\n</tr>\n<tr data-lines=\"8629,8630\">\n<td style=\"text-align:left\">Grounding</td>\n<td style=\"text-align:left\">Identifies specific regions in content where<br>each value was extracted</td>\n</tr>\n<tr data-lines=\"8630,8631\">\n<td style=\"text-align:left\">Structured output</td>\n<td style=\"text-align:left\">Final result as Markdown for search scenarios or<br>JSON for automation workflows</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"8621,8632"}},{"content":"\n<p data-lines=\"8632,8633\">Analyzers</p>","children":[{"content":"Content Understanding offers two types","children":[{"content":"Prebuilt analyzers<br>\nReady-to-use analyzers designed for common scenarios like<br>\ninvoice processing, receipt extraction, and call center analytics","children":[],"payload":{"tag":"li","lines":"8634,8637"}},{"content":"Custom analyzers<br>\nTailored analyzers you create with your own field schema for<br>\nspecific business needs","children":[],"payload":{"tag":"li","lines":"8637,8640"}}],"payload":{"tag":"li","lines":"8633,8640"}},{"content":"Configurations","children":[{"content":"The base analyzer type (document, image, audio, or video)","children":[],"payload":{"tag":"li","lines":"8641,8642"}},{"content":"The AI models to use for processing","children":[],"payload":{"tag":"li","lines":"8642,8643"}},{"content":"The field schema that defines what data to extract","children":[],"payload":{"tag":"li","lines":"8643,8644"}},{"content":"Options like confidence scoring and content segmentation","children":[],"payload":{"tag":"li","lines":"8644,8646"}}],"payload":{"tag":"li","lines":"8640,8646"}}],"payload":{"tag":"li","lines":"8632,8646"}},{"content":"\n<p data-lines=\"8646,8647\">Use cases</p>\n<table data-lines=\"8647,8653\">\n<thead data-lines=\"8647,8648\">\n<tr data-lines=\"8647,8648\">\n<th style=\"text-align:left\">Use cases</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"8649,8653\">\n<tr data-lines=\"8649,8650\">\n<td style=\"text-align:left\">Intelligent document<br>processing</td>\n<td style=\"text-align:left\">Convert unstructured documents into structured data for invoice processing,<br>contract analysis, and claims management</td>\n</tr>\n<tr data-lines=\"8650,8651\">\n<td style=\"text-align:left\">Search and RAG</td>\n<td style=\"text-align:left\">Ingest multimodal content into search indexes with figure<br>descriptions and layout analysis</td>\n</tr>\n<tr data-lines=\"8651,8652\">\n<td style=\"text-align:left\">Agentic applications</td>\n<td style=\"text-align:left\">Transform messy file inputs into predictable, standardized<br>inputs for AI agents</td>\n</tr>\n<tr data-lines=\"8652,8653\">\n<td style=\"text-align:left\">Analytics and<br>reporting</td>\n<td style=\"text-align:left\">Extract field outputs to gain insights and make informed decisions</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"8646,8654"}},{"content":"\n<p data-lines=\"8654,8655\">Content restrictions</p>","children":[{"content":"Content Understanding includes built-in <strong>Responsible AI</strong> protectionsy","children":[],"payload":{"tag":"li","lines":"8655,8656"}},{"content":"Integrates** Azure AI Content Safety** to detect and prevent harmful content","children":[],"payload":{"tag":"li","lines":"8656,8657"}},{"content":"Guidelines","children":[{"content":"Content is filtered for harmful material including violence,<br>\nhate speech, and exploitation","children":[],"payload":{"tag":"li","lines":"8658,8660"}},{"content":"Face description capabilities can identify facial attributes in<br>\nvideo and image content","children":[],"payload":{"tag":"li","lines":"8660,8662"}},{"content":"Biometric data processing requires appropriate notice and<br>\nconsent from data subjects","children":[],"payload":{"tag":"li","lines":"8662,8665"}}],"payload":{"tag":"li","lines":"8657,8665"}}],"payload":{"tag":"li","lines":"8654,8665"}}],"payload":{"tag":"li","lines":"8592,8665"}},{"content":"\n<p data-lines=\"8665,8666\"><strong>Analyze images with Content Understanding</strong></p>","children":[{"content":"\n<p data-lines=\"8667,8668\">Supported image formats</p>","children":[{"content":"Content Understanding can analyze images to","children":[{"content":"Extract structured data","children":[],"payload":{"tag":"li","lines":"8669,8670"}},{"content":"Identify visual elements","children":[],"payload":{"tag":"li","lines":"8670,8671"}},{"content":"Generate descriptions","children":[],"payload":{"tag":"li","lines":"8671,8672"}}],"payload":{"tag":"li","lines":"8668,8672"}},{"content":"Image input types\n<table data-lines=\"8673,8681\">\n<thead data-lines=\"8673,8674\">\n<tr data-lines=\"8673,8674\">\n<th style=\"text-align:left\">Format</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"8675,8681\">\n<tr data-lines=\"8675,8676\">\n<td style=\"text-align:left\">JPEG</td>\n<td style=\"text-align:left\">Standard photographic images</td>\n</tr>\n<tr data-lines=\"8676,8677\">\n<td style=\"text-align:left\">PNG</td>\n<td style=\"text-align:left\">Images with transparency support</td>\n</tr>\n<tr data-lines=\"8677,8678\">\n<td style=\"text-align:left\">BMP</td>\n<td style=\"text-align:left\">Bitmap images</td>\n</tr>\n<tr data-lines=\"8678,8679\">\n<td style=\"text-align:left\">TIFF</td>\n<td style=\"text-align:left\">High-quality scanned documents</td>\n</tr>\n<tr data-lines=\"8679,8680\">\n<td style=\"text-align:left\">HEIF</td>\n<td style=\"text-align:left\">High-efficiency image format</td>\n</tr>\n<tr data-lines=\"8680,8681\">\n<td style=\"text-align:left\">PDF</td>\n<td style=\"text-align:left\">Single or multi-page documents with embedded images</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"8672,8682"}}],"payload":{"tag":"li","lines":"8667,8682"}},{"content":"\n<p data-lines=\"8682,8683\">Prebuilt image analyzers</p>","children":[{"content":"prebuilt-image<br>\nGeneral-purpose image analysis with content extraction and figure description","children":[],"payload":{"tag":"li","lines":"8683,8685"}},{"content":"prebuilt-receipt<br>\nExtract vendor names, items, totals, and dates from receipt images","children":[],"payload":{"tag":"li","lines":"8685,8687"}},{"content":"prebuilt-invoice<br>\nExtract invoice details including line items, amounts, and vendor information","children":[],"payload":{"tag":"li","lines":"8687,8689"}},{"content":"prebuilt-idDocument<br>\nExtract information from identity documents like driver&apos;s licenses and passports","children":[],"payload":{"tag":"li","lines":"8689,8692"}}],"payload":{"tag":"li","lines":"8682,8692"}},{"content":"\n<p data-lines=\"8692,8693\">Define a field schema for images</p>","children":[{"content":"To extract specific information from images,<br>\ndefine a field schema that describes the data you want","children":[],"payload":{"tag":"li","lines":"8693,8695"}},{"content":"Each field can use one of\n<table data-lines=\"8696,8701\">\n<thead data-lines=\"8696,8697\">\n<tr data-lines=\"8696,8697\">\n<th style=\"text-align:left\">Method</th>\n<th style=\"text-align:left\">Description</th>\n<th style=\"text-align:left\">Example</th>\n</tr>\n</thead>\n<tbody data-lines=\"8698,8701\">\n<tr data-lines=\"8698,8699\">\n<td style=\"text-align:left\">extract</td>\n<td style=\"text-align:left\">Pull values directly as they appear in the image</td>\n<td style=\"text-align:left\">Extract text from a label or sign</td>\n</tr>\n<tr data-lines=\"8699,8700\">\n<td style=\"text-align:left\">classify</td>\n<td style=\"text-align:left\">Categorize content from predefined options</td>\n<td style=\"text-align:left\">Classify image as &quot;damaged&quot; or &quot;undamaged&quot;</td>\n</tr>\n<tr data-lines=\"8700,8701\">\n<td style=\"text-align:left\">generate</td>\n<td style=\"text-align:left\">Create values based on image analysis</td>\n<td style=\"text-align:left\">Generate a description of the scene</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"8695,8701"}},{"content":"Example  <pre><code>\n  {\n      &quot;description&quot;: &quot;Product image analyzer&quot;,\n      &quot;baseAnalyzerId&quot;: &quot;prebuilt-image&quot;,\n      &quot;fieldSchema&quot;: {\n          &quot;fields&quot;: {\n          &quot;ProductName&quot;: {\n              &quot;type&quot;: &quot;string&quot;,\n              &quot;method&quot;: &quot;extract&quot;,\n              &quot;description&quot;: &quot;Name of the product visible in the image&quot;\n          },\n          &quot;Condition&quot;: {\n              &quot;type&quot;: &quot;string&quot;,\n              &quot;method&quot;: &quot;classify&quot;,\n              &quot;description&quot;: &quot;Condition of the product&quot;,\n              &quot;enum&quot;: [&quot;new&quot;, &quot;used&quot;, &quot;damaged&quot;]\n          },\n          &quot;Description&quot;: {\n              &quot;type&quot;: &quot;string&quot;,\n              &quot;method&quot;: &quot;generate&quot;,\n              &quot;description&quot;: &quot;Brief description of what the image shows&quot;\n          }\n          }\n      }\n  }\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"8701,8729"}}],"payload":{"tag":"li","lines":"8692,8729"}},{"content":"\n<p data-lines=\"8729,8730\">Analyze an image</p>","children":[{"content":"Install Python SDK, with <code>pip</code>  <pre>\n  pip install azure-ai-contentunderstanding\n  </pre>","children":[],"payload":{"tag":"li","lines":"8730,8734"}}],"payload":{"tag":"li","lines":"8729,8734"}},{"content":"\n<p data-lines=\"8734,8736\">Example<br>\n(To submit a request to the analyze endpoint)</p>\n  <pre><code>\n  from azure.ai.contentunderstanding import ContentUnderstandingClient\n  from azure.ai.contentunderstanding.models import AnalysisInput, AnalysisResult\n  from azure.core.credentials import AzureKeyCredential # for key-based authentication\n  from azure.identity import DefaultAzureCredential # for Entra ID authentication\n  &#xa0;\n  # Get a client\n  credential = AzureKeyCredential(key)\n  client = ContentUnderstandingClient(endpoint={FOUNDRY_ENDPOINT},\n                                      credential={KEY_OR_IDENTITY},\n                                      api_version=&quot;2025-11-01&quot;)\n  &#xa0;\n  # Analyze an image file\n  with open(&quot;my_image.png&quot;, &quot;rb&quot;) as f:\n              file_bytes = f.read()\n  &#xa0;\n  try:\n      poller = client.begin_analyze(\n          analyzer_id={ANALYSER_ID},\n          inputs=[AnalysisInput(data=file_bytes)],\n      )\n      # Get results asynchronously from poller\n      result: AnalysisResult = poller.result()\n  &#xa0;\n      # Display results\n      result_str = json.dumps(result.as_dict(), indent=2)\n      print (result_str)\n  &#xa0;\n  except Exception as ex:\n      print(f&quot;[Unexpected Error]: {ex}&quot;)\n      sys.exit(1)\n  </code></pre>","children":[{"content":"\n<p data-lines=\"8768,8770\">Result<br>\n(include the extracted content)</p>\n  <pre><code>\n  {\n      &quot;contents&quot;: [\n          {\n          &quot;markdown&quot;: &quot;Product label showing &apos;Contoso Widget Pro&apos; with serial number...&quot;,\n          &quot;fields&quot;: {\n              &quot;ProductName&quot;: {\n              &quot;type&quot;: &quot;string&quot;,\n              &quot;valueString&quot;: &quot;Contoso Widget Pro&quot;,\n              &quot;confidence&quot;: 0.95,\n              &quot;source&quot;: &quot;D(1,100,50,300,50,300,80,100,80)&quot;\n              },\n              &quot;Condition&quot;: {\n              &quot;type&quot;: &quot;string&quot;,\n              &quot;valueString&quot;: &quot;new&quot;,\n              &quot;confidence&quot;: 0.89\n              },\n              &quot;Description&quot;: {\n              &quot;type&quot;: &quot;string&quot;,\n              &quot;valueString&quot;: &quot;A silver electronic device in retail packaging with product label visible&quot;\n              }\n          }\n          }\n      ]\n  }\n  </code></pre>\n  <br>","children":[{"content":"markdown<br>\nA text representation of the image content, useful for search and RAG scenarios","children":[],"payload":{"tag":"li","lines":"8799,8801"}},{"content":"fields<br>\nExtracted field values matching your schema, each with a confidence score","children":[],"payload":{"tag":"li","lines":"8801,8803"}},{"content":"source<br>\nGrounding information showing where in the image each value was found","children":[],"payload":{"tag":"li","lines":"8803,8806"}}],"payload":{"tag":"li","lines":"8768,8806"}}],"payload":{"tag":"li","lines":"8734,8806"}},{"content":"\n<p data-lines=\"8806,8807\">Use confidence scores</p>","children":[{"content":"Each extracted field includes a<br>\nconfidence score from 0 to 1","children":[{"content":"High confidence (0.9+)<br>\nValue can be trusted for automated processing","children":[],"payload":{"tag":"li","lines":"8809,8811"}},{"content":"Medium confidence (0.7-0.9)<br>\nConsider human review for critical applications","children":[],"payload":{"tag":"li","lines":"8811,8813"}},{"content":"Low confidence (&lt;0.7)<br>\nRecommend manual verification","children":[],"payload":{"tag":"li","lines":"8813,8815"}}],"payload":{"tag":"li","lines":"8807,8815"}},{"content":"Use confidence scores to<br>\nbuild automation workflows that route","children":[{"content":"Low-confidence extractions to human reviewers","children":[],"payload":{"tag":"li","lines":"8817,8818"}},{"content":"Processing high-confidence results automatically","children":[],"payload":{"tag":"li","lines":"8818,8820"}}],"payload":{"tag":"li","lines":"8815,8820"}}],"payload":{"tag":"li","lines":"8806,8820"}},{"content":"\n<p data-lines=\"8820,8821\">Tips for better image analysis</p>","children":[{"content":"Image quality matters<br>\nHigher resolution images produce more accurate extractions","children":[],"payload":{"tag":"li","lines":"8821,8823"}},{"content":"Lighting and contrast<br>\nEnsure text and visual elements are clearly visible","children":[],"payload":{"tag":"li","lines":"8823,8825"}},{"content":"Single focus<br>\nImages with one clear subject yield better results than cluttered scenes","children":[],"payload":{"tag":"li","lines":"8825,8827"}},{"content":"Consistent orientation<br>\nUpright images are processed more reliably than rotated ones","children":[],"payload":{"tag":"li","lines":"8827,8830"}}],"payload":{"tag":"li","lines":"8820,8830"}}],"payload":{"tag":"li","lines":"8665,8830"}},{"content":"\n<p data-lines=\"8830,8831\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview\">What is Azure Content Understanding?</a>","children":[],"payload":{"tag":"li","lines":"8831,8833"}}],"payload":{"tag":"li","lines":"8830,8833"}},{"content":"\n<p data-lines=\"8833,8835\"><strong>Exercise - Analyze images with Content Understanding</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-vision/Instructions/Exercises/04-content-understanding.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"8833,8836"}}],"payload":{"tag":"h3","lines":"8568,8569"}},{"content":"5. <a href=\"https://learn.microsoft.com/en-us/training/modules/analyze-content-ai/\">Create a multimodal analysis solution with Azure Content Understanding</a>","children":[{"content":"\n<p data-lines=\"8838,8839\"><strong>Introduction</strong></p>","children":[{"content":"Modern organizations store valuable information across multiple types of content,<br>\nincluding documents, images, videos, and audio recordings.","children":[],"payload":{"tag":"li","lines":"8840,8842"}},{"content":"Extracting meaningful information from unstructured content is often complex, time-consuming, and resource-intensive.","children":[],"payload":{"tag":"li","lines":"8842,8843"}},{"content":"Traditional content analysis solutions frequently require multiple technologies to<br>\nprocess different file formats and media types.","children":[],"payload":{"tag":"li","lines":"8843,8845"}},{"content":"Microsoft Azure Content Understanding simplifies content analysis through a<br>\nunified multimodal AI service.","children":[],"payload":{"tag":"li","lines":"8845,8847"}},{"content":"The platform can analyze and extract information from content in<br>\n<strong>practically any format</strong>.","children":[],"payload":{"tag":"li","lines":"8847,8849"}},{"content":"Azure Content Understanding enables the creation of AI-powered analyzers without the<br>\nneed for separate tools for each media type.","children":[],"payload":{"tag":"li","lines":"8849,8851"}},{"content":"Multimodal AI capabilities improve efficiency by centralizing document, image, video, and<br>\naudio analysis into a single solution.","children":[],"payload":{"tag":"li","lines":"8851,8853"}},{"content":"Organizations can accelerate automation, search, analytics, and<br>\nknowledge extraction processes using structured outputs from unstructured content.","children":[],"payload":{"tag":"li","lines":"8853,8855"}},{"content":"The service reduces development complexity while improving scalability and<br>\nmaintainability for enterprise AI solutions.","children":[],"payload":{"tag":"li","lines":"8855,8858"}}],"payload":{"tag":"li","lines":"8838,8858"}},{"content":"\n<p data-lines=\"8858,8859\"><strong>What is Azure Content Understanding?</strong></p>","children":[{"content":"Multimodal content analysis","children":[{"content":"Azure Content Understanding is a generative AI service that you can<br>\nuse to extract insights and data from multiple kinds of content","children":[],"payload":{"tag":"li","lines":"8861,8863"}},{"content":"Need to provision a Microsoft Foundry resource in<br>\nAzure subscription","children":[],"payload":{"tag":"li","lines":"8863,8865"}},{"content":"Can develop and manage","children":[{"content":"In the Microsoft Foundry portal","children":[],"payload":{"tag":"li","lines":"8866,8867"}},{"content":"In Content Understanding Studio","children":[],"payload":{"tag":"li","lines":"8867,8868"}},{"content":"Using the Content Understanding API","children":[],"payload":{"tag":"li","lines":"8868,8869"}}],"payload":{"tag":"li","lines":"8865,8869"}},{"content":"Documents and forms","children":[{"content":"Can analyze documents and forms and<br>\nretrieve specific field values","children":[],"payload":{"tag":"li","lines":"8870,8872"}},{"content":"Example<br>\nExtract key data values from an invoice to<br>\nautomate payment processing","children":[],"payload":{"tag":"li","lines":"8872,8875"}}],"payload":{"tag":"li","lines":"8869,8875"}},{"content":"Images","children":[{"content":"Can analyze images to<br>\ninfer information from visuals","children":[{"content":"Charts","children":[],"payload":{"tag":"li","lines":"8878,8879"}},{"content":"Identify physical defects in products or other items","children":[],"payload":{"tag":"li","lines":"8879,8880"}},{"content":"Detect the presence of specific objects or people","children":[],"payload":{"tag":"li","lines":"8880,8881"}},{"content":"Determine other information visually","children":[],"payload":{"tag":"li","lines":"8881,8882"}}],"payload":{"tag":"li","lines":"8876,8882"}}],"payload":{"tag":"li","lines":"8875,8882"}},{"content":"Audio","children":[{"content":"Enables to automate tasks","children":[{"content":"Summarizing conference calls","children":[],"payload":{"tag":"li","lines":"8884,8885"}},{"content":"Determining sentiment of recorded<br>\ncustomer conversations","children":[],"payload":{"tag":"li","lines":"8885,8887"}},{"content":"Extracting key data from telephone messages","children":[],"payload":{"tag":"li","lines":"8887,8888"}}],"payload":{"tag":"li","lines":"8883,8888"}}],"payload":{"tag":"li","lines":"8882,8888"}},{"content":"Video","children":[{"content":"Can analyze and extract<br>\ninsights from video to","children":[{"content":"Extract key points from video conference recordings","children":[],"payload":{"tag":"li","lines":"8891,8892"}},{"content":"Summarize presentations","children":[],"payload":{"tag":"li","lines":"8892,8893"}},{"content":"Detect the presence of specific activity in security footage","children":[],"payload":{"tag":"li","lines":"8893,8895"}}],"payload":{"tag":"li","lines":"8889,8895"}}],"payload":{"tag":"li","lines":"8888,8895"}}],"payload":{"tag":"li","lines":"8860,8895"}}],"payload":{"tag":"li","lines":"8858,8895"}},{"content":"\n<p data-lines=\"8895,8896\"><strong>Create a Content Understanding analyzer</strong></p>","children":[{"content":"\n<p data-lines=\"8897,8898\">What is an <em>analyzer</em>?</p>","children":[{"content":"Solutions are based on the creation of an <em>analyzer</em>","children":[],"payload":{"tag":"li","lines":"8898,8899"}},{"content":"Trained to <strong>extract specific information</strong> from a<br>\nparticular <strong>type of content</strong> based on a<br>\nuser defined <strong>schema</strong>","children":[],"payload":{"tag":"li","lines":"8899,8902"}},{"content":"Process for creating a Content Understanding solution","children":[{"content":"1. Create a Foundry resource.","children":[],"payload":{"tag":"li","lines":"8903,8904","listIndex":1}},{"content":"2. Define a Content Understanding schema for the information to be extracted.<br>\nThis can be based on a content sample and an analyzer template.","children":[],"payload":{"tag":"li","lines":"8904,8906","listIndex":2}},{"content":"3. Build an analyzer based on the completed schema.","children":[],"payload":{"tag":"li","lines":"8906,8907","listIndex":3}},{"content":"4. Use the analyzer to extract or generate fields from new content.","children":[],"payload":{"tag":"li","lines":"8907,8908","listIndex":4}},{"content":"5. Can use minimal training data to define a schema by example","children":[],"payload":{"tag":"li","lines":"8908,8910","listIndex":5}}],"payload":{"tag":"li","lines":"8902,8910"}}],"payload":{"tag":"li","lines":"8897,8910"}},{"content":"\n<p data-lines=\"8910,8912\">Creating an analyzer with<br>\nContent Understanding Studio</p>","children":[{"content":"Provides a visual interface to create a project","children":[],"payload":{"tag":"li","lines":"8912,8913"}},{"content":"Define a Content Understanding schema","children":[],"payload":{"tag":"li","lines":"8913,8914"}},{"content":"Build and test an analyzer","children":[],"payload":{"tag":"li","lines":"8914,8915"}},{"content":"<span>&#x1f4a1;</span><mark>Only certain prebuilt models are available for use<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;directly in the Microsoft Foundry portal.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;For custom analyzer creation and testing,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;use <a href=\"https://ai.azure.com/contentunderstanding\">Content Understanding Studio</a>.</mark>","children":[],"payload":{"tag":"li","lines":"8915,8920"}}],"payload":{"tag":"li","lines":"8910,8920"}},{"content":"\n<p data-lines=\"8920,8921\">Creating a Content Understanding project</p>","children":[{"content":"Resources needed","children":[{"content":"Storage a","children":[],"payload":{"tag":"li","lines":"8922,8923"}},{"content":"Key vault resource to store","children":[{"content":"Credentials","children":[],"payload":{"tag":"li","lines":"8924,8925"}},{"content":"Keys","children":[],"payload":{"tag":"li","lines":"8925,8926"}}],"payload":{"tag":"li","lines":"8923,8926"}}],"payload":{"tag":"li","lines":"8921,8926"}},{"content":"<span>&#x1f4a1;</span><mark>Content Understanding schemas can only be created in<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Azure locations where the service is supported.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;For more information, see <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/language-region-support\">Content Understanding region and language support</a>.</mark>","children":[],"payload":{"tag":"li","lines":"8926,8930"}}],"payload":{"tag":"li","lines":"8920,8930"}},{"content":"\n<p data-lines=\"8930,8931\">Defining a schema</p>","children":[{"content":"For the content the analyzer will process, and<br>\nthe information it will extract","children":[],"payload":{"tag":"li","lines":"8931,8933"}},{"content":"Use schema editor interface","children":[],"payload":{"tag":"li","lines":"8933,8934"}},{"content":"Upload a file","children":[{"content":"Document","children":[],"payload":{"tag":"li","lines":"8935,8936"}},{"content":"Image","children":[],"payload":{"tag":"li","lines":"8936,8937"}},{"content":"Audio","children":[],"payload":{"tag":"li","lines":"8937,8938"}},{"content":"Video","children":[],"payload":{"tag":"li","lines":"8938,8939"}}],"payload":{"tag":"li","lines":"8934,8939"}},{"content":"Apply an appropriate schema template","children":[],"payload":{"tag":"li","lines":"8939,8940"}},{"content":"Define the specific fields you want<br>\nthe analyzer to identify","children":[],"payload":{"tag":"li","lines":"8940,8942"}},{"content":"<span>&#x1f4a1;</span><mark>The templates and field types available in a schema depend on the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;content type of the file on which the schema is based.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Some content types support additional optional functionality, such as<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;extracting barcodes and formulae from text in documents.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;For more information about using Content Understanding with different<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;content types, see the following articles in the product documentation:<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview\">Content Understanding document solutions</a><br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview\">Content Understanding image solutions</a><br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview\">Content Understanding audio solutions</a><br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview\">Content Understanding video solutions</a></mark>","children":[],"payload":{"tag":"li","lines":"8942,8953"}}],"payload":{"tag":"li","lines":"8930,8953"}},{"content":"\n<p data-lines=\"8953,8954\">Testing</p>","children":[{"content":"Running analysis on the sample file used to<br>\ndefine the schema or other uploaded files","children":[],"payload":{"tag":"li","lines":"8954,8956"}},{"content":"Results include the extracted field values and the<br>\nJSON format output returned by the analyzer to<br>\nclient applications","children":[],"payload":{"tag":"li","lines":"8956,8960"}}],"payload":{"tag":"li","lines":"8953,8960"}},{"content":"\n<p data-lines=\"8960,8961\">Building an analyzer</p>","children":[{"content":"Building an analyzer makes it accessible to client applications<br>\nthrough the endpoint for the Microsoft Foundry resource<br>\nassociated with your project","children":[],"payload":{"tag":"li","lines":"8961,8964"}},{"content":"Can continue to test it in Content Understanding Studio, and<br>\nrefine the schema to create new named versions<br>\nwith different capabilities","children":[],"payload":{"tag":"li","lines":"8964,8968"}}],"payload":{"tag":"li","lines":"8960,8968"}}],"payload":{"tag":"li","lines":"8895,8968"}},{"content":"\n<p data-lines=\"8968,8969\"><strong>Use the Content Understanding API</strong></p>","children":[{"content":"Using the API to analyze content","children":[{"content":"How to use","children":[{"content":"Client application submits HTTP calls to the<br>\nContent Understanding endpoint for Foundry resource","children":[],"payload":{"tag":"li","lines":"8972,8974"}},{"content":"Passing one of the authorization keys in the header","children":[],"payload":{"tag":"li","lines":"8974,8975"}},{"content":"Obtain the endpoint and keys in","children":[{"content":"Azure portal","children":[],"payload":{"tag":"li","lines":"8976,8977"}},{"content":"Microsoft Foundry portal","children":[],"payload":{"tag":"li","lines":"8977,8978"}}],"payload":{"tag":"li","lines":"8975,8978"}}],"payload":{"tag":"li","lines":"8971,8978"}},{"content":"Common uses of the API is","children":[{"content":"Submit content to an existing analyzer that<br>\nyou have previously built","children":[],"payload":{"tag":"li","lines":"8979,8981"}},{"content":"Retrieve the results of analysis","children":[],"payload":{"tag":"li","lines":"8981,8982"}},{"content":"Analysis request returns an operation ID value<br>\nthat represents an asynchronous task","children":[],"payload":{"tag":"li","lines":"8982,8984"}},{"content":"Client application must then use another request to<br>\npass the operation ID back to the endpoint","children":[],"payload":{"tag":"li","lines":"8984,8986"}},{"content":"Retrieve the operation status","children":[],"payload":{"tag":"li","lines":"8986,8987"}},{"content":"Results are returned in JSON format","children":[],"payload":{"tag":"li","lines":"8987,8988"}}],"payload":{"tag":"li","lines":"8978,8988"}},{"content":"Example  <pre><code>\n  POST {endpoint}/contentunderstanding/analyzers/{analyzer}:analyze?api-version=2025-11-01\n  {\n  &quot;inputs&quot;: [\n      {\n      &quot;url&quot;: &quot;https://host.com/doc.pdf&quot;\n      }\n  ]\n  }\n  </code></pre>","children":[{"content":"<span>&#x1f4a1;</span><mark>You can specify a URL for the content file location as shown here.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;To submit binary file data directly, use the <code>analyzeBinary</code><br>\noperation instead.</mark>","children":[],"payload":{"tag":"li","lines":"8999,9002"}},{"content":"Response  <pre><code>\n  Operation-Id: 1234abcd-1234-abcd-1234-abcd1234abcd\n  Operation-Location: {endpoint}/contentunderstanding/analyzerResults/1234abcd-1234-abcd-1234-abcd1234abcd?api-version=2025-11-01\n  {\n  &quot;id&quot;: &quot;1234abcd-1234-abcd-1234-abcd1234abcd&quot;,\n  &quot;status&quot;: &quot;NotStarted&quot;\n  }\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"9002,9011"}},{"content":"Check status  <pre><code>\n  GET {endpoint}/contentunderstanding/analyzerResults/1234abcd-1234-abcd-1234-abcd1234abcd?api-version=2025-11-01\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"9011,9015"}},{"content":"Success operation","children":[{"content":"The response contains a JSON payload<br>\nrepresenting the results of the analysis","children":[],"payload":{"tag":"li","lines":"9016,9018"}}],"payload":{"tag":"li","lines":"9015,9018"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about the Content Understanding API,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;see the <a href=\"https://learn.microsoft.com/en-us/rest/api/contentunderstanding/operation-groups\">reference documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"9018,9021"}}],"payload":{"tag":"li","lines":"8988,9021"}}],"payload":{"tag":"li","lines":"8970,9021"}}],"payload":{"tag":"li","lines":"8968,9021"}},{"content":"\n<p data-lines=\"9021,9022\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/\">Azure Content Understanding documentation</a>","children":[],"payload":{"tag":"li","lines":"9022,9024"}}],"payload":{"tag":"li","lines":"9021,9024"}},{"content":"\n<p data-lines=\"9024,9026\"><strong>Exercise - Extract information from multimodal content</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-information-extraction/Instructions/Exercises/01-content-understanding.html\">&#x2192;     saber +</a></p>","children":[],"payload":{"tag":"li","lines":"9024,9027"}}],"payload":{"tag":"h3","lines":"8836,8837"}},{"content":"6. <a href=\"https://learn.microsoft.com/en-us/training/modules/analyze-content-ai-api/\">Create an Azure Content Understanding client application</a>","children":[{"content":"\n<p data-lines=\"9029,9030\"><strong>Introduction</strong></p>","children":[{"content":"Microsoft Azure Content Understanding is a multimodal AI service<br>\ndesigned to extract information from various content formats.","children":[],"payload":{"tag":"li","lines":"9030,9032"}},{"content":"The platform supports analysis of","children":[{"content":"Documents","children":[],"payload":{"tag":"li","lines":"9033,9034"}},{"content":"Images","children":[],"payload":{"tag":"li","lines":"9034,9035"}},{"content":"Audio files","children":[],"payload":{"tag":"li","lines":"9035,9036"}},{"content":"Videos","children":[],"payload":{"tag":"li","lines":"9036,9037"}}],"payload":{"tag":"li","lines":"9032,9037"}},{"content":"Azure Content Understanding simplifies the development of AI-powered<br>\ncontent analyzers for enterprise applications.","children":[],"payload":{"tag":"li","lines":"9037,9039"}},{"content":"Developers can integrate the service into custom applications using","children":[{"content":"The Python SDK","children":[],"payload":{"tag":"li","lines":"9040,9041"}},{"content":"REST APIs","children":[],"payload":{"tag":"li","lines":"9041,9042"}}],"payload":{"tag":"li","lines":"9039,9042"}},{"content":"The module focuses on building client applications that interact<br>\nprogrammatically with Azure Content Understanding services.","children":[],"payload":{"tag":"li","lines":"9042,9044"}},{"content":"Using the Python SDK and REST API, developers can:","children":[{"content":"Submit content files for analysis","children":[],"payload":{"tag":"li","lines":"9045,9046"}},{"content":"Retrieve structured results","children":[],"payload":{"tag":"li","lines":"9046,9047"}},{"content":"Process extracted information automatically","children":[],"payload":{"tag":"li","lines":"9047,9048"}}],"payload":{"tag":"li","lines":"9044,9048"}},{"content":"The service enables automation of content processing workflows and<br>\nreduces manual data extraction efforts.","children":[],"payload":{"tag":"li","lines":"9048,9050"}},{"content":"Multimodal analysis capabilities help organizations unlock insights from<br>\nunstructured data across multiple media types.","children":[],"payload":{"tag":"li","lines":"9050,9052"}},{"content":"Programmatic integration supports scalable, flexible, and<br>\nmaintainable AI-driven solutions.","children":[],"payload":{"tag":"li","lines":"9052,9055"}}],"payload":{"tag":"li","lines":"9029,9055"}},{"content":"\n<p data-lines=\"9055,9056\"><strong>Prepare to use the AI Content Understanding API</strong></p>","children":[{"content":"\n<p data-lines=\"9057,9058\">How to start</p>","children":[{"content":"Create a <strong>Microsoft Foundry resource</strong><br>\nin the Azure portal.","children":[],"payload":{"tag":"li","lines":"9058,9060"}},{"content":"Create a <strong>Microsoft Foundry project</strong>,<br>\nwhich includes a Microsoft Foundry resource by default.","children":[],"payload":{"tag":"li","lines":"9060,9062"}},{"content":"After provisioned a Microsoft Foundry resource","children":[{"content":"The Microsoft Foundry resource <em>endpoint</em>","children":[],"payload":{"tag":"li","lines":"9063,9064"}},{"content":"One of the API <em>keys</em> associated with the endpoint","children":[],"payload":{"tag":"li","lines":"9064,9065"}},{"content":"Mcrosoft Azure Portal &gt; Resource Management &gt; Keys and Endpoint &gt; Content Understanding (tab)","children":[],"payload":{"tag":"li","lines":"9065,9067"}}],"payload":{"tag":"li","lines":"9062,9067"}}],"payload":{"tag":"li","lines":"9057,9067"}},{"content":"\n<p data-lines=\"9067,9068\">Installing the Python SDK</p>","children":[{"content":"To use the Python SDK  <pre>\n  pip install azure-ai-contentunderstanding\n  </pre>","children":[],"payload":{"tag":"li","lines":"9068,9072"}},{"content":"<span>&#x2690;</span> <mark>The Python SDK requires Python 3.9 or later.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;You can also use the REST API directly from any<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;language that supports HTTP requests.</mark>","children":[],"payload":{"tag":"li","lines":"9072,9075"}},{"content":"<span>&#x26a0;</span> <mark>Before using the Content Understanding API, you must set up<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;default model deployments for your Microsoft Foundry resource.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Content Understanding requires <code>GPT-4.1</code>, <code>GPT-4.1-mini</code>, and<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<code>text-embedding-3-large</code> model deployments.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;You can configure these in the Azure portal or by using the API.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;For more information, see <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/how-to/migration-preview-to-ga#prerequisites\">Set up model deployments</a>.</mark>","children":[],"payload":{"tag":"li","lines":"9075,9081"}},{"content":"<span>&#x1f4a1;</span> <mark>To learn more about programming with the Microsoft Foundry SDK,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;complete the<a href=\"https://learn.microsoft.com/en-us/training/modules/ai-foundry-sdk/\"> Develop an AI app with the Microsoft Foundry SDK</a> module.</mark>","children":[],"payload":{"tag":"li","lines":"9081,9084"}}],"payload":{"tag":"li","lines":"9067,9084"}}],"payload":{"tag":"li","lines":"9055,9084"}},{"content":"\n<p data-lines=\"9084,9085\"><strong>Create a Content Understanding analyzer</strong></p>","children":[{"content":"\n<p data-lines=\"9086,9087\">Defining a schema for an analyzer</p>","children":[{"content":"Analyzers are based on schemas that define the fields","children":[],"payload":{"tag":"li","lines":"9087,9088"}},{"content":"Schema is a set of fields, which can be<br>\nspecified in a JSON document","children":[],"payload":{"tag":"li","lines":"9088,9090"}},{"content":"Example  <pre><code>\n  {\n      &quot;description&quot;: &quot;Simple business card&quot;,\n      &quot;baseAnalyzerId&quot;: &quot;prebuilt-document&quot;,\n      &quot;config&quot;: {\n          &quot;returnDetails&quot;: true\n      },\n      &quot;fieldSchema&quot;: {\n          &quot;fields&quot;: {\n              &quot;ContactName&quot;: {\n                  &quot;type&quot;: &quot;string&quot;,\n                  &quot;method&quot;: &quot;extract&quot;,\n                  &quot;description&quot;: &quot;Name on business card&quot;\n              },\n              &quot;EmailAddress&quot;: {\n                  &quot;type&quot;: &quot;string&quot;,\n                  &quot;method&quot;: &quot;extract&quot;,\n                  &quot;description&quot;: &quot;Email address on business card&quot;\n              }\n          }\n      },\n      &quot;models&quot;: {\n          &quot;completion&quot;: &quot;gpt-4.1&quot;,\n          &quot;embedding&quot;: &quot;text-embedding-3-large&quot;\n      }\n  }\n  </code></pre>","children":[{"content":"Decoding","children":[{"content":"Custom analyzer schema","children":[],"payload":{"tag":"li","lines":"9119,9120"}},{"content":"Based on the pre-built document analyzer","children":[],"payload":{"tag":"li","lines":"9120,9121"}},{"content":"Describes two fields that would expect to<br>\nfind on a business card","children":[{"content":"<em>ContactName</em>","children":[{"content":"Defined as string data types","children":[],"payload":{"tag":"li","lines":"9124,9125"}},{"content":"Expected to be <em>extracted</em> from a document","children":[],"payload":{"tag":"li","lines":"9125,9126"}}],"payload":{"tag":"li","lines":"9123,9126"}},{"content":"<em>EmailAddress</em>","children":[{"content":"Defined as string data types","children":[],"payload":{"tag":"li","lines":"9127,9128"}},{"content":"Expected to be <em>extracted</em> from a document","children":[],"payload":{"tag":"li","lines":"9128,9129"}}],"payload":{"tag":"li","lines":"9126,9129"}}],"payload":{"tag":"li","lines":"9121,9129"}},{"content":"The <code>models</code> object specifies the generative models that the<br>\nanalyzer uses for processing","children":[],"payload":{"tag":"li","lines":"9129,9131"}},{"content":"<span>&#x2690;</span> <mark>example is deliberately simple, with the minimal information<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;needed to create a working analyzer.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;In reality, the schema would likely include more fields of different types,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;and the analyzer definition would include more configuration settings.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;The JSON might even include a sample document.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;See the <a href=\"https://learn.microsoft.com/en-us/rest/api/contentunderstanding/content-analyzers/create-or-replace\">Azure Content Understanding API documentation</a> for more details.</mark>","children":[],"payload":{"tag":"li","lines":"9131,9139"}}],"payload":{"tag":"li","lines":"9118,9139"}}],"payload":{"tag":"li","lines":"9090,9139"}}],"payload":{"tag":"li","lines":"9086,9139"}},{"content":"\n<p data-lines=\"9139,9140\">Using the Python SDK to create an analyzer</p>","children":[{"content":"With your analyzer definition in place,<br>\ncan use the Python SDK to create the analyzer","children":[],"payload":{"tag":"li","lines":"9140,9142"}},{"content":"<code>ContentUnderstandingClient</code> class provides a <code>begin_create_analyzer</code> method that<br>\nhandles the asynchronous creation process","children":[],"payload":{"tag":"li","lines":"9142,9144"}},{"content":"Example  <pre><code>\n  from azure.ai.contentunderstanding  import ContentUnderstandingClient\n  from azure.core.credentials         import AzureKeyCredential\n  &#xa0;\n  # Authenticate the client\n  endpoint = &quot;<your_endpoint>&quot;\n  credential = AzureKeyCredential(&quot;<your_api_key>&quot;)\n  client = ContentUnderstandingClient(endpoint=endpoint, credential=credential)\n  &#xa0;\n  # Define the analyzer\n  analyzer_name = &quot;business_card_analyser&quot;\n  analyzer_definition = {\n      &quot;description&quot;: &quot;Simple business card&quot;,\n      &quot;baseAnalyzerId&quot;: &quot;prebuilt-document&quot;,\n      &quot;config&quot;: {&quot;returnDetails&quot;: True},\n      &quot;fieldSchema&quot;: {\n          &quot;fields&quot;: {\n              &quot;ContactName&quot;: {\n                  &quot;type&quot;: &quot;string&quot;,\n                  &quot;method&quot;: &quot;extract&quot;,\n                  &quot;description&quot;: &quot;Name on business card&quot;\n              },\n              &quot;EmailAddress&quot;: {\n                  &quot;type&quot;: &quot;string&quot;,\n                  &quot;method&quot;: &quot;extract&quot;,\n                  &quot;description&quot;: &quot;Email address on business card&quot;\n              }\n          }\n      },\n      &quot;models&quot;: {\n          &quot;completion&quot;: &quot;gpt-4.1&quot;,\n          &quot;embedding&quot;: &quot;text-embedding-3-large&quot;\n      }\n  }\n  &#xa0;\n  # Create the analyzer and wait for completion\n  poller = client.begin_create_analyzer(analyzer_name, body=analyzer_definition)\n  result = poller.result()\n  print(f&quot;Analyzer created: {result.analyzer_id}&quot;)\n  </your_api_key></your_endpoint></code></pre>","children":[],"payload":{"tag":"li","lines":"9144,9186"}}],"payload":{"tag":"li","lines":"9139,9186"}},{"content":"\n<p data-lines=\"9186,9187\">Using the REST API to create an analyzer</p>","children":[{"content":"Can use the REST API directly","children":[],"payload":{"tag":"li","lines":"9187,9188"}},{"content":"The JSON data is submitted as a <code>PUT</code> request to the<br>\nendpoint with the API key in the request header to<br>\nstart the analyzer creation operation","children":[],"payload":{"tag":"li","lines":"9188,9191"}},{"content":"The response from the <code>PUT</code> request includes a <strong>Operation-Location</strong> in the<br>\nheader, which provides a <em>callback</em> URL that you can use to check on the<br>\nstatus of the request by submitting a <code>GET</code> request.","children":[],"payload":{"tag":"li","lines":"9191,9194"}},{"content":"Example  <pre><code>\n  import json\n  import requests\n  &#xa0;\n  # Get the business card schema\n  with open(&quot;card.json&quot;, &quot;r&quot;) as file:\n      schema_json = json.load(file)\n  &#xa0;\n  # Use a PUT request to submit the schema for a new analyzer\n  analyzer_name = &quot;business_card_analyser&quot;\n  &#xa0;\n  headers = {\n      &quot;Ocp-Apim-Subscription-Key&quot;: &quot;<your_api_key>&quot;,\n      &quot;Content-Type&quot;: &quot;application/json&quot;}\n  &#xa0;\n  url = f&quot;{<your_endpoint>}/contentunderstanding/analyzers/{analyzer_name}?api-version=2025-11-01&quot;\n  &#xa0;\n  response = requests.put(url, headers=headers, data=json.dumps(schema_json))\n  &#xa0;\n  # Get the response and extract the ID assigned to the operation\n  callback_url = response.headers[&quot;Operation-Location&quot;]\n  &#xa0;\n  # Use a GET request to check the status of the operation\n  result_response = requests.get(callback_url, headers=headers)\n  &#xa0;\n  # Keep polling until the operation is complete\n  status = result_response.json().get(&quot;status&quot;)\n  while status == &quot;Running&quot;:\n      result_response = requests.get(callback_url, headers=headers)\n      status = result_response.json().get(&quot;status&quot;)\n  &#xa0;\n  print(&quot;Done!&quot;)\n  </your_endpoint></your_api_key></code></pre>","children":[],"payload":{"tag":"li","lines":"9194,9229"}}],"payload":{"tag":"li","lines":"9186,9229"}}],"payload":{"tag":"li","lines":"9084,9229"}},{"content":"\n<p data-lines=\"9229,9230\"><strong>Analyze content</strong></p>","children":[{"content":"\n<p data-lines=\"9231,9232\">Using the Python SDK</p>","children":[{"content":"\n<p data-lines=\"9232,9234\">To analyze the contents of a file, you can use the<br>\nAzure Content Understanding API to submit it to the endpoint</p>","children":[],"payload":{"tag":"li","lines":"9232,9234"}},{"content":"\n<p data-lines=\"9234,9236\">Can specify the content as a URL<br>\n(for a file hosted in an Internet-accessible location)</p>","children":[],"payload":{"tag":"li","lines":"9234,9236"}},{"content":"\n<p data-lines=\"9236,9239\">Can upload binary file data directly<br>\n(for example, a <code>.pdf</code> document, a <code>.png</code> image,<br>\nan <code>.mp3</code> audio file, or an <code>.mp4</code> video file)</p>","children":[],"payload":{"tag":"li","lines":"9236,9239"}},{"content":"\n<p data-lines=\"9239,9240\">The analysis request includes the analyzer to be used.</p>","children":[],"payload":{"tag":"li","lines":"9239,9240"}},{"content":"\n<p data-lines=\"9240,9241\">Analysis is an asynchronous operation</p>","children":[],"payload":{"tag":"li","lines":"9240,9241"}},{"content":"\n<p data-lines=\"9241,9242\">After submitting the request</p>","children":[{"content":"Receive an operation ID","children":[{"content":"Use to check the status","children":[],"payload":{"tag":"li","lines":"9243,9244"}},{"content":"Retrieve the results when the<br>\noperation is complete","children":[],"payload":{"tag":"li","lines":"9244,9246"}}],"payload":{"tag":"li","lines":"9242,9246"}}],"payload":{"tag":"li","lines":"9241,9246"}},{"content":"\n<p data-lines=\"9246,9247\">Example</p>\n  <pre><code>\n  from azure.ai.contentunderstanding          import ContentUnderstandingClient\n  from azure.ai.contentunderstanding.models   import AnalysisInput\n  from azure.core.credentials                 import AzureKeyCredential\n  &#xa0;\n  # Authenticate the client\n  endpoint = &quot;<your_endpoint>&quot;\n  credential = AzureKeyCredential(&quot;<your_api_key>&quot;)\n  client = ContentUnderstandingClient(endpoint=endpoint, credential=credential)\n  &#xa0;\n  # Analyze the business card using the custom analyzer\n  analyzer_name = &quot;business_card_analyser&quot;\n  poller = client.begin_analyze(\n      analyzer_id=analyzer_name,\n      inputs=[AnalysisInput(url=&quot;https://host.com/business-card.png&quot;)]\n  )\n  &#xa0;\n  # Wait for the operation to complete and get the results\n  result = poller.result()\n  &#xa0;\n  # Extract field values from the results\n  content = result.contents[0]\n  if content.fields:\n      for field_name, field_data in content.fields.items():\n          if field_data.type == &quot;string&quot;:\n              print(f&quot;{field_name}: {field_data.value}&quot;)\n  </your_api_key></your_endpoint></code></pre>\n  <br>\n<p data-lines=\"9277,9281\"><span>&#x1f4a1;</span> <mark>The SDK&apos;s <code>begin_analyze</code> method returns a poller object.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Calling <code>.result()</code> on the poller automatically handles<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;polling until the operation completes, so you don&apos;t need to<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;write your own polling loop.</mark></p>","children":[],"payload":{"tag":"li","lines":"9246,9282"}}],"payload":{"tag":"li","lines":"9231,9282"}},{"content":"\n<p data-lines=\"9282,9283\">Using the REST API</p>","children":[{"content":"\n<p data-lines=\"9283,9285\">Client application submits HTTP calls to the<br>\nContent Understanding endpoint, passing an API key in the header</p>","children":[],"payload":{"tag":"li","lines":"9283,9285"}},{"content":"\n<p data-lines=\"9285,9286\">Example</p>\n  <pre><code>\n  import json\n  import requests\n  &#xa0;\n  ## Use a POST request to submit the file URL to the analyzer\n  analyzer_name = &quot;business_card_analyser&quot;\n  &#xa0;\n  headers = {\n          &quot;Ocp-Apim-Subscription-Key&quot;: &quot;<your_api_key>&quot;,\n          &quot;Content-Type&quot;: &quot;application/json&quot;}\n  &#xa0;\n  url = f&quot;{<your_endpoint>}/contentunderstanding/analyzers/{analyzer_name}:analyze?api-version=2025-11-01&quot;\n  &#xa0;\n  request_body = {\n      &quot;inputs&quot;: [\n          {\n              &quot;url&quot;: &quot;https://host.com/business-card.png&quot;\n          }\n      ]\n  }\n  &#xa0;\n  response = requests.post(url, headers=headers, json=request_body)\n  &#xa0;\n  # Get the response and extract the ID assigned to the analysis operation\n  response_json = response.json()\n  id_value = response_json.get(&quot;id&quot;)\n  &#xa0;\n  # Use a GET request to check the status of the analysis operation\n  result_url = f&quot;{<your_endpoint>}/contentunderstanding/analyzerResults/{id_value}?api-version=2025-11-01&quot;\n  &#xa0;\n  result_response = requests.get(result_url, headers=headers)\n  &#xa0;\n  # Keep polling until the analysis is complete\n  status = result_response.json().get(&quot;status&quot;)\n  while status == &quot;Running&quot;:\n          result_response = requests.get(result_url, headers=headers)\n          status = result_response.json().get(&quot;status&quot;)\n  &#xa0;\n  # Get the analysis results\n  if status == &quot;Succeeded&quot;:\n      result_json = result_response.json()\n  </your_endpoint></your_endpoint></your_api_key></code></pre>\n  <br>\n<p data-lines=\"9331,9333\"><span>&#x1f4a1;</span> <mark>You can specify a URL for the content file location as shown here.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0; To submit binary file data directly, use the <code>analyzeBinary</code> operation instead.</mark></p>","children":[],"payload":{"tag":"li","lines":"9285,9334"}}],"payload":{"tag":"li","lines":"9282,9334"}},{"content":"\n<p data-lines=\"9334,9335\">Processing analysis results</p>","children":[{"content":"Results depend on","children":[{"content":"The kind of content the analyzer is designed to<br>\nanalyze (for example, document, video, image, or audio).","children":[],"payload":{"tag":"li","lines":"9336,9338"}},{"content":"The schema for the analyzer.","children":[],"payload":{"tag":"li","lines":"9338,9339"}},{"content":"The contents of the file that was analyzed.","children":[],"payload":{"tag":"li","lines":"9339,9340"}}],"payload":{"tag":"li","lines":"9335,9340"}},{"content":"The response from the document-based business<br>\ncard analyzer contain","children":[{"content":"The extracted fields","children":[],"payload":{"tag":"li","lines":"9342,9343"}},{"content":"The optical character recognition (OCR) layout of the document,<br>\nincluding locations of lines of text, individual words, and<br>\nparagraphs on each page.","children":[],"payload":{"tag":"li","lines":"9343,9347"}}],"payload":{"tag":"li","lines":"9340,9347"}}],"payload":{"tag":"li","lines":"9334,9347"}},{"content":"\n<p data-lines=\"9347,9348\">Using the Python SDK</p>","children":[{"content":"The <code>AnalysisResult</code> object provides typed<br>\naccess to the results","children":[],"payload":{"tag":"li","lines":"9348,9350"}},{"content":"The <code>contents</code> property contains a list of<br>\ncontent objects with","children":[{"content":"Fields","children":[],"payload":{"tag":"li","lines":"9352,9353"}},{"content":"Markdown","children":[],"payload":{"tag":"li","lines":"9353,9354"}},{"content":"Metadata","children":[],"payload":{"tag":"li","lines":"9354,9355"}}],"payload":{"tag":"li","lines":"9350,9355"}},{"content":"Example<br>\n(extracting string field values)  <pre><code>\n  # (continued from previous SDK code example)\n  &#xa0;\n  content = result.contents[0]\n  if content.fields:\n      for field_name, field_data in content.fields.items():\n          if field_data.type == &quot;string&quot;:\n              print(f&quot;{field_name}: {field_data.value}&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"9355,9367"}}],"payload":{"tag":"li","lines":"9347,9367"}},{"content":"\n<p data-lines=\"9367,9368\">Using the REST API</p>","children":[{"content":"The response is a JSON payload that<br>\nthe application must parse","children":[],"payload":{"tag":"li","lines":"9368,9370"}},{"content":"Example  <pre><code>\n  {\n      &quot;id&quot;: &quot;00000000-0000-0000-0000-a00000000000&quot;,\n      &quot;status&quot;: &quot;Succeeded&quot;,\n      &quot;result&quot;: {\n          &quot;analyzerId&quot;: &quot;biz_card_analyser_2&quot;,\n          &quot;apiVersion&quot;: &quot;2025-11-01&quot;,\n          &quot;createdAt&quot;: &quot;2025-05-16T03:51:46Z&quot;,\n          &quot;warnings&quot;: [],\n          &quot;contents&quot;: [\n              {\n                  &quot;markdown&quot;: &quot;John Smith\\nEmail: john@contoso.com\\n&quot;,\n                  &quot;fields&quot;: {\n                      &quot;ContactName&quot;: {\n                          &quot;type&quot;: &quot;string&quot;,\n                          &quot;valueString&quot;: &quot;John Smith&quot;,\n                          &quot;spans&quot;: [\n                              {\n                                  &quot;offset&quot;: 0,\n                                  &quot;length&quot;: 10\n                              }\n                          ],\n                          &quot;confidence&quot;: 0.994,\n                          &quot;source&quot;: &quot;D(1,69,234,333,234,333,283,69,283)&quot;\n                      },\n                      &quot;EmailAddress&quot;: {\n                          &quot;type&quot;: &quot;string&quot;,\n                          &quot;valueString&quot;: &quot;john@contoso.com&quot;,\n                          &quot;spans&quot;: [\n                              {\n                                  &quot;offset&quot;: 18,\n                                  &quot;length&quot;: 16\n                              }\n                          ],\n
