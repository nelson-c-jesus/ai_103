},\n          &quot;input_audio_noise_reduction&quot;: {&quot;type&quot;: &quot;azure_deep_noise_suppression&quot;},\n          &quot;input_audio_echo_cancellation&quot;: {&quot;type&quot;: &quot;server_echo_cancellation&quot;}\n      }\n  }\n          &#xa0;\n  # Create agent with Voice Live configuration in metadata\n  agent = project_client.agents.create_version(\n      agent_name=&quot;AGENT_NAME&quot;,\n      definition=PromptAgentDefinition(\n          model=&quot;MODEL_DEPLOYMENT_NAME&quot;,\n          instructions=&quot;You are a helpful assistant.&quot;,\n      ),\n      metadata=chunk_config(json.dumps(voice_live_config))\n  )\n  print(f&quot;Agent created: {agent.name} (version {agent.version})&quot;)\n  &#xa0;\n  # Helper function for Voice Live configuration chunking (to handle 512-char metadata limit)\n  def chunk_config(config_json: str, limit: int = 512) -&gt; dict:\n      &quot;&quot;&quot;Split config into chunked metadata entries.&quot;&quot;&quot;\n      metadata = {&quot;microsoft.voice-live.configuration&quot;: config_json[:limit]}\n      remaining = config_json[limit:]\n      chunk_num = 1\n      while remaining:\n          metadata[f&quot;microsoft.voice-live.configuration.{chunk_num}&quot;] = remaining[:limit]\n          remaining = remaining[limit:]\n          chunk_num += 1\n      return metadata\n  </code><pre>\n</pre></pre>","children":[],"payload":{"tag":"li","lines":"7379,7441"}}],"payload":{"tag":"li","lines":"7375,7441"}},{"content":"\n<p data-lines=\"7441,7442\">Use your agent in a client application</p>","children":[{"content":"Need to build a client app that","children":[{"content":"1. Connects to the agent","children":[],"payload":{"tag":"li","lines":"7443,7444","listIndex":1}},{"content":"2. Configures audio hardware input and output","children":[],"payload":{"tag":"li","lines":"7444,7445","listIndex":2}},{"content":"3. Establishes a Voice live session","children":[],"payload":{"tag":"li","lines":"7445,7446","listIndex":3}},{"content":"4. Monitors audio systems for activity","children":[],"payload":{"tag":"li","lines":"7446,7447","listIndex":4}},{"content":"5. Processes events<br>\n(such as user speech input and responses from the agent)","children":[],"payload":{"tag":"li","lines":"7447,7449","listIndex":5}}],"payload":{"tag":"li","lines":"7442,7449"}},{"content":"Recommended pattern","children":[{"content":"Use Microsoft Entra ID authentication to<br>\nconnect to the agent in a Microsoft Foundry project.","children":[],"payload":{"tag":"li","lines":"7450,7452"}},{"content":"Implement a custom VoiceAssistant class that encapsulates strongly<br>\ntyped agent configuration, defines functions to configure and start the<br>\nVoice live session, and processes voice events.","children":[],"payload":{"tag":"li","lines":"7452,7455"}},{"content":"Implement a custom AudioProcessor class that encapsulates input and<br>\noutput through audio devices.","children":[],"payload":{"tag":"li","lines":"7455,7457"}},{"content":"Example<br>\n(using the PyAudio library for audio input and output)  <pre><code>\n  import os\n  import asyncio\n  import base64\n  import queue\n  from dotenv import load_dotenv\n  import pyaudio\n  from azure.identity.aio import AzureCliCredential\n  from azure.ai.voicelive.aio import connect\n  from azure.ai.voicelive.models import (\n      InputAudioFormat,\n      Modality,\n      OutputAudioFormat,\n      RequestSession,\n      ServerEventType,\n      AudioNoiseReduction,\n      AudioEchoCancellation,\n      AzureSemanticVadMultilingual\n  ) \n  &#xa0;\n  # Main program entry point\n  def main():\n      &quot;&quot;&quot;Main entry point.&quot;&quot;&quot;\n  &#xa0;\n      try:\n          # Get required configuration from environment variables\n          load_dotenv()\n          endpoint = os.environ.get(&quot;AZURE_VOICELIVE_ENDPOINT&quot;)\n          agent_name = os.environ.get(&quot;AZURE_VOICELIVE_AGENT_ID&quot;)\n          project_name = os.environ.get(&quot;AZURE_VOICELIVE_PROJECT_NAME&quot;)\n  &#xa0;\n          # Create credential for authentication\n          credential = AzureCliCredential()\n  &#xa0;\n          # Create and start the voice assistant\n          assistant = VoiceAssistant(\n              endpoint=endpoint,\n              credential=credential,\n              agent_name=agent_name,\n              project_name=project_name\n          )\n  &#xa0;\n          # Run the assistant\n          try:\n              asyncio.run(assistant.start())\n          except KeyboardInterrupt:\n              # Exit if the user enters CTRL+C\n              print(&quot;\\nGoodbye!&quot;)\n  &#xa0;\n      except Exception as e:\n          print(f&quot;An error occurred: {e}&quot;)\n  &#xa0;\n  # VoiceAssistant class\n  class VoiceAssistant:\n      &quot;&quot;&quot;Main voice assistant - coordinates the conversation&quot;&quot;&quot;\n  &#xa0;\n      def __init__(self, endpoint, credential, agent_name, project_name):\n          self.endpoint = endpoint\n          self.credential = credential\n  &#xa0;\n          # Agent configuration\n          self.agent_config = {\n              &quot;agent_name&quot;: agent_name,\n              &quot;project_name&quot;: project_name\n          }\n  &#xa0;\n      async def start(self):\n          &quot;&quot;&quot;Start the voice assistant.&quot;&quot;&quot;\n  &#xa0;\n          try:\n              # Connect the agent\n              async with connect(\n                  endpoint=self.endpoint,\n                  credential=self.credential,\n                  api_version=&quot;2026-01-01-preview&quot;,\n                  agent_config=self.agent_config\n              ) as connection:\n                  self.connection = connection\n  &#xa0;\n                  # Initialize audio processor\n                  self.audio_processor = AudioProcessor(connection)\n  &#xa0;\n                  # Configure the session\n                  await self.setup_session()\n  &#xa0;\n                  # Start audio I/O \n                  self.audio_processor.start_playback()\n                  print(&quot;\\nVoice session started...&quot;)\n                  print(&quot;Press Ctrl+C to exit\\n&quot;)\n  &#xa0;\n                  # Process events\n                  await self.process_events()\n  &#xa0;\n          finally:\n              if hasattr(self, &apos;audio_processor&apos;):\n                  self.audio_processor.shutdown()\n  &#xa0;\n      async def setup_session(self):\n          &quot;&quot;&quot;Configure the session with audio settings.&quot;&quot;&quot;\n  &#xa0;\n          session_config = RequestSession(\n              # Enable both text and audio\n              modalities=[Modality.TEXT, Modality.AUDIO],\n  &#xa0;\n              # Audio format (16-bit PCM at 24kHz)\n              input_audio_format=InputAudioFormat.PCM16,\n              output_audio_format=OutputAudioFormat.PCM16,\n  &#xa0;\n              # Voice activity detection (when to detect speech)\n              turn_detection=AzureSemanticVadMultilingual(),\n  &#xa0;\n              # Prevent echo from speaker feedback\n              input_audio_echo_cancellation=AudioEchoCancellation(),\n  &#xa0;\n              # Reduce background noise\n              input_audio_noise_reduction=AudioNoiseReduction(type=&quot;azure_deep_noise_suppression&quot;)\n          )\n  &#xa0;\n          await self.connection.session.update(session=session_config)\n          print(&quot;Session configured&quot;)\n  &#xa0;\n      async def process_events(self):\n          &quot;&quot;&quot;Process events from the VoiceLive service.&quot;&quot;&quot;\n  &#xa0;\n          # Listen for events from the service\n          async for event in self.connection:\n              await self.handle_event(event)\n  &#xa0;\n      async def handle_event(self, event):\n          &quot;&quot;&quot;Handle different event types from the service.&quot;&quot;&quot;\n  &#xa0;\n          # Session is ready - start capturing audio\n          if event.type == ServerEventType.SESSION_UPDATED:\n              print(f&quot;Connected to agent: {event.session.agent.name}&quot;)\n              self.audio_processor.start_capture()\n  &#xa0;\n          # User speech was transcribed\n          elif event.type == ServerEventType.CONVERSATION_ITEM_INPUT_AUDIO_TRANSCRIPTION_COMPLETED:\n              print(f&apos;You: {event.get(&quot;transcript&quot;, &quot;&quot;)}&apos;)\n  &#xa0;\n          # Agent is responding with audio transcript\n          elif event.type == ServerEventType.RESPONSE_AUDIO_TRANSCRIPT_DONE:\n              print(f&apos;Agent: {event.get(&quot;transcript&quot;, &quot;&quot;)}&apos;)\n  &#xa0;\n          # User started speaking (interrupt any playing audio)\n          elif event.type == ServerEventType.INPUT_AUDIO_BUFFER_SPEECH_STARTED:\n              self.audio_processor.clear_playback_queue()\n              print(&quot;Listening...&quot;)\n  &#xa0;\n          # User stopped speaking\n          elif event.type == ServerEventType.INPUT_AUDIO_BUFFER_SPEECH_STOPPED:\n              print(&quot;Thinking...&quot;)\n  &#xa0;\n          # Receiving audio response chunks\n          elif event.type == ServerEventType.RESPONSE_AUDIO_DELTA:\n              self.audio_processor.queue_audio(event.delta)\n  &#xa0;\n          # Audio response complete\n          elif event.type == ServerEventType.RESPONSE_AUDIO_DONE:\n              print(&quot;Response complete\\n&quot;)\n  &#xa0;\n          # Handle errors\n          elif event.type == ServerEventType.ERROR:\n              print(f&quot;Error: {event.error.message}&quot;)\n  &#xa0;\n  # AudioProcessor class\n  class AudioProcessor:\n      &quot;&quot;&quot;Handles audio input (microphone) and output (speakers) &quot;&quot;&quot;\n  &#xa0;\n      def __init__(self, connection):\n          self.connection = connection\n          self.audio = pyaudio.PyAudio()\n  &#xa0;\n          # Audio settings: 24kHz, 16-bit PCM, mono\n          self.format = pyaudio.paInt16\n          self.channels = 1\n          self.rate = 24000\n          self.chunk_size = 1200  # 50ms chunks\n  &#xa0;\n          # Streams for input and output\n          self.input_stream = None\n          self.output_stream = None\n          self.playback_queue = queue.Queue()\n  &#xa0;\n      def start_capture(self):\n          &quot;&quot;&quot;Start capturing audio from the microphone.&quot;&quot;&quot;\n  &#xa0;\n          def capture_callback(in_data, frame_count, time_info, status):\n              # Convert audio to base64 and send to VoiceLive\n              audio_base64 = base64.b64encode(in_data).decode(&quot;utf-8&quot;)\n              asyncio.run_coroutine_threadsafe(\n                  self.connection.input_audio_buffer.append(audio=audio_base64),\n                  self.loop\n              )\n              return (None, pyaudio.paContinue)\n  &#xa0;\n          # Store event loop for use in callback thread\n          self.loop = asyncio.get_event_loop()\n  &#xa0;\n          self.input_stream = self.audio.open(\n              format=self.format,\n              channels=self.channels,\n              rate=self.rate,\n              input=True,\n              frames_per_buffer=self.chunk_size,\n              stream_callback=capture_callback\n          )\n          print(&quot;Microphone started&quot;)\n  &#xa0;\n      def start_playback(self):\n          &quot;&quot;&quot;Start audio playback system.&quot;&quot;&quot;\n  &#xa0;\n          remaining = bytes()\n  &#xa0;\n          def playback_callback(in_data, frame_count, time_info, status):\n              nonlocal remaining\n  &#xa0;\n              # Calculate bytes needed\n              bytes_needed = frame_count * pyaudio.get_sample_size(pyaudio.paInt16)\n              output = remaining[:bytes_needed]\n              remaining = remaining[bytes_needed:]\n  &#xa0;\n              # Get more audio from queue if needed\n              while len(output) &lt; bytes_needed:\n                  try:\n                      audio_data = self.playback_queue.get_nowait()\n                      if audio_data is None:  # End signal\n                          break\n                      output += audio_data\n                  except queue.Empty:\n                      # Pad with silence if no audio available\n                      output += bytes(bytes_needed - len(output))\n                      break\n  &#xa0;\n              # Keep any extra for next callback\n              if len(output) &gt; bytes_needed:\n                  remaining = output[bytes_needed:]\n                  output = output[:bytes_needed]\n  &#xa0;\n              return (output, pyaudio.paContinue)\n  &#xa0;\n          self.output_stream = self.audio.open(\n              format=self.format,\n              channels=self.channels,\n              rate=self.rate,\n              output=True,\n              frames_per_buffer=self.chunk_size,\n              stream_callback=playback_callback\n          )\n          print(&quot;Speakers ready&quot;)\n  &#xa0;\n      def queue_audio(self, audio_data):\n          &quot;&quot;&quot;Add audio data to the playback queue.&quot;&quot;&quot;\n          self.playback_queue.put(audio_data)\n  &#xa0;\n      def clear_playback_queue(self):\n          &quot;&quot;&quot;Clear any pending audio (used when user interrupts).&quot;&quot;&quot;\n          while not self.playback_queue.empty():\n              try:\n                  self.playback_queue.get_nowait()\n              except queue.Empty:\n                  break\n  &#xa0;\n      def shutdown(self):\n          &quot;&quot;&quot;Clean up audio resources.&quot;&quot;&quot;\n          if self.input_stream:\n              self.input_stream.stop_stream()\n              self.input_stream.close()\n  &#xa0;\n          if self.output_stream:\n              self.playback_queue.put(None)  # Signal end\n              self.output_stream.stop_stream()\n              self.output_stream.close()\n  &#xa0;\n          self.audio.terminate()\n          print(&quot;Audio stopped&quot;)\n  &#xa0;\n  if __name__ == &quot;__main__&quot;:\n      main()\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"7457,7740"}}],"payload":{"tag":"li","lines":"7449,7740"}}],"payload":{"tag":"li","lines":"7441,7740"}}],"payload":{"tag":"li","lines":"7343,7740"}},{"content":"\n<p data-lines=\"7740,7741\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/cognitive-services/speech-service/\">What is the Speech service?</a>","children":[],"payload":{"tag":"li","lines":"7741,7742"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to-customize\">How to customize voice live input and output</a>","children":[],"payload":{"tag":"li","lines":"7742,7744"}}],"payload":{"tag":"li","lines":"7740,7744"}},{"content":"\n<p data-lines=\"7744,7746\"><strong>Exercise - Develop a Voice Live agent</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-language/Instructions/Exercises/06-voice-live-agent.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"7744,7748"}}],"payload":{"tag":"h3","lines":"7049,7050"}},{"content":"7. <a href=\"https://learn.microsoft.com/en-us/training/modules/translate-text-speech/\">Translate text and speech with Microsoft Foundry Tools</a>","children":[{"content":"\n<p data-lines=\"7751,7752\"><strong>Introduction</strong></p>","children":[{"content":"AI-Powered Translation Solutions","children":[{"content":"The Global Communication Challenge<br>\nAs organizations expand globally, the ability to exchange information seamlessly across<br>\ndifferent languages becomes a critical business requirement.","children":[],"payload":{"tag":"li","lines":"7754,7757"}},{"content":"Limitations of Traditional Translation<br>\nManual translation is a specialized skill that can be highly time-consuming and expensive to<br>\nscale for enterprise-level demands.","children":[],"payload":{"tag":"li","lines":"7757,7760"}},{"content":"The Role of Machine Translation<br>\nAutomated translation reduces these barriers but requires highly sophisticated software<br>\ncapable of grasping complex linguistic nuances, grammatical rules, and cultural idioms.","children":[],"payload":{"tag":"li","lines":"7760,7763"}},{"content":"AI as a Translation Engine<br>\nModern solutions place AI models at the core of the translation process, enabling both<br>\ntext-based document translation and real-time speech conversion.","children":[],"payload":{"tag":"li","lines":"7763,7766"}},{"content":"Module Objectives<br>\nIn this module, you will learn to leverage the Microsoft Foundry ecosystem to design,<br>\nbuild, and deploy robust, AI-powered translation solutions that overcome traditional language barriers.","children":[],"payload":{"tag":"li","lines":"7766,7770"}}],"payload":{"tag":"li","lines":"7753,7770"}}],"payload":{"tag":"li","lines":"7751,7770"}},{"content":"\n<p data-lines=\"7770,7771\"><strong>Translation in Microsoft Foundry</strong></p>","children":[{"content":"How translations works in Microsoft Foundry","children":[{"content":"Comprehensive multi-language translation solutions<br>\ngenerally require specialized models","children":[],"payload":{"tag":"li","lines":"7773,7775"}},{"content":"Support for translation through Foundry Tools","children":[{"content":"Azure Translator in Foundry Tools<br>\nA comprehensive translation service for text, with a wide range of<br>\nsupported languages and the ability to create custom translation models.","children":[],"payload":{"tag":"li","lines":"7776,7779"}},{"content":"Azure Speech in Foundry Tools<br>\nA suite of speech-related tools, including speech-to-text and speech-to-speech<br>\ntranslation in multiple languages simultaneously.","children":[],"payload":{"tag":"li","lines":"7779,7782"}}],"payload":{"tag":"li","lines":"7775,7782"}},{"content":"Are accessible through a Microsoft Foundry resource endpoint","children":[],"payload":{"tag":"li","lines":"7782,7783"}},{"content":"Provide extensive APIs","children":[],"payload":{"tag":"li","lines":"7783,7784"}},{"content":"Can be used with language-specific SDKs","children":[],"payload":{"tag":"li","lines":"7784,7786"}}],"payload":{"tag":"li","lines":"7772,7786"}}],"payload":{"tag":"li","lines":"7770,7786"}},{"content":"\n<p data-lines=\"7786,7787\"><strong>Translate text</strong></p>","children":[{"content":"\n<p data-lines=\"7788,7789\">What is Azure Translator</p>","children":[{"content":"Provides an API for translating text between<br>\nover 90 supported languages","children":[],"payload":{"tag":"li","lines":"7789,7791"}},{"content":"Can","children":[{"content":"Translate or transliterate text using the default<br>\ntranslation model or a large language model (LLM).","children":[],"payload":{"tag":"li","lines":"7792,7794"}},{"content":"Translate documents, synchronously or asynchronously,<br>\nwhile maintaining document structure.","children":[],"payload":{"tag":"li","lines":"7794,7796"}},{"content":"Use custom translation models to translate<br>\ndomain-specific terms.","children":[],"payload":{"tag":"li","lines":"7796,7798"}}],"payload":{"tag":"li","lines":"7791,7798"}},{"content":"<span>&#x1f4a1;</span><mark>Find out more about the full range of Azure Translator capabilities in the <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/translator\">Azure Translator in Foundry Tools documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"7798,7801"}}],"payload":{"tag":"li","lines":"7788,7801"}},{"content":"\n<p data-lines=\"7801,7802\">Use Azure Translator in the Microsoft Foundry portal</p>","children":[{"content":"Playgrounds for","children":[{"content":"Text translation","children":[],"payload":{"tag":"li","lines":"7803,7804"}},{"content":"Document translation","children":[],"payload":{"tag":"li","lines":"7804,7806"}}],"payload":{"tag":"li","lines":"7802,7806"}}],"payload":{"tag":"li","lines":"7801,7806"}},{"content":"\n<p data-lines=\"7806,7807\">Use Azure Translator in application code</p>","children":[{"content":"Can use the <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/reference/rest-api-guide\">REST API</a> to call Azure Translator functions","children":[],"payload":{"tag":"li","lines":"7807,7808"}},{"content":"Can use one of the SDKs","children":[{"content":"<a href=\"https://pypi.org/project/azure-ai-translation-text/1.0.1/\">Azure Translator Text Translation Client for Python</a>","children":[],"payload":{"tag":"li","lines":"7809,7810"}},{"content":"<a href=\"https://www.nuget.org/packages/Azure.AI.Translation.Text/1.0.0\">Azure Translator Text Translation Client for Microsoft .NET</a>","children":[],"payload":{"tag":"li","lines":"7810,7811"}},{"content":"<a href=\"https://mvnrepository.com/artifact/com.azure/azure-ai-translation-text/1.0.0\">Azure Translator Text Translation Client for Java</a>","children":[],"payload":{"tag":"li","lines":"7811,7812"}},{"content":"<a href=\"https://www.npmjs.com/package/@azure-rest/ai-translation-text/v/1.0.0\">Azure Translator Text Translation Client for JavaScript</a>","children":[],"payload":{"tag":"li","lines":"7812,7814"}}],"payload":{"tag":"li","lines":"7808,7814"}}],"payload":{"tag":"li","lines":"7806,7814"}},{"content":"\n<p data-lines=\"7814,7815\">Connect to an Azure Translator resource</p>","children":[{"content":"Azure Translator APIs are served through REST endpoints","children":[],"payload":{"tag":"li","lines":"7815,7816"}},{"content":"The client must make an authenticated connection","children":[],"payload":{"tag":"li","lines":"7816,7817"}},{"content":"Endpoint can be","children":[{"content":"The Azure Translator <strong>global</strong> endpoint<br>\n<code>api.cognitive.microsofttranslator.com</code>","children":[],"payload":{"tag":"li","lines":"7818,7820"}},{"content":"Azure Translator <strong>regional</strong> endpoints<br>\nThese endpoints include","children":[{"content":"<code>api-nam.cognitive.microsofttranslator.com</code>","children":[],"payload":{"tag":"li","lines":"7822,7823"}},{"content":"<code>api-apc.cognitive.microsofttranslator.com</code>","children":[],"payload":{"tag":"li","lines":"7823,7824"}},{"content":"<code>api-eur.cognitive.microsofttranslator.com</code>","children":[],"payload":{"tag":"li","lines":"7824,7825"}}],"payload":{"tag":"li","lines":"7820,7825"}},{"content":"Foundry resource endpoints<br>\n<code>{foundry-resource-name}.cognitiveservices.azure.com/</code>","children":[],"payload":{"tag":"li","lines":"7825,7827"}}],"payload":{"tag":"li","lines":"7817,7827"}},{"content":"Example  <pre><code>\n  from azure.core.credentials import AzureKeyCredential\n  from azure.ai.translation.text import *\n  &#xa0;\n  key_credential = AzureKeyCredential(&quot;FOUNDRY_KEY&quot;)\n  &#xa0;\n  # Connect to a Foundry resource endpoint\n  client = TextTranslationClient(credential=key_credential, endpoint=&quot;FOUNDRY_ENDPOINT&quot;)\n  &#xa0;\n  # Or connect using a region\n  client = TextTranslationClient(credential=key_credential, region=&quot;FOUNDRY_REGION&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"7827,7840"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about the <strong>TextTranslationClient</strong> constructor, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/python/api/azure-ai-translation-text/azure.ai.translation.text.texttranslationclient#constructor\">Azure Translator Python SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"7840,7843"}}],"payload":{"tag":"li","lines":"7814,7843"}},{"content":"\n<p data-lines=\"7843,7844\">Determine available languages</p>","children":[{"content":"Azure Translator supports over 90 languages","children":[],"payload":{"tag":"li","lines":"7844,7845"}},{"content":"Example<br>\n(list of available languages for translation)  <pre><code>\n  languages = client.get_supported_languages(scope=&quot;translation&quot;)\n  print(&quot;{} languages supported:&quot;.format(len(languages.translation)))\n  for language in languages.translation.keys():\n      print(languages.translation[language].name + &quot; (&quot; + language + &quot;)&quot;)\n  </code></pre>","children":[{"content":"Result<br>\n(name and ISO code for each language)  <pre>\n  137 languages supported:\n  Afrikaans (af)\n  Amharic (am)\n  Arabic (ar)\n  Assamese (as)\n  Azerbaijani (az)\n  Bashkir (ba)\n  Belarusian (be)\n  Bulgarian (bg)\n  ...\n  </pre>","children":[],"payload":{"tag":"li","lines":"7853,7867"}}],"payload":{"tag":"li","lines":"7845,7867"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about the <strong>get_supported_language</strong> method, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/python/api/azure-ai-translation-text/azure.ai.translation.text.texttranslationclient#azure-ai-translation-text-texttranslationclient-get-supported-languages\">Azure Translator Python SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"7867,7870"}}],"payload":{"tag":"li","lines":"7843,7870"}},{"content":"\n<p data-lines=\"7870,7871\">Translate text</p>","children":[{"content":"Use <code>translate</code> method","children":[{"content":"Source text is passed into the method as a list of <strong>InputTextItem</strong> objects,<br>\neach containing a text string to be translated.","children":[],"payload":{"tag":"li","lines":"7872,7874"}},{"content":"You can optionally specify a <strong>from_language</strong> parameter with the ISO code for the<br>\nsource language (for example, &quot;en&quot;); or you can omit this parameter to have<br>\nAzure Translator automatically detect the source language.","children":[],"payload":{"tag":"li","lines":"7874,7877"}},{"content":"Target languages as specified as a list of language codes in the<br>\n<strong>to_language</strong> parameter - Azure Translator will return a translation for<br>\neach valid language code.","children":[],"payload":{"tag":"li","lines":"7877,7880"}}],"payload":{"tag":"li","lines":"7871,7880"}},{"content":"Example  <pre><code>\n  input_text_elements = [InputTextItem(text=&quot;Hola&quot;), InputTextItem(text=&quot;&#x3053;&#x3093;&#x306b;&#x3061;&#x306f;&quot;)]\n  translation_results = client.translate(body=input_text_elements, to_language=[&quot;fr&quot;, &quot;en&quot;])\n  idx = 0\n  for translation in translation_results:\n      input_text = input_text_elements[idx].text\n      idx += 1\n      sourceLanguage = translation.detected_language\n      for translated_text in translation.translations:\n          print(f&quot;&apos;{input_text}&apos; was translated from {sourceLanguage.language} to {translated_text.to} as &apos;{translated_text.text}&apos;.&quot;)\n  </code></pre>","children":[{"content":"Result  <pre>\n  &apos;Hola&apos; was translated from es to fr as &apos;Bonjour&apos;.\n  &apos;Hola&apos; was translated from es to en as &apos;Hello&apos;.\n  &apos;&#x3053;&#x3093;&#x306b;&#x3061;&#x306f;&apos; was translated from ja to fr as &apos;Bonjour&apos;.\n  &apos;&#x3053;&#x3093;&#x306b;&#x3061;&#x306f;&apos; was translated from ja to en as &apos;Hello&apos;.\n  </pre>","children":[],"payload":{"tag":"li","lines":"7892,7899"}}],"payload":{"tag":"li","lines":"7880,7899"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about the **translate ** method, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/python/api/azure-ai-translation-text/azure.ai.translation.text.texttranslationclient#azure-ai-translation-text-texttranslationclient-translate\">Azure Translator Python SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"7899,7902"}}],"payload":{"tag":"li","lines":"7870,7902"}},{"content":"\n<p data-lines=\"7902,7903\">Transliterate text</p>","children":[{"content":"When want to transliterate it to a different script<br>\n(for example to render the Japanese words in Latin script)","children":[],"payload":{"tag":"li","lines":"7903,7905"}},{"content":"Example  <pre><code>\n  source_text = &quot;&#x3053;&#x3093;&#x306b;&#x3061;&#x306f;&quot;\n  input_text_elements = [InputTextItem(text=source_text)]\n  transliteration_results = client.transliterate(body=input_text_elements, language=&quot;ja&quot;,\n                                              from_script=&quot;Jpan&quot;, to_script=&quot;Latn&quot;)\n  for transliteration in transliteration_results:\n      sourceScript = transliteration.script\n      targetScript = transliteration.text\n      print(f&quot;&apos;{source_text}&apos; was transliterated into {sourceScript} as {targetScript}.&quot;)\n  </code></pre>","children":[{"content":"Result  <pre>\n  &apos;&#x3053;&#x3093;&#x306b;&#x3061;&#x306f;&apos; was transliterated into Latn as Kon&apos;nichiwa&#x200b;.\n  </pre>","children":[],"payload":{"tag":"li","lines":"7916,7920"}}],"payload":{"tag":"li","lines":"7905,7920"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about the <strong>transliterate</strong> method, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/python/api/azure-ai-translation-text/azure.ai.translation.text.texttranslationclient#azure-ai-translation-text-texttranslationclient-transliterate\">Azure Translator Python SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"7920,7923"}}],"payload":{"tag":"li","lines":"7902,7923"}}],"payload":{"tag":"li","lines":"7786,7923"}},{"content":"\n<p data-lines=\"7923,7924\"><strong>Translate speech</strong></p>","children":[{"content":"\n<p data-lines=\"7925,7926\">Use Azure Speech translation in application code</p>","children":[{"content":"The <strong>Speech Translation API</strong> enables you to build solutions that<br>\ntranslate spoken input and return the translation as text or speech","children":[],"payload":{"tag":"li","lines":"7926,7928"}},{"content":"Can use from your application code through the<br>\n<strong>TranslationRecognizer</strong> object","children":[],"payload":{"tag":"li","lines":"7928,7930"}},{"content":"Can create by connecting to your Azure Speech<br>\nresource using a <strong>SpeechTranslationConfig</strong> object","children":[],"payload":{"tag":"li","lines":"7930,7933"}}],"payload":{"tag":"li","lines":"7925,7933"}},{"content":"\n<p data-lines=\"7933,7934\">Connect to an Azure Speech resource</p>","children":[{"content":"To use the Azure Speech Translation API in client code","children":[],"payload":{"tag":"li","lines":"7934,7935"}},{"content":"Must use a SpeechTranslationConfig object","children":[],"payload":{"tag":"li","lines":"7935,7936"}},{"content":"To connect to an Azure Speech resource","children":[],"payload":{"tag":"li","lines":"7936,7937"}},{"content":"Can connect by specifying the relevant <strong>endpoint</strong> or<br>\n<strong>region</strong> for your resource","children":[],"payload":{"tag":"li","lines":"7937,7939"}},{"content":"Example  <pre><code>\n  import azure.cognitiveservices.speech as speech_sdk\n  &#xa0;\n  # Connect to a Foundry resource endpoint\n  translation_cfg = speech_sdk.translation.SpeechTranslationConfig(\n                      subscription=&quot;FOUNDRY_KEY&quot;, endpoint=&quot;FOUNDRY_ENDPOINT&quot;)\n  &#xa0;\n  # Or connect using a region\n  translation_cfg = speech_sdk.translation.SpeechTranslationConfig(\n                      subscription=&quot;FOUNDRY_KEY&quot;, region=&quot;FOUNDRY_REGION&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"7939,7951"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about the <strong>SpeechTranslationConfig</strong> constructor, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/python/api/azure-cognitiveservices-speech/azure.cognitiveservices.speech.translation.speechtranslationconfig#constructor\">Azure Speech Python SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"7951,7954"}}],"payload":{"tag":"li","lines":"7933,7954"}},{"content":"\n<p data-lines=\"7954,7955\">Configure translation languages and input</p>","children":[{"content":"Azure Speech can translate spoken audio input to<br>\none or more languages","children":[],"payload":{"tag":"li","lines":"7955,7957"}},{"content":"Use the <strong>SpeechTranslationConfig</strong> object to configure the source and target languages","children":[],"payload":{"tag":"li","lines":"7957,7958"}},{"content":"Use an <strong>AudioConfig</strong> object to specify the source audio stream","children":[],"payload":{"tag":"li","lines":"7958,7959"}},{"content":"Example<br>\n(Configures the <strong>SpeechTranslationConfig</strong> object for translation<br>\nFrom US English (en-US) to French (fr) and Japanese (ja)<br>\nUses an <strong>AudioConfig</strong> object to specify the source audio as<br>\ncoming from the default system microphone)   <pre><code>\n  # Configure languages\n  translation_cfg.speech_recognition_language = &apos;en-US&apos;\n  translation_cfg.add_target_language(&apos;fr&apos;)\n  translation_cfg.add_target_language(&apos;ja&apos;)\n  print(&apos;Ready to translate from&apos;,translation_cfg.speech_recognition_language)\n  &#xa0;\n  # Configure audio source\n  audio_cfg = speech_sdk.AudioConfig(use_default_microphone=True)\n   </code></pre>","children":[],"payload":{"tag":"li","lines":"7959,7974"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about the <strong>AudioConfig</strong> class, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/python/api/azure-cognitiveservices-speech/azure.cognitiveservices.speech.audio.audioconfig\">Azure Speech Python SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"7974,7977"}}],"payload":{"tag":"li","lines":"7954,7977"}},{"content":"\n<p data-lines=\"7977,7978\">Translate speech to text</p>","children":[{"content":"Translate spoken input using a <strong>TranslationRecognizer</strong> object","children":[],"payload":{"tag":"li","lines":"7978,7979"}},{"content":"Example  <pre><code>\n  # Get a TranslationRecognizr object\n  translator = speech_sdk.translation.TranslationRecognizer(translation_config=translation_cfg,\n                                                          audio_config=audio_cfg)\n  # Get input from mic and translate\n  print(&quot;Speak now...&quot;)\n  translation_results = translator.recognize_once_async().get()\n  print(f&quot;Translating &apos;{translation_results.text}&apos;&quot;)\n  &#xa0;\n  # Print each translation\n  translations = translation_results.translations\n  for translation_language in translations:\n      print(f&quot;{translation_language}: &apos;{translations[translation_language]}&apos;&quot;)\n  </code></pre>","children":[{"content":"Result<br>\n(saying &quot;hello&quot; into the microphone)  <pre>\n  Speak now...\n  Translating &apos;Hello.&apos;\n  fr: &apos;Bonjour.&apos;\n  ja: &apos;&#x3053;&#x3093;&#x306b;&#x3061;&#x306f;&#x3002;&apos;\n  </pre>","children":[],"payload":{"tag":"li","lines":"7994,8002"}}],"payload":{"tag":"li","lines":"7979,8002"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about the **TranslationRecognizer ** class, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/python/api/azure-cognitiveservices-speech/azure.cognitiveservices.speech.translation.translationrecognizer\">Azure Speech Python SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"8002,8005"}}],"payload":{"tag":"li","lines":"7977,8005"}},{"content":"\n<p data-lines=\"8005,8006\">Synthesize translations as speech</p>","children":[{"content":"Implement speech-to-speech translation by","children":[{"content":"Manual synthesis","children":[{"content":"Manual synthesis is a straightforward way to<br>\nsynthesize the results of speech translation","children":[],"payload":{"tag":"li","lines":"8008,8010"}},{"content":"Is the combination of two separate operations","children":[{"content":"1. Use a <strong>TranslationRecognizer</strong> to translate spoken input into<br>\ntext transcriptions in one or more target languages.","children":[],"payload":{"tag":"li","lines":"8011,8013","listIndex":1}},{"content":"2. Iterate through the <strong>Translations</strong> in the result of the translation operation,<br>\nusing a <strong>SpeechSynthesizer</strong> to synthesize an audio stream for each language.","children":[],"payload":{"tag":"li","lines":"8013,8015","listIndex":2}}],"payload":{"tag":"li","lines":"8010,8015"}},{"content":"Example  <pre><code>\n  import azure.cognitiveservices.speech as speech_sdk\n  &#xa0;\n  # Configure translation\n  translation_cfg = speech_sdk.translation.SpeechTranslationConfig(subscription=&quot;FOUNDRY_KEY&quot;,\n                                                                  endpoint=&quot;FOUNDRY_ENDPOINT&quot;)\n  translation_cfg.speech_recognition_language = &apos;en-US&apos;\n  translation_cfg.add_target_language(&apos;fr&apos;)\n  translation_cfg.add_target_language(&apos;ja&apos;)\n  audio_cfg = speech_sdk.AudioConfig(use_default_microphone=True)\n  &#xa0;\n  # Configure speech synthesis\n  speech_cfg = speech_sdk.SpeechConfig(subscription=&quot;FOUNDRY_KEY&quot;, \n                                      endpoint=&quot;FOUNDRY_ENDPOINT&quot;)\n  audio_out_cfg = speech_sdk.audio.AudioOutputConfig(use_default_speaker=True)\n  voices = {\n          &quot;fr&quot;: &quot;fr-FR-HenriNeural&quot;,\n          &quot;ja&quot;: &quot;ja-JP-NanamiNeural&quot;\n  }\n  &#xa0;\n  # Get trsnslations\n  translator = speech_sdk.translation.TranslationRecognizer(translation_config=translation_cfg,\n                                                          audio_config=audio_cfg)\n  print(&quot;Speak now...&quot;)\n  translation_results = translator.recognize_once_async().get()\n  print(f&quot;Translating &apos;{translation_results.text}&apos;&quot;)\n  &#xa0;\n  # process the translation results\n  translations = translation_results.translations\n  for translation_language in translations:\n  &#xa0;\n      # Print ressults\n      print(f&quot;{translation_language}: &apos;{translations[translation_language]}&apos;&quot;)\n  &#xa0;\n      # Speak results\n      speech_cfg.speech_synthesis_voice_name = voices.get(translation_language)\n      speech_synthesizer = speech_sdk.SpeechSynthesizer(speech_cfg, audio_out_cfg)\n      speak = speech_synthesizer.speak_text_async(translations[translation_language]).get()\n  &#xa0;\n      # CHeck for speech failure\n      if speak.reason != speech_sdk.ResultReason.SynthesizingAudioCompleted:\n          print(speak.reason)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"8015,8059"}},{"content":"Need to create a <strong>SpeechConfig</strong> object for the speech synthesis API","children":[],"payload":{"tag":"li","lines":"8059,8060"}},{"content":"Need to create an <strong>AudioConfig</strong> to direct the spoken output to the default speaker","children":[],"payload":{"tag":"li","lines":"8060,8061"}},{"content":"Can also specify language-specific voices to optimize pronunciation","children":[],"payload":{"tag":"li","lines":"8061,8062"}}],"payload":{"tag":"li","lines":"8007,8062"}},{"content":"Event-based synthesis","children":[{"content":"Translating from one source language into a<br>\nsingle target language","children":[],"payload":{"tag":"li","lines":"8063,8065"}},{"content":"Use event-based synthesis to capture the<br>\ntranslation as an audio stream","children":[],"payload":{"tag":"li","lines":"8065,8067"}},{"content":"Need to","children":[{"content":"Specify the desired voice for the translated speech in the <strong>TranslationConfig</strong>.","children":[],"payload":{"tag":"li","lines":"8068,8069"}},{"content":"Create an event handler for the <strong>TranslationRecognizer</strong> object&apos;s <strong>Synthesizing</strong> event.","children":[],"payload":{"tag":"li","lines":"8069,8070"}},{"content":"In the event handler, use the <strong>GetAudio()</strong> method of the <strong>Result</strong> parameter to<br>\nretrieve the byte stream of translated audio.","children":[],"payload":{"tag":"li","lines":"8070,8072"}}],"payload":{"tag":"li","lines":"8067,8072"}},{"content":"<span>&#x26a0;</span><mark>You can&apos;t use event-based synthesis for multi-language translation.</mark>","children":[],"payload":{"tag":"li","lines":"8072,8073"}},{"content":"Example  <pre><code>\n  import azure.cognitiveservices.speech as speech_sdk\n  from playsound3 import playsound\n  &#xa0;\n  # Configure translation\n  source_language, target_language = &quot;en-US&quot;, &quot;fr&quot;\n  output_file = &quot;translation.wav&quot;\n  translation_cfg = speech_sdk.translation.SpeechTranslationConfig(subscription=&quot;FOUNDRY_KEY&quot;,\n                                                                  endpoint=&quot;FOUNDRY_ENDPOINT&quot;)\n  translation_cfg.speech_recognition_language = source_language\n  translation_cfg.add_target_language(target_language)\n  translation_cfg.voice_name = &quot;fr-FR-HenriNeural&quot;\n  audio_cfg = speech_sdk.AudioConfig(use_default_microphone=True)\n  translator = speech_sdk.translation.TranslationRecognizer(translation_config=translation_cfg,\n                                                          audio_config=audio_cfg)\n  &#xa0;\n  # Event handler function to save the synthesized audio to a file\n  def synthesis_callback(evt):\n      size = len(evt.result.audio)\n      print(f&apos;Audio synthesized: {size} byte(s) {&quot;(COMPLETED)&quot; if size == 0 else &quot;&quot;}&apos;)\n  &#xa0;\n      if size &gt; 0:\n          file = open(output_file, &apos;wb+&apos;)\n          file.write(evt.result.audio)\n          file.close()\n  &#xa0;\n  # Connect the event handler function\n  translator.synthesizing.connect(synthesis_callback)\n  &#xa0;\n  # Get input from mic and translate it\n  print(f&quot;Speak now (in {source_language})...&quot;)\n  translation_results = translator.recognize_once()\n  print(f&quot;Translating &apos;{translation_results.text}&apos;&quot;)\n  &#xa0;\n  # Print and play the translation results\n  print(translation_results.translations[target_language])\n  playsound(output_file)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"8073,8112"}}],"payload":{"tag":"li","lines":"8062,8112"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about synthesizing translations, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech?tabs=terminal&amp;pivots=programming-language-python#synthesize-translations\">Azure Speech Python SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"8112,8115"}}],"payload":{"tag":"li","lines":"8006,8115"}}],"payload":{"tag":"li","lines":"8005,8115"}}],"payload":{"tag":"li","lines":"7923,8115"}},{"content":"\n<p data-lines=\"8115,8116\"><strong>Furtheer reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/translator\">Azure Translator in Foundry Tools documentation</a>","children":[],"payload":{"tag":"li","lines":"8116,8117"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation\">Azure Speech in Foundry Tools translation documentation</a>","children":[],"payload":{"tag":"li","lines":"8117,8119"}}],"payload":{"tag":"li","lines":"8115,8119"}},{"content":"\n<p data-lines=\"8119,8121\"><strong>Exercise - Translate text and speech</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-language/Instructions/Exercises/07-translation.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"8119,8125"}}],"payload":{"tag":"h3","lines":"7748,7749"}}],"payload":{"tag":"h2","lines":"5999,6000"}},{"content":"Extract insights from visual data on Azure","children":[{"content":"1. <a href=\"https://learn.microsoft.com/en-us/training/modules/develop-generative-ai-vision-apps/\">Develop a vision-enabled generative AI application</a>","children":[{"content":"\n<p data-lines=\"8131,8132\"><strong>Introduction</strong></p>","children":[{"content":"Generative AI models are transforming how intelligent chat-based applications are developed.","children":[],"payload":{"tag":"li","lines":"8132,8133"}},{"content":"Modern AI systems can reason over user input and generate context-aware responses.","children":[],"payload":{"tag":"li","lines":"8133,8134"}},{"content":"Traditionally, generative AI relied mainly on <strong>text-based prompts</strong> for interaction.","children":[],"payload":{"tag":"li","lines":"8134,8135"}},{"content":"Advances in multimodal AI now allow models to process and understand <strong>both text and visual content</strong>.","children":[],"payload":{"tag":"li","lines":"8135,8136"}},{"content":"Vision-enabled generative AI expands the possibilities for creating richer and more interactive applications.","children":[],"payload":{"tag":"li","lines":"8136,8137"}},{"content":"Microsoft Foundry provides tools and services for building multimodal generative AI solutions.","children":[],"payload":{"tag":"li","lines":"8137,8138"}},{"content":"Developers can create applications that respond to prompts containing a combination of <strong>text and image data</strong>.","children":[],"payload":{"tag":"li","lines":"8138,8139"}},{"content":"Multimodal AI enables more natural, intuitive, and intelligent human-computer interactions.","children":[],"payload":{"tag":"li","lines":"8139,8141"}}],"payload":{"tag":"li","lines":"8131,8141"}},{"content":"\n<p data-lines=\"8141,8142\"><strong>Use a vision-capable model in the Microsoft Foundry portal</strong></p>","children":[{"content":"Testing multimodal models with image-based prompts","children":[{"content":"<em>Multimodal</em> generative AI model supports inputs","children":[{"content":"Text-based","children":[],"payload":{"tag":"li","lines":"8145,8146"}},{"content":"Image-based","children":[],"payload":{"tag":"li","lines":"8146,8147"}},{"content":"Audio-based","children":[],"payload":{"tag":"li","lines":"8147,8148"}}],"payload":{"tag":"li","lines":"8144,8148"}},{"content":"Multimodels available in Foundry","children":[{"content":"Microsoft Phi-4-multimodal-instruct","children":[],"payload":{"tag":"li","lines":"8149,8150"}},{"content":"OpenAI gpt-4.1","children":[],"payload":{"tag":"li","lines":"8150,8151"}},{"content":"OpenAI gpt-4.1-mini","children":[],"payload":{"tag":"li","lines":"8151,8152"}}],"payload":{"tag":"li","lines":"8148,8152"}},{"content":"After deploying a multimodal model, you can test it in the<br>\nchat playground","children":[],"payload":{"tag":"li","lines":"8152,8154"}},{"content":"In the chat playground, you can upload an image from a local file and<br>\nadd text to the message to elicit a response from a multimodal model.","children":[],"payload":{"tag":"li","lines":"8154,8156"}},{"content":"<span>&#x1f4a1;</span><mark>To learn more about available models in Microsoft Foundry, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview\">Microsoft Foundry Models overview</a>article in the Microsoft Foundry documentation.</mark>","children":[],"payload":{"tag":"li","lines":"8156,8159"}}],"payload":{"tag":"li","lines":"8143,8159"}}],"payload":{"tag":"li","lines":"8141,8159"}},{"content":"\n<p data-lines=\"8159,8160\"><strong>Develop a vision-based chat app</strong></p>","children":[{"content":"\n<p data-lines=\"8161,8162\">Submit an image-based prompt using the <strong>Responses API</strong></p>","children":[{"content":"Can use the same basic techniques<br>\nused for text-based chats","children":[],"payload":{"tag":"li","lines":"8162,8164"}},{"content":"Require a connection to the endpoint where the<br>\nmodel is deployed","children":[],"payload":{"tag":"li","lines":"8164,8166"}},{"content":"Use that endpoint to submit prompts","children":[],"payload":{"tag":"li","lines":"8166,8167"}},{"content":"Prompts for a vision-based chat","children":[{"content":"Include multi-part user messages","children":[],"payload":{"tag":"li","lines":"8168,8169"}},{"content":"Contain a <em>text</em> content","children":[],"payload":{"tag":"li","lines":"8169,8170"}},{"content":"Contain a <em>image</em> content","children":[],"payload":{"tag":"li","lines":"8170,8171"}}],"payload":{"tag":"li","lines":"8167,8171"}},{"content":"Example<br>\n(submit an image in a prompt using the Responses API)  <pre><code>\n  # Read the image data from a local file\n  image_path = Path(&quot;dragon-fruit.jpeg&quot;)\n  image_format = &quot;jpeg&quot;\n  with open(image_path, &quot;rb&quot;) as image_file:\n      image_data = base64.b64encode(image_file.read()).decode(&quot;utf-8&quot;)\n  &#xa0;\n  data_url = f&quot;data:image/{image_format};base64,{image_data}&quot; # You can also use a web URL\n  &#xa0;\n  # Send the image data in a prompt to the model\n  response = client.responses.create(\n      model=&quot;gpt-4.1&quot;,\n      input=[\n          {&quot;role&quot;: &quot;developer&quot;, &quot;content&quot;: &quot;You are an AI assistant for chefs planning recipes.&quot;},\n          {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: [  \n              { &quot;type&quot;: &quot;input_text&quot;, &quot;text&quot;: &quot;What desserts could I make with this?&quot;},\n              { &quot;type&quot;: &quot;input_image&quot;, &quot;image_url&quot;: data_url}\n          ] } \n      ]\n  )\n  print(response.output_text)\n  </code><pre>\n</pre></pre>","children":[],"payload":{"tag":"li","lines":"8171,8196"}}],"payload":{"tag":"li","lines":"8161,8196"}},{"content":"\n<p data-lines=\"8196,8197\">Submit an image-based prompt using the <strong>ChatCompletions API</strong></p>","children":[{"content":"Submit prompts to models that don&apos;t<br>\nsupport the Responses API","children":[],"payload":{"tag":"li","lines":"8197,8199"}},{"content":"Example  <pre><code>\n  # Read the image data from a local file\n  image_path = Path(&quot;orange.jpeg&quot;)\n  image_format = &quot;jpeg&quot;\n  with open(image_path, &quot;rb&quot;) as image_file:\n      image_data = base64.b64encode(image_file.read()).decode(&quot;utf-8&quot;)\n  &#xa0;\n  data_url = f&quot;data:image/{image_format};base64,{image_data}&quot; # You can also use a web URL\n  &#xa0;\n  # Send the image data in a prompt to the model\n  response = client.chat.completions.create(\n      model=&quot;Phi-4-multimodal-instruct&quot;,\n      messages=[\n          {&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;You are an AI assistant for chefs planning recipes.&quot;},\n          { &quot;role&quot;: &quot;user&quot;, &quot;content&quot;: [  \n              { &quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;What can I make with this fruit?&quot;},\n              { &quot;type&quot;: &quot;image_url&quot;, &quot;image_url&quot;: {&quot;url&quot;: data_url}}\n          ] }\n      ]\n  )\n  print(response.choices[0].message.content)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"8199,8223"}}],"payload":{"tag":"li","lines":"8196,8223"}}],"payload":{"tag":"li","lines":"8159,8223"}},{"content":"\n<p data-lines=\"8223,8224\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://developers.openai.com/api/docs/guides/images-vision?format=url#analyze-images?azure-portal=true\">Images and vision</a>","children":[],"payload":{"tag":"li","lines":"8224,8226"}}],"payload":{"tag":"li","lines":"8223,8226"}},{"content":"\n<p data-lines=\"8226,8228\"><strong>Exercise - Develop a vision-enabled chat app</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-vision/Instructions/Exercises/01-gen-ai-vision.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"8226,8229"}}],"payload":{"tag":"h3","lines":"8129,8130"}},{"content":"2. <a href=\"https://learn.microsoft.com/en-us/training/modules/generate-images-azure-openai/\">Generate images with AI</a>","children":[{"content":"\n<p data-lines=\"8231,8232\"><strong>Introduction</strong></p>","children":[{"content":"Microsoft Foundry enables developers to use language models to generate content from natural language prompts.","children":[],"payload":{"tag":"li","lines":"8232,8233"}},{"content":"Generative AI is evolving beyond text generation to support the creation of visual and graphical content.","children":[],"payload":{"tag":"li","lines":"8233,8234"}},{"content":"Models such as OpenAI gpt-image-1 can generate original images based on descriptive prompts.","children":[],"payload":{"tag":"li","lines":"8234,8235"}},{"content":"AI-powered image generation allows users to transform ideas and descriptions into visual assets automatically.","children":[],"payload":{"tag":"li","lines":"8235,8236"}},{"content":"Generated graphics can range from illustrations to highly realistic photorealistic images.","children":[],"payload":{"tag":"li","lines":"8236,8237"}},{"content":"AI image generation has multiple business and creative applications, including","children":[{"content":"Marketing and advertising materials","children":[],"payload":{"tag":"li","lines":"8238,8239"}},{"content":"Article and presentation illustrations","children":[],"payload":{"tag":"li","lines":"8239,8240"}},{"content":"Product and company logo creation","children":[],"payload":{"tag":"li","lines":"8240,8241"}},{"content":"Custom creative design assets","children":[],"payload":{"tag":"li","lines":"8241,8242"}}],"payload":{"tag":"li","lines":"8237,8242"}},{"content":"Generative AI simplifies and accelerates the creative process by reducing the need for manual graphic design work.","children":[],"payload":{"tag":"li","lines":"8242,8243"}},{"content":"Natural language prompting makes image creation more accessible to users without advanced design skills.","children":[],"payload":{"tag":"li","lines":"8243,8245"}}],"payload":{"tag":"li","lines":"8231,8245"}},{"content":"\n<p data-lines=\"8245,8246\"><strong>What are image-generation models?</strong></p>","children":[{"content":"Models that are capable of generating images","children":[{"content":"The OpenAI gpt-image-1 series of models.","children":[],"payload":{"tag":"li","lines":"8248,8249"}},{"content":"The Black Forest Labs FLUX series of models.","children":[],"payload":{"tag":"li","lines":"8249,8250"}},{"content":"<span>&#x1f4a1;</span><mark>View the <a href=\"https://ai.azure.com/catalog/models\">Model catalog</a> for the full set of models available in Microsoft Foundry.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;In the Foundry portal you can filter by inference task to find <em>text to image</em> models.</mark>","children":[],"payload":{"tag":"li","lines":"8250,8252"}},{"content":"Image generation models are generative AI model that can<br>\ncreate graphical data from natural language input.","children":[],"payload":{"tag":"li","lines":"8252,8254"}},{"content":"The images generated are original","children":[],"payload":{"tag":"li","lines":"8254,8255"}},{"content":"The model generates new images based on the<br>\ndata on which it was trained","children":[],"payload":{"tag":"li","lines":"8255,8258"}}],"payload":{"tag":"li","lines":"8247,8258"}}],"payload":{"tag":"li","lines":"8245,8258"}},{"content":"\n<p data-lines=\"8258,8259\"><strong>Explore image-generation models in Microsoft Foundry portal</strong></p>","children":[{"content":"How to explore","children":[{"content":"Create a Microsoft Foundry project","children":[],"payload":{"tag":"li","lines":"8261,8262"}},{"content":"Use the model playground","children":[{"content":"To submit prompts","children":[],"payload":{"tag":"li","lines":"8263,8264"}},{"content":"View the resulting generated images","children":[],"payload":{"tag":"li","lines":"8264,8265"}}],"payload":{"tag":"li","lines":"8262,8265"}},{"content":"Can specify the resolution (size) of the<br>\ngenerated images","children":[],"payload":{"tag":"li","lines":"8265,8267"}},{"content":"Can include a reference image for the<br>\nmodel to base it&apos;s output on","children":[],"payload":{"tag":"li","lines":"8267,8270"}}],"payload":{"tag":"li","lines":"8260,8270"}}],"payload":{"tag":"li","lines":"8258,8270"}},{"content":"\n<p data-lines=\"8270,8271\"><strong>Create a client application that uses an image generation model</strong></p>","children":[{"content":"How to create a client app","children":[{"content":"Use a language-specific SDK<br>\n(for example, the OpenAI Python SDK or the<br>\nAzure OpenAI .NET SDK)","children":[],"payload":{"tag":"li","lines":"8273,8276"}},{"content":"Example<br>\n(usingthe OpenAI Images API)  <pre><code>\n  # Generate an image\n  img_results = client.images.generate(\n      model=&quot;FLUX.1-Kontext-pro&quot;,\n      prompt=&quot;A robot eating a cheeseburger.&quot;,\n      n=1,\n      size=&quot;1024x1024&quot;,\n  )\n  &#xa0;\n  # Save the generated image\n  image_data = base64.b64decode(img_results.data[0].b64_json)\n  with open(&quot;image.png&quot;, &quot;wb&quot;) as image_file:\n      image_file.write(image_data)\n  </code></pre>","children":[{"content":"Result<br>\nBinary stream containing the requested image","children":[],"payload":{"tag":"li","lines":"8292,8296"}}],"payload":{"tag":"li","lines":"8276,8296"}}],"payload":{"tag":"li","lines":"8272,8296"}}],"payload":{"tag":"li","lines":"8270,8296"}},{"content":"\n<p data-lines=\"8296,8298\"><strong>Exercise - Generate images with AI</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-vision/Instructions/Exercises/02-generate-image.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"8296,8301"}}],"payload":{"tag":"h3","lines":"8229,8230"}},{"content":"3. <a href=\"https://learn.microsoft.com/en-us/training/modules/generate-video-with-foundry/\">Generate videos with Microsoft Foundry</a>","children":[{"content":"\n<p data-lines=\"8303,8304\"><strong>Introduction</strong></p>","children":[{"content":"Generative AI is rapidly evolving from text and image generation to <strong>AI-powered video creation</strong>.","children":[],"payload":{"tag":"li","lines":"8304,8305"}},{"content":"Microsoft Foundry integrates advanced video-generation capabilities through Sora 2.","children":[],"payload":{"tag":"li","lines":"8305,8306"}},{"content":"Sora 2 can generate realistic and creative video scenes using:","children":[{"content":"Text prompts","children":[],"payload":{"tag":"li","lines":"8307,8308"}},{"content":"Reference images","children":[],"payload":{"tag":"li","lines":"8308,8309"}},{"content":"Existing videos for remixing and transformation","children":[],"payload":{"tag":"li","lines":"8309,8310"}}],"payload":{"tag":"li","lines":"8306,8310"}},{"content":"AI-generated video enables faster and more accessible content creation for creative and business use cases.","children":[],"payload":{"tag":"li","lines":"8310,8311"}},{"content":"Effective prompt engineering plays a key role in producing high-quality and accurate video outputs.","children":[],"payload":{"tag":"li","lines":"8311,8312"}},{"content":"Developers can deploy and integrate Sora 2 into custom applications and workflows.","children":[],"payload":{"tag":"li","lines":"8312,8313"}},{"content":"The module demonstrates how to build video-generation solutions programmatically using the OpenAI SDK and Python.","children":[],"payload":{"tag":"li","lines":"8313,8314"}},{"content":"AI video generation opens opportunities for:","children":[{"content":"Marketing and advertising content","children":[],"payload":{"tag":"li","lines":"8315,8316"}},{"content":"Storytelling and entertainment","children":[],"payload":{"tag":"li","lines":"8316,8317"}},{"content":"Educational media","children":[],"payload":{"tag":"li","lines":"8317,8318"}},{"content":"Creative prototyping and visualization","children":[],"payload":{"tag":"li","lines":"8318,8319"}}],"payload":{"tag":"li","lines":"8314,8319"}},{"content":"Programmatic video generation enables automation, scalability, and integration into enterprise applications.","children":[],"payload":{"tag":"li","lines":"8319,8321"}}],"payload":{"tag":"li","lines":"8303,8321"}},{"content":"\n<p data-lines=\"8321,8322\"><strong>Deploy a video generating model</strong></p>","children":[{"content":"\n<p data-lines=\"8323,8324\">Prerequisites</p>","children":[{"content":"Sora 2 is an AI model from OpenAI that<br>\ncreates realistic and imaginative video scenes from","children":[{"content":"Text instructions","children":[],"payload":{"tag":"li","lines":"8326,8327"}},{"content":"Input images","children":[],"payload":{"tag":"li","lines":"8327,8328"}},{"content":"Existing videos","children":[],"payload":{"tag":"li","lines":"8328,8329"}}],"payload":{"tag":"li","lines":"8324,8329"}},{"content":"Before deploying","children":[{"content":"An Azure subscription","children":[],"payload":{"tag":"li","lines":"8330,8331"}},{"content":"Access to the Microsoft Foundry portal","children":[],"payload":{"tag":"li","lines":"8331,8332"}},{"content":"Foundry project where you have<br>\npermissions to deploy models","children":[],"payload":{"tag":"li","lines":"8332,8335"}}],"payload":{"tag":"li","lines":"8329,8335"}}],"payload":{"tag":"li","lines":"8323,8335"}},{"content":"\n<p data-lines=\"8335,8336\">Deploy the Sora 2 model</p>","children":[{"content":"1. Go to the <a href=\"https://ai.azure.com/\">Microsoft Foundry portal</a> and sign in with your credentials.","children":[],"payload":{"tag":"li","lines":"8336,8337","listIndex":1}},{"content":"2. From the Foundry landing page, create or select a project.","children":[],"payload":{"tag":"li","lines":"8337,8338","listIndex":2}},{"content":"3. Select <strong>Build</strong> from the navigation pane on the right.","children":[],"payload":{"tag":"li","lines":"8338,8339","listIndex":3}},{"content":"4. Select <strong>Models</strong> from the left-hand menu to view the model catalog.","children":[],"payload":{"tag":"li","lines":"8339,8340","listIndex":4}},{"content":"5. Use the search bar or filter options to find the <strong>Sora-2</strong> video generation model.","children":[],"payload":{"tag":"li","lines":"8340,8341","listIndex":5}},{"content":"6. Select the <strong>Sora-2</strong> model then select <strong>Deploy</strong> and choose the appropriate deployment settings.","children":[],"payload":{"tag":"li","lines":"8341,8342","listIndex":6}},{"content":"7. <span>&#x1f4a1;</span><mark>To learn more about available models in Microsoft Foundry, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/model-catalog-overview\">Model catalog and collections in Microsoft Foundry portal</a> article in the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Microsoft Foundry documentation.</mark>","children":[],"payload":{"tag":"li","lines":"8342,8346","listIndex":7}}],"payload":{"tag":"li","lines":"8335,8346"}},{"content":"\n<p data-lines=\"8346,8347\">Sora 2 capabilities</p>\n<table data-lines=\"8347,8355\">\n<thead data-lines=\"8347,8348\">\n<tr data-lines=\"8347,8348\">\n<th style=\"text-align:left\">Feature</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"8349,8355\">\n<tr data-lines=\"8349,8350\">\n<td style=\"text-align:left\">Text to video</td>\n<td style=\"text-align:left\">Generate videos from natural language text prompts</td>\n</tr>\n<tr data-lines=\"8350,8351\">\n<td style=\"text-align:left\">Image to video</td>\n<td style=\"text-align:left\">Transform existing images into video content</td>\n</tr>\n<tr data-lines=\"8351,8352\">\n<td style=\"text-align:left\">Video remix</td>\n<td style=\"text-align:left\">Make targeted adjustments to existing videos without<br>regenerating from scratch</td>\n</tr>\n<tr data-lines=\"8352,8353\">\n<td style=\"text-align:left\">Audio generation</td>\n<td style=\"text-align:left\">Supports audio generation in output videos</td>\n</tr>\n<tr data-lines=\"8353,8354\">\n<td style=\"text-align:left\">Multiple resolutions</td>\n<td style=\"text-align:left\">Supports portrait (720&#xd7;1280) and<br>landscape (1280&#xd7;720) formats</td>\n</tr>\n<tr data-lines=\"8354,8355\">\n<td style=\"text-align:left\">Variable duration</td>\n<td style=\"text-align:left\">Generate videos of 4, 8, or 12 seconds</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"8346,8356"}}],"payload":{"tag":"li","lines":"8321,8356"}},{"content":"\n<p data-lines=\"8356,8357\"><strong>Generate video from a prompt</strong></p>","children":[{"content":"\n<p data-lines=\"8358,8359\">Video generation parameters</p>\n<table data-lines=\"8359,8367\">\n<thead data-lines=\"8359,8360\">\n<tr data-lines=\"8359,8360\">\n<th style=\"text-align:left\">Parameter</th>\n<th style=\"text-align:left\">Description</th>\n<th style=\"text-align:left\">Supported Values</th>\n</tr>\n</thead>\n<tbody data-lines=\"8361,8367\">\n<tr data-lines=\"8361,8362\">\n<td style=\"text-align:left\">prompt</td>\n<td style=\"text-align:left\">Natural language description of<br>your video</td>\n<td style=\"text-align:left\">Text string (required)</td>\n</tr>\n<tr data-lines=\"8362,8363\">\n<td style=\"text-align:left\">model</td>\n<td style=\"text-align:left\">The model to use</td>\n<td style=\"text-align:left\"><code>sora-2</code> or <code>sora-2-pro</code></td>\n</tr>\n<tr data-lines=\"8363,8364\">\n<td style=\"text-align:left\">size</td>\n<td style=\"text-align:left\">Output resolution</td>\n<td style=\"text-align:left\"><code>1280x720</code> (landscape),<br><code>720x1280</code> (portrait)</td>\n</tr>\n<tr data-lines=\"8364,8365\">\n<td style=\"text-align:left\">seconds</td>\n<td style=\"text-align:left\">Video duration</td>\n<td style=\"text-align:left\"><code>4</code>, <code>8</code>, or<br><code>12</code> (default: 4)</td>\n</tr>\n<tr data-lines=\"8365,8366\">\n<td style=\"text-align:left\">input_reference</td>\n<td style=\"text-align:left\">Reference image for the first frame</td>\n<td style=\"text-align:left\">JPEG, PNG, or<br>WebP file</td>\n</tr>\n<tr data-lines=\"8366,8367\">\n<td style=\"text-align:left\">remix_video_id</td>\n<td style=\"text-align:left\">ID of a previous video to remix</td>\n<td style=\"text-align:left\">Video ID string</td>\n</tr>\n</tbody>\n</table>\n  <br>\n<p data-lines=\"8370,8373\"><span>&#x1f4a1;</span><mark>The model follows instructions more reliably in shorter clips.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;For best results, consider generating two 4-second clips and<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;stitching them together rather than a single 8-second clip.</mark></p>","children":[],"payload":{"tag":"li","lines":"8358,8374"}},{"content":"\n<p data-lines=\"8374,8375\">Test video generation in the playground</p>","children":[{"content":"1. Navigate to your deployed Sora 2 model in the Foundry portal.","children":[],"payload":{"tag":"li","lines":"8375,8376","listIndex":1}},{"content":"2. Select the <strong>Playground</strong> tab to access the video generation interface.","children":[],"payload":{"tag":"li","lines":"8376,8377","listIndex":2}},{"content":"3. Enter your prompt into the text box describing the video you want to generate.","children":[],"payload":{"tag":"li","lines":"8377,8378","listIndex":3}},{"content":"4. Configure video settings such as resolution and duration.","children":[],"payload":{"tag":"li","lines":"8378,8379","listIndex":4}},{"content":"5. Select <strong>Generate</strong> to start video creation.","children":[],"payload":{"tag":"li","lines":"8379,8380","listIndex":5}},{"content":"6. Video generation typically takes 1 to 5 minutes depending on your settings.","children":[],"payload":{"tag":"li","lines":"8380,8381","listIndex":6}},{"content":"7. Can also view cURL code samples that are prefilled according to your settings","children":[],"payload":{"tag":"li","lines":"8381,8382","listIndex":7}},{"content":"8. Select the View code button at the top of the playground to<br>\naccess sample code you can use in your applications.","children":[],"payload":{"tag":"li","lines":"8382,8384","listIndex":8}},{"content":"9. <span>&#x1f4a1;</span><mark>The content generation APIs include a content moderation filter.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;If Azure OpenAI recognizes your prompt as harmful content,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;it won&apos;t return a generated video.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;For more information, see <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/content-filter\">Content filtering</a>.</mark>","children":[],"payload":{"tag":"li","lines":"8384,8389","listIndex":9}}],"payload":{"tag":"li","lines":"8374,8389"}},{"content":"\n<p data-lines=\"8389,8390\">Writing effective prompts</p>","children":[{"content":"\n<p data-lines=\"8390,8391\">Prompt anatomy</p>","children":[{"content":"The more specific you are about what the shot should achieve~<br>\nthe more control and consistency you&apos;ll get","children":[],"payload":{"tag":"li","lines":"8391,8393"}},{"content":"Camera framing<br>\nSpecify the shot type (wide, medium, close-up) and angle","children":[],"payload":{"tag":"li","lines":"8393,8395"}},{"content":"Subject description<br>\nAnchor your subject with distinctive details","children":[],"payload":{"tag":"li","lines":"8395,8397"}},{"content":"Action<br>\nDescribe movement in beats&#x2014;small steps, gestures, or pauses","children":[],"payload":{"tag":"li","lines":"8397,8399"}},{"content":"Lighting and palette<br>\nSet the mood with lighting direction and color anchors","children":[],"payload":{"tag":"li","lines":"8399,8401"}},{"content":"Style<br>\nEstablish the aesthetic early (for example, &quot;1970s film&quot; or &quot;handheld documentary&quot;)","children":[],"payload":{"tag":"li","lines":"8401,8404"}}],"payload":{"tag":"li","lines":"8390,8404"}},{"content":"\n<p data-lines=\"8404,8405\">Weak vs. strong prompts</p>\n<table data-lines=\"8405,8410\">\n<thead data-lines=\"8405,8406\">\n<tr data-lines=\"8405,8406\">\n<th style=\"text-align:left\">Weak prompt</th>\n<th style=\"text-align:left\">Strong prompt</th>\n</tr>\n</thead>\n<tbody data-lines=\"8407,8410\">\n<tr data-lines=\"8407,8408\">\n<td style=\"text-align:left\">&quot;A beautiful street at night&quot;</td>\n<td style=\"text-align:left\">&quot;Wet asphalt, zebra crosswalk, neon signs reflecting in puddles&quot;</td>\n</tr>\n<tr data-lines=\"8408,8409\">\n<td style=\"text-align:left\">&quot;Person moves quickly&quot;</td>\n<td style=\"text-align:left\">&quot;Cyclist pedals three times, brakes, and stops at crosswalk&quot;</td>\n</tr>\n<tr data-lines=\"8409,8410\">\n<td style=\"text-align:left\">&quot;Cinematic look&quot;</td>\n<td style=\"text-align:left\">&quot;Anamorphic 2.0x lens, shallow DOF, volumetric light&quot;</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"8404,8411"}},{"content":"\n<p data-lines=\"8411,8412\">Example prompt</p>\n  <pre>\n  In a 90s documentary-style interview, an old Swedish man sits in a study \n  and says, &quot;I still remember when I was young.&quot;\n  </pre>","children":[{"content":"Why it works","children":[{"content":"&quot;90s documentary&quot;<br>\nsets the style, so the model chooses<br>\nappropriate camera, lighting, and color","children":[],"payload":{"tag":"li","lines":"8417,8420"}},{"content":"&quot;old Swedish man sits in a study&quot;<br>\ndescribes subject and setting while allowing<br>\ncreative interpretation","children":[],"payload":{"tag":"li","lines":"8420,8423"}},{"content":"The dialogue gives the model specific words to<br>\nsync with the character","children":[],"payload":{"tag":"li","lines":"8423,8426"}}],"payload":{"tag":"li","lines":"8416,8426"}}],"payload":{"tag":"li","lines":"8411,8426"}}],"payload":{"tag":"li","lines":"8389,8426"}},{"content":"\n<p data-lines=\"8426,8427\">Using reference images</p>","children":[{"content":"For more control over composition and style<br>\nuse the <code>input_reference</code> parameter","children":[],"payload":{"tag":"li","lines":"8427,8429"}},{"content":"The model uses the image as an anchor for the<br>\nfirst frame","children":[],"payload":{"tag":"li","lines":"8429,8431"}},{"content":"The prompt defines what happens next","children":[],"payload":{"tag":"li","lines":"8431,8432"}},{"content":"Requirements","children":[{"content":"The image resolution must match the<br>\ntarget video size (<code>1280x720</code> or <code>720x1280</code>)","children":[],"payload":{"tag":"li","lines":"8433,8435"}},{"content":"Supported formats","children":[{"content":"JPEG","children":[],"payload":{"tag":"li","lines":"8436,8437"}},{"content":"PNG","children":[],"payload":{"tag":"li","lines":"8437,8438"}},{"content":"WebP","children":[],"payload":{"tag":"li","lines":"8438,8440"}}],"payload":{"tag":"li","lines":"8435,8440"}}],"payload":{"tag":"li","lines":"8432,8440"}}],"payload":{"tag":"li","lines":"8426,8440"}},{"content":"\n<p data-lines=\"8440,8441\">Remixing existing videos</p>","children":[{"content":"The remix feature lets you modify specific aspects of an<br>\nexisting video while preserving its core elements","children":[{"content":"Scene transitions","children":[],"payload":{"tag":"li","lines":"8443,8444"}},{"content":"Visual layout","children":[],"payload":{"tag":"li","lines":"8444,8445"}},{"content":"Overall structure","children":[],"payload":{"tag":"li","lines":"8445,8446"}}],"payload":{"tag":"li","lines":"8441,8446"}},{"content":"To remix a video","children":[{"content":"1. Generate a video and note its video ID from the completed job","children":[],"payload":{"tag":"li","lines":"8447,8448","listIndex":1}},{"content":"2. Call the remix endpoint with the original video ID and an updated prompt","children":[],"payload":{"tag":"li","lines":"8448,8449","listIndex":2}},{"content":"3. Describe only the changes you want &#x2014; keep modifications focused","children":[],"payload":{"tag":"li","lines":"8449,8450","listIndex":3}}],"payload":{"tag":"li","lines":"8446,8450"}},{"content":"For best results","children":[{"content":"Limit changes to one clearly articulated adjustment","children":[],"payload":{"tag":"li","lines":"8451,8452"}},{"content":"Be specific about what to change","children":[{"content":"&quot;same shot, switch to 85mm lens&quot;","children":[],"payload":{"tag":"li","lines":"8453,8454"}},{"content":"&quot;same lighting, new palette: teal, sand, rust&quot;","children":[],"payload":{"tag":"li","lines":"8454,8455"}}],"payload":{"tag":"li","lines":"8452,8455"}},{"content":"Narrow, precise edits retain greater fidelity to the source material","children":[],"payload":{"tag":"li","lines":"8455,8457"}}],"payload":{"tag":"li","lines":"8450,8457"}}],"payload":{"tag":"li","lines":"8440,8457"}},{"content":"\n<p data-lines=\"8457,8458\">Tips for better results</p>","children":[{"content":"Keep it simple<br>\nEach shot should have one clear camera move and one clear subject action","children":[],"payload":{"tag":"li","lines":"8458,8460"}},{"content":"Use beats for timing<br>\nInstead of &quot;actor walks across the room,&quot;<br>\ntry &quot;actor takes four steps to the window, pauses, and pulls the curtain&quot;","children":[],"payload":{"tag":"li","lines":"8460,8463"}},{"content":"Be consistent<br>\nReuse phrasing for characters across shots to maintain continuity","children":[],"payload":{"tag":"li","lines":"8463,8465"}},{"content":"Iterate<br>\nSmall changes to camera, lighting, or<br>\naction can shift outcomes dramatically &#x2010;<br>\n&#x2010; treat each generation as a creative variation","children":[],"payload":{"tag":"li","lines":"8465,8470"}}],"payload":{"tag":"li","lines":"8457,8470"}}],"payload":{"tag":"li","lines":"8356,8470"}},{"content":"\n<p data-lines=\"8470,8471\"><strong>Generate video in Python</strong></p>","children":[{"content":"\n<p data-lines=\"8472,8473\">Generate a video</p>","children":[{"content":"Video generation is an<br>\nasynchronous process","children":[{"content":"Submit a job","children":[],"payload":{"tag":"li","lines":"8475,8476"}},{"content":"Poll for completion","children":[],"payload":{"tag":"li","lines":"8476,8477"}},{"content":"Download the result","children":[],"payload":{"tag":"li","lines":"8477,8478"}}],"payload":{"tag":"li","lines":"8473,8478"}},{"content":"Example  <pre><code>\n  import time\n  &#xa0;\n  # Create the video generation job\n  video = client.videos.create(\n      model=&quot;sora-2&quot;,\n      prompt=&quot;A robot walks through a rainy city street at dusk, neon signs reflecting in puddles&quot;,\n      size=&quot;1280x720&quot;,\n      seconds=&quot;4&quot;,\n  )\n  &#xa0;\n  print(f&quot;Video creation started. ID: {video.id}&quot;)\n  &#xa0;\n  # Poll for completion\n  while video.status not in [&quot;completed&quot;, &quot;failed&quot;, &quot;cancelled&quot;]:\n      print(f&quot;Status: {video.status}. Waiting...&quot;)\n      time.sleep(20)\n      video = client.videos.retrieve(video.id)\n  &#xa0;\n  # Download when complete\n  if video.status == &quot;completed&quot;:\n      content = client.videos.download_content(video.id, variant=&quot;video&quot;)\n      content.write_to_file(&quot;output.mp4&quot;)\n      print(&quot;Video saved to output.mp4&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"8478,8505"}}],"payload":{"tag":"li","lines":"8472,8505"}},{"content":"\n<p data-lines=\"8505,8506\">Generate video from a reference image</p>","children":[{"content":"To use an image as a starting frame,<br>\npass it to the <code>input_reference</code> parameter","children":[],"payload":{"tag":"li","lines":"8506,8508"}},{"content":"The image resolution must match the<br>\ntarget video size","children":[],"payload":{"tag":"li","lines":"8508,8510"}},{"content":"Example  <pre><code>\n      video = client.videos.create(\n          model=&quot;sora-2&quot;,\n          prompt=&quot;The camera slowly pans across the landscape as clouds drift overhead&quot;,\n          size=&quot;1280x720&quot;,\n          seconds=&quot;4&quot;,\n          input_reference=open(&quot;landscape.png&quot;, &quot;rb&quot;),\n      )\n  </code><pre>\n</pre></pre>","children":[],"payload":{"tag":"li","lines":"8510,8520"}},{"content":"<span>&#x1f4a1;</span><mark>Reference images containing human faces are currently rejected.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Use images of landscapes, objects, or animated characters instead.</mark>","children":[],"payload":{"tag":"li","lines":"8520,8523"}}],"payload":{"tag":"li","lines":"8505,8523"}},{"content":"\n<p data-lines=\"8523,8524\">Remix an existing video</p>","children":[{"content":"Used to modify an existing video<br>\nwhile preserving its structure<br>\n(use the original video&apos;s ID)","children":[],"payload":{"tag":"li","lines":"8524,8527"}},{"content":"Example  <pre><code>\n  video = client.videos.remix(\n      video_id=&quot;video_abc123&quot;,\n      prompt=&quot;Change the color palette to warm sunset tones&quot;,\n  )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"8527,8535"}}],"payload":{"tag":"li","lines":"8523,8535"}},{"content":"\n<p data-lines=\"8535,8536\">Handle job states</p>\n<table data-lines=\"8536,8543\">\n<thead data-lines=\"8536,8537\">\n<tr data-lines=\"8536,8537\">\n<th style=\"text-align:left\">Status</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"8538,8543\">\n<tr data-lines=\"8538,8539\">\n<td style=\"text-align:left\"><code>queued</code></td>\n<td style=\"text-align:left\">Job is waiting to be processed</td>\n</tr>\n<tr data-lines=\"8539,8540\">\n<td style=\"text-align:left\"><code>in_progress</code></td>\n<td style=\"text-align:left\">Video is being generated</td>\n</tr>\n<tr data-lines=\"8540,8541\">\n<td style=\"text-align:left\"><code>completed</code></td>\n<td style=\"text-align:left\">Video is ready for download</td>\n</tr>\n
