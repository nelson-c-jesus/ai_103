t":"Resolution","children":[{"content":"Simplify agent instructions where possible.","children":[],"payload":{"tag":"li","lines":"4611,4612"}},{"content":"Optimize tool configurations.","children":[],"payload":{"tag":"li","lines":"4612,4613"}},{"content":"Test from different network locations to isolate network issues.","children":[],"payload":{"tag":"li","lines":"4613,4615"}}],"payload":{"tag":"li","lines":"4610,4615"}}],"payload":{"tag":"li","lines":"4605,4615"}}],"payload":{"tag":"li","lines":"4577,4615"}},{"content":"\n<p data-lines=\"4615,4616\">Monitoring published agents</p>","children":[{"content":"Check Foundry metrics<br>\nReview these metrics regularly to<br>spot trends that indicate problems","children":[{"content":"Request volume and patterns","children":[],"payload":{"tag":"li","lines":"4618,4619"}},{"content":"Response times","children":[],"payload":{"tag":"li","lines":"4619,4620"}},{"content":"Error rates","children":[],"payload":{"tag":"li","lines":"4620,4621"}},{"content":"Tool invocation statistics","children":[],"payload":{"tag":"li","lines":"4621,4622"}}],"payload":{"tag":"li","lines":"4616,4622"}},{"content":"Review Application Insights","children":[{"content":"Trace individual conversations","children":[],"payload":{"tag":"li","lines":"4623,4624"}},{"content":"Analyze error patterns","children":[],"payload":{"tag":"li","lines":"4624,4625"}},{"content":"Measure end-to-end latency","children":[],"payload":{"tag":"li","lines":"4625,4626"}},{"content":"Set up alerts for anomalies","children":[],"payload":{"tag":"li","lines":"4626,4627"}}],"payload":{"tag":"li","lines":"4622,4627"}},{"content":"Gather user feedback","children":[{"content":"Create a Teams channel or email address for agent feedback","children":[],"payload":{"tag":"li","lines":"4628,4629"}},{"content":"Periodically review feedback to identify common problems","children":[],"payload":{"tag":"li","lines":"4629,4630"}},{"content":"Use feedback to prioritize agent improvements","children":[],"payload":{"tag":"li","lines":"4630,4631"}}],"payload":{"tag":"li","lines":"4627,4631"}},{"content":"<span>&#x1f4a1;</span><mark>Keep a testing checklist specific to your agent.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Document the key scenarios you test before each release to<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;ensure consistent quality</mark>","children":[],"payload":{"tag":"li","lines":"4631,4635"}}],"payload":{"tag":"li","lines":"4615,4635"}}],"payload":{"tag":"li","lines":"4566,4635"}}],"payload":{"tag":"li","lines":"4564,4635"}},{"content":"\n<p data-lines=\"4635,4636\"><strong>Key takeaways</strong></p>","children":[{"content":"Omnipresent Deployment<br>\nBringing AI agents directly into Microsoft Teams and Microsoft 365 Copilot ensures they are<br>\ninstantly accessible within the communication tools your users already occupy.","children":[],"payload":{"tag":"li","lines":"4636,4639"}},{"content":"Automated Infrastructure Provisioning<br>\nThe direct publishing workflow inside the Foundry portal strips away backend complexity by<br>\nautomatically configuring the Azure Bot Service and handling Microsoft Entra ID app<br>\nregistrations behind the scenes.","children":[],"payload":{"tag":"li","lines":"4639,4643"}},{"content":"Enterprise-Grade Customization<br>\nWhile the portal handles standard deployments seamlessly, the Microsoft 365 Agents Toolkit is<br>\navailable as a dedicated developer alternative for highly complex enterprise integration scenarios.","children":[],"payload":{"tag":"li","lines":"4643,4646"}},{"content":"Targeted Distribution Scopes<br>\nLifecycle management is split into strategic rollout tiers&#x2014;utilizing Shared scopes for safe,<br>\nlocalized team testing before escalating to Organization scopes for broad corporate distribution.","children":[],"payload":{"tag":"li","lines":"4646,4649"}},{"content":"Access Control &amp; Identity<br>\nManaging agent identity properly is essential, ensuring the agent aligns perfectly with internal<br>\nRole-Based Access Control (RBAC) permissions so it never accesses data it shouldn&apos;t.","children":[],"payload":{"tag":"li","lines":"4649,4652"}},{"content":"Contextual Grounding via Work IQ<br>\nBy leveraging the Model Context Protocol (MCP), Work IQ securely bridges your agent to live Microsoft 365<br>\ndata ecosystems, giving it the operational context required to be genuinely useful.","children":[],"payload":{"tag":"li","lines":"4652,4656"}}],"payload":{"tag":"li","lines":"4635,4656"}},{"content":"\n<p data-lines=\"4656,4657\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/publish-copilot\">Publish agents to Microsoft 365 Copilot and Microsoft Teams</a>","children":[],"payload":{"tag":"li","lines":"4657,4658"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/workiq-overview\">Microsoft Work IQ documentation</a>","children":[],"payload":{"tag":"li","lines":"4658,4659"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/microsoftteams/platform/toolkit/overview-agents-toolkit\">Microsoft 365 Agents Toolkit overview</a>","children":[],"payload":{"tag":"li","lines":"4659,4660"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/agent-identity\">Agent identity concepts in Microsoft Foundry</a>","children":[],"payload":{"tag":"li","lines":"4660,4663"}}],"payload":{"tag":"li","lines":"4656,4663"}},{"content":"\n<p data-lines=\"4663,4665\"><strong>Exercise - Publish a Foundry agent to Teams</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-agents/Instructions/Exercises/05a-m365-teams-integration.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"4663,4666"}},{"content":"\n<p data-lines=\"4666,4668\"><strong>Exercise - Work IQ - Workplace intelligence for AI agents</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-agents/Instructions/Exercises/05b-work-iq-integration.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"4666,4670"}}],"payload":{"tag":"h3","lines":"4198,4199"}},{"content":"6. <a href=\"https://learn.MS.com/en-us/training/modules/build-agent-workflows-MS-foundry/\">Build agent-driven workflows using MS Foundry</a>","children":[{"content":"\n<p data-lines=\"4672,4673\"><strong>Introduction</strong></p>","children":[{"content":"The Multi-Agent Paradigm<br>\nModern AI solutions increasingly move away from isolated models<br>\ntoward ecosystem environments where multiple specialized agents collaborate to<br>\nanalyze inputs, make decisions, and take actions.","children":[],"payload":{"tag":"li","lines":"4673,4677"}},{"content":"Orchestration &amp; Governance<br>\nMicrosoft Foundry agent workflows provide the structural scaffolding needed to<br>\nmanage these complex interactions, combining granular control flow with<br>\nessential runtime safeguards.","children":[],"payload":{"tag":"li","lines":"4677,4681"}},{"content":"Low-Code Visual Canvas<br>\nA visual workflow builder allows developers to model data movement,<br>\ndefine agent invocation logic, and deeply inspect intermediate execution paths and<br>\nruntime behaviors without writing extensive code.","children":[],"payload":{"tag":"li","lines":"4681,4685"}},{"content":"The Automation vs. Safety Dilemma<br>\nIn high-volume scenarios like SaaS customer support&#x2014;where manual review fails to scale but<br>\nfull automation risks unpredictability&#x2014;workflows strike a balance by mixing multi-agent<br>\ntriaging, conditional routing, and human-in-the-loop escalation.","children":[],"payload":{"tag":"li","lines":"4685,4690"}}],"payload":{"tag":"li","lines":"4672,4690"}},{"content":"\n<p data-lines=\"4690,4691\"><strong>Understand Workflows</strong></p>","children":[{"content":"Workflows in Foundry provide a way to orchestrate AI-driven actions<br>\nusing a visual, declarative approach","children":[],"payload":{"tag":"li","lines":"4691,4693"}},{"content":"A workflow consists of connected nodes,<br>\nwhere each node performs a specific function","children":[{"content":"Invoke agents","children":[],"payload":{"tag":"li","lines":"4695,4696"}},{"content":"Evaluate conditions","children":[],"payload":{"tag":"li","lines":"4696,4697"}},{"content":"Manage data","children":[],"payload":{"tag":"li","lines":"4697,4698"}},{"content":"Communicate with users","children":[],"payload":{"tag":"li","lines":"4698,4699"}}],"payload":{"tag":"li","lines":"4693,4699"}},{"content":"These nodes form an execution path that determines<br>\nhow requests move through the system","children":[],"payload":{"tag":"li","lines":"4699,4701"}},{"content":"Arranging and configuring nodes, you control how<br>\ninformation flows and how decisions are made","children":[],"payload":{"tag":"li","lines":"4701,4703"}},{"content":"Workflows has an advantage the is their ability to<br>\ncoordinate multiple agents<br>\nThis orchestration enables more robust and<br>\nscalable automation","children":[],"payload":{"tag":"li","lines":"4703,4707"}},{"content":"Workflows support patterns that balance automation with oversight","children":[{"content":"Can pause execution","children":[],"payload":{"tag":"li","lines":"4708,4709"}},{"content":"Request human input","children":[],"payload":{"tag":"li","lines":"4709,4710"}},{"content":"Escalate decisions","children":[],"payload":{"tag":"li","lines":"4710,4712"}}],"payload":{"tag":"li","lines":"4707,4712"}}],"payload":{"tag":"li","lines":"4690,4712"}},{"content":"\n<p data-lines=\"4712,4713\"><strong>Identify Workflow Patterns</strong></p>","children":[{"content":"Sequential workflow follows a fixed, step-by-step path","children":[{"content":"Works for pipelines and multi-stage processes","children":[{"content":"Validating input","children":[],"payload":{"tag":"li","lines":"4715,4716"}},{"content":"Enriching data","children":[],"payload":{"tag":"li","lines":"4716,4717"}},{"content":"Generating a final response","children":[],"payload":{"tag":"li","lines":"4717,4718"}}],"payload":{"tag":"li","lines":"4714,4718"}},{"content":"They are predictable","children":[],"payload":{"tag":"li","lines":"4718,4719"}},{"content":"Easy to reason about","children":[],"payload":{"tag":"li","lines":"4719,4720"}}],"payload":{"tag":"li","lines":"4713,4720"}},{"content":"Human-in-the-loop workflow introduces pauses where user input or<br>\napproval is required","children":[{"content":"The workflow explicitly asks a question","children":[],"payload":{"tag":"li","lines":"4722,4723"}},{"content":"Waits for a response","children":[],"payload":{"tag":"li","lines":"4723,4724"}},{"content":"Resumes execution based on that input","children":[],"payload":{"tag":"li","lines":"4724,4725"}},{"content":"Useful when automation must be<br>\nbalanced with oversight","children":[{"content":"Approvals","children":[],"payload":{"tag":"li","lines":"4727,4728"}},{"content":"Confirmations","children":[],"payload":{"tag":"li","lines":"4728,4729"}},{"content":"Situations where missing context<br>\nneeds to be provided by a person","children":[],"payload":{"tag":"li","lines":"4729,4731"}}],"payload":{"tag":"li","lines":"4725,4731"}}],"payload":{"tag":"li","lines":"4720,4731"}},{"content":"Group chat workflow enables more dynamic<br>\norchestration across multiple agents","children":[{"content":"Control can shift between agents based on","children":[{"content":"Context","children":[],"payload":{"tag":"li","lines":"4734,4735"}},{"content":"Rules","children":[],"payload":{"tag":"li","lines":"4735,4736"}},{"content":"Intermediate results","children":[],"payload":{"tag":"li","lines":"4736,4737"}}],"payload":{"tag":"li","lines":"4733,4737"}},{"content":"Useful for scenarios where multiple specialized agents<br>\ncollaborate to handle complex requests","children":[{"content":"Customer support","children":[],"payload":{"tag":"li","lines":"4739,4740"}},{"content":"Multi-domain question answering.","children":[],"payload":{"tag":"li","lines":"4740,4742"}}],"payload":{"tag":"li","lines":"4737,4742"}}],"payload":{"tag":"li","lines":"4731,4742"}}],"payload":{"tag":"li","lines":"4712,4742"}},{"content":"\n<p data-lines=\"4742,4743\"><strong>Create workflows in Microsoft Foundry</strong></p>","children":[{"content":"Main node types","children":[{"content":"Invoke","children":[{"content":"Invoke an AI agent","children":[],"payload":{"tag":"li","lines":"4745,4746"}},{"content":"Create a new one","children":[],"payload":{"tag":"li","lines":"4746,4747"}},{"content":"Agent nodes return","children":[{"content":"Free text responses","children":[],"payload":{"tag":"li","lines":"4748,4749"}},{"content":"Structured outputs (e.g. JSON)","children":[],"payload":{"tag":"li","lines":"4749,4750"}}],"payload":{"tag":"li","lines":"4747,4750"}},{"content":"Used for","children":[{"content":"Classification","children":[],"payload":{"tag":"li","lines":"4751,4752"}},{"content":"Reasoning","children":[],"payload":{"tag":"li","lines":"4752,4753"}},{"content":"Recommendations","children":[],"payload":{"tag":"li","lines":"4753,4754"}},{"content":"Any AI-driven task","children":[],"payload":{"tag":"li","lines":"4754,4755"}}],"payload":{"tag":"li","lines":"4750,4755"}}],"payload":{"tag":"li","lines":"4744,4755"}},{"content":"Flow","children":[{"content":"Controls the workflows execution path<br>\nAdapt dinamically to different inputs or situations","children":[],"payload":{"tag":"li","lines":"4756,4758"}},{"content":"Include","children":[{"content":"If/Else<br>\nBranches execution based on conditions","children":[],"payload":{"tag":"li","lines":"4759,4761"}},{"content":"Go To<br>\nJumps to another node in the workflow","children":[],"payload":{"tag":"li","lines":"4761,4763"}},{"content":"For each<br>\nLoops over a list of items, performing the<br>\nsame action for each one","children":[],"payload":{"tag":"li","lines":"4763,4766"}}],"payload":{"tag":"li","lines":"4758,4766"}},{"content":"Data transformation<br>\nManipulates data and manags variables","children":[{"content":"Include","children":[{"content":"Set Variable<br>\nAssigns a value to a variable for later use","children":[],"payload":{"tag":"li","lines":"4769,4771"}},{"content":"Reset Variable<br>\nClears or reinitialize a variable","children":[],"payload":{"tag":"li","lines":"4771,4773"}},{"content":"Parse Value<br>\nExtracts specific data from struxtured outputs or<br>\nconverts values to different formats","children":[],"payload":{"tag":"li","lines":"4773,4776"}}],"payload":{"tag":"li","lines":"4768,4776"}}],"payload":{"tag":"li","lines":"4766,4776"}},{"content":"Basic chat<br>\nSend messages to the user or<br>\nasks questions to collect input<br>\nOften paired with variables to capture responses","children":[],"payload":{"tag":"li","lines":"4776,4780"}},{"content":"End<br>\nMarks the conclusions of a workfloe<br>\nCan return a final result or status","children":[],"payload":{"tag":"li","lines":"4780,4784"}}],"payload":{"tag":"li","lines":"4755,4784"}}],"payload":{"tag":"li","lines":"4743,4784"}}],"payload":{"tag":"li","lines":"4742,4784"}},{"content":"\n<p data-lines=\"4784,4785\"><strong>Add Agents to a Workflow</strong></p>","children":[{"content":"Agents are the core reasoning components within Foundry workflow","children":[],"payload":{"tag":"li","lines":"4785,4786"}},{"content":"Adding agents to workflow enables","children":[{"content":"AI-driven decision-making","children":[],"payload":{"tag":"li","lines":"4787,4788"}},{"content":"Classification","children":[],"payload":{"tag":"li","lines":"4788,4789"}},{"content":"Response generation","children":[],"payload":{"tag":"li","lines":"4789,4790"}}],"payload":{"tag":"li","lines":"4786,4790"}},{"content":"Each agent can be configured","children":[{"content":"Specific purpose","children":[],"payload":{"tag":"li","lines":"4791,4792"}},{"content":"Model","children":[],"payload":{"tag":"li","lines":"4792,4793"}},{"content":"Prompt","children":[],"payload":{"tag":"li","lines":"4793,4794"}},{"content":"Set of tools","children":[],"payload":{"tag":"li","lines":"4794,4795"}}],"payload":{"tag":"li","lines":"4790,4795"}},{"content":"Insert agents with <strong>Invoke agent</strong> node<br>\nallowing","children":[{"content":"Configure tools","children":[],"payload":{"tag":"li","lines":"4797,4798"}},{"content":"Knowledge bases","children":[],"payload":{"tag":"li","lines":"4798,4799"}},{"content":"Memory","children":[],"payload":{"tag":"li","lines":"4799,4800"}},{"content":"Guardrails for the agent","children":[],"payload":{"tag":"li","lines":"4800,4801"}}],"payload":{"tag":"li","lines":"4795,4801"}},{"content":"Agents can be reused across multiple<br>\nworkflows","children":[],"payload":{"tag":"li","lines":"4801,4803"}},{"content":"Structured outputs are useful when agent<br>\nresponses drive control flow","children":[{"content":"Routing logic","children":[],"payload":{"tag":"li","lines":"4805,4806"}},{"content":"Variable assignement","children":[],"payload":{"tag":"li","lines":"4806,4807"}}],"payload":{"tag":"li","lines":"4803,4807"}},{"content":"Define agent&apos;s output in the <em>Parameters</em> of the<br>\n<strong>Details</strong> tab of the <strong>Invoke agent</strong> editor","children":[],"payload":{"tag":"li","lines":"4807,4809"}},{"content":"Variables allows agents to","children":[{"content":"Influence decisions","children":[],"payload":{"tag":"li","lines":"4810,4811"}},{"content":"Trigger conditional branches","children":[],"payload":{"tag":"li","lines":"4811,4812"}},{"content":"Provide input to other agents","children":[],"payload":{"tag":"li","lines":"4812,4813"}}],"payload":{"tag":"li","lines":"4809,4813"}},{"content":"Variable storage can be configures in the <strong>Action<br>settings</strong> of the <strong>Invoke agent</strong> node","children":[],"payload":{"tag":"li","lines":"4813,4815"}}],"payload":{"tag":"li","lines":"4784,4815"}},{"content":"\n<p data-lines=\"4815,4816\"><strong>Apply Power Fx in Workflows</strong></p>","children":[{"content":"\n<p data-lines=\"4816,4818\">Power Fx is the low-code,<br>\nExcel-like language that acts as the glue of a workflow.</p>","children":[{"content":"Allows","children":[{"content":"Manipulate data","children":[],"payload":{"tag":"li","lines":"4819,4820"}},{"content":"Evaluate conditions","children":[],"payload":{"tag":"li","lines":"4820,4821"}},{"content":"Control the flow of execution","children":[],"payload":{"tag":"li","lines":"4821,4823"}}],"payload":{"tag":"li","lines":"4818,4823"}}],"payload":{"tag":"li","lines":"4816,4823"}},{"content":"\n<p data-lines=\"4823,4824\">How formulas work</p>","children":[{"content":"System variables<br>\nProvide contextual information about the workflow or<br>\nconversation, such as the current activity, last message, or user info.","children":[],"payload":{"tag":"li","lines":"4824,4827"}},{"content":"Local variables<br>\nStore data captured or created during workflow execution and<br>\ncan be used in subsequent nodes","children":[],"payload":{"tag":"li","lines":"4827,4830"}},{"content":"Example","children":[{"content":"Convert a user&apos;s input to uppercase: <code>Upper(Local.Input)</code>","children":[],"payload":{"tag":"li","lines":"4831,4832"}},{"content":"Check whether an agent&apos;s confidence score is above a threshold: <code>Local.Confidence &gt; 0.8</code>","children":[],"payload":{"tag":"li","lines":"4832,4833"}},{"content":"Sum values in a list or a column of records: <code>Sum(Local.ItemList, Amount)</code>","children":[],"payload":{"tag":"li","lines":"4833,4835"}}],"payload":{"tag":"li","lines":"4830,4835"}}],"payload":{"tag":"li","lines":"4823,4835"}},{"content":"\n<p data-lines=\"4835,4836\">Conditions as decision points</p>","children":[{"content":"Power Fx expressions are commonly used in<br>\n<strong>If/Else</strong> nodes to evaluate conditions and branch execution","children":[],"payload":{"tag":"li","lines":"4836,4838"}},{"content":"Example<br>\nA workflow might check an agent&apos;s confidence score to decide whether to<br>\ncontinue processing automatically or escalate to a human.","children":[],"payload":{"tag":"li","lines":"4838,4842"}}],"payload":{"tag":"li","lines":"4835,4842"}},{"content":"\n<p data-lines=\"4842,4843\">Loops for processing multiple items</p>","children":[{"content":"<strong>For-each</strong> nodes use Power Fx to iterate over collections","children":[],"payload":{"tag":"li","lines":"4843,4844"}},{"content":"Combining loops with variables and conditions,<br>\nworkflows can handle lists of inputs ithout duplicating<br>\nnodes or logic","children":[],"payload":{"tag":"li","lines":"4844,4848"}}],"payload":{"tag":"li","lines":"4842,4848"}},{"content":"\n<p data-lines=\"4848,4849\">Power Fx formula examples</p>\n<table data-lines=\"4849,4863\">\n<thead data-lines=\"4849,4850\">\n<tr data-lines=\"4849,4850\">\n<th style=\"text-align:left\">Purpose</th>\n<th style=\"text-align:left\">Formula Example</th>\n<th style=\"text-align:left\">Notes</th>\n</tr>\n</thead>\n<tbody data-lines=\"4851,4863\">\n<tr data-lines=\"4851,4852\">\n<td style=\"text-align:left\">Convert text to<br> uppercase</td>\n<td style=\"text-align:left\"><code>Upper(Local.Input)</code></td>\n<td style=\"text-align:left\">Transforms a string to all caps</td>\n</tr>\n<tr data-lines=\"4852,4853\">\n<td style=\"text-align:left\">Convert text to<br> lowercase</td>\n<td style=\"text-align:left\"><code>Lower(Local.Input)</code></td>\n<td style=\"text-align:left\">Transforms a string to all lowercase</td>\n</tr>\n<tr data-lines=\"4853,4854\">\n<td style=\"text-align:left\">Get string length</td>\n<td style=\"text-align:left\"><code>Len(Local.Input)</code></td>\n<td style=\"text-align:left\">Returns the number of characters in a string<br>&#xa0;</td>\n</tr>\n<tr data-lines=\"4854,4855\">\n<td style=\"text-align:left\">Conditional check</td>\n<td style=\"text-align:left\"><code>Local.Confidence &gt; 0.8</code></td>\n<td style=\"text-align:left\">Returns true/false; used in If/Else nodes<br>&#xa0;</td>\n</tr>\n<tr data-lines=\"4855,4856\">\n<td style=\"text-align:left\">If/Else logic</td>\n<td style=\"text-align:left\"><code>If(Local.Confidence &gt; 0.8, &quot;Proceed&quot;, &quot;Escalate&quot;)</code></td>\n<td style=\"text-align:left\">Returns one of two values depending on a condition<br>&#xa0;</td>\n</tr>\n<tr data-lines=\"4856,4857\">\n<td style=\"text-align:left\">Sum a list of<br> numbers</td>\n<td style=\"text-align:left\"><code>Sum([10, 20, 30])</code></td>\n<td style=\"text-align:left\">Adds up numbers in a simple list</td>\n</tr>\n<tr data-lines=\"4857,4858\">\n<td style=\"text-align:left\">Sum a column in<br> a table</td>\n<td style=\"text-align:left\"><code>Sum(Local.ItemList, Amount)</code></td>\n<td style=\"text-align:left\">Adds up the Amount property of each record in a table</td>\n</tr>\n<tr data-lines=\"4858,4859\">\n<td style=\"text-align:left\">Count items in a table<br> or list</td>\n<td style=\"text-align:left\"><code>Count(Local.ItemList)</code></td>\n<td style=\"text-align:left\">Returns the number of items</td>\n</tr>\n<tr data-lines=\"4859,4860\">\n<td style=\"text-align:left\">Check if blank</td>\n<td style=\"text-align:left\"><code>IsBlank(Local.Input)</code></td>\n<td style=\"text-align:left\">Returns true if variable or input is empty</td>\n</tr>\n<tr data-lines=\"4860,4861\">\n<td style=\"text-align:left\">Check if empty<br> table</td>\n<td style=\"text-align:left\"><code>IsEmpty(Local.ItemList)</code></td>\n<td style=\"text-align:left\">Returns true if a table has no records</td>\n</tr>\n<tr data-lines=\"4861,4862\">\n<td style=\"text-align:left\">Loop over items</td>\n<td style=\"text-align:left\"><code>ForAll(Local.ItemList, Upper(Name))</code></td>\n<td style=\"text-align:left\">Applies a formula to each item in a list or table<br>&#xa0;</td>\n</tr>\n<tr data-lines=\"4862,4863\">\n<td style=\"text-align:left\">Concatenate text</td>\n<td style=\"text-align:left\"><code>Concatenate(Local.FirstName, &quot; &quot;, Local.LastName)</code></td>\n<td style=\"text-align:left\">Joins multiple strings into one<br>&#xa0;</td>\n</tr>\n</tbody>\n</table>\n  <br>\n<p data-lines=\"4866,4867\"><span>&#x1f4a1;</span><mark>For more information about the Power Fx language, visit the <a href=\"https://learn.microsoft.com/en-us/power-platform/power-fx/overview\">Power Fx documentation</a></mark></p>","children":[],"payload":{"tag":"li","lines":"4848,4868"}}],"payload":{"tag":"li","lines":"4815,4868"}},{"content":"\n<p data-lines=\"4868,4869\"><strong>Maintain Workflows in Microsoft Foundry</strong></p>","children":[{"content":"\n<p data-lines=\"4870,4871\">YAML and visual representations</p>","children":[{"content":"Visual canvas for","children":[{"content":"Deal for conceptual understanding","children":[],"payload":{"tag":"li","lines":"4872,4873"}},{"content":"Tracing execution paths","children":[],"payload":{"tag":"li","lines":"4873,4874"}},{"content":"Collaborating with others","children":[],"payload":{"tag":"li","lines":"4874,4875"}}],"payload":{"tag":"li","lines":"4871,4875"}},{"content":"YAML for","children":[{"content":"Advanced configuration","children":[],"payload":{"tag":"li","lines":"4876,4877"}},{"content":"Version tracking","children":[],"payload":{"tag":"li","lines":"4877,4878"}},{"content":"Integration with source control","children":[],"payload":{"tag":"li","lines":"4878,4880"}}],"payload":{"tag":"li","lines":"4875,4880"}}],"payload":{"tag":"li","lines":"4870,4880"}},{"content":"\n<p data-lines=\"4880,4881\">Versioning</p>","children":[{"content":"On save is created a new, immutable version","children":[],"payload":{"tag":"li","lines":"4881,4882"}},{"content":"Provides a safety net","children":[{"content":"Review prior versions","children":[],"payload":{"tag":"li","lines":"4883,4884"}},{"content":"Compare changes","children":[],"payload":{"tag":"li","lines":"4884,4885"}},{"content":"Roll back to an earlier workflow<br>\nIf a modification introduces errors","children":[],"payload":{"tag":"li","lines":"4885,4887"}},{"content":"Collaboration<br>\nEasier to track who made changes and why","children":[],"payload":{"tag":"li","lines":"4887,4890"}}],"payload":{"tag":"li","lines":"4882,4890"}}],"payload":{"tag":"li","lines":"4880,4890"}},{"content":"\n<p data-lines=\"4890,4891\">Adding notes for maintainers</p>","children":[{"content":"Notes","children":[{"content":"Provide context","children":[],"payload":{"tag":"li","lines":"4892,4893"}},{"content":"Explain design decisions","children":[],"payload":{"tag":"li","lines":"4893,4894"}},{"content":"Clarify variable usage","children":[],"payload":{"tag":"li","lines":"4894,4896"}}],"payload":{"tag":"li","lines":"4891,4896"}}],"payload":{"tag":"li","lines":"4890,4896"}},{"content":"\n<p data-lines=\"4896,4897\">Best practices for refinement</p>","children":[{"content":"Regularly reviewing workflows for unused or redundant nodes.","children":[],"payload":{"tag":"li","lines":"4897,4898"}},{"content":"Ensuring structured agent outputs are consistently handled.","children":[],"payload":{"tag":"li","lines":"4898,4899"}},{"content":"Documenting decisions and logic with notes.","children":[],"payload":{"tag":"li","lines":"4899,4900"}},{"content":"Leveraging version history to track changes and validate updates.","children":[],"payload":{"tag":"li","lines":"4900,4901"}},{"content":"By combining YAML editing, version control, and thoughtful documentation,<br>\nyou ensure that workflows are robust, maintainable, and ready for enterprise use","children":[],"payload":{"tag":"li","lines":"4901,4904"}}],"payload":{"tag":"li","lines":"4896,4904"}}],"payload":{"tag":"li","lines":"4868,4904"}},{"content":"\n<p data-lines=\"4904,4905\"><strong>Use workflows in code</strong></p>","children":[{"content":"\n<p data-lines=\"4906,4907\">Invoke a workflow</p>","children":[{"content":"Establish a connection to<br>\nFoundry project using the <code>AIProjectClient</code>","children":[{"content":"Handles authentication","children":[],"payload":{"tag":"li","lines":"4909,4910"}},{"content":"Acess to OpenAI-compatible API","children":[{"content":"Executing conversations","children":[],"payload":{"tag":"li","lines":"4911,4912"}},{"content":"Invoking workflows","children":[],"payload":{"tag":"li","lines":"4912,4913"}}],"payload":{"tag":"li","lines":"4910,4913"}}],"payload":{"tag":"li","lines":"4907,4913"}},{"content":"Example  <pre><code>\n      # Reference a workflow created in the Foundry portal\n      workflow_name = &quot;triage-workflow&quot;\n      &#xa0;\n      # Create a conversation context for the workflow\n      conversation = openai_client.conversations.create()\n      &#xa0;\n      # Execute the workflow, passing input to drive the workflow logic\n      stream = openai_client.responses.create(\n          conversation=conversation.id,\n          extra_body={&quot;agent&quot;: {&quot;name&quot;: workflow_name, &quot;type&quot;: &quot;agent_reference&quot;}},\n          input=&quot;Users can&apos;t reset their password from the mobile app.&quot;,\n          stream=True,\n      )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"4913,4929"}},{"content":"<code>input</code> parameter","children":[{"content":"A user question that agents analyze and respond to","children":[],"payload":{"tag":"li","lines":"4930,4931"}},{"content":"A support ticket description for classification and routing","children":[],"payload":{"tag":"li","lines":"4931,4932"}},{"content":"A data payload that triggers processing logic","children":[],"payload":{"tag":"li","lines":"4932,4933"}},{"content":"An empty string that simply starts the workflow without specific input","children":[],"payload":{"tag":"li","lines":"4933,4935"}}],"payload":{"tag":"li","lines":"4929,4935"}}],"payload":{"tag":"li","lines":"4906,4935"}},{"content":"\n<p data-lines=\"4935,4936\">Process workflow events</p>","children":[{"content":"When streaming is enables, tha application<br>\nreceives events as the workflow executes","children":[],"payload":{"tag":"li","lines":"4936,4938"}},{"content":"Example  <pre><code>\n      for event in stream:\n          if event.type == &quot;response.completed&quot;:\n              print(&quot;Workflow completed:&quot;)\n              for message in event.response.output:\n                  if message.content:\n                      for content_item in message.content:\n                          if content_item.type == &apos;output_text&apos;:\n                              print(content_item.text)\n          if (event.type == &quot;response.output_item.done&quot;) and event.item.type == ItemType.WORKFLOW_ACTION:\n              print(f&quot;Action &apos;{event.item.action_id}&apos; completed with status: {event.item.status}&quot;)\n  </code><pre>\n</pre></pre>","children":[],"payload":{"tag":"li","lines":"4938,4951"}},{"content":"Common event types\n<table data-lines=\"4952,4956\">\n<thead data-lines=\"4952,4953\">\n<tr data-lines=\"4952,4953\">\n<th style=\"text-align:left\">Event type</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"4954,4956\">\n<tr data-lines=\"4954,4955\">\n<td style=\"text-align:left\"><code>response.completed</code></td>\n<td style=\"text-align:left\">The workflow finished executing and returned a final response</td>\n</tr>\n<tr data-lines=\"4955,4956\">\n<td style=\"text-align:left\"><code>response.output_item.done</code></td>\n<td style=\"text-align:left\">An individual output item (such as a workflow action) completed</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"4951,4956"}},{"content":"Real-Time Visibility &amp; Event Tracking<br>\nMonitor workflow event streams to observe progress live or<br>\ntrigger external system actions dynamically based on<br>\nchanges in the workflow state.","children":[],"payload":{"tag":"li","lines":"4956,4960"}},{"content":"Flexible Consumption Options<br>\nChoose between streaming execution data in real time or<br>\nawaiting total workflow completion to process a single, consolidated final response.","children":[],"payload":{"tag":"li","lines":"4960,4963"}},{"content":"Human-in-the-Loop Orchestration<br>\nHandle execution pauses natively when a workflow reaches a step requiring manual<br>\nverification, user input, or explicit approval.","children":[],"payload":{"tag":"li","lines":"4963,4966"}},{"content":"Seamless Execution Resumption<br>\nEasily restart a paused workflow by sending targeted input messages directly back into the<br>\nconversation thread to fulfill the pending request.","children":[],"payload":{"tag":"li","lines":"4966,4970"}}],"payload":{"tag":"li","lines":"4935,4970"}},{"content":"\n<p data-lines=\"4970,4971\">Benefits of code integration</p>\n<table data-lines=\"4971,4978\">\n<thead data-lines=\"4971,4972\">\n<tr data-lines=\"4971,4972\">\n<th style=\"text-align:left\">Scenario</th>\n<th style=\"text-align:left\">Benefit</th>\n</tr>\n</thead>\n<tbody data-lines=\"4973,4978\">\n<tr data-lines=\"4973,4974\">\n<td style=\"text-align:left\">Web applications</td>\n<td style=\"text-align:left\">Embed AI-driven workflows directly in user-facing apps</td>\n</tr>\n<tr data-lines=\"4974,4975\">\n<td style=\"text-align:left\">APIs and microservices</td>\n<td style=\"text-align:left\">Expose workflow capabilities through REST endpoints</td>\n</tr>\n<tr data-lines=\"4975,4976\">\n<td style=\"text-align:left\">Batch processing</td>\n<td style=\"text-align:left\">Invoke workflows programmatically for bulk operations</td>\n</tr>\n<tr data-lines=\"4976,4977\">\n<td style=\"text-align:left\">Testing and validation</td>\n<td style=\"text-align:left\">Automate workflow testing as part of CI/CD pipelines</td>\n</tr>\n<tr data-lines=\"4977,4978\">\n<td style=\"text-align:left\">Custom interfaces</td>\n<td style=\"text-align:left\">Build specialized UIs tailored to specific workflow use cases</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"4970,4979"}}],"payload":{"tag":"li","lines":"4904,4979"}},{"content":"\n<p data-lines=\"4979,4980\"><strong>Key takeaways</strong></p>","children":[{"content":"Workflow Composition &amp; Orchestration","children":[{"content":"Node-Based Architecture<br>\nWorkflows are structured by sequencing diverse nodes &#x2014; including agents,<br>\nlogic, data transformation, and chat &#x2014; to seamlessly orchestrate AI reasoning and<br>\nuser interactions.","children":[],"payload":{"tag":"li","lines":"4981,4985"}},{"content":"Data-Driven Decisions<br>\nAgents generate structured outputs captured in variables, which are<br>\nthen used to dynamically drive runtime routing, escalation paths, or workflow continuation.","children":[],"payload":{"tag":"li","lines":"4985,4988"}},{"content":"The Integration &amp; Execution Layer","children":[{"content":"Power Fx as Low-Code &quot;Glue&quot;<br>\nThe platform utilizes Power Fx to transform data,<br>\nevaluate complex logic conditions, and handle iterative<br>\ntasks through loops without heavy coding requirements.","children":[],"payload":{"tag":"li","lines":"4989,4993"}},{"content":"Adaptive Intelligence<br>\nThe fluid movement of data through variables, conditions, and<br>\nloops enables the system to exhibit highly flexible and context-aware behavior at runtime.","children":[],"payload":{"tag":"li","lines":"4993,4996"}}],"payload":{"tag":"li","lines":"4988,4996"}},{"content":"Enterprise Maintenance &amp; Lifecycle","children":[{"content":"Dual-Representation Design<br>\nSystems maintain a visual design canvas alongside a YAML representation, ensuring that<br>\nworkflows are equally accessible to business analysts and developers.","children":[],"payload":{"tag":"li","lines":"4997,5000"}},{"content":"Long-Term Reliability<br>\nIncorporating rigorous versioning practices and inline notes guarantees that complex enterprise<br>\nautomation solutions remain reliable, transparent, and scalable.","children":[],"payload":{"tag":"li","lines":"5000,5003"}}],"payload":{"tag":"li","lines":"4996,5003"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about workflows in Microsoft Foundry, visit <a href=\"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/workflow\">Create a workflow documentation.</a></mark>","children":[],"payload":{"tag":"li","lines":"5003,5005"}}],"payload":{"tag":"li","lines":"4980,5005"}}],"payload":{"tag":"li","lines":"4979,5005"}},{"content":"\n<p data-lines=\"5005,5007\"><strong>Exercise - Create an Agent-driven Workflow</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-agents/Instructions/Exercises/06-build-workflow-ms-foundry.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"5005,5008"}}],"payload":{"tag":"h3","lines":"4670,4671"}},{"content":"7. <a href=\"https://learn.MS.com/en-us/training/modules/develop-ai-agent-with-semantic-kernel/\">Develop an AI agent with MS Agent Framework</a>","children":[{"content":"\n<p data-lines=\"5010,5011\"><strong>Introduction</strong></p>","children":[{"content":"\n<p data-lines=\"5012,5013\">Core Concepts of AI Agents</p>","children":[{"content":"Dynamic Decision-Making<br>\nUnlike rigid, traditional software, AI agents leverage generative AI and<br>\nLLMs to interpret data, make independent decisions, and automate complex<br>\nworkflows with minimal human intervention.","children":[],"payload":{"tag":"li","lines":"5013,5017"}}],"payload":{"tag":"li","lines":"5012,5017"}},{"content":"\n<p data-lines=\"5017,5018\">The Microsoft Agent Framework</p>","children":[{"content":"Open-Source &amp; Multi-Provider Support<br>\nThis open-source SDK simplifies model integration by supporting a wide array of<br>\nagent ecosystems, including Microsoft Foundry, Azure OpenAI, OpenAI,<br>\nMicrosoft Copilot Studio, and Anthropic.","children":[],"payload":{"tag":"li","lines":"5018,5022"}},{"content":"Flexibility &amp; Consistency<br>\nThe framework adds architectural flexibility and scalability, ensuring consistency<br>\nacross your entire implementation if your solution requires mixing different types of agents.","children":[],"payload":{"tag":"li","lines":"5022,5025"}},{"content":"Multi-Agent Orchestration<br>\nIt features built-in workflow coordination capabilities, making it the ideal foundation for<br>\nbuilding complex solutions where multiple collaborative agents must work together.","children":[],"payload":{"tag":"li","lines":"5025,5028"}}],"payload":{"tag":"li","lines":"5017,5028"}},{"content":"\n<p data-lines=\"5028,5029\">Microsoft Foundry Agent Service</p>","children":[{"content":"Fully Managed Infrastructure<br>\nOffers an enterprise-grade platform to build, deploy, and scale agents securely.<br>\nIt completely removes operational overhead, meaning developers do not need to<br>\nmanage underlying compute or storage resources.","children":[],"payload":{"tag":"li","lines":"5029,5033"}},{"content":"Rapid Development<br>\nWhen combined with the Agent Framework, developers can spin up solutions with advanced<br>\nnatural language processing and built-in tools using just a few lines of code.","children":[],"payload":{"tag":"li","lines":"5033,5037"}}],"payload":{"tag":"li","lines":"5028,5037"}},{"content":"\n<p data-lines=\"5037,5038\">Practical Application</p>","children":[{"content":"Functional Extensibility<br>\nBy utilizing the framework&apos;s &quot;tools and functions&quot; capabilities, agents can interact directly<br>\nwith external APIs and retrieve external data to execute real-world tasks.","children":[],"payload":{"tag":"li","lines":"5038,5041"}},{"content":"End-to-End Workflow Example: A practical scenario includes an agent that automatically extracts data<br>\nfrom submitted employee expense reports, structures the formatting correctly, and handles the email<br>\nrouting to appropriate recipients.","children":[],"payload":{"tag":"li","lines":"5041,5045"}}],"payload":{"tag":"li","lines":"5037,5045"}}],"payload":{"tag":"li","lines":"5010,5045"}},{"content":"\n<p data-lines=\"5045,5046\"><strong>Understand Microsoft Agent Framework AI agents</strong></p>","children":[{"content":"\n<p data-lines=\"5047,5048\">Microsoft Agent Framework core components</p>","children":[{"content":"Agents","children":[{"content":"Provides a consistent interface","children":[],"payload":{"tag":"li","lines":"5049,5050"}},{"content":"Enables different features like multi-agent orchestration.","children":[],"payload":{"tag":"li","lines":"5050,5051"}},{"content":"Out of the box, agents support","children":[{"content":"Function calling","children":[],"payload":{"tag":"li","lines":"5052,5053"}},{"content":"Multi-turn conversations with chat history,","children":[],"payload":{"tag":"li","lines":"5053,5054"}},{"content":"Service-provided tools","children":[],"payload":{"tag":"li","lines":"5054,5055"}},{"content":"Structured outputs","children":[],"payload":{"tag":"li","lines":"5055,5056"}},{"content":"Streaming responses.","children":[],"payload":{"tag":"li","lines":"5056,5057"}}],"payload":{"tag":"li","lines":"5051,5057"}}],"payload":{"tag":"li","lines":"5048,5057"}},{"content":"Chat providers","children":[{"content":"Provides abstractions for connecting to AI services from different providers under a common interface.","children":[],"payload":{"tag":"li","lines":"5058,5059"}},{"content":"Supported providers","children":[{"content":"Azure OpenAI","children":[],"payload":{"tag":"li","lines":"5060,5061"}},{"content":"OpenAI","children":[],"payload":{"tag":"li","lines":"5061,5062"}},{"content":"Anthropic","children":[],"payload":{"tag":"li","lines":"5062,5063"}},{"content":"Copilot","children":[],"payload":{"tag":"li","lines":"5063,5064"}},{"content":"More through the BaseAgent abstraction.","children":[],"payload":{"tag":"li","lines":"5064,5065"}}],"payload":{"tag":"li","lines":"5059,5065"}}],"payload":{"tag":"li","lines":"5057,5065"}},{"content":"Function tools","children":[{"content":"Containers for custom functions that extend agent capabilities.","children":[],"payload":{"tag":"li","lines":"5066,5067"}},{"content":"Agents can automatically invoke functions to integrate with external APIs and services.","children":[],"payload":{"tag":"li","lines":"5067,5068"}}],"payload":{"tag":"li","lines":"5065,5068"}},{"content":"Built-in tools","children":[{"content":"Prebuilt capabilities","children":[{"content":"Code Interpreter for Python execution","children":[],"payload":{"tag":"li","lines":"5070,5071"}},{"content":"File Search for document analysis","children":[],"payload":{"tag":"li","lines":"5071,5072"}},{"content":"Web Search for internet access.","children":[],"payload":{"tag":"li","lines":"5072,5073"}}],"payload":{"tag":"li","lines":"5069,5073"}}],"payload":{"tag":"li","lines":"5068,5073"}},{"content":"Conversation management<br>\nStructured message system with roles (USER, ASSISTANT, SYSTEM, TOOL) and AgentSession for persistent conversation context across interactions.","children":[],"payload":{"tag":"li","lines":"5073,5075"}},{"content":"Workflow orchestration<br>\nSupports sequential workflows, concurrent execution, group chat, and handoff patterns for complex multi-agent collaboration.","children":[],"payload":{"tag":"li","lines":"5075,5078"}}],"payload":{"tag":"li","lines":"5047,5078"}},{"content":"\n<p data-lines=\"5078,5079\">What Is a Microsoft Foundry Agent?</p>","children":[{"content":"Enterprise-level capabilities<br>\nBuilt for Azure environments with advanced AI features<br>\nincluding code interpreter,<br>\nfunction tools integration, and<br>\nModel Context Protocol (MCP) support.","children":[],"payload":{"tag":"li","lines":"5079,5084"}},{"content":"Automatic tool invocation<br>\nAgents can automatically call and execute tools,<br>\nintegrating seamlessly with Azure AI Search,<br>\nAzure Functions, and other Azure services.","children":[],"payload":{"tag":"li","lines":"5084,5088"}},{"content":"Thread and conversation management<br>\nProvides built-in mechanisms for managing persistent conversation<br>\nstates across sessions, ensuring smooth multi-agent interactions.","children":[],"payload":{"tag":"li","lines":"5088,5091"}},{"content":"Secure enterprise integration<br>\nEnables secure and compliant AI agent development with Azure CLI<br>\nauthentication, RBAC, and customizable storage options.","children":[],"payload":{"tag":"li","lines":"5091,5095"}}],"payload":{"tag":"li","lines":"5078,5095"}},{"content":"\n<p data-lines=\"5095,5096\">Agent framework core concepts</p>","children":[{"content":"BaseAgent<br>\nThe foundation for all agents with consistent methods,<br>\nproviding a unified interface across all agent types.","children":[],"payload":{"tag":"li","lines":"5096,5099"}},{"content":"Agent session<br>\nManage persistent conversation context and store conversation history<br>\nacross sessions using the AgentSession class.","children":[],"payload":{"tag":"li","lines":"5099,5102"}},{"content":"Chat messages<br>\nOrganized structure for agent communication using role-based messaging<br>\n(USER, ASSISTANT, SYSTEM, TOOL) that enables smooth communication and integration.","children":[],"payload":{"tag":"li","lines":"5102,5105"}},{"content":"Workflow orchestration<br>\nSupports sequential workflows, running multiple agents in parallel, group conversations<br>\nbetween agents, and transferring control between specialized agents.","children":[],"payload":{"tag":"li","lines":"5105,5108"}},{"content":"Multi-modal support<br>\nAllows agents to work with text, images, and structured outputs, including vision capabilities and<br>\ntype-safe response generation.","children":[],"payload":{"tag":"li","lines":"5108,5111"}},{"content":"Function tools<br>\nLet you add custom capabilities to agents by including custom functions with automatic schema<br>\ngeneration from Python functions.","children":[],"payload":{"tag":"li","lines":"5111,5114"}},{"content":"Authentication methods<br>\nSupports multiple authentication methods including Azure CLI credentials, API keys,<br>\nMicrosoft Authentication Library (MSAL) for Microsoft business authentication, and<br>\nrole-based access control.","children":[],"payload":{"tag":"li","lines":"5114,5119"}}],"payload":{"tag":"li","lines":"5095,5119"}}],"payload":{"tag":"li","lines":"5045,5119"}},{"content":"\n<p data-lines=\"5119,5120\"><strong>Create an Azure AI agent with Microsoft Agent Framework</strong></p>","children":[{"content":"\n<p data-lines=\"5121,5122\">Creating an Azure AI Agent</p>","children":[{"content":"1. Create a Microsoft Foundry project.","children":[],"payload":{"tag":"li","lines":"5122,5123","listIndex":1}},{"content":"2. Add the project connection string to your Microsoft Agent Framework application code.","children":[],"payload":{"tag":"li","lines":"5123,5124","listIndex":2}},{"content":"3. Set up authentication credentials with <code>AzureCliCredential</code>.","children":[],"payload":{"tag":"li","lines":"5124,5125","listIndex":3}},{"content":"4. Connect to your project client with the <code>AzureOpenAIResponsesClient</code> class.","children":[],"payload":{"tag":"li","lines":"5125,5126","listIndex":4}},{"content":"5. Create an <code>Agent</code> instance with the client, instructions, and tools you want to use.","children":[],"payload":{"tag":"li","lines":"5126,5128","listIndex":5}}],"payload":{"tag":"li","lines":"5121,5128"}},{"content":"\n<p data-lines=\"5128,5129\">Azure AI Agent key components</p>","children":[{"content":"AzureOpenAIResponsesClient<br>\nManages the connection to your Microsoft Foundry project.<br>\nThis client lets you access the services and models associated with your project and<br>\nprovides enterprise-level authentication and security features.","children":[],"payload":{"tag":"li","lines":"5129,5133"}},{"content":"Agent<br>\nThe main agent class that combines the client, instructions, and tools to create a<br>\nworking AI agent that can handle conversations and complete tasks.","children":[],"payload":{"tag":"li","lines":"5133,5136"}},{"content":"AgentSession<br>\nAutomatically keeps track of conversation history between agents and users, and<br>\nmanages the conversation state.<br>\nYou can create new threads or reuse existing ones to maintain context across interactions.","children":[],"payload":{"tag":"li","lines":"5136,5140"}},{"content":"Tools integration<br>\nSupport for custom functions that extend agent capabilities.<br>\nFunctions are automatically registered and can be called by agents to connect with external APIs and services.","children":[],"payload":{"tag":"li","lines":"5140,5143"}},{"content":"Authentication credentials<br>\nSupports Azure CLI credentials, service principal authentication, and other Azure identity options for<br>\nsecure access to Foundry Tools.","children":[],"payload":{"tag":"li","lines":"5143,5146"}},{"content":"Thread management (AgentThread)<br>\nProvides flexible options for thread creation, including automatic thread creation for simple scenarios and<br>\nexplicit thread management for ongoing conversations.","children":[],"payload":{"tag":"li","lines":"5146,5150"}}],"payload":{"tag":"li","lines":"5128,5150"}}],"payload":{"tag":"li","lines":"5119,5150"}},{"content":"\n<p data-lines=\"5150,5151\"><strong>Add tools to Azure AI agent</strong></p>","children":[{"content":"\n<p data-lines=\"5152,5153\">How to use tools with Microsoft Foundry Agent</p>","children":[{"content":"Built-in tools<br>(without any extra setup)","children":[{"content":"Code Interpreter<br>\nExecutes Python code for calculations, data analysis, and more","children":[],"payload":{"tag":"li","lines":"5154,5156"}},{"content":"File Search<br>\nSearches through and analyzes documents","children":[],"payload":{"tag":"li","lines":"5156,5158"}},{"content":"Web Search<br>\nRetrieves information from the internet","children":[],"payload":{"tag":"li","lines":"5158,5160"}}],"payload":{"tag":"li","lines":"5153,5160"}}],"payload":{"tag":"li","lines":"5152,5160"}},{"content":"\n<p data-lines=\"5160,5161\">Custom function tools</p>","children":[{"content":"Key concepts","children":[{"content":"1. Use the tool decorator<br>\nCreate a custom function tool by defining a Python function and<br>\ndecorating it with the <code>@tool</code> decorator from the Microsoft Agent Framework.<br>\nThis decorator registers your function as a tool that the AI can call.<br>\nThe <code>@tool</code> decorator includes parameters for providing a name and<br>\ndescription for your tool, as well as the <code>approval_mode</code> to specify whether<br>\ntool calls require approval.","children":[],"payload":{"tag":"li","lines":"5162,5169","listIndex":1}},{"content":"2. Function definition and annotations<br>\nCreate your tool by defining a regular Python function with proper type annotations.<br>\nUse <code>Annotated</code> and <code>Field</code> from Pydantic to provide detailed descriptions that help the AI<br>\nunderstand the function&apos;s purpose and how to use its parameters.<br>\nThe more descriptive your annotations, the better the AI can understand when and how to call your function.","children":[],"payload":{"tag":"li","lines":"5169,5174","listIndex":2}},{"content":"3. Adding tools to your agent<br>\nPass your custom functions to the ChatAgent during creation using the <code>tools</code> parameter.<br>\nYou can add a single function or a list of multiple functions.<br>\nThe framework automatically registers these functions and makes them available for the AI to call.","children":[],"payload":{"tag":"li","lines":"5174,5178","listIndex":3}},{"content":"4. Tool invocation through conversation<br>\nOnce your tools are registered with the agent, you don&apos;t need to manually invoke them.<br>\nInstead, ask the agent questions or give it tasks that would naturally require your tool&apos;s functionality.<br>\nThe AI automatically determines when to call your tools based on the conversation context and<br>\nthe tool descriptions you provided.","children":[],"payload":{"tag":"li","lines":"5178,5183","listIndex":4}},{"content":"5. Multiple tools and orchestration<br>\nYou can add multiple tools to a single agent, and the AI automatically chooses which tool to use based on<br>\nthe user&apos;s request.<br>\nThe framework handles the orchestration, calling the appropriate functions and combining their results to<br>\nprovide a comprehensive response.","children":[],"payload":{"tag":"li","lines":"5183,5189","listIndex":5}}],"payload":{"tag":"li","lines":"5161,5189"}}],"payload":{"tag":"li","lines":"5160,5189"}},{"content":"\n<p data-lines=\"5189,5190\">Best practices for tool development</p>","children":[{"content":"Clear descriptions<br>\nWrite clear, detailed descriptions for your functions and parameters to help the AI understand their purpose","children":[],"payload":{"tag":"li","lines":"5190,5192"}},{"content":"Type annotations<br>\nUse proper Python type hints to specify expected input and output types","children":[],"payload":{"tag":"li","lines":"5192,5194"}},{"content":"Error handling<br>\nImplement appropriate error handling in your tool functions to gracefully handle unexpected inputs","children":[],"payload":{"tag":"li","lines":"5194,5196"}},{"content":"Return meaningful data<br>\nEnsure your functions return data that the AI can effectively use in its responses","children":[],"payload":{"tag":"li","lines":"5196,5198"}},{"content":"Keep functions focused<br>\nDesign each tool to handle a specific task rather than trying to do too many things in one function","children":[],"payload":{"tag":"li","lines":"5198,5202"}}],"payload":{"tag":"li","lines":"5189,5202"}}],"payload":{"tag":"li","lines":"5150,5202"}},{"content":"\n<p data-lines=\"5202,5204\"><strong>Exercise - Develop an Azure AI agent with the Microsoft Agent Framework SDK</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-agents/Instructions/Exercises/06-build-workflow-ms-foundry.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"5202,5205"}}],"payload":{"tag":"h3","lines":"5008,5009"}},{"content":"8. <a href=\"https://learn.MS.com/en-us/training/modules/orchestrate-semantic-kernel-multi-agent-solution/\">Orchestrate a multi-agent solution using the MS Agent Framework</a>","children":[{"content":"\n<p data-lines=\"5207,5208\"><strong>Introduction</strong></p>","children":[{"content":"A multi-agent system could consist of four<br>\nspecialized agents working collaboratively","children":[{"content":"<strong>Monitoring Agent</strong><br>\nContinuously ingests logs and metrics, detects anomalies using<br>natural language processing (NLP), and triggers alerts when issues arise.","children":[],"payload":{"tag":"li","lines":"5210,5212"}},{"content":"<strong>Root Cause Analysis Agent</strong><br>\nCorrelates these anomalies with recent system changes, using<br> machine learning models or predefined rules to pinpoint the root cause of the problem.","children":[],"payload":{"tag":"li","lines":"5212,5214"}},{"content":"<strong>Automated Deployment Agent</strong><br>\nTakes over to implement fixes or roll back problematic changes by<br> interacting with CI/CD pipelines and executing deployment scripts.","children":[],"payload":{"tag":"li","lines":"5214,5216"}},{"content":"<strong>Reporting Agent</strong><br>\nGenerates detailed reports summarizing the anomalies, root causes, and<br> resolutions, and notifies stakeholders via email or other communication channels.","children":[],"payload":{"tag":"li","lines":"5216,5219"}}],"payload":{"tag":"li","lines":"5208,5219"}}],"payload":{"tag":"li","lines":"5207,5219"}},{"content":"\n<p data-lines=\"5219,5220\"><strong>Understand the Microsoft Agent Framework</strong></p>","children":[{"content":"\n<p data-lines=\"5220,5224\">What is the Microsoft Agent Framework?<br>\nIs designed to help developers build AI-powered agents that can process user inputs,<br>\nmake decisions, and execute tasks autonomously by leveraging large language models and<br>\ntraditional programming logic</p>","children":[{"content":"Core concepts","children":[{"content":"Agents<br>\nAgents are intelligent, AI-driven entities capable of reasoning and<br>\nexecuting tasks.<br>\nThey use large language models, tools, and conversation history to<br>\nmake decisions dynamically and respond to user needs.","children":[],"payload":{"tag":"li","lines":"5225,5230"}},{"content":"Agent orchestration<br>\nMultiple agents can collaborate towards a common goal using different<br>\norchestration patterns.<br>\nThe Microsoft Agent Framework supports several orchestration patterns with a<br>\nunified interface for construction and invocation, allowing you to easily switch<br>\nbetween patterns without rewriting your agent logic.","children":[],"payload":{"tag":"li","lines":"5230,5236"}}],"payload":{"tag":"li","lines":"5224,5236"}},{"content":"Agent functionality","children":[{"content":"Chat clients<br>\nChat clients provide abstractions for connecting to AI services from different<br>\nproviders under a common interface.<br>\nSupported providers include Azure OpenAI, OpenAI, Anthropic, and more<br>\nthrough the <code>BaseChatClient</code> abstraction.","children":[],"payload":{"tag":"li","lines":"5237,5242"}},{"content":"Tools and function integration<br>\nTools enable agents to extend their capabilities through custom functions and<br>\nbuilt-in services.<br>\nAgents can automatically invoke tools to integrate with external APIs, execute<br>\ncode, search files, or access web information.<br>\nThe framework supports both custom function tools and built-in tools like<br>\nCode Interpreter, File Search, and Web Search.","children":[],"payload":{"tag":"li","lines":"5242,5249"}},{"content":"Conversation management<br>\nAgents can maintain conversation history across multiple interactions using<br>\n<code>AgentSession</code>, allowing them to track previous interactions and adapt<br>\nresponses accordingly.<br>\nThe structured message system uses roles (USER, ASSISTANT, SYSTEM, TOOL)<br>\nfor persistent conversation context.","children":[],"payload":{"tag":"li","lines":"5249,5256"}}],"payload":{"tag":"li","lines":"5236,5256"}}],"payload":{"tag":"li","lines":"5220,5256"}},{"content":"\n<p data-lines=\"5256,5257\">Why you should use the Microsoft Agent Framework</p>","children":[{"content":"<strong>Build autonomous AI agents faster</strong><br>\nUsing a structured framework designed for intelligent, task-oriented workflows.","children":[],"payload":{"tag":"li","lines":"5257,5259"}},{"content":"<strong>Support multi-agent collaboration</strong><br>\nAllowing specialized agents to work together on complex business processes.","children":[],"payload":{"tag":"li","lines":"5259,5261"}},{"content":"<strong>Integrate agents from multiple sources</strong><br>\nIncluding Microsoft Foundry Agent Service and other AI ecosystems.","children":[],"payload":{"tag":"li","lines":"5261,5263"}},{"content":"<strong>Enable human-in-the-loop interactions</strong><br>\nWhere AI agents assist users with insights, recommendations, and automation while keeping humans in control.","children":[],"payload":{"tag":"li","lines":"5263,5265"}},{"content":"<strong>Automate repetitive and operational tasks</strong><br>\nTo improve efficiency and reduce manual effort.","children":[],"payload":{"tag":"li","lines":"5265,5267"}},{"content":"<strong>Orchestrate sophisticated workflows</strong><br>\nBy assigning different responsibilities to different agents, such as data gathering, analysis, and decision-making.","children":[],"payload":{"tag":"li","lines":"5267,5269"}},{"content":"<strong>Remain provider-agnostic</strong><br>\nMaking it possible to switch AI providers without rewriting application logic.","children":[],"payload":{"tag":"li","lines":"5269,5271"}},{"content":"<strong>Increase flexibility and adaptability</strong><br>\nFor evolving AI strategies and enterprise requirements.","children":[],"payload":{"tag":"li","lines":"5271,5273"}},{"content":"<strong>Scale from simple chatbots to enterprise-grade AI systems</strong><br>\nUsing the same framework architecture.","children":[],"payload":{"tag":"li","lines":"5273,5275"}},{"content":"<strong>Simplify development and maintenance</strong><br>\nThrough a unified platform for managing collaborative AI solutions.","children":[],"payload":{"tag":"li","lines":"5275,5278"}}],"payload":{"tag":"li","lines":"5256,5278"}}],"payload":{"tag":"li","lines":"5219,5278"}},{"content":"\n<p data-lines=\"5278,5279\"><strong>Understand agent orchestration</strong></p>","children":[{"content":"\n<p data-lines=\"5280,5281\">Why multi-agent orchestration matters</p>","children":[{"content":"Assign distinct skills, responsibilities, or perspectives to each agent.","children":[],"payload":{"tag":"li","lines":"5281,5282"}},{"content":"Combine outputs from multiple agents to improve decision-making and accuracy.","children":[],"payload":{"tag":"li","lines":"5282,5283"}},{"content":"Coordinate steps in a workflow so each agent&#x2019;s work builds on the last.","children":[],"payload":{"tag":"li","lines":"5283,5284"}},{"content":"Dynamically route control between agents based on context or rules.","children":[],"payload":{"tag":"li","lines":"5284,5286"}}],"payload":{"tag":"li","lines":"5280,5286"}},{"content":"\n<p data-lines=\"5286,5287\">Understand workflows in the Microsoft Agent Framework</p>","children":[{"content":"<strong>Workflows</strong><br>\nStructured sequences of steps used to complete a task","children":[],"payload":{"tag":"li","lines":"5287,5289"}},{"content":"Can include one or more <strong>AI agents</strong>","children":[],"payload":{"tag":"li","lines":"5289,5290"}},{"content":"Can include other components","children":[],"payload":{"tag":"li","lines":"5290,5291"}},{"content":"Enable <strong>multi-agent orchestration</strong>","children":[],"payload":{"tag":"li","lines":"5291,5292"}},{"content":"Support <strong>checkpointing</strong> to save and<br>\nresume workflow states","children":[],"payload":{"tag":"li","lines":"5292,5295"}}],"payload":{"tag":"li","lines":"5286,5295"}},{"content":"\n<p data-lines=\"5295,5296\">Core Components of a Workflow</p>","children":[{"content":"\n<p data-lines=\"5296,5297\">Executors</p>","children":[{"content":"Executors are the main workers in a workflow","children":[],"payload":{"tag":"li","lines":"5297,5298"}},{"content":"Recieve input messages","children":[],"payload":{"tag":"li","lines":"5298,5299"}},{"content":"Perform specific actions","children":[],"payload":{"tag":"li","lines":"5299,5300"}},{"content":"Produce outputs that mov workflow toward<br>\ncompleting its goal","children":[],"payload":{"tag":"li","lines":"5300,5302"}},{"content":"Represent <strong>AI agents</strong> or <strong>custom logic</strong> components","children":[],"payload":{"tag":"li","lines":"5302,5303"}},{"content":"Example  <pre>\n  One executor could analyze a travel request, \n  while another books the flight or hotel \n  based on the results\n  </pre>","children":[],"payload":{"tag":"li","lines":"5303,5309"}}],"payload":{"tag":"li","lines":"5296,5309"}},{"content":"\n<p data-lines=\"5309,5310\">Edges</p>","children":[{"content":"Define <strong>how</strong> messages flow between executors","children":[],"payload":{"tag":"li","lines":"5310,5311"}},{"content":"Determine the logic and order of execution","children":[],"payload":{"tag":"li","lines":"5311,5312"}},{"content":"Type of edges supported","children":[{"content":"Direct edges","children":[{"content":"Connect one executor directly to another in sequence","children":[],"payload":{"tag":"li","lines":"5314,5315"}},{"content":"Example  <pre>\n  After an AI agent gathers user input, the next executor processes the booking.\n  </pre>","children":[],"payload":{"tag":"li","lines":"5315,5319"}}],"payload":{"tag":"li","lines":"5313,5319"}},{"content":"Conditional Edges","children":[{"content":"Trigger only when certain conditions are met","children":[],"payload":{"tag":"li","lines":"5320,5321"}},{"content":"Example  <pre>\n  If hotel rooms are unavailable, the workflow branches to an \n  executor that suggests alternative dates or locations\n  </pre>","children":[],"payload":{"tag":"li","lines":"5321,5326"}}],"payload":{"tag":"li","lines":"5319,5326"}},{"content":"Switch-Case Edges","children":[{"content":"Route messages to different executors based on<br>\npredefined conditions","children":[],"payload":{"tag":"li","lines":"5327,5329"}},{"content":"Example  <pre>\n  VIP customers might be routed to a premium service executor, \n  while others follow the standard process\n  </pre>","children":[],"payload":{"tag":"li","lines":"5329,5334"}}],"payload":{"tag":"li","lines":"5326,5334"}},{"content":"Fan-Out Edges","children":[{"content":"Send a single message to multiple<br>\nexecutors simultaneously","children":[],"payload":{"tag":"li","lines":"5335,5337"}},{"content":"Example  <pre>\n  One request could be sent to several agents -\n  - one checking flights, another checking hotels\n  </pre>","children":[],"payload":{"tag":"li","lines":"5337,5342"}}],"payload":{"tag":"li","lines":"5334,5342"}},{"content":"Fan-In Edges","children":[{"content":"Combine multiple messages from different executors<br>\ninto one for a final step","children":[],"payload":{"tag":"li","lines":"5343,5345"}},{"content":"Example  <pre>\n  After gathering hotel and flight results, a \n  summary executor compiles them into a single travel itinerary\n  </pre>","children":[],"payload":{"tag":"li","lines":"5345,5350"}}],"payload":{"tag":"li","lines":"5342,5350"}}],"payload":{"tag":"li","lines":"5312,5350"}}],"payload":{"tag":"li","lines":"5309,5350"}},{"content":"\n<p data-lines=\"5350,5351\">Events</p>","children":[{"content":"Includes built-in events to improve <strong>observability</strong> and<br>\n<strong>debugging</strong> during workflow execution","children":[],"payload":{"tag":"li","lines":"5351,5353"}},{"content":"Bring structure, flexibility, and transparency to agent-driven applications","children":[],"payload":{"tag":"li","lines":"5353,5354"}},{"content":"Help developers monitor","children":[{"content":"Progress","children":[],"payload":{"tag":"li","lines":"5355,5356"}},{"content":"Track errors","children":[],"payload":{"tag":"li","lines":"5356,5357"}},{"content":"Analyze system performance","children":[],"payload":{"tag":"li","lines":"5357,5358"}}],"payload":{"tag":"li","lines":"5354,5358"}},{"content":"Examples\n<table data-lines=\"5359,5367\">\n<thead data-lines=\"5359,5360\">\n<tr data-lines=\"5359,5360\">\n<th style=\"text-align:left\">Event Name</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"5361,5367\">\n<tr data-lines=\"5361,5362\">\n<td style=\"text-align:left\">WorkflowStartedEvent</td>\n<td style=\"text-align:left\">Triggered when workflow execution begins</td>\n</tr>\n<tr data-lines=\"5362,5363\">\n<td style=\"text-align:left\">WorkflowOutputEvent</td>\n<td style=\"text-align:left\">Emitted when the workflow produces an output</td>\n</tr>\n<tr data-lines=\"5363,5364\">\n<td style=\"text-align:left\">WorkflowErrorEvent</td>\n<td style=\"text-align:left\">Occurs when an error is encountered</td>\n</tr>\n<tr data-lines=\"5364,5365\">\n<td style=\"text-align:left\">ExecutorInvokeEvent</td>\n<td style=\"text-align:left\">Fired when an executor starts processing a task</td>\n</tr>\n<tr data-lines=\"5365,5366\">\n<td style=\"text-align:left\">ExecutorCompleteEvent</td>\n<td style=\"text-align:left\">Fired when an executor finishes its work</td>\n</tr>\n<tr data-lines=\"5366,5367\">\n<td style=\"text-align:left\">RequestInfoEvent</td>\n<td style=\"text-align:left\">Logged when an external request is issued</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"5358,5368"}}],"payload":{"tag":"li","lines":"5350,5368"}},{"content":"\n<p data-lines=\"5368,5369\">Supported orchestration patterns</p>","children":[{"content":"Concurrent orchestration<br>\nBroadcast the same task to multiple agents at once and collect their results independently.<br>\nUseful for parallel analysis, independent subtasks, or ensemble decision making.","children":[],"payload":{"tag":"li","lines":"5369,5372"}},{"content":"Sequential orchestration<br>\nPass the output from one agent to the next in a fixed order.<br>\nIdeal for step-by-step workflows, pipelines, and<br>\nprogressive refinement.","children":[],"payload":{"tag":"li","lines":"5372,5376"}},{"content":"Handoff orchestration<br>\nDynamically transfer control between agents based on context or rules.<br>\nGreat for escalation, fallback, and expert routing where one<br>\nagent works at a time.","children":[],"payload":{"tag":"li","lines":"5376,5380"}},{"content":"Group chat orchestration<br>\nCoordinate a shared conversation among multiple agents (and optionally a human),<br>\nmanaged by a chat manager that chooses who speaks next.<br>\nBest for brainstorming, collaborative problem solving, and building consensus.","children":[],"payload":{"tag":"li","lines":"5380,5384"}},{"content":"Magentic orchestration<br>\nA manager-driven approach that plans, delegates, and adapts across specialized agents.<br>\nSuited to complex, open-ended problems where the solution path evolves.","children":[],"payload":{"tag":"li","lines":"5384,5388"}}],"payload":{"tag":"li","lines":"5368,5388"}}],"payload":{"tag":"li","lines":"5295,5388"}},{"content":"\n<p data-lines=\"5388,5389\">A unified orchestration workflow</p>","children":[{"content":"1. Define your agents and describe their capabilities.","children":[],"payload":{"tag":"li","lines":"5389,5390","listIndex":1}},{"content":"2. Select and create an orchestration pattern, optionally adding a manager agent if needed.","children":[],"payload":{"tag":"li","lines":"5390,5391","listIndex":2}},{"content":"3. Optionally configure callbacks or transforms for custom input and output handling.","children":[],"payload":{"tag":"li","lines":"5391,5392","listIndex":3}},{"content":"4. Start a runtime to manage execution.","children":[],"payload":{"tag":"li","lines":"5392,5393","listIndex":4}},{"content":"5. Invoke the orchestration with your task.","children":[],"payload":{"tag":"li","lines":"5393,5394","listIndex":5}},{"content":"6. Retrieve results in an asynchronous, nonblocking way.","children":[],"payload":{"tag":"li","lines":"5394,5396","listIndex":6}}],"payload":{"tag":"li","lines":"5388,5396"}}],"payload":{"tag":"li","lines":"5278,5396"}},{"content":"\n<p data-lines=\"5396,5397\"><strong>Use concurrent orchestration</strong></p>","children":[{"content":"\n<p data-lines=\"5398,5399\">What is concurrent orchestration</p>","children":[{"content":"Lets multiple agents work on the same task at the same time","children":[],"payload":{"tag":"li","lines":"5399,5400"}},{"content":"Each agent handles the task independently","children":[],"payload":{"tag":"li","lines":"5400,5401"}},{"content":"Then their outputs are gathered and combined","children":[],"payload":{"tag":"li","lines":"5401,5402"}},{"content":"Works well when you want diverse approaches or solutions","children":[{"content":"Brainstorming","children":[],"payload":{"tag":"li","lines":"5403,5404"}},{"content":"Group decision-making","children":[],"payload":{"tag":"li","lines":"5404,5405"}},{"content":"Voting","children":[],"payload":{"tag":"li","lines":"5405,5406"}}],"payload":{"tag":"li","lines":"5402,5406"}},{"content":"When you need different approaches or ideas to solve the same problem","children":[],"payload":{"tag":"li","lines":"5406,5407"}},{"content":"All agents work at the same time","children":[],"payload":{"tag":"li","lines":"5407,5408"}},{"content":"Speeds up the process and covers the problem from many angles","children":[],"payload":{"tag":"li","lines":"5408,5409"}},{"content":"Usually, the results from each agent are combined to create a final answer,<br>\nbut this isn&#x2019;t always necessary","children":[],"payload":{"tag":"li","lines":"5409,5411"}},{"content":"Agent can also produce its own separate result","children":[],"payload":{"tag":"li","lines":"5411,5413"}}],"payload":{"tag":"li","lines":"5398,5413"}},{"content":"\n<p data-lines=\"5413,5414\">When to use concurrent orchestration</p>","children":[{"content":"When tasks can run at the same time,<br>\neither by using a fixed group of agents or by<br>\nselecting AI agents dynamically based on what the task needs.","children":[],"payload":{"tag":"li","lines":"5414,5417"}},{"content":"When the task benefits from different specialized skills or<br>\napproaches (for example, technical, business, or creative) that<br>\nall work independently but contribute to solving the same problem.","children":[],"payload":{"tag":"li","lines":"5417,5420"}},{"content":"Common in multi-agent decision-making methods","children":[{"content":"Brainstorming ideas","children":[],"payload":{"tag":"li","lines":"5421,5422"}},{"content":"Combining different reasoning methods (ensemble reasoning)","children":[],"payload":{"tag":"li","lines":"5422,5423"}},{"content":"Making decisions based on voting or consensus (quorum)","children":[],"payload":{"tag":"li","lines":"5423,5424"}},{"content":"Handling tasks where speed matters and running agents in parallel cuts down wait time","children":[],"payload":{"tag":"li","lines":"5424,5426"}}],"payload":{"tag":"li","lines":"5420,5426"}}],"payload":{"tag":"li","lines":"5413,5426"}},{"content":"\n<p data-lines=\"5426,5427\">When to avoid concurrent orchestration</p>","children":[{"content":"Agents need to build on each other&apos;s work or depend on<br>\nshared context in a specific order.","children":[],"payload":{"tag":"li","lines":"5427,5429"}},{"content":"The task requires a strict sequence of steps or predictable,<br>\nrepeatable results.","children":[],"payload":{"tag":"li","lines":"5429,5431"}},{"content":"Resource limits, like model usage quotas, make running agents in<br>\nparallel inefficient or impossible.","children":[],"payload":{"tag":"li","lines":"5431,5433"}},{"content":"Agents can&apos;t reliably coordinate changes to shared data or<br>\nexternal systems while running at the same time.","children":[],"payload":{"tag":"li","lines":"5433,5435"}},{"content":"There&apos;s no clear way to resolve conflicts or contradictions between<br>\nresults from different agents.","children":[],"payload":{"tag":"li","lines":"5435,5437"}},{"content":"Combining results is too complicated or ends up<br>\nlowering the overall quality.","children":[],"payload":{"tag":"li","lines":"5437,5440"}}],"payload":{"tag":"li","lines":"5426,5440"}},{"content":"\n<p data-lines=\"5440,5441\">Implement concurrent orchestration</p>","children":[{"content":"1. Create your chat client<br>\nSet up a chat client (for example, <code>AzureOpenAIChatClient</code>) with<br>\nappropriate credentials to connect to your AI service provider.","children":[],"payload":{"tag":"li","lines":"5441,5444","listIndex":1}},{"content":"2. Define your agents<br>\nCreate agent instances using the chat client&apos;s <code>create_agent</code> method.<br>\nEach agent should have specific instructions and a name that defines<br>\nits role and expertise area.","children":[],"payload":{"tag":"li","lines":"5444,5448","listIndex":2}},{"content":"3. Build the concurrent workflow<br>\nUse the <code>ConcurrentBuilder</code> class to create a workflow that can run<br>\nmultiple agents in parallel.<br>\nAdd your agent instances as participants using the <code>participants()</code> method, then call <code>build()</code> to create the workflow.","children":[],"payload":{"tag":"li","lines":"5448,5452","listIndex":3}},{"content":"4. Run the workflow<br>\nCall the workflow&apos;s <code>run</code> method with the task or input you want the agents to work on.<br>\nThe workflow runs all agents concurrently and returns events containing the results.","children":[],"payload":{"tag":"li","lines":"5452,5455","listIndex":4}},{"content":"5. Process the results<br>\nExtract the outputs from the workflow events using <code>get_outputs()</code>.<br>\nThe results contain the combined conversations from all agents,<br>\nwith each agent&apos;s response included in the final output.","children":[],"payload":{"tag":"li","lines":"5455,5459","listIndex":5}},{"content":"6. Handle the aggregated responses<br>\nProcess the aggregated messages from all agents.<br>\nEach message includes the author name and content, allowing you to<br>\nidentify which agent provided each response.","children":[],"payload":{"tag":"li","lines":"5459,5464","listIndex":6}}],"payload":{"tag":"li","lines":"5440,5464"}}],"payload":{"tag":"li","lines":"5396,5464"}},{"content":"\n<p data-lines=\"5464,5465\"><strong>Use sequential orchestration</strong></p>","children":[{"content":"\n<p data-lines=\"5466,5467\">What is sequential orchestration</p>","children":[{"content":"Agents are arranged in a pipeline where each agent<br>\nprocesses the task one after another","children":[],"payload":{"tag":"li","lines":"5467,5469"}},{"content":"The output from one agent becomes the input for the next","children":[],"payload":{"tag":"li","lines":"5469,5470"}},{"content":"Is ideal for workflows where each step depends on the previous one","children":[{"content":"Document review","children":[],"payload":{"tag":"li","lines":"5471,5472"}},{"content":"Data transformation pipelines","children":[],"payload":{"tag":"li","lines":"5472,5473"}},{"content":"Multi-stage reasoning","children":[],"payload":{"tag":"li","lines":"5473,5475"}}],"payload":{"tag":"li","lines":"5470,5475"}}],"payload":{"tag":"li","lines":"5466,5475"}},{"content":"\n<p data-lines=\"5475,5476\">When to use sequential orchestration</p>","children":[{"content":"Processes made up of multiple steps that must happen in a specific order,<br>\nwhere each step relies on the one before it.","children":[],"payload":{"tag":"li","lines":"5476,5478"}},{"content":"Data workflows where each stage adds something important that the next stage<br>\nneeds to work properly.","children":[],"payload":{"tag":"li","lines":"5478,5480"}},{"content":"Tasks where stages can&apos;t be done at the same time and must run one after another.","children":[],"payload":{"tag":"li","lines":"5480,5481"}},{"content":"Situations that require gradual improvements, like drafting, reviewing, and polishing content.","children":[],"payload":{"tag":"li","lines":"5481,5482"}},{"content":"Systems where you know how each agent performs and can handle delays or<br>\nfailures in any step without stopping the whole process.","children":[],"payload":{"tag":"li","lines":"5482,5485"}}],"payload":{"tag":"li","lines":"5475,5485"}},{"content":"\n<p data-lines=\"5485,5486\">When to avoid sequential orchestration</p>","children":[{"content":"Stages can be run independently and in parallel without affecting quality.","children":[],"payload":{"tag":"li","lines":"5486,5487"}},{"content":"A single agent can perform the entire task effectively.","children":[],"payload":{"tag":"li","lines":"5487,5488"}},{"content":"Early stages may fail or produce poor output, and<br>\nthere&apos;s no way to stop or correct downstream processing based on errors.","children":[],"payload":{"tag":"li","lines":"5488,5490"}},{"content":"Agents need to collaborate dynamically rather than hand off work sequentially.","children":[],"payload":{"tag":"li","lines":"5490,5491"}},{"content":"The workflow requires iteration, backtracking, or dynamic routing based on<br>\nintermediate results.","children":[],"payload":{"tag":"li","lines":"5491,5494"}}],"payload":{"tag":"li","lines":"5485,5494"}},{"content":"\n<p data-lines=\"5494,5495\">Implement sequential orchestration</p>","children":[{"content":"1. Create your chat client<br>\nSet up a chat client (for example, <code>AzureOpenAIChatClient</code>) with<br>\nappropriate credentials to connect to your AI service provider.","children":[],"payload":{"tag":"li","lines":"5495,5498","listIndex":1}},{"content":"2. Define y
