our agents<br>\nCreate agent instances using the chat client&apos;s <code>create_agent</code> method.<br>\nEach agent should have specific instructions and a name that defines its role and<br>\nexpertise area in the pipeline.","children":[],"payload":{"tag":"li","lines":"5498,5502","listIndex":2}},{"content":"3. Build the sequential workflow<br>\nUse the <code>SequentialBuilder</code> class to create a workflow that executes agents one after another.<br>\nAdd your agent instances as participants using the <code>participants()</code> method, then call <code>build()</code> to create the workflow.","children":[],"payload":{"tag":"li","lines":"5502,5505","listIndex":3}},{"content":"4. Run the workflow<br>\nCall the workflow&apos;s <code>run_stream</code> method with the task or input you want the agents to work on.<br>\nThe workflow processes the task through all agents sequentially, with each agent&apos;s output becoming input for the next.","children":[],"payload":{"tag":"li","lines":"5505,5508","listIndex":4}},{"content":"5. Process the workflow events<br>\nIterate through the workflow events using an async loop.<br>\nLook for <code>WorkflowOutputEvent</code> instances, which contain the results from the sequential processing.","children":[],"payload":{"tag":"li","lines":"5508,5511","listIndex":5}},{"content":"6. Extract the final conversation<br>\nCollect the final conversation from the workflow outputs.<br>\nThe result contains the complete conversation history showing how each agent in the<br>\nsequence contributed to the final outcome.","children":[],"payload":{"tag":"li","lines":"5511,5516","listIndex":6}}],"payload":{"tag":"li","lines":"5494,5516"}}],"payload":{"tag":"li","lines":"5464,5516"}},{"content":"\n<p data-lines=\"5516,5517\"><strong>Use group chat orchestration</strong></p>","children":[{"content":"\n<p data-lines=\"5518,5519\">What is group chat orchestration</p>","children":[{"content":"A collaborative conversation among multiple AI agents","children":[],"payload":{"tag":"li","lines":"5519,5520"}},{"content":"Optionally a human participant","children":[],"payload":{"tag":"li","lines":"5520,5521"}},{"content":"A central chat manager controls the flow","children":[{"content":"Which agent responds next","children":[],"payload":{"tag":"li","lines":"5522,5523"}},{"content":"When to request human input","children":[],"payload":{"tag":"li","lines":"5523,5524"}}],"payload":{"tag":"li","lines":"5521,5524"}},{"content":"Useful for","children":[{"content":"Simulating meetings","children":[],"payload":{"tag":"li","lines":"5525,5526"}},{"content":"Debates","children":[],"payload":{"tag":"li","lines":"5526,5527"}},{"content":"Collaborative problem-solving","children":[],"payload":{"tag":"li","lines":"5527,5528"}},{"content":"Human-in-the-loop setups where a human<br>\nmay guide or intervene in the conversation","children":[],"payload":{"tag":"li","lines":"5528,5530"}},{"content":"Agents in this pattern don&apos;t directly<br>\nchange running systems","children":[],"payload":{"tag":"li","lines":"5530,5533"}}],"payload":{"tag":"li","lines":"5524,5533"}}],"payload":{"tag":"li","lines":"5518,5533"}},{"content":"\n<p data-lines=\"5533,5534\">When to use group chat orchestration</p>","children":[{"content":"Spontaneous or guided collaboration among agents (and possibly humans)","children":[],"payload":{"tag":"li","lines":"5534,5535"}},{"content":"Iterative maker-checker loops where agents take turns creating and reviewing","children":[],"payload":{"tag":"li","lines":"5535,5536"}},{"content":"Real-time human oversight or participation","children":[],"payload":{"tag":"li","lines":"5536,5537"}},{"content":"Transparent and auditable conversations since all output is collected in a single thread","children":[],"payload":{"tag":"li","lines":"5537,5538"}},{"content":"Common scenarios","children":[{"content":"Creative brainstorming where agents build on each other&apos;s ideas","children":[],"payload":{"tag":"li","lines":"5539,5540"}},{"content":"Decision-making that benefits from debate and consensus","children":[],"payload":{"tag":"li","lines":"5540,5541"}},{"content":"Complex problems requiring cross-disciplinary dialogue","children":[],"payload":{"tag":"li","lines":"5541,5542"}},{"content":"Quality control and validation requiring multiple expert perspectives","children":[],"payload":{"tag":"li","lines":"5542,5543"}},{"content":"Content workflows with clear separation between creation and review","children":[],"payload":{"tag":"li","lines":"5543,5545"}}],"payload":{"tag":"li","lines":"5538,5545"}}],"payload":{"tag":"li","lines":"5533,5545"}},{"content":"\n<p data-lines=\"5545,5546\">When to avoid group chat orchestration</p>","children":[{"content":"Simple task delegation or straightforward linear pipelines suffice","children":[],"payload":{"tag":"li","lines":"5546,5547"}},{"content":"Real-time speed requirements make discussion overhead impractical","children":[],"payload":{"tag":"li","lines":"5547,5548"}},{"content":"Hierarchical or deterministic workflows are needed without discussion","children":[],"payload":{"tag":"li","lines":"5548,5549"}},{"content":"The chat manager can&apos;t clearly determine when the task is complete","children":[],"payload":{"tag":"li","lines":"5549,5550"}},{"content":"Managing conversation flow becomes too complex, especially with many agents<br>\n(limit to three or fewer for easier control)","children":[],"payload":{"tag":"li","lines":"5550,5553"}}],"payload":{"tag":"li","lines":"5545,5553"}},{"content":"\n<p data-lines=\"5553,5554\">Maker-checker loops</p>","children":[{"content":"One agent (the maker) proposes content or solutions","children":[],"payload":{"tag":"li","lines":"5554,5555"}},{"content":"Another agent (the checker) reviews and critiques them","children":[],"payload":{"tag":"li","lines":"5555,5556"}},{"content":"Checker can send feedback back to the maker","children":[],"payload":{"tag":"li","lines":"5556,5557"}},{"content":"This cycle repeats until the result is satisfactory","children":[],"payload":{"tag":"li","lines":"5557,5558"}},{"content":"Requires a turn-based sequence managed by the chat manager","children":[],"payload":{"tag":"li","lines":"5558,5560"}}],"payload":{"tag":"li","lines":"5553,5560"}},{"content":"\n<p data-lines=\"5560,5561\">Implement group chat orchestration</p>","children":[{"content":"1. Create your chat client<br>\nSet up a chat client (for example, <code>AzureOpenAIChatClient</code>) with<br>\nappropriate credentials to connect to your AI service provider.","children":[],"payload":{"tag":"li","lines":"5561,5564","listIndex":1}},{"content":"2. Define your agents<br>\nCreate agent instances using the chat client&apos;s <code>create_agent</code> method.<br>\nEach agent should have specific instructions and a name that defines its role and expertise area.","children":[],"payload":{"tag":"li","lines":"5564,5567","listIndex":2}},{"content":"3. Build the group chat workflow<br>\nUse the <code>GroupChatBuilder</code> class to create a workflow that can run multiple agents in parallel.<br>\nAdd your agent instances as participants using the <code>participants()</code> method, then call <code>build()</code> to create the workflow.","children":[],"payload":{"tag":"li","lines":"5567,5570","listIndex":3}},{"content":"4. Run the workflow<br>\nCall the workflow&apos;s run method with the task or input you want the agents to work on.<br>\nThe workflow runs all agents concurrently and returns events containing the results.","children":[],"payload":{"tag":"li","lines":"5570,5573","listIndex":4}},{"content":"5. Process the results<br>\nExtract the outputs from the workflow events using <code>get_outputs()</code>.<br>\nThe results contain the combined conversations from all agents, with each agent&apos;s<br>\nresponse included in the final output.","children":[],"payload":{"tag":"li","lines":"5573,5577","listIndex":5}},{"content":"6. Handle the aggregated responses<br>\nProcess the aggregated messages from all agents.<br>\nEach message includes the author name and content, allowing you to identify which agent provided each response.","children":[],"payload":{"tag":"li","lines":"5577,5581","listIndex":6}}],"payload":{"tag":"li","lines":"5560,5581"}},{"content":"\n<p data-lines=\"5581,5582\">Customizing the group chat manager</p>","children":[{"content":"Create a custom group chat manager by extending the base <code>GroupChatManager</code> class","children":[],"payload":{"tag":"li","lines":"5582,5583"}},{"content":"Lets you control","children":[{"content":"How conversation results are filtered or summarized","children":[],"payload":{"tag":"li","lines":"5584,5585"}},{"content":"How the next agent is selected","children":[],"payload":{"tag":"li","lines":"5585,5586"}},{"content":"When to request user input","children":[],"payload":{"tag":"li","lines":"5586,5587"}},{"content":"When to terminate the conversation","children":[],"payload":{"tag":"li","lines":"5587,5588"}}],"payload":{"tag":"li","lines":"5583,5588"}},{"content":"Custom managers let you implement specialized logic tailored to your use case","children":[],"payload":{"tag":"li","lines":"5588,5590"}}],"payload":{"tag":"li","lines":"5581,5590"}},{"content":"\n<p data-lines=\"5590,5591\">Group chat manager call order</p>","children":[{"content":"1. <code>should_request_user_input</code><br>\nChecks if human input is needed before the next agent responds.","children":[],"payload":{"tag":"li","lines":"5591,5593","listIndex":1}},{"content":"2. <code>should_terminate</code><br>\nDetermines if the conversation should end (for example, max rounds reached).","children":[],"payload":{"tag":"li","lines":"5593,5595","listIndex":2}},{"content":"3. <code>filter_results</code><br>\nIf ending, summarizes or processes the final conversation.","children":[],"payload":{"tag":"li","lines":"5595,5597","listIndex":3}},{"content":"4. <code>select_next_agent</code><br>\nIf continuing, chooses the next agent to speak.","children":[],"payload":{"tag":"li","lines":"5597,5599","listIndex":4}},{"content":"5. This ensures user input and termination conditions are handled before<br>\nmoving the conversation forward","children":[],"payload":{"tag":"li","lines":"5599,5602","listIndex":5}}],"payload":{"tag":"li","lines":"5590,5602"}}],"payload":{"tag":"li","lines":"5516,5602"}},{"content":"\n<p data-lines=\"5602,5603\"><strong>Use handoff orchestration</strong></p>","children":[{"content":"\n<p data-lines=\"5604,5605\">What is handoff orchestration</p>","children":[{"content":"Lets AI agents transfer control to one another based on the<br>\ntask context or user requests","children":[],"payload":{"tag":"li","lines":"5605,5607"}},{"content":"Is ideal for customer support, expert systems, or any situation<br>\nwhere dynamic delegation is needed","children":[],"payload":{"tag":"li","lines":"5607,5609"}},{"content":"Fits scenarios where the best agent isn&apos;t known upfront or<br>\nwhere the task requirements become clearer during processing","children":[],"payload":{"tag":"li","lines":"5609,5612"}}],"payload":{"tag":"li","lines":"5604,5612"}},{"content":"\n<p data-lines=\"5612,5613\">When to use handoff orchestration</p>","children":[{"content":"Tasks need specialized knowledge or tools, but the number or order of agents can&apos;t be determined in advance.","children":[],"payload":{"tag":"li","lines":"5613,5614"}},{"content":"Expertise requirements emerge dynamically during processing, triggering task routing based on content analysis.","children":[],"payload":{"tag":"li","lines":"5614,5615"}},{"content":"Multiple-domain problems require different specialists working sequentially.","children":[],"payload":{"tag":"li","lines":"5615,5616"}},{"content":"You can define clear signals or rules indicating when an agent should transfer control and to whom.","children":[],"payload":{"tag":"li","lines":"5616,5618"}}],"payload":{"tag":"li","lines":"5612,5618"}},{"content":"\n<p data-lines=\"5618,5619\">When to avoid handoff orchestration</p>","children":[{"content":"The involved agents and their order are known upfront and fixed.","children":[],"payload":{"tag":"li","lines":"5619,5620"}},{"content":"Task routing is simple and rule-based, not needing dynamic interpretation.","children":[],"payload":{"tag":"li","lines":"5620,5621"}},{"content":"Poor routing decisions might frustrate users.","children":[],"payload":{"tag":"li","lines":"5621,5622"}},{"content":"Multiple operations must run at the same time.","children":[],"payload":{"tag":"li","lines":"5622,5623"}},{"content":"Avoiding infinite handoff loops or excessive bouncing between agents is difficult.","children":[],"payload":{"tag":"li","lines":"5623,5625"}}],"payload":{"tag":"li","lines":"5618,5625"}},{"content":"\n<p data-lines=\"5625,5626\">Implementing handoff orchestration</p>","children":[{"content":"1. This routing is done using a switch-case structure that<br>\nroutes the task to different agents based on classification results","children":[],"payload":{"tag":"li","lines":"5626,5628","listIndex":1}},{"content":"2. Set up data models and chat client","children":[{"content":"Create your chat client for connecting to AI services","children":[],"payload":{"tag":"li","lines":"5629,5630"}},{"content":"Define Pydantic models for AI agents&apos; structured JSON responses","children":[],"payload":{"tag":"li","lines":"5630,5631"}},{"content":"Create simple data classes for passing information between workflow steps","children":[],"payload":{"tag":"li","lines":"5631,5632"}},{"content":"Configure agents with specific instructions and response_format parameter for<br>\nstructured JSON output","children":[],"payload":{"tag":"li","lines":"5632,5634"}}],"payload":{"tag":"li","lines":"5628,5634","listIndex":2}},{"content":"3. Create specialized executor functions","children":[{"content":"Input storage executor<br>\nSaves incoming data to shared state and forwards to classification agent","children":[],"payload":{"tag":"li","lines":"5635,5637"}},{"content":"Transformation executor<br>\nConverts agent&apos;s JSON response into typed routing object","children":[],"payload":{"tag":"li","lines":"5637,5639"}},{"content":"Handler executors<br>\nSeparate executors for each classification outcome with guard conditions to<br>\nverify correct message processing","children":[],"payload":{"tag":"li","lines":"5639,5642"}}],"payload":{"tag":"li","lines":"5634,5642","listIndex":3}},{"content":"4. Build routing logic","children":[{"content":"Create factory functions that generate condition checkers for each classification value","children":[],"payload":{"tag":"li","lines":"5643,5644"}},{"content":"Design conditions to examine incoming messages and return true for specific classification results","children":[],"payload":{"tag":"li","lines":"5644,5645"}},{"content":"Use conditions with Case objects in switch-case edge groups","children":[],"payload":{"tag":"li","lines":"5645,5646"}},{"content":"Always include a Default case as fallback for unexpected scenarios","children":[],"payload":{"tag":"li","lines":"5646,5647"}}],"payload":{"tag":"li","lines":"5642,5647","listIndex":4}},{"content":"5. Assemble the workflow","children":[{"content":"Use WorkflowBuilder to connect executors with regular edges","children":[],"payload":{"tag":"li","lines":"5648,5649"}},{"content":"Add switch-case edge group for routing based on classification results","children":[],"payload":{"tag":"li","lines":"5649,5650"}},{"content":"Configure workflow to follow first matching case or fall back to default","children":[],"payload":{"tag":"li","lines":"5650,5651"}},{"content":"Set up terminal executor to yield final output","children":[],"payload":{"tag":"li","lines":"5651,5653"}}],"payload":{"tag":"li","lines":"5647,5653","listIndex":5}}],"payload":{"tag":"li","lines":"5625,5653"}}],"payload":{"tag":"li","lines":"5602,5653"}},{"content":"\n<p data-lines=\"5653,5654\"><strong>Use Magentic orchestration</strong></p>","children":[{"content":"\n<p data-lines=\"5655,5656\">What is magnetic orchestration</p>","children":[{"content":"Is a flexible, general-purpose multi-agent pattern designed for complex,<br>\nopen-ended tasks that require dynamic collaboration","children":[],"payload":{"tag":"li","lines":"5656,5658"}},{"content":"Uses a dedicated Magentic manager to coordinate a team of specialized agents","children":[],"payload":{"tag":"li","lines":"5658,5659"}},{"content":"The manager decides which agent should act next based","children":[{"content":"The evolving context","children":[],"payload":{"tag":"li","lines":"5660,5661"}},{"content":"Task progress","children":[],"payload":{"tag":"li","lines":"5661,5662"}},{"content":"Agent capabilities.","children":[],"payload":{"tag":"li","lines":"5662,5663"}}],"payload":{"tag":"li","lines":"5659,5663"}},{"content":"Allows the system to break down complex problems, assign subtasks, and<br>\niteratively refine solutions","children":[],"payload":{"tag":"li","lines":"5663,5665"}},{"content":"Focuses as much on building and documenting the approach as it does on<br>\ndelivering the final solution","children":[],"payload":{"tag":"li","lines":"5665,5668"}}],"payload":{"tag":"li","lines":"5655,5668"}},{"content":"\n<p data-lines=\"5668,5669\">When to use Magentic orchestration</p>","children":[{"content":"The problem is complex or open-ended with no predetermined solution path.","children":[],"payload":{"tag":"li","lines":"5669,5670"}},{"content":"Input and feedback from multiple specialized agents are needed to shape a valid solution.","children":[],"payload":{"tag":"li","lines":"5670,5671"}},{"content":"The system must generate a documented plan of approach for human review.","children":[],"payload":{"tag":"li","lines":"5671,5672"}},{"content":"Agents have tools that can directly interact with external systems and resources.","children":[],"payload":{"tag":"li","lines":"5672,5673"}},{"content":"A step-by-step, dynamically built execution plan adds value before running the tasks.","children":[],"payload":{"tag":"li","lines":"5673,5675"}}],"payload":{"tag":"li","lines":"5668,5675"}},{"content":"\n<p data-lines=\"5675,5676\">When to avoid Magentic orchestration</p>","children":[{"content":"The solution path is fixed or deterministic.","children":[],"payload":{"tag":"li","lines":"5676,5677"}},{"content":"There&apos;s no need to produce a ledger or plan of approach.","children":[],"payload":{"tag":"li","lines":"5677,5678"}},{"content":"The task is simple enough for a more lightweight orchestration pattern.","children":[],"payload":{"tag":"li","lines":"5678,5679"}},{"content":"Speed is the priority, as this method emphasizes planning over fast execution.","children":[],"payload":{"tag":"li","lines":"5679,5680"}},{"content":"You expect frequent stalls or loops without a clear resolution path.","children":[],"payload":{"tag":"li","lines":"5680,5682"}}],"payload":{"tag":"li","lines":"5675,5682"}},{"content":"\n<p data-lines=\"5682,5683\">Implementing Magentic orchestration</p>","children":[{"content":"1. Define specialized agents<br>\nCreate agent instances (for example, <code>ChatAgent</code>) with specific instructions and chat clients.<br>\nEach agent should have a specialized role and capabilities suited for different aspects of the complex task.","children":[],"payload":{"tag":"li","lines":"5683,5686","listIndex":1}},{"content":"2. Set up event handling callback<br>\nDefine an async callback function to handle different types of events during orchestration,<br>\nincluding orchestrator messages, agent streaming updates, agent messages, and final results.","children":[],"payload":{"tag":"li","lines":"5686,5689","listIndex":2}},{"content":"3. Build the Magentic workflow<br>\nUse the <code>MagenticBuilder</code> class to create the orchestration.<br>\nAdd your agent instances as participants, configure the event callback with streaming mode, and<br>\nset up the standard manager with appropriate parameters like max round count and stall limits.","children":[],"payload":{"tag":"li","lines":"5689,5693","listIndex":3}},{"content":"4. Configure the standard manager<br>\nThe standard manager coordinates agent collaboration using a chat client for planning and progress tracking.<br>\nConfigure parameters like maximum round count, stall count, and reset count to control the orchestration behavior.","children":[],"payload":{"tag":"li","lines":"5693,5696","listIndex":4}},{"content":"5. Run the workflow<br>\nCall the workflow&apos;s <code>run_stream</code> method with your complex task.<br>\nThe workflow dynamically plans, delegates work to appropriate agents, and coordinates their collaboration to solve the problem.","children":[],"payload":{"tag":"li","lines":"5696,5699","listIndex":5}},{"content":"6. Process workflow events<br>\nIterate through the workflow events using an async loop.<br>\nHandle different event types including <code>WorkflowOutputEvent</code>, which contains the final results from the orchestration.","children":[],"payload":{"tag":"li","lines":"5699,5702","listIndex":6}},{"content":"7. Extract the final result<br>\nCollect the final output from the workflow events.<br>\nThe result contains the complete solution developed through the collaborative effort of all participating agents","children":[],"payload":{"tag":"li","lines":"5702,5706","listIndex":7}}],"payload":{"tag":"li","lines":"5682,5706"}}],"payload":{"tag":"li","lines":"5653,5706"}},{"content":"\n<p data-lines=\"5706,5707\"><strong>Key takeaways</strong></p>","children":[{"content":"Multi-agent systems offer significant advantages over single-agent architectures,<br>\nespecially in <strong>scalability</strong>, <strong>specialization</strong>, and <strong>collaborative problem solving</strong>.","children":[],"payload":{"tag":"li","lines":"5707,5709"}},{"content":"The Microsoft Agent Framework SDK enables the design and management of<br>\nsophisticated multi-agent orchestration workflows.","children":[],"payload":{"tag":"li","lines":"5709,5711"}},{"content":"Different orchestration patterns serve different purposes and use cases","children":[{"content":"<strong>Concurrent orchestration</strong> for parallel task execution","children":[],"payload":{"tag":"li","lines":"5712,5713"}},{"content":"<strong>Sequential orchestration</strong> for step-by-step workflows","children":[],"payload":{"tag":"li","lines":"5713,5714"}},{"content":"<strong>Handoff orchestration</strong> for transferring responsibility between agents","children":[],"payload":{"tag":"li","lines":"5714,5715"}},{"content":"<strong>Group chat orchestration</strong> for collaborative interactions among agents","children":[],"payload":{"tag":"li","lines":"5715,5716"}},{"content":"<strong>Magnetic orchestration</strong> for dynamic and adaptive coordination","children":[],"payload":{"tag":"li","lines":"5716,5717"}}],"payload":{"tag":"li","lines":"5711,5717"}},{"content":"Choosing the correct orchestration pattern is essential for building efficient and maintainable AI solutions.","children":[],"payload":{"tag":"li","lines":"5717,5718"}},{"content":"The SDK provides a <strong>unified interface</strong> for","children":[{"content":"Defining agents","children":[],"payload":{"tag":"li","lines":"5719,5720"}},{"content":"Running orchestrations","children":[],"payload":{"tag":"li","lines":"5720,5721"}},{"content":"Managing structured data","children":[],"payload":{"tag":"li","lines":"5721,5722"}},{"content":"Retrieving asynchronous results","children":[],"payload":{"tag":"li","lines":"5722,5723"}}],"payload":{"tag":"li","lines":"5718,5723"}},{"content":"Asynchronous execution improves responsiveness and scalability in distributed AI systems.","children":[],"payload":{"tag":"li","lines":"5723,5724"}},{"content":"The framework helps developers build <strong>flexible</strong>, <strong>reliable</strong>, and <strong>maintainable</strong> enterprise-grade AI workflows.","children":[],"payload":{"tag":"li","lines":"5724,5725"}},{"content":"Multi-agent orchestration simplifies the implementation of complex business processes by<br>\ndistributing responsibilities across specialized agents.","children":[],"payload":{"tag":"li","lines":"5725,5728"}}],"payload":{"tag":"li","lines":"5706,5728"}},{"content":"\n<p data-lines=\"5728,5729\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/agent-framework/overview/agent-framework-overview\"> Microsoft Agent Framework SDK documentation</a>","children":[],"payload":{"tag":"li","lines":"5729,5732"}}],"payload":{"tag":"li","lines":"5728,5732"}},{"content":"\n<p data-lines=\"5732,5734\"><strong>Exercise - Develop a multi-agent solution</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-agents/Instructions/Exercises/08-agent-framework-multi-agents.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"5732,5736"}}],"payload":{"tag":"h3","lines":"5205,5206"}},{"content":"9. <a href=\"https://learn.MS.com/en-us/training/modules/discover-agents-with-a2a/\">Discover Azure AI Agents with A2A</a>","children":[{"content":"\n<p data-lines=\"5738,5739\"><strong>Introduction</strong></p>","children":[{"content":"AI agents are effective individually, but many real-world scenarios require <strong>collaboration between multiple agents</strong>.","children":[],"payload":{"tag":"li","lines":"5739,5740"}},{"content":"Managing communication and coordination between distributed or remote agents manually can become <strong>complex and inefficient</strong>.","children":[],"payload":{"tag":"li","lines":"5740,5741"}},{"content":"The <strong>Agent-to-Agent (A2A) protocol</strong> provides a <strong>standardized framework</strong> for:","children":[{"content":"Agent discovery","children":[],"payload":{"tag":"li","lines":"5742,5743"}},{"content":"Agent communication","children":[],"payload":{"tag":"li","lines":"5743,5744"}},{"content":"Coordinated task execution","children":[],"payload":{"tag":"li","lines":"5744,5745"}},{"content":"A2A enables <strong>secure and seamless communication</strong> between agents across different environments.","children":[],"payload":{"tag":"li","lines":"5745,5746"}}],"payload":{"tag":"li","lines":"5741,5746"}},{"content":"The protocol allows developers to:","children":[{"content":"Connect to remote agents easily","children":[],"payload":{"tag":"li","lines":"5747,5748"}},{"content":"Delegate tasks to the most appropriate agent","children":[],"payload":{"tag":"li","lines":"5748,5749"}},{"content":"Automate multi-agent workflows","children":[],"payload":{"tag":"li","lines":"5749,5750"}},{"content":"A routing agent can orchestrate workflows by passing outputs from one agent to another automatically.","children":[],"payload":{"tag":"li","lines":"5750,5751"}}],"payload":{"tag":"li","lines":"5746,5751"}},{"content":"Example workflow:","children":[{"content":"A title-generation agent creates blog headlines","children":[],"payload":{"tag":"li","lines":"5752,5753"}},{"content":"An outline-generation agent creates article structures","children":[],"payload":{"tag":"li","lines":"5753,5754"}},{"content":"A routing agent coordinates the interaction between both agents","children":[],"payload":{"tag":"li","lines":"5754,5755"}},{"content":"The module focuses on implementing the A2A protocol using Microsoft Azure AI Agents.","children":[],"payload":{"tag":"li","lines":"5755,5756"}}],"payload":{"tag":"li","lines":"5751,5756"}},{"content":"Key practical skills covered include:","children":[{"content":"Configuring routing agents","children":[],"payload":{"tag":"li","lines":"5757,5758"}},{"content":"Registering remote agents","children":[],"payload":{"tag":"li","lines":"5758,5759"}},{"content":"Building coordinated multi-agent workflows","children":[],"payload":{"tag":"li","lines":"5759,5760"}},{"content":"A2A improves the scalability, interoperability, and maintainability of collaborative AI systems.","children":[],"payload":{"tag":"li","lines":"5760,5762"}}],"payload":{"tag":"li","lines":"5756,5762"}}],"payload":{"tag":"li","lines":"5738,5762"}},{"content":"\n<p data-lines=\"5762,5763\"><strong>Define an A2A agent</strong></p>","children":[{"content":"\n<p data-lines=\"5764,5765\">What is Agent-to-Agent (A2A) protocol</p>","children":[{"content":"Is a standardized way for AI agents to communicate and<br>\ncollaborate with each other","children":[],"payload":{"tag":"li","lines":"5765,5767"}},{"content":"It defines","children":[{"content":"How agents can share context","children":[],"payload":{"tag":"li","lines":"5768,5769"}},{"content":"Invoke each other&apos;s capabilities","children":[],"payload":{"tag":"li","lines":"5769,5770"}},{"content":"Exchange information securely","children":[],"payload":{"tag":"li","lines":"5770,5771"}}],"payload":{"tag":"li","lines":"5767,5771"}},{"content":"Agents from different vendors or platforms can work together seamlessly,<br>\nenabling more complex and integrated AI solutions","children":[],"payload":{"tag":"li","lines":"5771,5773"}},{"content":"Agent needs to explain what it can do<br>\nAgent Skills and how other agents or clients can discover those<br>\ncapabilities are exposed through an Agent Cardt","children":[],"payload":{"tag":"li","lines":"5773,5777"}}],"payload":{"tag":"li","lines":"5764,5777"}},{"content":"\n<p data-lines=\"5777,5778\">Advantages of the Agent-to-Agent (A2A) protocol</p>","children":[{"content":"Enhanced Collaboration<br>\nA2A enables agents from different vendors and platforms to <strong>share context and work together</strong>,<br>\nallowing seamless automation across systems that are traditionally disconnected.","children":[],"payload":{"tag":"li","lines":"5778,5781"}},{"content":"Flexible Model Selection<br>\nEach A2A agent can choose which large language model (LLM) to use for handling requests,<br>\nenabling optimized or fine-tuned models per agent, unlike some MCP scenarios that rely on a<br>\nsingle LLM connection.","children":[],"payload":{"tag":"li","lines":"5781,5785"}},{"content":"Integrated Authentication<br>\nAuthentication is built into the A2A protocol, providing a robust security framework for<br>\nsecure agent-to-agent communication.","children":[],"payload":{"tag":"li","lines":"5785,5789"}}],"payload":{"tag":"li","lines":"5777,5789"}},{"content":"\n<p data-lines=\"5789,5790\">Agent Skills</p>","children":[{"content":"Describes a specific capability or function that the agent can perform","children":[],"payload":{"tag":"li","lines":"5790,5791"}},{"content":"Key elements","children":[{"content":"ID<br>\nA unique identifier for the skill.","children":[],"payload":{"tag":"li","lines":"5792,5794"}},{"content":"Name<br>\nA human-readable name describing the skill.","children":[],"payload":{"tag":"li","lines":"5794,5796"}},{"content":"Description<br>\nA detailed explanation of what the skill does.","children":[],"payload":{"tag":"li","lines":"5796,5798"}},{"content":"Tags<br>\nKeywords for categorization and easier discovery.","children":[],"payload":{"tag":"li","lines":"5798,5800"}},{"content":"Examples<br>\nSample prompts or use cases to illustrate the skill in action.","children":[],"payload":{"tag":"li","lines":"5800,5802"}},{"content":"Input/Output Modes<br>\nSupported data formats or media types (for example, text, JSON).","children":[],"payload":{"tag":"li","lines":"5802,5804"}}],"payload":{"tag":"li","lines":"5791,5804"}},{"content":"When defining a skill consider","children":[{"content":"The tasks it should perform","children":[],"payload":{"tag":"li","lines":"5805,5806"}},{"content":"How to describe them clearly","children":[],"payload":{"tag":"li","lines":"5806,5807"}},{"content":"How other agents or clients might use them","children":[],"payload":{"tag":"li","lines":"5807,5808"}},{"content":"Example  <pre>\n  A simple &quot;Hello World&quot; skill could return a basic greeting in text format, \n  whereas a blog-writing skill might accept a topic and return a suggested title or outline.\n  </pre>","children":[],"payload":{"tag":"li","lines":"5808,5814"}}],"payload":{"tag":"li","lines":"5804,5814"}}],"payload":{"tag":"li","lines":"5789,5814"}},{"content":"\n<p data-lines=\"5814,5815\">Agent Card</p>","children":[{"content":"Is like a digital business card for your agent","children":[],"payload":{"tag":"li","lines":"5815,5816"}},{"content":"It&apos;s a structured document that a routing agent or client can<br>\nretrieve to discover your agent&#x2019;s capabilities and how to interact with it","children":[],"payload":{"tag":"li","lines":"5816,5818"}},{"content":"Key elements","children":[{"content":"Identity Information<br>\nName, description, and version of the agent.","children":[],"payload":{"tag":"li","lines":"5819,5821"}},{"content":"Endpoint URL<br>\nWhere the agent&#x2019;s A2A service can be accessed.","children":[],"payload":{"tag":"li","lines":"5821,5823"}},{"content":"Capabilities<br>\nSupported A2A features such as streaming or push notifications.","children":[],"payload":{"tag":"li","lines":"5823,5825"}},{"content":"Default Input/Output Modes<br>\nThe primary media types the agent can handle.","children":[],"payload":{"tag":"li","lines":"5825,5827"}},{"content":"Skills<br>\nA list of the agent&#x2019;s skills that other agents can invoke.","children":[],"payload":{"tag":"li","lines":"5827,5829"}},{"content":"Authentication Support<br>\nIndicates if the agent requires credentials for access.","children":[],"payload":{"tag":"li","lines":"5829,5831"}}],"payload":{"tag":"li","lines":"5818,5831"}},{"content":"Ensure it accurately represents your agent&#x2019;s skills and endpoints","children":[],"payload":{"tag":"li","lines":"5831,5833"}}],"payload":{"tag":"li","lines":"5814,5833"}},{"content":"\n<p data-lines=\"5833,5834\">Putting it together</p>","children":[{"content":"Once an agent defines its skills and publishes an Agent Card","children":[{"content":"Other agents or clients can discover the agent automatically.","children":[],"payload":{"tag":"li","lines":"5835,5836"}},{"content":"Requests can be routed to the agent&#x2019;s appropriate skill.","children":[],"payload":{"tag":"li","lines":"5836,5837"}},{"content":"Responses are returned in supported formats, enabling smooth collaboration across multiple agents.","children":[],"payload":{"tag":"li","lines":"5837,5838"}}],"payload":{"tag":"li","lines":"5834,5838"}},{"content":"Example  <pre>\n  In a technical writer workflow, \n  one agent could define skills for generating article titles, and \n  another for creating outlines.\n  The routing agent retrieves each agent&#x2019;s card to discover these capabilities and \n  orchestrates a workflow where a title generated by one agent feeds into the \n  outline agent, producing a cohesive final response.\n  </pre>","children":[],"payload":{"tag":"li","lines":"5838,5848"}}],"payload":{"tag":"li","lines":"5833,5848"}}],"payload":{"tag":"li","lines":"5762,5848"}},{"content":"\n<p data-lines=\"5848,5849\"><strong>Implement an agent executor</strong></p>","children":[{"content":"\n<p data-lines=\"5850,5851\">What is the Agent Executor</p>","children":[{"content":"Is a core component of an A2A agent","children":[],"payload":{"tag":"li","lines":"5851,5852"}},{"content":"Defines","children":[{"content":"How your agent processes incoming requests","children":[],"payload":{"tag":"li","lines":"5853,5854"}},{"content":"Generates responses","children":[],"payload":{"tag":"li","lines":"5854,5855"}},{"content":"Communicates with clients or other agents","children":[],"payload":{"tag":"li","lines":"5855,5856"}}],"payload":{"tag":"li","lines":"5852,5856"}},{"content":"Is the bridge between the A2A protocol and<br>\nyour agent&apos;s specific business logic","children":[],"payload":{"tag":"li","lines":"5856,5859"}}],"payload":{"tag":"li","lines":"5850,5859"}},{"content":"\n<p data-lines=\"5859,5860\">Understand the Agent Executor</p>","children":[{"content":"The <code>AgentExecutor</code> interface handles all<br>\nincoming requests sent to your agent.","children":[],"payload":{"tag":"li","lines":"5860,5862"}},{"content":"Key responsibilities","children":[{"content":"Execute tasks requested by users or other agents.<br>\n<code>RequestContext</code> to understand the incoming request","children":[],"payload":{"tag":"li","lines":"5863,5865"}},{"content":"Stream responses or send individual messages back to the client.<br>\n<code>EventQueue</code> to communicate results or events back to the client","children":[],"payload":{"tag":"li","lines":"5865,5867"}},{"content":"Handle task cancellation if supported.","children":[],"payload":{"tag":"li","lines":"5867,5869"}}],"payload":{"tag":"li","lines":"5862,5869"}}],"payload":{"tag":"li","lines":"5859,5869"}},{"content":"\n<p data-lines=\"5869,5870\">Implement the interface</p>","children":[{"content":"Execute","children":[{"content":"Processes incoming requests and generates responses.","children":[],"payload":{"tag":"li","lines":"5871,5872"}},{"content":"Accesses request details (for example, user input, task context).","children":[],"payload":{"tag":"li","lines":"5872,5873"}},{"content":"Sends results back via an event queue, which may include messages,<br>\ntask updates, or artifacts.","children":[],"payload":{"tag":"li","lines":"5873,5875"}}],"payload":{"tag":"li","lines":"5870,5875"}},{"content":"Cancel","children":[{"content":"Handles requests to cancel an ongoing task.","children":[],"payload":{"tag":"li","lines":"5876,5877"}},{"content":"May not be supported for simple agents.","children":[],"payload":{"tag":"li","lines":"5877,5879"}}],"payload":{"tag":"li","lines":"5875,5879"}}],"payload":{"tag":"li","lines":"5869,5879"}},{"content":"\n<p data-lines=\"5879,5881\">Request handling flow<br>\n(Consider a &quot;Hello World&quot; agent workflow)</p>","children":[{"content":"The agent has a small helper class that implements its core logic (for example, returning a string).","children":[],"payload":{"tag":"li","lines":"5881,5882"}},{"content":"The executor receives a request and calls the agent&#x2019;s logic.","children":[],"payload":{"tag":"li","lines":"5882,5883"}},{"content":"The executor wraps the result as an event and places it on the event queue.","children":[],"payload":{"tag":"li","lines":"5883,5884"}},{"content":"The routing mechanism sends the event back to the requester.","children":[],"payload":{"tag":"li","lines":"5884,5885"}},{"content":"A basic agent might only indicate that cancellation isn&apos;t supported","children":[],"payload":{"tag":"li","lines":"5885,5887"}}],"payload":{"tag":"li","lines":"5879,5887"}}],"payload":{"tag":"li","lines":"5848,5887"}},{"content":"\n<p data-lines=\"5887,5888\"><strong>Host an A2A server</strong></p>","children":[{"content":"\n<p data-lines=\"5889,5890\">Hosting an agent allows</p>","children":[{"content":"Expose its capabilities through its <strong>Agent Card</strong>,<br>\nwhich clients and other agents can discover.","children":[],"payload":{"tag":"li","lines":"5890,5892"}},{"content":"Receive incoming A2A requests and forward them to<br>\n<strong>Agent Executor</strong> for processing.","children":[],"payload":{"tag":"li","lines":"5892,5894"}},{"content":"Manage task lifecycles, including streaming responses and<br>\nstateful interactions.","children":[],"payload":{"tag":"li","lines":"5894,5896"}},{"content":"The server acts as a bridge between your agent&#x2019;s logic and<br>\nthe external world","children":[],"payload":{"tag":"li","lines":"5896,5898"}},{"content":"Hosting an A2A agent combines","children":[{"content":"The Agent Card","children":[],"payload":{"tag":"li","lines":"5899,5900"}},{"content":"Request handler","children":[],"payload":{"tag":"li","lines":"5900,5901"}},{"content":"Agent executor to make it available for<br>\nclient and agent interactions","children":[],"payload":{"tag":"li","lines":"5901,5904"}}],"payload":{"tag":"li","lines":"5898,5904"}}],"payload":{"tag":"li","lines":"5889,5904"}},{"content":"\n<p data-lines=\"5904,5905\">Core components of the agent server</p>","children":[{"content":"Agent Card","children":[{"content":"Describes the agent&#x2019;s capabilities, skills, and<br>\ninput/output modes.","children":[],"payload":{"tag":"li","lines":"5906,5908"}},{"content":"Exposed at a standard endpoint (typically <code>/.well-known/agent-card.json</code>) so<br>\nclients and other agents can discover your agent.","children":[],"payload":{"tag":"li","lines":"5908,5910"}},{"content":"Can include multiple versions or an &quot;extended&quot; card for authenticated users.","children":[],"payload":{"tag":"li","lines":"5910,5911"}}],"payload":{"tag":"li","lines":"5905,5911"}},{"content":"Request Handler","children":[{"content":"Routes incoming requests to the appropriate methods on<br>\nyour <strong>Agent Executor</strong> (for example, execute or cancel).","children":[],"payload":{"tag":"li","lines":"5912,5914"}},{"content":"Manages the task lifecycle using a <strong>Task Store</strong>, which tracks tasks,<br>\nstreaming data, and resubscriptions.","children":[],"payload":{"tag":"li","lines":"5914,5916"}},{"content":"Even simple agents require a task store to handle interactions reliably.","children":[],"payload":{"tag":"li","lines":"5916,5917"}}],"payload":{"tag":"li","lines":"5911,5917"}},{"content":"Server Application","children":[{"content":"Built using a web framework (Starlette in Python) to handle HTTP requests.","children":[],"payload":{"tag":"li","lines":"5918,5919"}},{"content":"Combined with an Asynchronous Server Gateway Interface (ASGI)<br>\nserver &#x2014; like Uvicorn &#x2014; to start listening on a network interface and port.","children":[],"payload":{"tag":"li","lines":"5919,5921"}},{"content":"Exposes the agent card and request handler endpoints, enabling clients to<br>\ninteract with your agent.","children":[],"payload":{"tag":"li","lines":"5921,5924"}}],"payload":{"tag":"li","lines":"5917,5924"}}],"payload":{"tag":"li","lines":"5904,5924"}},{"content":"\n<p data-lines=\"5924,5925\">Set up the A2A agent server</p>","children":[{"content":"1. Define your agent&#x2019;s skills and Agent Card.","children":[],"payload":{"tag":"li","lines":"5925,5926","listIndex":1}},{"content":"2. Initialize a request handler that links your Agent Executor with a Task Store.","children":[],"payload":{"tag":"li","lines":"5926,5927","listIndex":2}},{"content":"3. Set up the server application, providing the Agent Card and request handler.","children":[],"payload":{"tag":"li","lines":"5927,5928","listIndex":3}},{"content":"4. Start the server using an ASGI server (Uvicorn) to make it accessible on the network.","children":[],"payload":{"tag":"li","lines":"5928,5929","listIndex":4}},{"content":"5. Once running, the agent listens for incoming requests and responds according to its defined skills.","children":[],"payload":{"tag":"li","lines":"5929,5931","listIndex":5}}],"payload":{"tag":"li","lines":"5924,5931"}}],"payload":{"tag":"li","lines":"5887,5931"}},{"content":"\n<p data-lines=\"5931,5932\"><strong>Connect to your A2A agent</strong></p>","children":[{"content":"\n<p data-lines=\"5933,5934\">How a client can interact with A2A server</p>","children":[{"content":"A client acts as the bridge between the<br>\napplication and the agent server","children":[],"payload":{"tag":"li","lines":"5934,5936"}},{"content":"Client responsibilities","children":[{"content":"Discovering the Agent Card, which contains metadata about the<br>\nagent and its endpoints.","children":[],"payload":{"tag":"li","lines":"5937,5939"}},{"content":"Sending requests to the agent for processing.","children":[],"payload":{"tag":"li","lines":"5939,5940"}},{"content":"Receiving and interpreting the agent&apos;s responses, which can be<br>\neither direct messages or task-based results.","children":[],"payload":{"tag":"li","lines":"5940,5943"}}],"payload":{"tag":"li","lines":"5936,5943"}}],"payload":{"tag":"li","lines":"5933,5943"}},{"content":"\n<p data-lines=\"5943,5944\">Connect to your agent server</p>","children":[{"content":"The client must know the base URL of the server.","children":[],"payload":{"tag":"li","lines":"5944,5945"}},{"content":"The client typically retrieves the Agent Card from a<br>\nwell-known endpoint on the server.","children":[],"payload":{"tag":"li","lines":"5945,5947"}},{"content":"Once the Agent Card is obtained, the client can be<br>\ninitialized with it, establishing a connection ready to send messages.","children":[],"payload":{"tag":"li","lines":"5947,5950"}}],"payload":{"tag":"li","lines":"5943,5950"}},{"content":"\n<p data-lines=\"5950,5951\">Send requests to the agent</p>","children":[{"content":"Non-Streaming Requests<br>\nThe client sends a message and waits for a complete response.<br>\nThis type of request is suitable for simple interactions or<br>\nwhen a single response is expected.","children":[],"payload":{"tag":"li","lines":"5951,5955"}},{"content":"Streaming Requests<br>\nThe client sends a message and receives responses incrementally as the<br>\nagent processes the request.<br>\nThis type of request is useful for long-running tasks or when you want to<br>\nupdate the user in real-time.","children":[],"payload":{"tag":"li","lines":"5955,5960"}},{"content":"Requests usually include a role (for example, user) and the message content","children":[],"payload":{"tag":"li","lines":"5960,5962"}}],"payload":{"tag":"li","lines":"5950,5962"}},{"content":"\n<p data-lines=\"5962,5963\">Handle the agent response</p>","children":[{"content":"Direct messages<br>\nImmediate outputs from the agent, such as text or structured content.","children":[],"payload":{"tag":"li","lines":"5963,5965"}},{"content":"Task-based responses<br>\nObjects representing ongoing tasks, which may require follow-up calls to<br>\ncheck status or retrieve results.","children":[],"payload":{"tag":"li","lines":"5965,5969"}}],"payload":{"tag":"li","lines":"5962,5969"}},{"content":"\n<p data-lines=\"5969,5970\">Interacting with the agent</p>","children":[{"content":"Each request should be uniquely identifiable,<br>\noften using a generated ID.","children":[],"payload":{"tag":"li","lines":"5970,5972"}},{"content":"Streaming responses are asynchronous and<br>\nmay provide partial results before the final output.","children":[],"payload":{"tag":"li","lines":"5972,5974"}},{"content":"Simple agents may return messages directly,<br>\nwhile more advanced agents may manage multiple tasks simultaneously.","children":[],"payload":{"tag":"li","lines":"5974,5977"}}],"payload":{"tag":"li","lines":"5969,5977"}}],"payload":{"tag":"li","lines":"5931,5977"}},{"content":"\n<p data-lines=\"5977,5978\"><strong>Key takeaways</strong></p>","children":[{"content":"The A2A Ecosystem<br>\nConnecting Python clients to Azure AI Agents relies on running an Agent-to-Agent (A2A) server,<br>\nestablishing a standard framework for cross-agent communication.","children":[],"payload":{"tag":"li","lines":"5978,5981"}},{"content":"Dynamic Discovery &amp; Agent Cards<br>\nAgents utilize an Agent Card mechanism to be discovered and communicated with dynamically at<br>\nruntime, eliminating rigid, hardcoded network configurations.","children":[],"payload":{"tag":"li","lines":"5981,5984"}},{"content":"Request Handling via Executors<br>\nExecutors act as the core processing engine, managing and fulfilling incoming agent requests<br>\nwithin the network.","children":[],"payload":{"tag":"li","lines":"5984,5987"}},{"content":"Bi-Directional Message Flow<br>\nThe architecture natively supports both streaming and non-streaming message delivery patterns<br>\nbetween clients and agents to accommodate different latency and data requirements.","children":[],"payload":{"tag":"li","lines":"5987,5990"}},{"content":"Distributed Task Delegation<br>\nMastering these components allows developers to construct decentralized, flexible agent networks<br>\nthat can seamlessly delegate tasks and respond to complex requests across distributed environments.","children":[],"payload":{"tag":"li","lines":"5990,5995"}}],"payload":{"tag":"li","lines":"5977,5995"}},{"content":"\n<p data-lines=\"5995,5997\"><strong>Exercise - Connect to remote Azure AI Agents with the A2A protocol</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-agents/Instructions/Exercises/09-multi-remote-agents-with-a2a.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"5995,5999"}}],"payload":{"tag":"h3","lines":"5736,5737"}}],"payload":{"tag":"h2","lines":"2613,2614"}},{"content":"Develop natural language solutions in Azure","children":[{"content":"1. <a href=\"https://learn.MS.com/en-us/training/modules/analyze-text-ai-language/\">Analyze text with Azure Language in Foundry Tools</a>","children":[{"content":"\n<p data-lines=\"6005,6006\"><strong>Azure Language in MS Foundry Tools</strong></p>","children":[{"content":"\n<p data-lines=\"6007,6008\">Azure Language can be used for tasks like</p>","children":[{"content":"1. Language detection<br>Determining the language in which text is written","children":[],"payload":{"tag":"li","lines":"6008,6009","listIndex":1}},{"content":"2. Named entity recognition (NER)<br>detecting references to entities (people, organizations, places, time periods...)","children":[],"payload":{"tag":"li","lines":"6009,6010","listIndex":2}},{"content":"3. Personally Identifiable Information (PII) extraction<br>Identifying and redacting personal details in text","children":[],"payload":{"tag":"li","lines":"6010,6011","listIndex":3}},{"content":"4. Sentiment analysis","children":[],"payload":{"tag":"li","lines":"6011,6012","listIndex":4}},{"content":"5. Summarization","children":[],"payload":{"tag":"li","lines":"6012,6013","listIndex":5}},{"content":"6. Key phrase extraction and others","children":[],"payload":{"tag":"li","lines":"6013,6015","listIndex":6}}],"payload":{"tag":"li","lines":"6007,6015"}},{"content":"\n<p data-lines=\"6015,6016\">Using Foundry resource for text analysis</p>","children":[{"content":"1. Foundry resource","children":[],"payload":{"tag":"li","lines":"6016,6017","listIndex":1}},{"content":"2. Use endpoint to call the Azure Language APIs","children":[],"payload":{"tag":"li","lines":"6017,6018","listIndex":2}},{"content":"3. Authentication by the key associate to the resource or Entra ID","children":[],"payload":{"tag":"li","lines":"6018,6019","listIndex":3}},{"content":"4. Submit requests in JSON to thee REST interface or SDKs","children":[],"payload":{"tag":"li","lines":"6019,6021","listIndex":4}}],"payload":{"tag":"li","lines":"6015,6021"}},{"content":"\n<p data-lines=\"6021,6022\">Authentication</p>","children":[{"content":"1. Project end point<br>\n<code><br>\nhttps://my-ai-app-foundry.services.ai.azure.com/api/projects/my-ai-app<br>\n</code>","children":[],"payload":{"tag":"li","lines":"6022,6026","listIndex":1}},{"content":"2. Resource endpoint<br>\n<code><br>\nhttps://my-ai-app-foundry.services.ai.azure.com<br>\n</code>","children":[],"payload":{"tag":"li","lines":"6026,6030","listIndex":2}},{"content":"3. Submit requests to Azure Language APIs <pre><code>\n     # run &quot;pip install azure-ai-textanalytics&quot; first to install the package \n     from azure.core.credentials import AzureKeyCredential\n     from azure.ai.textanalytics import TextAnalyticsClient\n     # Create client using endpoint and key\n     credential = AzureKeyCredential(&quot;YOUR_FOUNDRY_RESOURCE_KEY&quot;)\n     client = TextAnalyticsClient(endpoint=&quot;YOUR_FOUNDRY_RESOURCE_ENDPOINT&quot;, \n                  credential=credential)\n </code></pre>","children":[],"payload":{"tag":"li","lines":"6030,6040","listIndex":3}},{"content":"4. Using Entra ID authentication in production <pre><code>\n     # run &quot;pip install azure-idntity azure-ai-textanalytics&quot; first to install the packages \n     from azure.identity import DefaultAzureCredential\n     from azure.ai.textanalytics import TextAnalyticsClient\n     # Create client using endpoint and default Azure identity\n     credential = DefaultAzureCredential()\n     client = TextAnalyticsClient(endpoint=&quot;YOUR_FOUNDRY_RESOURCE_ENDPOINT&quot;, \n                 credential=credential)\n </code></pre>","children":[],"payload":{"tag":"li","lines":"6040,6051","listIndex":4}}],"payload":{"tag":"li","lines":"6021,6051"}}],"payload":{"tag":"li","lines":"6005,6051"}},{"content":"\n<p data-lines=\"6051,6052\"><strong>Detect language</strong></p>","children":[{"content":"Azure Language detection API evaluates text input and<br>returns a score (between 0 and 1) of the confidence of the analysis","children":[],"payload":{"tag":"li","lines":"6053,6054"}},{"content":"Useful for content stores that collect arbirtary text","children":[],"payload":{"tag":"li","lines":"6054,6055"}},{"content":"Chat applications","children":[],"payload":{"tag":"li","lines":"6055,6056"}},{"content":"Input documents","children":[],"payload":{"tag":"li","lines":"6056,6057"}},{"content":"Document size under 5 120 characters per document","children":[],"payload":{"tag":"li","lines":"6057,6058"}},{"content":"Limit of 1 000 items for collection (IDs)","children":[],"payload":{"tag":"li","lines":"6058,6059"}},{"content":"Example of 2 documents  <pre><code>\n      # Assumes code to create TextAnalyticsClient is above...\n      # Example text to analyze\n      documents = [&quot;Hello World!&quot;, &quot;Bonjour le monde!&quot;]\n      # Detect language\n      response = client.detect_language(documents=documents)\n      for doc in response:\n          print(f&quot;Document: {doc.id}&quot;)\n          print(f&quot;\\tPrimary Language: {doc.primary_language.name}&quot;)\n          print(f&quot;\\tISO6391 Name: {doc.primary_language.iso6391_name}&quot;)\n          print(f&quot;\\tConfidence Score: {doc.primary_language.confidence_score}&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"6059,6072"}},{"content":"Response  <pre>\n  Document: 0\n          Primary Language: English\n          ISO6391 Name: en\n          Confidence Score: 0.9\n  Document: 1\n          Primary Language: French\n          ISO6391 Name: fr\n          Confidence Score: 0.98\n  </pre>","children":[],"payload":{"tag":"li","lines":"6072,6083"}},{"content":"<span>&#x26a0;</span> <mark>Mixed language content within same document returns the language<br>&#xa0;&#xa0;&#xa0;&#xa0;with the largest representation in the content, but with a lower positive rating<br>\n&#xa0;&#xa0;&#xa0;&#xa0;If the parser encounters character encoding issues during conversion, the<br>&#xa0;&#xa0;&#xa0;&#xa0;response for the language name and ISO code will be returned as <code>(unknown)</code> and score as <code>0</code></mark>","children":[],"payload":{"tag":"li","lines":"6083,6086"}}],"payload":{"tag":"li","lines":"6051,6086"}},{"content":"\n<p data-lines=\"6086,6087\"><strong>Extract entities</strong></p>","children":[{"content":"\n<p data-lines=\"6088,6089\">Named entity Recognition (NER)</p>","children":[{"content":"1. Person","children":[],"payload":{"tag":"li","lines":"6089,6090","listIndex":1}},{"content":"2. Location","children":[],"payload":{"tag":"li","lines":"6090,6091","listIndex":2}},{"content":"3. DateTime","children":[],"payload":{"tag":"li","lines":"6091,6092","listIndex":3}},{"content":"4. Organization","children":[],"payload":{"tag":"li","lines":"6092,6093","listIndex":4}},{"content":"5. Address","children":[],"payload":{"tag":"li","lines":"6093,6094","listIndex":5}},{"content":"6. Email","children":[],"payload":{"tag":"li","lines":"6094,6095","listIndex":6}},{"content":"7. URL","children":[],"payload":{"tag":"li","lines":"6095,6096","listIndex":7}},{"content":"8. <a href=\"https://learn.MS.com/en-us/azure/ai-services/language-service/named-entity-recognition/concepts/named-entity-categories?tabs=ga-api\">Others</a>","children":[],"payload":{"tag":"li","lines":"6096,6098","listIndex":8}}],"payload":{"tag":"li","lines":"6088,6098"}},{"content":"\n<p data-lines=\"6098,6099\">Example input for NER</p>\n  <pre><code>\n      # Example text to analyze\n      documents = [&quot;MS was founded on April 4, 1975 by Bill Gates and Paul Allen in Albuquerque, New Mexico.&quot;,\n                  &quot;Satya Nadella became CEO of MS on February 4, 2014.&quot;]\n      # Extract named entities\n      response = client.recognize_entities(documents=documents)\n      for doc in response:\n          print(f&quot;Entities in document {doc.id}:&quot;)\n          for entity in doc.entities:\n              print(f&quot; - {entity.text} ({entity.category})&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"6098,6111"}},{"content":"\n<p data-lines=\"6111,6112\">Response</p>\n  <pre>\n      Entities in document 0:\n          MS (Organization)\n          April 4, 1975 (DateTime)\n          Bill Gates (Person)\n          Paul Allen (Person)\n          Albuquerque (Location)\n          New Mexico (Location)\n      Entities in document 1:\n          Satya Nadella (Person)\n          CEO (PersonType)\n          MS (Organization)\n          February 4, 2014 (DateTime)\n  </pre>","children":[],"payload":{"tag":"li","lines":"6111,6127"}}],"payload":{"tag":"li","lines":"6086,6127"}},{"content":"\n<p data-lines=\"6127,6128\"><strong>Extract Personally Identifiable Information (PII)</strong></p>","children":[{"content":"\n<p data-lines=\"6129,6130\">Need to remove PPI from</p>","children":[{"content":"Customer feedback","children":[],"payload":{"tag":"li","lines":"6130,6131"}},{"content":"Medical records","children":[],"payload":{"tag":"li","lines":"6131,6132"}},{"content":"Legal records","children":[],"payload":{"tag":"li","lines":"6132,6134"}}],"payload":{"tag":"li","lines":"6129,6134"}},{"content":"\n<p data-lines=\"6134,6135\">Azure Language provides PII detection (extraction) and<br> redaction (mask) sensitive info</p>","children":[{"content":"Names","children":[],"payload":{"tag":"li","lines":"6135,6136"}},{"content":"Addresses","children":[],"payload":{"tag":"li","lines":"6136,6137"}},{"content":"Phone numbers","children":[],"payload":{"tag":"li","lines":"6137,6138"}},{"content":"E-mail addresses","children":[],"payload":{"tag":"li","lines":"6138,6139"}},{"content":"Social security numbers","children":[],"payload":{"tag":"li","lines":"6139,6140"}},{"content":"Credit card numbers","children":[],"payload":{"tag":"li","lines":"6140,6142"}}],"payload":{"tag":"li","lines":"6134,6142"}},{"content":"\n<p data-lines=\"6142,6143\">Example of analysis of text</p>\n  <pre><code>\n      # Example text to analyze\n      documents = [&quot;John Smith works at Contoso Ltd. His email is john.smith@contoso.com and his phone number is 555-012-456.&quot;,\n                  &quot;Patient Sarah Johnson, SSN 123-45-6789, was admitted on 03/15/2024.&quot;]\n      # Extract PII entities\n      response = client.recognize_pii_entities(documents=documents, language=&quot;en&quot;)\n      for doc in response:\n          print(f&quot;\\nPII entities in document {doc.id}:&quot;)\n          for entity in doc.entities:\n              print(f&quot; - {entity.text}: {entity.category} (confidence: {entity.confidence_score:.2f})&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"6142,6155"}},{"content":"\n<p data-lines=\"6155,6156\">Response</p>\n  <pre>\n      PII entities in document 0:\n          John Smith: Person (confidence: 0.99)\n          Contoso Ltd: Organization (confidence: 0.85)\n          john.smith@contoso.com: Email (confidence: 1.00)\n          555-012-456: PhoneNumber (confidence: 0.80)\n      PII entities in document 1:\n          Sarah Johnson: Person (confidence: 0.99)\n          123-45-6789: USSocialSecurityNumber (confidence: 0.99)\n          03/15/2024: DateTime (confidence: 0.80)\n  </pre>","children":[],"payload":{"tag":"li","lines":"6155,6168"}},{"content":"\n<p data-lines=\"6168,6169\">Example of protect information</p>\n  <pre><code>\n      # Redact PII entities\n      response = client.recognize_pii_entities(documents=documents, language=&quot;en&quot;)\n      for doc in response:\n          print(f&quot;\\nDocument {doc.id} (redacted):&quot;)\n          print(f&quot; {doc.redacted_text}&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"6168,6177"}},{"content":"\n<p data-lines=\"6177,6178\">Response</p>\n  <pre>\n      Document 0 (redacted):\n      ********** works at ************. His email is ************************ and his phone number is ********.\n      Document 1 (redacted):\n      Patient *************, SSN ***********, was admitted on **********.\n  </pre>","children":[],"payload":{"tag":"li","lines":"6177,6185"}}],"payload":{"tag":"li","lines":"6127,6185"}},{"content":"\n<p data-lines=\"6185,6187\"><strong>Exercise - Analyze text</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-language/Instructions/Exercises/01-analyze-text.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"6185,6188"}},{"content":"\n<p data-lines=\"6188,6189\"><a href=\"https://learn.MS.com/en-us/azure/ai-services/language-service/\"><code>Documenta&#xe7;&#xe3;o Language Service</code></a></p>","children":[],"payload":{"tag":"li","lines":"6188,6190"}}],"payload":{"tag":"h3","lines":"6003,6004"}},{"content":"2. <a href=\"https://learn.microsoft.com/en-us/training/modules/develop-text-analysis-agent-language-mcp/\">Develop a text analysis agent with the Azure Language MCP server</a>","children":[{"content":"\n<p data-lines=\"6192,6193\"><strong>Introduction</strong></p>","children":[{"content":"Powerful NLP Capabilities<br>\nAzure Language tools in Foundry offer robust text analysis,<br>\nincluding automated language detection, named entity recognition, and<br>\nPII (personally identifiable information) extraction.","children":[],"payload":{"tag":"li","lines":"6194,6198"}},{"content":"The Power of MCP Integration<br>\nBy connecting these capabilities through the Azure Language Model Context Protocol (MCP) server,<br>\nyour AI agent can dynamically select and execute the right tool for the job.<br>\nThis removes the need to write custom integration code for every individual NLP task.","children":[],"payload":{"tag":"li","lines":"6198,6202"}},{"content":"Unified Analysis Workflow<br>\nRather than building siloed integrations for complex processing&#x2014;such as<br>\ndetermining review languages, identifying entities, and<br>\nsanitizing private data &#x2014; a single agent connection can handle these tasks in one cohesive workflow.","children":[],"payload":{"tag":"li","lines":"6202,6206"}},{"content":"Module Objectives<br>\nLearn the architecture of the Azure Language MCP server, master the process of connecting it to a<br>\nMicrosoft Foundry agent, and practice building programmatic client applications that<br>\ninteract with these intelligent agents.","children":[],"payload":{"tag":"li","lines":"6206,6211"}}],"payload":{"tag":"li","lines":"6192,6211"}},{"content":"\n<p data-lines=\"6211,6212\"><strong>Understand the Azure Language MCP server</strong></p>","children":[{"content":"\n<p data-lines=\"6213,6214\">What is the Model Context Protocol?</p>","children":[{"content":"Is an open protocol that defines how AI agents interact with","children":[{"content":"External tools","children":[],"payload":{"tag":"li","lines":"6215,6216"}},{"content":"Data sources","children":[],"payload":{"tag":"li","lines":"6216,6217"}},{"content":"Services","children":[],"payload":{"tag":"li","lines":"6217,6218"}}],"payload":{"tag":"li","lines":"6214,6218"}},{"content":"MCP uses a client-server architecture with","children":[{"content":"Host<br>\nThe application that runs the agent (such as Microsoft Foundry or a custom app).","children":[],"payload":{"tag":"li","lines":"6219,6221"}},{"content":"Client<br>\nA component within the host that manages connections to MCP servers and handles communication.","children":[],"payload":{"tag":"li","lines":"6221,6223"}},{"content":"Server<br>\nA program that exposes tools, resources, and prompts that an agent can discover and call.","children":[],"payload":{"tag":"li","lines":"6223,6225"}}],"payload":{"tag":"li","lines":"6218,6225"}},{"content":"When an agent connects to an MCP server","children":[{"content":"Receives a catalog of available tools","children":[],"payload":{"tag":"li","lines":"6226,6227"}},{"content":"A descriptions of what each tool does","children":[],"payload":{"tag":"li","lines":"6227,6228"}},{"content":"Choose the right tool based on the user&apos;s request","children":[],"payload":{"tag":"li","lines":"6228,6229"}},{"content":"This approach is called <em>dynamic tool</em> discovery<br>\nThe agent doesn&apos;t need hardcoded knowledge of each tool","children":[],"payload":{"tag":"li","lines":"6229,6231"}},{"content":"Key advantage of MCP for AI agents is flexibility","children":[],"payload":{"tag":"li","lines":"6231,6232"}},{"content":"Tools can be added, updated, or removed on the server<br>\nwithout modifying the agent itself","children":[],"payload":{"tag":"li","lines":"6232,6234"}},{"content":"<span>&#x1f4a1;</span><mark>To learn more about MCP architecture and how to build custom MCP tool integrations,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;see the  <a href=\"https://learn.microsoft.com/en-us/training/modules/connect-agent-to-mcp-tools/\"> Integrate MCP Tools with Azure AI Agents</a> module.</mark>","children":[],"payload":{"tag":"li","lines":"6234,6237"}}],"payload":{"tag":"li","lines":"6225,6237"}}],"payload":{"tag":"li","lines":"6213,6237"}},{"content":"\n<p data-lines=\"6237,6238\">Azure Language MCP server capabilities</p>\n<table data-lines=\"6238,6244\">\n<thead data-lines=\"6238,6239\">\n<tr data-lines=\"6238,6239\">\n<th style=\"text-align:left\">Capability</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"6240,6244\">\n<tr data-lines=\"6240,6241\">\n<td style=\"text-align:left\">Language Detection</td>\n<td style=\"text-align:left\">Identifies the language in which text is written</td>\n</tr>\n<tr data-lines=\"6241,6242\">\n<td style=\"text-align:left\">Named Entity<br>Recognition</td>\n<td style=\"text-align:left\">Identifies and categorizes entities in text, such as<br>people, places, organizations, dates, and quantities</td>\n</tr>\n<tr data-lines=\"6242,6243\">\n<td style=\"text-align:left\">PII Redaction</td>\n<td style=\"text-align:left\">Detects and redacts personally identifiable information (PII) such as<br>names, addresses, and phone numbers</td>\n</tr>\n<tr data-lines=\"6243,6244\">\n<td style=\"text-align:left\">Text Analytics for<br>Health</td>\n<td style=\"text-align:left\">Extracts and labels medical entities, such as<br>diagnoses, medications, and symptoms from clinical text</td>\n</tr>\n</tbody>\n</table>\n  <br>\n<p data-lines=\"6247,6250\"><span>&#x1f4a1;</span><mark>Azure Language also provides functionality for sentiment analysis, summarization,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;key phrase extraction, and other common language-related tasks.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;These deprecated capabilities are provided to support existing applications.</mark></p>","children":[],"payload":{"tag":"li","lines":"6237,6251"}},{"content":"\n<p data-lines=\"6251,6252\">How the agent selects tools</p>","children":[{"content":"1. The user sends a prompt to the agent.","children":[],"payload":{"tag":"li","lines":"6252,6253","listIndex":1}},{"content":"2. The agent analyzes the prompt and determines which task (or tasks) need to be performed.","children":[],"payload":{"tag":"li","lines":"6253,6254","listIndex":2}},{"content":"3. The agent checks the available MCP tools and their descriptions to find the best match.","children":[],"payload":{"tag":"li","lines":"6254,6255","listIndex":3}},{"content":"4. The agent calls the selected tool through the MCP server, passing the relevant input text.","children":[],"payload":{"tag":"li","lines":"6255,6256","listIndex":4}},{"content":"5. The MCP server processes the request using the appropriate Azure Language capability and returns the results.","children":[],"payload":{"tag":"li","lines":"6256,6257","listIndex":5}},{"content":"6. The agent combines the results into a natural language response for the user.","children":[],"payload":{"tag":"li","lines":"6257,6258","listIndex":6}},{"content":"7. There&apos;s no need to write routing logic to direct requests to specific tools","children":[],"payload":{"tag":"li","lines":"6258,6260","listIndex":7}}],"payload":{"tag":"li","lines":"6251,6260"}},{"content":"\n<p data-lines=\"6260,6261\">MCP server endpoint</p>","children":[{"content":"Format  <pre>\n  https://{foundry-resource-name}.cognitiveservices.azure.com/language/mcp?api-version=2025-11-15-preview\n  </pre>","children":[],"payload":{"tag":"li","lines":"6261,6265"}},{"content":"Replace <code>{foundry-resource-name}</code> with the name of your Foundry resource (or Azure Language resource)","children":[],"payload":{"tag":"li","lines":"6265,6266"}},{"content":"<span>&#x1f4a1;</span><mark>Azure Language also provides a local MCP server that you can host in your own environment.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;or setup guidance, see the <a href=\"https://github.com/Azure-Samples/ai-language-samples\">Azure Language MCP Server quickstart</a> in the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Azure Language samples repository.</mark>","children":[],"payload":{"tag":"li","lines":"6266,6270"}}],"payload":{"tag":"li","lines":"6260,6270"}}],"payload":{"tag":"li","lines":"6211,6270"}},{"content":"\n<p data-lines=\"6270,6271\"><strong>Connect and use the Language MCP server with an agent</strong></p>","children":[{"content":"\n<p data-lines=\"6272,6273\">Create a Foundry project and agent</p>","children":[{"content":"1. In the <a href=\"https://ai.azure.com/\">Microsoft Foundry portal</a>, create a new project (or use an existing one).","children":[],"payload":{"tag":"li","lines":"6273,6274","listIndex":1}},{"content":"2. Deploy a model (such as gpt-4.1) that your agent will use for reasoning and generating responses.","children":[],"payload":{"tag":"li","lines":"6274,6275","listIndex":2}},{"content":"3. Create an agent and give it instructions that describe its purpose.","children":[],"payload":{"tag":"li","lines":"6275,6276","listIndex":3}},{"content":"4. Example <pre>\n You are an AI agent that assists users by helping them analyze and summarize text.\n </pre>\nThe agent is now ready to receive tool connections","children":[],"payload":{"tag":"li","lines":"6276,6282","listIndex":4}}],"payload":{"tag":"li","lines":"6272,6282"}},{"content":"\n<p data-lines=\"6282,6283\">Connect the Azure Language MCP server</p>","children":[{"content":"1. In the navigation pane, select the <strong>Tools page</strong>.","children":[],"payload":{"tag":"li","lines":"6283,6284","listIndex":1}},{"content":"2. Select <strong>Connect a tool</strong> and choose <strong>Azure Language in Foundry Tools</strong> from the catalog.","children":[],"payload":{"tag":"li","lines":"6284,6285","listIndex":2}},{"content":"3. Configure the connection with the following settings:","children":[{"content":"Foundry resource name<br>\nThe name of your Foundry resource (for example, myproject-resource).","children":[],"payload":{"tag":"li","lines":"6286,6288"}},{"content":"Authentication<br>\nKey-based.","children":[],"payload":{"tag":"li","lines":"6288,6290"}},{"content":"Credential (<code>Ocp-Apim-Subscription-Key</code>)<br>\nThe key for your Foundry project.","children":[],"payload":{"tag":"li","lines":"6290,6292"}}],"payload":{"tag":"li","lines":"6285,6292","listIndex":3}},{"content":"4. Wait for the connection to be created, then select <strong>Use in an agent</strong> and choose your agent.","children":[],"payload":{"tag":"li","lines":"6292,6293","listIndex":4}},{"content":"5. <span>&#x1f4a1;</span><mark>You can find the project key on the project home page in the Foundry portal.</mark>","children":[],"payload":{"tag":"li","lines":"6293,6295","listIndex":5}}],"payload":{"tag":"li","lines":"6282,6295"}},{"content":"\n<p data-lines=\"6295,6296\">Update agent instructions</p>","children":[{"content":"After connecting the Language MCP tool,<br>\nupdate the agent&apos;s instructions to direct it to use the tool","children":[],"payload":{"tag":"li","lines":"6296,6298"}},{"content":"Example  <pre>\n  You are an AI agent that assists users by helping them analyze text. \n  Use the Azure Language tool to perform text analysis tasks.\n  </pre>","children":[],"payload":{"tag":"li","lines":"6298,6303"}},{"content":"This instruction helps the agent understand that it should use the<br>\nconnected tool when processing text analysis requests.","children":[],"payload":{"tag":"li","lines":"6303,6306"}}],"payload":{"tag":"li","lines":"6295,6306"}},{"content":"\n<p data-lines=\"6306,6307\">Test in the agent playground</p>","children":[{"content":"Prompt sent that requires text analysis,<br>\nthe agent","children":[{"content":"1. Identifies the tasks needed<br>\n(for example, language detection and entity recognition).","children":[],"payload":{"tag":"li","lines":"6309,6311","listIndex":1}},{"content":"2. Calls the appropriate Azure Language MCP tool(s).","children":[],"payload":{"tag":"li","lines":"6311,6312","listIndex":2}},{"content":"3. Returns a combined response.","children":[],"payload":{"tag":"li","lines":"6312,6313","listIndex":3}}],"payload":{"tag":"li","lines":"6307,6313"}},{"content":"The first time the agent uses an MCP tool,<br>\nyou&apos;re prompted to <strong>approve</strong> the tool usage","children":[{"content":"Single use","children":[],"payload":{"tag":"li","lines":"6315,6316"}},{"content":"Always approve all<br>\nAzure Language in Foundry Tools tools","children":[],"payload":{"tag":"li","lines":"6316,6318"}}],"payload":{"tag":"li","lines":"6313,6318"}},{"content":"After the agent responds,<br>\nyou can review the Logs pane to verify which tools were used","children":[],"payload":{"tag":"li","lines":"6318,6321"}}],"payload":{"tag":"li","lines":"6306,6321"}},{"content":"\n<p data-lines=\"6321,6322\">Build a client application</p>","children":[{"content":"The <strong>Microsoft Foundry SDK</strong> supports this<br>\nthrough the OpenAI Responses API.","children":[],"payload":{"tag":"li","lines":"6322,6324"}},{"content":"To build a client application use","children":[{"content":"<code>azure-ai-projects</code>","children":[],"payload":{"tag":"li","lines":"6325,6326"}},{"content":"<code>azure-identity packages</code>","children":[],"payload":{"tag":"li","lines":"6326,6327"}}],"payload":{"tag":"li","lines":"6324,6327"}},{"content":"General pattern","children":[{"content":"1. Create an <code>AIProjectClient</code> using your Foundry project endpoint and<br>\n<code>DefaultAzureCredential</code> (which uses your Azure CLI credentials in development).","children":[],"payload":{"tag":"li","lines":"6328,6330","listIndex":1}},{"content":"2. Get an OpenAI client from the project client by<br>\ncalling <code>get_openai_client()</code>.","children":[],"payload":{"tag":"li","lines":"6330,6332","listIndex":2}},{"content":"3. Call <code>responses.create()</code> to send a user prompt to the agent.","children":[],"payload":{"tag":"li","lines":"6332,6333","listIndex":3}},{"content":"4. The key part is how you reference the<br>\nagent (name in the <code>extra_body</code> parameter)","children":[],"payload":{"tag":"li","lines":"6333,6335","listIndex":4}},{"content":"5. Example <pre><code>\n response = openai_client.responses.create(\n     input=[{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_prompt}],\n     extra_body={\n         &quot;agent_reference&quot;: {\n             &quot;name&quot;: &quot;Text-Analysis-Agent&quot;,\n             &quot;type&quot;: &quot;agent_reference&quot;\n         }\n     },\n )\n &#xa0;\n print(response.output_text)\n </code></pre>","children":[],"payload":{"tag":"li","lines":"6335,6349","listIndex":5}},{"content":"6. Steps","children":[{"content":"The agent processes the prompt","children":[],"payload":{"tag":"li","lines":"6350,6351"}},{"content":"Calls the appropriate MCP tools","children":[],"payload":{"tag":"li","lines":"6351,6352"}},{"content":"Returns the result in <code>output_text</code>","children":[],"payload":{"tag":"li","lines":"6352,6353"}}],"payload":{"tag":"li","lines":"6349,6353","listIndex":6}},{"content":"7. Response inspection (JSON) using<br>\n<code>response.model_dump_json()</code>","children":[{"content":"See which tools the agent called","children":[{"content":"<code>extract_named_entities_from_text</code>","children":[],"payload":{"tag":"li","lines":"6356,6357"}},{"content":"<code>detect_language_from_text</code>","children":[],"payload":{"tag":"li","lines":"6357,6358"}}],"payload":{"tag":"li","lines":"6355,6358"}},{"content":"The arguments","children":[],"payload":{"tag":"li","lines":"6358,6359"}},{"content":"Results for each tool call","children":[],"payload":{"tag":"li","lines":"6359,6361"}}],"payload":{"tag":"li","lines":"6353,6361","listIndex":7}}],"payload":{"tag":"li","lines":"6327,6361"}}],"payload":{"tag":"li","lines":"6321,6361"}},{"content":"\n<p data-lines=\"6361,6362\">Connect the MCP server in code</p>","children":[{"content":"Is possible to define the MCP tool connection directly in<br>\ncode when you create an agent","children":[],"payload":{"tag":"li","lines":"6362,6364"}},{"content":"Use the MCPTool class from the <code>azure-ai-projects</code> SDK to specify","children":[{"content":"Server label","children":[],"payload":{"tag":"li","lines":"6365,6366"}},{"content":"URL","children":[],"payload":{"tag":"li","lines":"6366,6367"}},{"content":"Allowed tools","children":[],"payload":{"tag":"li","lines":"6367,6368"}}],"payload":{"tag":"li","lines":"6364,6368"}},{"content":"Example  <pre><code>\n  from azure.ai.projects.models import MCPTool\n  &#xa0;\n  mcp_tool = MCPTool(\n      server_label=&quot;azure-language&quot;,\n      server_url=&quot;https://{foundry-resource-name}.cognitiveservices.azure.com/language/mcp?api-version=2025-11-15-preview&quot;,\n      require_approval=&quot;always&quot;,\n  )\n  </code><pre>\n</pre></pre>","children":[],"payload":{"tag":"li","lines":"6368,6378"}},{"content":"Then pass the <code>mcp_tool</code> when creating the<br>\nagent through the SDK","children":[],"payload":{"tag":"li","lines":"6378,6380"}},{"content":"Useful when you want to manage tool connections as<br>\npart of your application code<br>\nrather than configuring them manually in the portal","children":[],"payload":{"tag":"li","lines":"6380,6383"}},{"content":"Use the <code>allowed_tools</code> property on MCPTool to<br>\nrestrict which specific Language tools the agent can call","children":[],"payload":{"tag":"li","lines":"6383,6386"}}],"payload":{"tag":"li","lines":"6361,6386"}},{"content":"\n<p data-lines=\"6386,6387\">Tool selection with multi-task prompts</p>","children":[{"content":"When a user&apos;s prompt involves multiple text analysis tasks, the<br>\nagent can call multiple tools in a single turn","children":[],"payload":{"tag":"li","lines":"6387,6389"}},{"content":"Example  <pre>\n  &quot;Tell me what entities and dates are mentioned in this review, and \n  whether it is positive or negative.&quot;\n  </pre>","children":[],"payload":{"tag":"li","lines":"6389,6394"}},{"content":"This prompt requires","children":[{"content":"Entity recognition","children":[],"payload":{"tag":"li","lines":"6395,6396"}},{"content":"Sentiment analysis","children":[],"payload":{"tag":"li","lines":"6396,6397"}}],"payload":{"tag":"li","lines":"6394,6397"}},{"content":"The agent identifies both tasks","children":[],"payload":{"tag":"li","lines":"6397,6398"}},{"content":"Calls the appropriate tools","children":[{"content":"<code>extract_named_entities_from_text</code>","children":[],"payload":{"tag":"li","lines":"6399,6400"}},{"content":"<code>detect_language_from_text</code>","children":[],"payload":{"tag":"li","lines":"6400,6401"}}],"payload":{"tag":"li",
