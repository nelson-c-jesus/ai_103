"lines":"6398,6401"}},{"content":"Combines the results into a single response","children":[],"payload":{"tag":"li","lines":"6401,6402"}},{"content":"Each tool call goes through the<br>\nMCP server independently","children":[],"payload":{"tag":"li","lines":"6402,6404"}},{"content":"The agent synthesizes the outputs into a<br>\ncoherent answer for the user","children":[],"payload":{"tag":"li","lines":"6404,6407"}}],"payload":{"tag":"li","lines":"6386,6407"}}],"payload":{"tag":"li","lines":"6270,6407"}},{"content":"\n<p data-lines=\"6407,6408\"><strong>Key takeaways</strong></p>","children":[{"content":"Describe the Azure Language MCP server and the text analysis capabilities it exposes.","children":[],"payload":{"tag":"li","lines":"6408,6409"}},{"content":"Explain how MCP enables dynamic tool discovery and selection by AI agents.","children":[],"payload":{"tag":"li","lines":"6409,6410"}},{"content":"Connect the Azure Language MCP server to an agent in Microsoft Foundry.","children":[],"payload":{"tag":"li","lines":"6410,6411"}},{"content":"Test language tool integration in the agent playground.","children":[],"payload":{"tag":"li","lines":"6411,6412"}},{"content":"Build a Python client application that invokes an agent with language tools using the Foundry SDK.","children":[],"payload":{"tag":"li","lines":"6412,6415"}}],"payload":{"tag":"li","lines":"6407,6415"}},{"content":"\n<p data-lines=\"6415,6416\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/language-service/concepts/foundry-tools-agents\">A    zure Language tools and agents</a>","children":[],"payload":{"tag":"li","lines":"6416,6417"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/language-service/concepts/foundry-tools-agents#azure-language-mcp-server-preview\">Azure Language MCP server capabilities</a>","children":[],"payload":{"tag":"li","lines":"6417,6418"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol\">Connect to Model Context Protocol servers</a>","children":[],"payload":{"tag":"li","lines":"6418,6419"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/python/api/overview/azure/ai-projects-readme\">Azure AI Projects SDK for Python</a>","children":[],"payload":{"tag":"li","lines":"6419,6420"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/developer/ai/intro-agents-mcp\">Build agents using Model Context Protocol on Azure</a>","children":[],"payload":{"tag":"li","lines":"6420,6422"}}],"payload":{"tag":"li","lines":"6415,6422"}},{"content":"\n<p data-lines=\"6422,6424\"><strong>Exercise - Develop a text analysis agent</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-language/Instructions/Exercises/02-language-agent.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"6422,6426"}}],"payload":{"tag":"h3","lines":"6190,6191"}},{"content":"3. <a href=\"https://learn.microsoft.com/en-us/training/paths/develop-language-solutions-azure-ai/\">Develop natural language solutions in Azure</a>","children":[{"content":"\n<p data-lines=\"6428,6429\"><strong>Choose a speech-capable model</strong></p>","children":[{"content":"How to find","children":[{"content":"Use the filter and search features in the<br>\nMicrosoft Foundry Portal","children":[],"payload":{"tag":"li","lines":"6431,6433"}},{"content":"Relationed with speech-capable models<br>\nmust consider","children":[{"content":"Generative AI models that can transcribe speech to text","children":[],"payload":{"tag":"li","lines":"6435,6436"}},{"content":"Generative AI models that can synthesize text to speech","children":[],"payload":{"tag":"li","lines":"6436,6437"}}],"payload":{"tag":"li","lines":"6433,6437"}},{"content":"<span>&#x1f4a1;</span><mark>To learn more about available models in Microsoft Foundry, see the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;<a href=\"https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview\">Microsoft Foundry Models overview</a> article in the Microsoft Foundry documentation.</mark>","children":[],"payload":{"tag":"li","lines":"6437,6440"}}],"payload":{"tag":"li","lines":"6430,6440"}}],"payload":{"tag":"li","lines":"6428,6440"}},{"content":"\n<p data-lines=\"6440,6441\"><strong>Transcribe speech</strong></p>","children":[{"content":"\n<p data-lines=\"6442,6444\">What it is speech transcription or<br>\n<em>speech-to-text</em></p>","children":[{"content":"Speech-to-text","children":[{"content":"Involves submitting audio content to a model","children":[],"payload":{"tag":"li","lines":"6445,6446"}},{"content":"Wich responds with a text-based transcript of the<br>\nspeech in the audio source","children":[],"payload":{"tag":"li","lines":"6446,6448"}}],"payload":{"tag":"li","lines":"6444,6448"}},{"content":"Models that support speech-to-text operations","children":[{"content":"gpt-4o-transcribe","children":[],"payload":{"tag":"li","lines":"6449,6450"}},{"content":"gpt-4o-mini-transcribe","children":[],"payload":{"tag":"li","lines":"6450,6451"}},{"content":"gpt-4o-transcribe-diarize","children":[],"payload":{"tag":"li","lines":"6451,6452"}}],"payload":{"tag":"li","lines":"6448,6452"}},{"content":"<span>&#x1f4a1;</span><mark>Model availability varies by region.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Review the<a href=\"https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure?pivots=azure-openai#model-summary-table-and-region-availability&amp;azure-portal=true\"> model regional availability</a> table in the Microsoft Foundry documentation.</mark>","children":[],"payload":{"tag":"li","lines":"6452,6455"}}],"payload":{"tag":"li","lines":"6442,6455"}},{"content":"\n<p data-lines=\"6455,6456\">Using a speech-to-text model</p>","children":[{"content":"Can use the <strong>AzureOpenAI</strong> client in the OpenAI SDK","children":[],"payload":{"tag":"li","lines":"6456,6457"}},{"content":"To connect to the endpoint for your Microsoft Foundry resource","children":[],"payload":{"tag":"li","lines":"6457,6458"}},{"content":"Upload the contents of an audio file to the model for transcription","children":[],"payload":{"tag":"li","lines":"6458,6459"}},{"content":"Example  <pre><code>\n  from openai import AzureOpenAI\n  from pathlib import Path\n  &#xa0;\n  # Create an AzureOpenAI client\n  client = AzureOpenAI(\n      azure_endpoint=YOUR_FOUNDRY_ENDPOINT,\n      api_key=YOUR_FOUNDRY_KEY,\n      api_version=&quot;2025-03-01-preview&quot;\n  )\n  &#xa0;\n  # Get the audio file\n  file_path = Path(&quot;speech.mp3&quot;)\n  audio_file = open(file_path, &quot;rb&quot;)\n  &#xa0;\n  # Use the model to transcribe the audio file\n  transcription = client.audio.transcriptions.create(\n      model=YOUR_MODEL_DEPLOYMENT,\n      file=audio_file,\n      response_format=&quot;text&quot;\n  )\n  &#xa0;\n  print(transcription)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"6459,6485"}}],"payload":{"tag":"li","lines":"6455,6485"}}],"payload":{"tag":"li","lines":"6440,6485"}},{"content":"\n<p data-lines=\"6485,6486\"><strong>Synthesize speech</strong></p>","children":[{"content":"\n<p data-lines=\"6487,6489\">What it is speech synthesis or<br>\n<em>text-to-speech</em></p>","children":[{"content":"Text-to-speech","children":[{"content":"Is the reverse of speech-to-text","children":[],"payload":{"tag":"li","lines":"6490,6491"}},{"content":"Involves submitting text to a model","children":[],"payload":{"tag":"li","lines":"6491,6492"}},{"content":"Which returns an audio stream of the<br>\nvocalized text","children":[],"payload":{"tag":"li","lines":"6492,6494"}}],"payload":{"tag":"li","lines":"6489,6494"}},{"content":"Models that support text-to-speech operations","children":[{"content":"gpt-4o-tts","children":[],"payload":{"tag":"li","lines":"6495,6496"}},{"content":"gpt-4o-mini-tts","children":[],"payload":{"tag":"li","lines":"6496,6497"}}],"payload":{"tag":"li","lines":"6494,6497"}},{"content":"<span>&#x1f4a1;</span><mark>Model availability varies by region.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Review the<a href=\"https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure?pivots=azure-openai#model-summary-table-and-region-availability&amp;azure-portal=true\"> model regional availability</a> table in the Microsoft Foundry documentation.</mark>","children":[],"payload":{"tag":"li","lines":"6497,6500"}}],"payload":{"tag":"li","lines":"6487,6500"}},{"content":"\n<p data-lines=\"6500,6501\">Using a text-to-speech model</p>","children":[{"content":"Can use the <strong>AzureOpenAI</strong> client in the OpenAI SDK","children":[],"payload":{"tag":"li","lines":"6501,6502"}},{"content":"To connect to the endpoint for your Microsoft Foundry resource","children":[],"payload":{"tag":"li","lines":"6502,6503"}},{"content":"Upload the contents of an audio file to the model for transcription","children":[],"payload":{"tag":"li","lines":"6503,6504"}},{"content":"Example  <pre><code>\n  from openai import AzureOpenAI\n  from pathlib import Path\n  &#xa0;\n  # Create an AzureOpenAI client\n  client = AzureOpenAI(\n      azure_endpoint=YOUR_FOUNDRY_ENDPOINT,\n      api_key=YOUR_FOUNDRY_KEY,\n      api_version=&quot;2025-03-01-preview&quot;\n  )\n  &#xa0;\n  # Path for audio output file\n  speech_file_path = Path(&quot;output_speech.wav&quot;)\n  &#xa0;\n  # Generate speech and save to file\n  with client.audio.speech.with_streaming_response.create(\n              model=YOUR_MODEL_DEPLOYMENT,\n              voice=&quot;alloy&quot;,\n              input=&quot;This speech was AI-generated!&quot;,\n              instructions=&quot;Speak in an upbeat, excited tone.&quot;,\n      ) as response:\n      response.stream_to_file(speech_file_path)\n  &#xa0;\n  print(f&quot;Speech generated and saved to {speech_file_path}&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"6504,6531"}}],"payload":{"tag":"li","lines":"6500,6531"}}],"payload":{"tag":"li","lines":"6485,6531"}},{"content":"\n<p data-lines=\"6531,6532\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure?pivots=azure-openai#audio-models&amp;azure-portal=true\"> Audio models</a>","children":[],"payload":{"tag":"li","lines":"6532,6534"}}],"payload":{"tag":"li","lines":"6531,6534"}},{"content":"\n<p data-lines=\"6534,6536\"><strong>Exercise - Use speech-capable generative AI models</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-language/Instructions/Exercises/03-gen-ai-speech.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"6534,6538"}}],"payload":{"tag":"h3","lines":"6426,6427"}},{"content":"4. <a href=\"https://learn.microsoft.com/en-us/training/modules/create-speech-enabled-apps/\">Create speech-enabled apps with Azure Speech in Microsoft Foundry Tools</a>","children":[{"content":"\n<p data-lines=\"6540,6541\"><strong>Azure Speech in Foundry Tools</strong></p>","children":[{"content":"\n<p data-lines=\"6542,6543\">What is Azure Speech</p>","children":[{"content":"Is a set of speech-related capabilities that are<br>\nprovided by a Foundry resource","children":[],"payload":{"tag":"li","lines":"6543,6545"}},{"content":"Can use for","children":[{"content":"Creating an application to transcribe<br>\nrecorded calls or meetings","children":[],"payload":{"tag":"li","lines":"6546,6548"}},{"content":"Creating an AI assistant that can<br>\nread text messages or emails aloud","children":[],"payload":{"tag":"li","lines":"6548,6551"}}],"payload":{"tag":"li","lines":"6545,6551"}}],"payload":{"tag":"li","lines":"6542,6551"}},{"content":"\n<p data-lines=\"6551,6552\">Using Azure Speech in a Microsoft Foundry resource</p>","children":[{"content":"Must provision a Microsoft Foundry resource in<br>\nyour Azure subscription","children":[],"payload":{"tag":"li","lines":"6552,6554"}},{"content":"Use its endpoint to call the<br>\nAzure Language APIs from your code","children":[],"payload":{"tag":"li","lines":"6554,6556"}},{"content":"Authenticating requests by providing the<br>\nkey associated with your resource","children":[],"payload":{"tag":"li","lines":"6556,6558"}},{"content":"Call the Azure Language APIs by","children":[{"content":"Submitting requests in JSON format to the<br>\nREST interface","children":[],"payload":{"tag":"li","lines":"6559,6561"}},{"content":"Using any of the available programming<br>\nlanguage-specific SDKs","children":[],"payload":{"tag":"li","lines":"6561,6563"}}],"payload":{"tag":"li","lines":"6558,6563"}},{"content":"<span>&#x1f4a1;</span><mark>The code examples in this module are based in Python,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;using the <a href=\"https://pypi.org/project/azure-cognitiveservices-speech/\">Python SDK for Azure Speech in Foundry Tools</a>.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;SDKs for other common languages (such as Microsoft C#,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;JavaScript, and others) follow a similar pattern.</mark>","children":[],"payload":{"tag":"li","lines":"6563,6568"}}],"payload":{"tag":"li","lines":"6551,6568"}},{"content":"\n<p data-lines=\"6568,6569\">Creating a SpeechConfig</p>","children":[{"content":"Initial object you need to create to<br>\nprovide access to the Azure Speech in Foundry Tool endpoint","children":[],"payload":{"tag":"li","lines":"6569,6571"}},{"content":"<span>&#x1f4a1;</span><mark>The default home page in the Foundry portal shows the <code>endpoint</code> and <code>key</code> for your <strong>project</strong>.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;To view the <code>key</code> and <code>endpoint</code> for your <strong>resource</strong>, you can view the parent resource for your<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;project in the <strong>Admin</strong> tab of the <strong>Operate</strong> page of the portal.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;The project and foundry resource keys are the same.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;The project endpoint is the resource endpoint with <code>/api/projects/{project_name}</code> appended<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;The <strong>project endpoint</strong> is <code>https://my-ai-app-foundry.services.ai.azure.com/api/projects/my-ai-app</code><br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;The <strong>resource endpoint</strong> is <code>https://my-ai-app-foundry.services.ai.azure.com</code></mark>","children":[],"payload":{"tag":"li","lines":"6571,6578"}},{"content":"Example  <pre><code>\n  # run &quot;pip install azure-cognitiveservices-speech&quot; first to install the package \n  import azure.cognitiveservices.speech as speech_sdk\n  &#xa0;\n  # Create SpeechConfig using endpoint and key\n  speech_config = speech_sdk.SpeechConfig(subscription=&quot;YOUR_FOUNDRY_KEY&quot;,\n                                          endpoint=&quot;YOUR_FOUNDRY_ENDPOINT&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"6578,6587"}},{"content":"<span>&#x1f4a1;</span><mark>Releases of the Python SDK prior to 1.48.2 <strong>required</strong> that you specify the <em>region</em><br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;where your resource is deployed instead of the endpoint.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;With the latest release, you can use either the Foundry resource endpoint or the region.</mark>","children":[],"payload":{"tag":"li","lines":"6587,6591"}}],"payload":{"tag":"li","lines":"6568,6591"}}],"payload":{"tag":"li","lines":"6540,6591"}},{"content":"\n<p data-lines=\"6591,6592\"><strong>Use the Speech to Text API</strong></p>","children":[{"content":"Pattern for using the Speech to text API","children":[{"content":"1. <img src=\"https://learn.microsoft.com/en-us/training/wwl-data-ai/create-speech-enabled-apps/media/speech-to-text.png\" alt=\"https://learn.microsoft.com/en-us/training/wwl-data-ai/create-speech-enabled-apps/media/speech-to-text.png\">","children":[],"payload":{"tag":"li","lines":"6594,6595","listIndex":1}},{"content":"2. Use a <strong>SpeechConfig</strong> object to<br>\nencapsulate the information required to connect to your Foundry resource.<br>\nSpecifically, its endpoint (or region) and key.","children":[],"payload":{"tag":"li","lines":"6595,6598","listIndex":2}},{"content":"3. Optionally, use an <strong>AudioConfig</strong> to define the input source for<br>\nthe audio to be transcribed. By default, this is the default system microphone,<br>\nbut you can also specify an audio file.","children":[],"payload":{"tag":"li","lines":"6598,6601","listIndex":3}},{"content":"4. Use the <strong>SpeechConfig</strong> and <strong>AudioConfig</strong> to create a <strong>SpeechRecognizer</strong> object.<br>\nThis object is a proxy client for the <strong>Speech to text API</strong>.","children":[],"payload":{"tag":"li","lines":"6601,6603","listIndex":4}},{"content":"5. Use the methods of the <strong>SpeechRecognizer</strong> object to call the underlying API functions.<br>\nFor example, the <strong>RecognizeOnceAsync()</strong> method uses the Azure Speech service to<br>\nasynchronously transcribe a single spoken utterance.","children":[],"payload":{"tag":"li","lines":"6603,6606","listIndex":5}},{"content":"6. Process the response. In the case of the <strong>RecognizeOnceAsync()</strong> method, the result is a    SpeechRecognitionResult object that includes the following properties:","children":[{"content":"Duration","children":[],"payload":{"tag":"li","lines":"6607,6608"}},{"content":"OffsetInTicks","children":[],"payload":{"tag":"li","lines":"6608,6609"}},{"content":"Properties","children":[],"payload":{"tag":"li","lines":"6609,6610"}},{"content":"Reason","children":[],"payload":{"tag":"li","lines":"6610,6611"}},{"content":"ResultId","children":[],"payload":{"tag":"li","lines":"6611,6612"}},{"content":"Text","children":[],"payload":{"tag":"li","lines":"6612,6613"}}],"payload":{"tag":"li","lines":"6606,6613","listIndex":6}},{"content":"7. Success operation","children":[{"content":"The <strong>Reason</strong> property has the<br>\nenumerated value <strong>RecognizedSpeech</strong>","children":[],"payload":{"tag":"li","lines":"6614,6616"}},{"content":"The <strong>Text</strong> property contains the transcription","children":[],"payload":{"tag":"li","lines":"6616,6617"}}],"payload":{"tag":"li","lines":"6613,6617","listIndex":7}},{"content":"8. Other values for <strong>Result</strong>","children":[{"content":"NoMatch<br>\nIndicating that the audio was successfully parsed but no<br>\nspeech was recognized","children":[],"payload":{"tag":"li","lines":"6618,6621"}},{"content":"Canceled<br>\nIndicating that an error occurred","children":[{"content":"Check <strong>Properties</strong> collection","children":[],"payload":{"tag":"li","lines":"6623,6624"}},{"content":"<strong>CancellationReason</strong> property to determine what went wrong","children":[],"payload":{"tag":"li","lines":"6624,6625"}}],"payload":{"tag":"li","lines":"6621,6625"}}],"payload":{"tag":"li","lines":"6617,6625","listIndex":8}},{"content":"9. Example (Transcribing an audio file) <pre><code>\n import azure.cognitiveservices.speech as speech_sdk\n &#xa0;\n # Speech config encapsulates the connection to the resource\n speech_config = speech_sdk.SpeechConfig(subscription=&quot;YOUR_FOUNDRY_KEY&quot;,\n                                     endpoint=&quot;YOUR_FOUNDRY_ENDPOINT&quot;)\n &#xa0;\n # Audio config determines the audio stream source (defaults to system mic)\n file_path = &quot;audio.wav&quot;\n audio_config = speech_sdk.audio.AudioConfig(filename=file_path)\n &#xa0;\n # Use a speech recognizer to transcribe the audio\n speech_recognizer = speech_sdk.SpeechRecognizer(speech_config=speech_config,\n                                             audio_config=audio_config)\n &#xa0;\n result = speech_recognizer.recognize_once_async().get()\n &#xa0;\n # Did it succeeed\n if result.reason == speech_sdk.ResultReason.RecognizedSpeech:\n     # Yes!\n     print(f&quot;Transcription:\\n{result.text}&quot;)\n else:\n     # No. Try to determine why.\n     print(&quot;Error transcribing message: {}&quot;.format(result.reason))\n </code></pre>","children":[],"payload":{"tag":"li","lines":"6625,6652","listIndex":9}}],"payload":{"tag":"li","lines":"6593,6652"}}],"payload":{"tag":"li","lines":"6591,6652"}},{"content":"\n<p data-lines=\"6652,6653\"><strong>Use the Text to Speech API</strong></p>","children":[{"content":"Pattern for using the Text to speech API","children":[{"content":"1. <img src=\"https://learn.microsoft.com/en-us/training/wwl-data-ai/create-speech-enabled-apps/media/text-to-speech.png\" alt=\"https://learn.microsoft.com/en-us/training/wwl-data-ai/create-speech-enabled-apps/media/text-to-speech.png\">","children":[],"payload":{"tag":"li","lines":"6655,6656","listIndex":1}},{"content":"2. Use a <strong>SpeechConfig</strong> object to<br>\nencapsulate the information required to connect to your Azure Speech resource.<br>\nSpecifically, its <strong>location</strong> and <strong>key</strong>.","children":[],"payload":{"tag":"li","lines":"6656,6659","listIndex":2}},{"content":"3. Optionally, use an <strong>AudioConfig</strong> to define the output device for<br>\nthe speech to be synthesized.<br>\nBy default, this is the default system speaker, but you can also specify an<br>\naudio file, or by explicitly setting this value to a <strong>null</strong> value, you can<br>\nprocess the audio stream object that is returned directly.","children":[],"payload":{"tag":"li","lines":"6659,6664","listIndex":3}},{"content":"4. Use the <strong>SpeechConfig</strong> and <strong>AudioConfig</strong> to create a <strong>SpeechSynthesizer</strong> object.<br>\nThis object is a proxy client for the <strong>Text to speech</strong> API.","children":[],"payload":{"tag":"li","lines":"6664,6666","listIndex":4}},{"content":"5. Use the methods of the <strong>SpeechSynthesizer</strong> object to call the underlying API functions.<br>\nFor example, the <strong>SpeakTextAsync()</strong> method uses the Azure Speech service to convert text to spoken audio.","children":[],"payload":{"tag":"li","lines":"6666,6668","listIndex":5}},{"content":"6. Process the response from the Azure Speech service.<br>\nIn the case of the <strong>SpeakTextAsync</strong> method, the result is a <strong>SpeechSynthesisResult</strong><br>\nobject that contains the following properties:","children":[{"content":"AudioData","children":[],"payload":{"tag":"li","lines":"6671,6672"}},{"content":"Properties","children":[],"payload":{"tag":"li","lines":"6672,6673"}},{"content":"Reason","children":[],"payload":{"tag":"li","lines":"6673,6674"}},{"content":"ResultId","children":[],"payload":{"tag":"li","lines":"6674,6675"}}],"payload":{"tag":"li","lines":"6668,6675","listIndex":6}},{"content":"7. Success operation","children":[{"content":"The <strong>Reason</strong> property is set to the<br>\n<strong>SynthesizingAudioCompleted</strong> enumeration","children":[],"payload":{"tag":"li","lines":"6676,6678"}},{"content":"The <strong>AudioData</strong> property contains the audio stream<br>\nDepending on the <strong>AudioConfig</strong> may have been automatically<br>\nsent to a speaker or file","children":[],"payload":{"tag":"li","lines":"6678,6681"}}],"payload":{"tag":"li","lines":"6675,6681","listIndex":7}},{"content":"8. Example <pre><code>\n import azure.cognitiveservices.speech as speechsdk\n &#xa0;\n # Speech config encapsulates the connection to the resource\n speech_config = speechsdk.SpeechConfig(subscription=KEY, endpoint=ENDPOINT)\n &#xa0;\n # Audio output config determines where to send the audio stream (defaults to speaker)\n audio_config = speechsdk.audio.AudioOutputConfig(use_default_speaker=True)\n &#xa0;\n # Use speech synthesizer to synthesize text as speech\n speech_synthesizer = speechsdk.SpeechSynthesizer(speech_config=speech_config,\n &#xa0;                                             audio_config=audio_config)\n text = &quot;My voice is my password!&quot;\n speech_synthesis_result = speech_synthesizer.speak_text_async(text).get()\n &#xa0;\n # Did it succeeed?\n if speech_synthesis_result.reason == speechsdk.ResultReason.SynthesizingAudioCompleted:\n     # Yes!\n     print(&quot;Speech synthesized for text [{}]&quot;.format(text))\n elif speech_synthesis_result.reason == speechsdk.ResultReason.Canceled:\n     # No - Ty to find out why not\n     cancellation_details = speech_synthesis_result.cancellation_details\n     print(&quot;Speech synthesis canceled: {}&quot;.format(cancellation_details.reason))\n     if cancellation_details.reason == speechsdk.CancellationReason.Error:\n         if cancellation_details.error_details:\n             print(&quot;Error details: {}&quot;.format(cancellation_details.error_details))\n </code></pre>","children":[],"payload":{"tag":"li","lines":"6681,6710","listIndex":8}}],"payload":{"tag":"li","lines":"6654,6710"}}],"payload":{"tag":"li","lines":"6652,6710"}},{"content":"\n<p data-lines=\"6710,6711\"><strong>Configure audio format and voices</strong></p>","children":[{"content":"\n<p data-lines=\"6712,6713\">Audio format</p>","children":[{"content":"Can choose a format based on the required","children":[{"content":"Audio file type","children":[],"payload":{"tag":"li","lines":"6714,6715"}},{"content":"Sample-rate","children":[],"payload":{"tag":"li","lines":"6715,6716"}},{"content":"Bit-depth","children":[],"payload":{"tag":"li","lines":"6716,6717"}}],"payload":{"tag":"li","lines":"6713,6717"}},{"content":"Example<br>\n(a previously defined <strong>SpeechConfig</strong> object named <em>speech_config</em>)  <pre>\n  speech_config.set_speech_synthesis_output_format(SpeechSynthesisOutputFormat.Riff24Khz16BitMonoPcm)\n  </pre>","children":[],"payload":{"tag":"li","lines":"6717,6722"}},{"content":"<span>&#x1f4a1;</span><mark>For a full list of supported formats and their enumeration values,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;see the <a href=\"https://learn.microsoft.com/en-us/python/api/azure-cognitiveservices-speech/azure.cognitiveservices.speech.speechsynthesisoutputformat\">Azure Speech SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"6722,6725"}}],"payload":{"tag":"li","lines":"6712,6725"}},{"content":"\n<p data-lines=\"6725,6726\">Voices</p>","children":[{"content":"Voices are identified by <em>names</em> that indicate a <em>locale</em>","children":[],"payload":{"tag":"li","lines":"6726,6727"}},{"content":"Example  <pre>\n  speech_config.speech_synthesis_voice_name=&apos;en-US-Brian:DragonHDLatestNeural&apos;\n  </pre>","children":[],"payload":{"tag":"li","lines":"6727,6731"}},{"content":"<span>&#x1f4a1;</span><mark>For information about voices,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;see the <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support?tabs=tts\">Azure Speech SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"6731,6734"}}],"payload":{"tag":"li","lines":"6725,6734"}}],"payload":{"tag":"li","lines":"6710,6734"}},{"content":"\n<p data-lines=\"6734,6735\"><strong>Use Speech Synthesis Markup Language</strong></p>","children":[{"content":"What is SSML","children":[{"content":"Azure Speech SDK enables you to submit plain text to be<br>\nsynthesized into speech","children":[],"payload":{"tag":"li","lines":"6737,6739"}},{"content":"Also supports an XML-based syntax for describing<br>\ncharacteristics of the speech you want to generate","children":[],"payload":{"tag":"li","lines":"6739,6741"}},{"content":"<strong>Speech Synthesis Markup Language</strong> (SSML) syntax<br>\noffers greater control over how the spoken output sounds","children":[],"payload":{"tag":"li","lines":"6741,6743"}},{"content":"Can","children":[{"content":"Specify a speaking style, such as &quot;excited&quot; or &quot;cheerful&quot; when using a neural voice.","children":[],"payload":{"tag":"li","lines":"6744,6745"}},{"content":"Insert pauses or silence.","children":[],"payload":{"tag":"li","lines":"6745,6746"}},{"content":"Specify <em>phonemes</em> (phonetic pronunciations), for example to<br>\npronounce the text &quot;SQL&quot; as &quot;sequel&quot;.","children":[],"payload":{"tag":"li","lines":"6746,6748"}},{"content":"Adjust the <em>prosody</em> of the voice (affecting the pitch, timbre, and speaking rate).","children":[],"payload":{"tag":"li","lines":"6748,6749"}},{"content":"Use common &quot;say-as&quot; rules, for example to specify that a given string should be<br>\nexpressed as a date, time, telephone number, or other form.","children":[],"payload":{"tag":"li","lines":"6749,6751"}},{"content":"Insert recorded speech or audio, for example to include a standard recorded message or<br>\nsimulate background noise.","children":[],"payload":{"tag":"li","lines":"6751,6753"}}],"payload":{"tag":"li","lines":"6743,6753"}},{"content":"Example<pre data-lines=\"6754,6768\"><code class=\"language-xml\"><span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">speak</span> <span class=\"hljs-attr\">version</span>=<span class=\"hljs-string\">&quot;1.0&quot;</span> <span class=\"hljs-attr\">xmlns</span>=<span class=\"hljs-string\">&quot;http://www.w3.org/2001/10/synthesis&quot;</span> \n                    <span class=\"hljs-attr\">xmlns:mstts</span>=<span class=\"hljs-string\">&quot;https://www.w3.org/2001/mstts&quot;</span> <span class=\"hljs-attr\">xml:lang</span>=<span class=\"hljs-string\">&quot;en-US&quot;</span>&gt;</span> \n    <span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">voice</span> <span class=\"hljs-attr\">name</span>=<span class=\"hljs-string\">&quot;en-US-AriaNeural&quot;</span>&gt;</span> \n        <span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">mstts:express-as</span> <span class=\"hljs-attr\">style</span>=<span class=\"hljs-string\">&quot;cheerful&quot;</span>&gt;</span> \n        I say tomato \n        <span class=\"hljs-tag\">&lt;/<span class=\"hljs-name\">mstts:express-as</span>&gt;</span> \n    <span class=\"hljs-tag\">&lt;/<span class=\"hljs-name\">voice</span>&gt;</span> \n    <span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">voice</span> <span class=\"hljs-attr\">name</span>=<span class=\"hljs-string\">&quot;en-US-GuyNeural&quot;</span>&gt;</span> \n        I say <span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">phoneme</span> <span class=\"hljs-attr\">alphabet</span>=<span class=\"hljs-string\">&quot;sapi&quot;</span> <span class=\"hljs-attr\">ph</span>=<span class=\"hljs-string\">&quot;t ao m ae t ow&quot;</span>&gt;</span> tomato <span class=\"hljs-tag\">&lt;/<span class=\"hljs-name\">phoneme</span>&gt;</span>. \n        <span class=\"hljs-tag\">&lt;<span class=\"hljs-name\">break</span> <span class=\"hljs-attr\">strength</span>=<span class=\"hljs-string\">&quot;weak&quot;</span>/&gt;</span>Lets call the whole thing off! \n    <span class=\"hljs-tag\">&lt;/<span class=\"hljs-name\">voice</span>&gt;</span> \n<span class=\"hljs-tag\">&lt;/<span class=\"hljs-name\">speak</span>&gt;</span>\n</code></pre>","children":[],"payload":{"tag":"li","lines":"6753,6768"}},{"content":"This SSML specifies a spoken dialog between<br>\ntwo different neural voices","children":[{"content":"Ariana (cheerfully)<br>\n&quot;I say tomato:","children":[],"payload":{"tag":"li","lines":"6770,6772"}},{"content":"Guy<br>\n&quot;I say tomato (pronounced tom-ah-toe) ... Let&apos;s call the whole thing off!&quot;","children":[],"payload":{"tag":"li","lines":"6772,6774"}}],"payload":{"tag":"li","lines":"6768,6774"}},{"content":"Submit an SSML description to the<br>\nSpeech service  <pre>\n  speech_synthesis_result = speech_synthesizer.speak_ssml_async(&apos;<speak>...&apos;).get()\n  </speak></pre>","children":[],"payload":{"tag":"li","lines":"6774,6779"}},{"content":"<span>&#x1f4a1;</span><mark>For more information about SSML,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;see the <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-synthesis-markup\">Azure Speech SDK documentation</a>.</mark>","children":[],"payload":{"tag":"li","lines":"6779,6782"}}],"payload":{"tag":"li","lines":"6736,6782"}}],"payload":{"tag":"li","lines":"6734,6782"}},{"content":"\n<p data-lines=\"6782,6783\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/\">Azure Speech in Foundry Tools documentation</a>","children":[],"payload":{"tag":"li","lines":"6783,6786"}}],"payload":{"tag":"li","lines":"6782,6786"}},{"content":"\n<p data-lines=\"6786,6788\"><strong>Exercise - Create a speech-enabled app</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-language/Instructions/Exercises/04-azure-speech.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"6786,6789"}}],"payload":{"tag":"h3","lines":"6538,6539"}},{"content":"5. <a href=\"https://learn.microsoft.com/en-us/training/modules/develop-speech-agent-speech-mcp/\">Develop a speech agent with the Azure Speech MCP server</a>","children":[{"content":"\n<p data-lines=\"6791,6792\"><strong>Introduction</strong></p>","children":[{"content":"Integrating Azure Speech via MCP","children":[{"content":"Versatile Speech Capabilities<br>\nLeverage Azure Speech tools to integrate high-quality speech-to-text (transcription) and<br>\ntext-to-speech (synthesis) directly into your AI applications.","children":[],"payload":{"tag":"li","lines":"6794,6797"}},{"content":"Intelligent Agent Access<br>\nBy exposing these tools through the Azure Speech Model Context Protocol (MCP) server,<br>\nyour agent can perform speech-related operations based on simple natural language requests,<br>\neliminating the need to write custom integration code for every operation.","children":[],"payload":{"tag":"li","lines":"6797,6801"}},{"content":"Unified Audio Processing<br>\nStreamline complex workflows, such as processing customer support calls, by using a single<br>\nagent connection to handle both call transcription for analysis and audio response generation<br>\nfor customer interaction.","children":[],"payload":{"tag":"li","lines":"6801,6805"}},{"content":"Module Objectives<br>\nMaster the architectural design of the Azure Speech MCP server, configure the connection to a<br>\nMicrosoft Foundry agent, and develop programmatic client applications to interact with these<br>\nspeech-enabled agents.","children":[],"payload":{"tag":"li","lines":"6805,6810"}}],"payload":{"tag":"li","lines":"6793,6810"}}],"payload":{"tag":"li","lines":"6791,6810"}},{"content":"\n<p data-lines=\"6810,6811\"><strong>Understand the Azure Speech MCP server</strong></p>","children":[{"content":"\n<p data-lines=\"6812,6813\">What is the Model Context Protocol?</p>","children":[{"content":"Is an open protocol that defines how AI agents interact with","children":[{"content":"External tools","children":[],"payload":{"tag":"li","lines":"6814,6815"}},{"content":"Data sources","children":[],"payload":{"tag":"li","lines":"6815,6816"}},{"content":"Services","children":[],"payload":{"tag":"li","lines":"6816,6817"}}],"payload":{"tag":"li","lines":"6813,6817"}},{"content":"MCP uses a client-server architecture with","children":[{"content":"Host<br>\nThe application that runs the agent (such as Microsoft Foundry or a custom app).","children":[],"payload":{"tag":"li","lines":"6818,6820"}},{"content":"Client<br>\nA component within the host that manages connections to MCP servers and handles communication.","children":[],"payload":{"tag":"li","lines":"6820,6822"}},{"content":"Server<br>\nA program that exposes tools, resources, and prompts that an agent can discover and call.","children":[],"payload":{"tag":"li","lines":"6822,6824"}}],"payload":{"tag":"li","lines":"6817,6824"}},{"content":"When an agent connects to an MCP server","children":[{"content":"Receives a catalog of available tools","children":[],"payload":{"tag":"li","lines":"6825,6826"}},{"content":"A descriptions of what each tool does","children":[],"payload":{"tag":"li","lines":"6826,6827"}},{"content":"Choose the right tool based on the user&apos;s request","children":[],"payload":{"tag":"li","lines":"6827,6828"}},{"content":"This approach is called <em>dynamic tool</em> discovery<br>\nThe agent doesn&apos;t need hardcoded knowledge of each tool","children":[],"payload":{"tag":"li","lines":"6828,6830"}},{"content":"Key advantage of MCP for AI agents is flexibility","children":[],"payload":{"tag":"li","lines":"6830,6831"}},{"content":"Tools can be added, updated, or removed on the server<br>\nwithout modifying the agent itself","children":[],"payload":{"tag":"li","lines":"6831,6833"}},{"content":"<span>&#x1f4a1;</span><mark>To learn more about MCP architecture and how to build custom MCP tool integrations,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;see the  <a href=\"https://learn.microsoft.com/en-us/training/modules/connect-agent-to-mcp-tools/\"> Integrate MCP Tools with Azure AI Agents</a> module.</mark>","children":[],"payload":{"tag":"li","lines":"6833,6836"}}],"payload":{"tag":"li","lines":"6824,6836"}}],"payload":{"tag":"li","lines":"6812,6836"}},{"content":"\n<p data-lines=\"6836,6837\">Azure Speech MCP server capabilities</p>\n<table data-lines=\"6837,6841\">\n<thead data-lines=\"6837,6838\">\n<tr data-lines=\"6837,6838\">\n<th style=\"text-align:left\">Capability</th>\n<th style=\"text-align:left\">Description</th>\n</tr>\n</thead>\n<tbody data-lines=\"6839,6841\">\n<tr data-lines=\"6839,6840\">\n<td style=\"text-align:left\">Speech-to-text<br>(Recognize)</td>\n<td style=\"text-align:left\">Converts audio files to text using advanced speech recognition.<br>Supports WAV, MP3, OGG, FLAC, MP4, M4A, AAC, and other common audio formats.<br>Includes options for language selection, phrase hints for improved accuracy, profanity filtering, and<br>detailed or simple output formats</td>\n</tr>\n<tr data-lines=\"6840,6841\">\n<td style=\"text-align:left\">Text-to-speech<br>(Synthesize)</td>\n<td style=\"text-align:left\">Converts text input into natural-sounding audio files using neural text-to-speech voices.<br>Supports multiple languages and voices (for example, en-US-JennyNeural or en-GB-SoniaNeural), and<br>generates output in WAV, MP3, or other formats</td>\n</tr>\n</tbody>\n</table>\n  <br>\n<p data-lines=\"6844,6849\"><span>&#x1f4a1;</span><mark>When you connect the Speech MCP server to an agent, the agent receives the<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;available speech tools and their descriptions.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Based on the user&apos;s prompt, the agent decides which tool to call.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;If a user says &quot;Transcribe this audio file,&quot; the agent calls the speech-to-text tool.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;If the user says &quot;Generate speech from this text,&quot; the agent calls the text-to-speech tool.</mark></p>","children":[],"payload":{"tag":"li","lines":"6836,6850"}},{"content":"\n<p data-lines=\"6850,6851\">How the agent selects tools</p>","children":[{"content":"1. The user sends a prompt to the agent.","children":[],"payload":{"tag":"li","lines":"6851,6852","listIndex":1}},{"content":"2. The agent analyzes the prompt and<br>\ndetermines which speech task needs to be performed.","children":[],"payload":{"tag":"li","lines":"6852,6854","listIndex":2}},{"content":"3. The agent checks the available MCP tools and<br>\ntheir descriptions to find the best match.","children":[],"payload":{"tag":"li","lines":"6854,6856","listIndex":3}},{"content":"4. The agent calls the selected tool through the MCP server,<br>\npassing the relevant input (audio file URL or text).","children":[],"payload":{"tag":"li","lines":"6856,6858","listIndex":4}},{"content":"5. The MCP server processes the request using Azure Speech and<br>\nreturns the results (transcribed text or a link to an audio file).","children":[],"payload":{"tag":"li","lines":"6858,6860","listIndex":5}},{"content":"6. The agent presents the results to the user in a natural language response.","children":[],"payload":{"tag":"li","lines":"6860,6861","listIndex":6}},{"content":"7. The agent handles tool selection autonomously","children":[],"payload":{"tag":"li","lines":"6861,6862","listIndex":7}},{"content":"8. There&apos;s no need to write routing logic to determine whether a<br>\nprompt requires speech-to-text or text-to-speech.","children":[],"payload":{"tag":"li","lines":"6862,6865","listIndex":8}}],"payload":{"tag":"li","lines":"6850,6865"}},{"content":"\n<p data-lines=\"6865,6866\">Storage requirements</p>","children":[{"content":"Azure Speech MCP server works with audio files,<br>\nwhich requires an <strong>Azure Storage</strong> account.","children":[{"content":"Text-to-speech:<br>\nThe Speech MCP server saves generated audio files to an Azure Blob Storage container.<br>\nThe agent&apos;s response includes a link to the generated audio file.","children":[],"payload":{"tag":"li","lines":"6868,6871"}},{"content":"Speech-to-text<br>\nThe agent can transcribe audio files from a publicly accessible URL or from an<br>\nAzure Blob Storage container accessed with a SAS URL.","children":[],"payload":{"tag":"li","lines":"6871,6874"}}],"payload":{"tag":"li","lines":"6866,6874"}},{"content":"When you connect the Speech MCP server to your agent,<br>\nyou provide a SAS URL for a blob container.","children":[],"payload":{"tag":"li","lines":"6874,6876"}},{"content":"The SAS URL grants the MCP server permission to<br>\nread and write files in that container.","children":[],"payload":{"tag":"li","lines":"6876,6878"}},{"content":"<span>&#x26a0;</span> <mark>Treat SAS URLs as secrets.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;Use the shortest practical expiry time, scope them to a single container, and<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;don&apos;t embed them in source code, agent prompts, or chat transcripts.</mark>","children":[],"payload":{"tag":"li","lines":"6878,6882"}}],"payload":{"tag":"li","lines":"6865,6882"}},{"content":"\n<p data-lines=\"6882,6883\">Prerequisites</p>","children":[{"content":"An <strong>Azure subscription</strong>.","children":[],"payload":{"tag":"li","lines":"6883,6884"}},{"content":"A <strong>Foundry resource and project</strong> &#x2014; you need<br>\n<strong>Contributor</strong> or <strong>Owner</strong> role on the resource group.<br>\nYour Foundry resource includes speech capabilities.","children":[],"payload":{"tag":"li","lines":"6884,6887"}},{"content":"An <strong>Azure Storage account</strong> with a blob container for storing audio files.","children":[],"payload":{"tag":"li","lines":"6887,6888"}},{"content":"A <strong>SAS URL</strong> for the blob container with read, write, add, create, and list permissions.","children":[],"payload":{"tag":"li","lines":"6888,6890"}}],"payload":{"tag":"li","lines":"6882,6890"}},{"content":"\n<p data-lines=\"6890,6891\">Security considerations</p>","children":[{"content":"The Azure Speech MCP server uses<br>\nkey-based authentication.","children":[],"payload":{"tag":"li","lines":"6891,6893"}},{"content":"On create the connection","children":[{"content":"Provide resource key","children":[],"payload":{"tag":"li","lines":"6894,6895"}},{"content":"Blob container SAS URL","children":[],"payload":{"tag":"li","lines":"6895,6896"}}],"payload":{"tag":"li","lines":"6893,6896"}},{"content":"Best practices","children":[{"content":"Store keys and SAS URLs in a secure secret store and rotate them regularly.","children":[],"payload":{"tag":"li","lines":"6897,6898"}},{"content":"Avoid embedding keys or SAS URLs directly in source code, scripts, or documentation.","children":[],"payload":{"tag":"li","lines":"6898,6899"}},{"content":"Use the shortest practical SAS expiry time and scope it to the minimum required resource.","children":[],"payload":{"tag":"li","lines":"6899,6900"}},{"content":"Rotate keys immediately if you suspect they&apos;re exposed.","children":[],"payload":{"tag":"li","lines":"6900,6902"}}],"payload":{"tag":"li","lines":"6896,6902"}}],"payload":{"tag":"li","lines":"6890,6902"}}],"payload":{"tag":"li","lines":"6810,6902"}},{"content":"\n<p data-lines=\"6902,6903\"><strong>Connect and use the Speech MCP server with an agent</strong></p>","children":[{"content":"\n<p data-lines=\"6904,6905\">Set up Azure Blob Storage</p>","children":[{"content":"The Azure Speech MCP server requires an<br>\nAzure Storage account to store audio files","children":[],"payload":{"tag":"li","lines":"6905,6907"}},{"content":"Create a storage account and a<br>\nblob container before connecting the tool","children":[],"payload":{"tag":"li","lines":"6907,6909"}},{"content":"How to create","children":[{"content":"1. In the <a href=\"https://portal.azure.com/\">Azure portal</a>, create a new<br>\nAzure Storage account (or use an existing one).","children":[],"payload":{"tag":"li","lines":"6910,6912","listIndex":1}},{"content":"2. In the storage account, expand <strong>Data storage</strong> and<br>\nselect <strong>Containers</strong>.","children":[],"payload":{"tag":"li","lines":"6912,6914","listIndex":2}},{"content":"3. Create a new container (for example, named <strong>files</strong>) to<br>\nstore the audio files your agent generates and reads.","children":[],"payload":{"tag":"li","lines":"6914,6916","listIndex":3}},{"content":"4. Generate a SAS token for the container with the permissions","children":[{"content":"Read","children":[],"payload":{"tag":"li","lines":"6917,6918"}},{"content":"Add","children":[],"payload":{"tag":"li","lines":"6918,6919"}},{"content":"Create","children":[],"payload":{"tag":"li","lines":"6919,6920"}},{"content":"Write","children":[],"payload":{"tag":"li","lines":"6920,6921"}},{"content":"List.","children":[],"payload":{"tag":"li","lines":"6921,6922"}}],"payload":{"tag":"li","lines":"6916,6922","listIndex":4}},{"content":"5. Set the expiry time to the shortest practical duration.","children":[],"payload":{"tag":"li","lines":"6922,6923","listIndex":5}}],"payload":{"tag":"li","lines":"6909,6923"}},{"content":"<span>&#x26a0;</span> <mark>Copy the generated SAS URL and store it securely<br>\n&#xa0;&#xa0;&#xa0;&#xa0;&#xa0;you need it when connecting the Speech MCP server.</mark>","children":[],"payload":{"tag":"li","lines":"6923,6926"}}],"payload":{"tag":"li","lines":"6904,6926"}},{"content":"\n<p data-lines=\"6926,6927\">Create a Foundry project and agent</p>","children":[{"content":"1. In the <a href=\"https://ai.azure.com/\">Microsoft Foundry portal</a>, create a new project (or use an existing one).","children":[],"payload":{"tag":"li","lines":"6927,6928","listIndex":1}},{"content":"2. Deploy a model (such as <strong>gpt-4.1</strong>) that your agent will use for reasoning and generating responses.","children":[],"payload":{"tag":"li","lines":"6928,6929","listIndex":2}},{"content":"3. Create an agent and give it instructions that describe its purpose","children":[],"payload":{"tag":"li","lines":"6929,6930","listIndex":3}},{"content":"4. Example <pre>\n You are an AI agent that uses the Azure AI Speech tool to transcribe and generate speech.\n </pre>","children":[],"payload":{"tag":"li","lines":"6930,6934","listIndex":4}},{"content":"5. The agent is now ready to receive tool connections.","children":[],"payload":{"tag":"li","lines":"6934,6936","listIndex":5}}],"payload":{"tag":"li","lines":"6926,6936"}},{"content":"\n<p data-lines=\"6936,6937\">Connect the Azure Speech MCP server</p>","children":[{"content":"1. In the navigation pane, select the <strong>Tools</strong> page.","children":[],"payload":{"tag":"li","lines":"6937,6938","listIndex":1}},{"content":"2. Select <strong>Connect a tool</strong> and choose <strong>Azure Speech in Foundry Tools</strong> from the catalog.","children":[],"payload":{"tag":"li","lines":"6938,6939","listIndex":2}},{"content":"3. Configure the connection with the following settings:","children":[{"content":"Foundry resource name<br>\nThe name of your Foundry resource (for example, <code>myproject-resource</code>).","children":[],"payload":{"tag":"li","lines":"6940,6942"}},{"content":"Bearer (<code>Ocp-Apim-Subscription-Key</code>)<br>\nThe key for your Foundry project.","children":[],"payload":{"tag":"li","lines":"6942,6944"}},{"content":"X-Blob-Container-Url<br>\nThe SAS URL for your blob container.","children":[],"payload":{"tag":"li","lines":"6944,6946"}}],"payload":{"tag":"li","lines":"6939,6946","listIndex":3}},{"content":"4. Wait for the connection to be created, then select <strong>Use in an agent</strong> and choose your agent.","children":[],"payload":{"tag":"li","lines":"6946,6947","listIndex":4}},{"content":"5. The agent now has access to the speech-to-text and<br>\ntext-to-speech tools exposed by the Azure Speech MCP server.","children":[],"payload":{"tag":"li","lines":"6947,6949","listIndex":5}},{"content":"6. <span>&#x1f4a1;</span><mark>You can find the project key on the project home page in the Foundry portal.</mark>","children":[],"payload":{"tag":"li","lines":"6949,6951","listIndex":6}}],"payload":{"tag":"li","lines":"6936,6951"}},{"content":"\n<p data-lines=\"6951,6952\">Test in the agent playground</p>","children":[{"content":"Prompt  <pre>\n  Generate &quot;To be or not to be, that is the question.&quot; as speech\n  </pre>","children":[],"payload":{"tag":"li","lines":"6952,6956"}},{"content":"The first time the agent uses the Speech MCP tool,<br>\nyou&apos;re prompted to <strong>approve</strong> the tool usage.<br>\nYou can select <strong>Always approve all Azure Speech MCP Server tools</strong> to<br>\nskip future approval prompts.","children":[],"payload":{"tag":"li","lines":"6956,6960"}},{"content":"The response includes a link to the<br>\ngenerated audio file saved in your blob container","children":[],"payload":{"tag":"li","lines":"6960,6963"}}],"payload":{"tag":"li","lines":"6951,6963"}},{"content":"\n<p data-lines=\"6963,6964\">Test speech-to-text</p>","children":[{"content":"Prompt  <pre>\n  Transcribe the file at https://example.com/audio/meeting-recording.wav\n  </pre>","children":[],"payload":{"tag":"li","lines":"6964,6968"}},{"content":"The agent calls the speech-to-text tool and<br>\nreturns the transcribed text.","children":[],"payload":{"tag":"li","lines":"6968,6971"}}],"payload":{"tag":"li","lines":"6963,6971"}},{"content":"\n<p data-lines=\"6971,6972\">Customizing speech output</p>","children":[{"content":"Voice selection<br>\nSpecify a neural voice, such as <code>en-GB-SoniaNeural</code> or <code>en-US-JennyNeural</code>.","children":[],"payload":{"tag":"li","lines":"6972,6974"}},{"content":"Language<br>\nSpecify the language for recognition or<br>\nsynthesis (for example, <code>es-ES</code> for Spanish).","children":[],"payload":{"tag":"li","lines":"6974,6977"}},{"content":"Phrase hints<br>\nProvide domain-specific terms to improve transcription<br>\naccuracy (for example, &quot;Azure, OpenAI, Cognitive Services&quot;).","children":[],"payload":{"tag":"li","lines":"6977,6980"}},{"content":"Profanity filtering<br>\nRequest <code>masked</code>, <code>removed</code>, or <code>raw</code> profanity<br>\nhandling during transcription.","children":[],"payload":{"tag":"li","lines":"6980,6983"}},{"content":"Example  <pre>\n  Synthesize &quot;Better a witty fool, than a foolish wit!&quot; as speech using the voice &quot;en-GB-SoniaNeural&quot;.\n  </pre>","children":[],"payload":{"tag":"li","lines":"6983,6988"}}],"payload":{"tag":"li","lines":"6971,6988"}},{"content":"\n<p data-lines=\"6988,6989\">Build a client application</p>","children":[{"content":"The Microsoft Foundry SDK supports through the OpenAI Responses API","children":[],"payload":{"tag":"li","lines":"6989,6990"}},{"content":"To build a client application, you use","children":[{"content":"<code>azure-ai-projects</code>","children":[],"payload":{"tag":"li","lines":"6991,6992"}},{"content":"<code>azure-identity</code>","children":[],"payload":{"tag":"li","lines":"6992,6993"}}],"payload":{"tag":"li","lines":"6990,6993"}},{"content":"Pattern","children":[{"content":"1. \n<p data-lines=\"6994,6996\">Create an <code>AIProjectClient</code> using your Foundry project endpoint and<br>\n<code>DefaultAzureCredential</code> (which uses your Azure CLI credentials in development).</p>","children":[],"payload":{"tag":"li","lines":"6994,6996","listIndex":1}},{"content":"2. \n<p data-lines=\"6996,6997\">Get an OpenAI client from the project client by calling <code>get_openai_client()</code>.</p>","children":[],"payload":{"tag":"li","lines":"6996,6997","listIndex":2}},{"content":"3. \n<p data-lines=\"6997,6998\">Call <code>responses.create()</code> to send a user prompt to the agent.</p>","children":[],"payload":{"tag":"li","lines":"6997,6998","listIndex":3}},{"content":"4. \n<p data-lines=\"6998,7000\">Key part is how you reference the agent<br>\nspecify it by name in the <code>extra_body</code> parameter</p>\n <br>\n <pre><code>\n response = openai_client.responses.create(\n     input=[{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_prompt}],\n     extra_body={\n         &quot;agent_reference&quot;: {\n             &quot;name&quot;: &quot;Speech-Agent&quot;,\n             &quot;type&quot;: &quot;agent_reference&quot;\n         }\n     },\n )\n &#xa0;\n print(response.output_text)\n </code></pre>","children":[],"payload":{"tag":"li","lines":"6998,7015","listIndex":4}},{"content":"5. \n<p data-lines=\"7015,7016\">The agent processes the prompt</p>","children":[],"payload":{"tag":"li","lines":"7015,7016","listIndex":5}},{"content":"6. \n<p data-lines=\"7016,7017\">Calls the appropriate Speech MCP tool</p>","children":[],"payload":{"tag":"li","lines":"7016,7017","listIndex":6}},{"content":"7. \n<p data-lines=\"7017,7018\">Returns the result in <code>output_text</code></p>","children":[],"payload":{"tag":"li","lines":"7017,7018","listIndex":7}},{"content":"8. \n<p data-lines=\"7018,7020\">For text-to-speech requests, the output includes a<br>\nlink to the generated audio file in your blob container.</p>","children":[],"payload":{"tag":"li","lines":"7018,7021","listIndex":8}}],"payload":{"tag":"li","lines":"6993,7021"}}],"payload":{"tag":"li","lines":"6988,7021"}},{"content":"\n<p data-lines=\"7021,7022\">Connect the MCP server in code</p>","children":[{"content":"Use the <code>MCPTool</code> class from the <code>azure-ai-projects</code> SDK","children":[],"payload":{"tag":"li","lines":"7022,7023"}},{"content":"Example  <pre><code>\n  from azure.ai.projects.models import MCPTool\n  &#xa0;\n  mcp_tool = MCPTool(\n      server_label=&quot;azure-speech&quot;,\n      server_url=&quot;https://{foundry-resource-name}.cognitiveservices.azure.com/speech/mcp&quot;,\n      require_approval=&quot;always&quot;,\n  )\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"7023,7033"}},{"content":"Pass the <code>mcp_tool</code> when creating the<br>\nagent through the SDK","children":[],"payload":{"tag":"li","lines":"7033,7035"}},{"content":"Useful when you want to manage tool connections as<br>\npart of your application code rather than configuring<br>\nthem manually in the portal","children":[],"payload":{"tag":"li","lines":"7035,7039"}}],"payload":{"tag":"li","lines":"7021,7039"}}],"payload":{"tag":"li","lines":"6902,7039"}},{"content":"\n<p data-lines=\"7039,7040\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/developer/azure-mcp-server/tools/ai-services-speech\">Azure Speech in Foundry Tools for the Azure MCP Server</a>","children":[],"payload":{"tag":"li","lines":"7040,7041"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol\">Connect to Model Context Protocol servers</a>","children":[],"payload":{"tag":"li","lines":"7041,7042"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/python/api/overview/azure/ai-projects-readme\">Azure AI Projects SDK for Python</a>","children":[],"payload":{"tag":"li","lines":"7042,7043"}},{"content":"<a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview\">Azure Speech service overview</a>","children":[],"payload":{"tag":"li","lines":"7043,7045"}}],"payload":{"tag":"li","lines":"7039,7045"}},{"content":"\n<p data-lines=\"7045,7047\"><strong>Exercise - Use Azure Speech in an agent</strong><br>\n<a href=\"https://microsoftlearning.github.io/mslearn-ai-language/Instructions/Exercises/05-azure-speech-mcp.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"7045,7049"}}],"payload":{"tag":"h3","lines":"6789,6790"}},{"content":"6. <a href=\"https://learn.microsoft.com/en-us/training/modules/develop-voice-live-agent/\">Develop an Azure Speech Voice Live Agent in Microsoft Foundry</a>","children":[{"content":"\n<p data-lines=\"7051,7052\"><strong>Introduction</strong></p>","children":[{"content":"Building Real-Time Voice Agents","children":[{"content":"The Evolution of Interaction<br>\nVoice-enabled applications are fundamentally changing the human-technology interface,<br>\nmoving toward more natural, conversational experiences.","children":[],"payload":{"tag":"li","lines":"7054,7057"}},{"content":"Low-Latency Performance<br>\nThis module introduces the Voice Live API within Azure Speech in Foundry Tools, a<br>\nspecialized solution engineered for high-quality, real-time, speech-to-speech interactions.","children":[],"payload":{"tag":"li","lines":"7057,7060"}},{"content":"Simplified Orchestration<br>\nDesigned for scalability and efficiency, the API abstracts the complexity of traditional<br>\nvoice architectures by eliminating the need to manually orchestrate individual audio components.","children":[],"payload":{"tag":"li","lines":"7060,7063"}},{"content":"Developer-Focused Solutions<br>\nYou will learn how to leverage these advanced tools to build robust, interactive voice agents that<br>\nare both performant and easy to maintain.","children":[],"payload":{"tag":"li","lines":"7063,7067"}}],"payload":{"tag":"li","lines":"7053,7067"}}],"payload":{"tag":"li","lines":"7051,7067"}},{"content":"\n<p data-lines=\"7067,7068\"><strong>Explore the Azure Voice Live API</strong></p>","children":[{"content":"\n<p data-lines=\"7069,7070\">Key features</p>","children":[{"content":"The Voice live API enables developers to create voice-enabled applications<br>\nwith real-time, bidirectional communication.","children":[],"payload":{"tag":"li","lines":"7070,7072"}},{"content":"Uses WebSocket connections","children":[],"payload":{"tag":"li","lines":"7072,7073"}},{"content":"Supports","children":[{"content":"Speech recognition","children":[],"payload":{"tag":"li","lines":"7074,7075"}},{"content":"Text-to-speech synthesis","children":[],"payload":{"tag":"li","lines":"7075,7076"}},{"content":"Avatar streaming","children":[],"payload":{"tag":"li","lines":"7076,7077"}},{"content":"Audio processing","children":[],"payload":{"tag":"li","lines":"7077,7078"}}],"payload":{"tag":"li","lines":"7073,7078"}},{"content":"JSON-formatted events manage","children":[{"content":"Conversations","children":[],"payload":{"tag":"li","lines":"7079,7080"}},{"content":"Audio streams","children":[],"payload":{"tag":"li","lines":"7080,7081"}},{"content":"Responses.","children":[],"payload":{"tag":"li","lines":"7081,7082"}}],"payload":{"tag":"li","lines":"7078,7082"}},{"content":"Events are categorized into","children":[{"content":"Client events (sent from client to server)","children":[],"payload":{"tag":"li","lines":"7083,7084"}},{"content":"Server events (sent from server to client)","children":[],"payload":{"tag":"li","lines":"7084,7085"}}],"payload":{"tag":"li","lines":"7082,7085"}},{"content":"Real-time audio processing with support for multiple formats like PCM16 and G.711.","children":[],"payload":{"tag":"li","lines":"7085,7086"}},{"content":"Advanced voice options, including OpenAI voices and Azure custom voices.","children":[],"payload":{"tag":"li","lines":"7086,7087"}},{"content":"Avatar integration using WebRTC for video and animation.","children":[],"payload":{"tag":"li","lines":"7087,7088"}},{"content":"Built-in noise reduction and echo cancellation.","children":[],"payload":{"tag":"li","lines":"7088,7089"}},{"content":"For a table of supported models and regions, visit the [Voice Live API overview]https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live#supported-models-and-regions.","children":[],"payload":{"tag":"li","lines":"7089,7091"}}],"payload":{"tag":"li","lines":"7069,7091"}},{"content":"\n<p data-lines=\"7091,7092\">Connect to the Voice Live API</p>","children":[{"content":"Authentication methods","children":[{"content":"Microsoft Entra (keyless)","children":[{"content":"Uses token-based authentication","children":[],"payload":{"tag":"li","lines":"7094,7095"}},{"content":"Apply a retrieved authentication token using a<br>\n<code>Bearer</code> token with the <code>Authorization</code> header","children":[],"payload":{"tag":"li","lines":"7095,7097"}},{"content":"Need to assign the <strong>Cognitive Services User</strong> role to<br>\nuser account or a managed identity","children":[],"payload":{"tag":"li","lines":"7097,7099"}},{"content":"Generate a token using","children":[{"content":"Azure CLI","children":[],"payload":{"tag":"li","lines":"7100,7101"}},{"content":"Azure SDKs","children":[],"payload":{"tag":"li","lines":"7101,7102"}}],"payload":{"tag":"li","lines":"7099,7102"}},{"content":"Token generated with","children":[{"content":"The <code>https://ai.azure.com/.default</code> scope","children":[],"payload":{"tag":"li","lines":"7103,7104"}},{"content":"Legacy <code>https://cognitiveservices.azure.com/.default</code> scope","children":[],"payload":{"tag":"li","lines":"7104,7105"}}],"payload":{"tag":"li","lines":"7102,7105"}},{"content":"Use the token in the <code>Authorization</code> header of the WebSocket connection request,<br>\nwith the format <code>Bearer &lt;token&gt;</code>","children":[],"payload":{"tag":"li","lines":"7105,7107"}}],"payload":{"tag":"li","lines":"7093,7107"}},{"content":"API key","children":[{"content":"Use an <code>api-key</code> connection header on the<br>\nprehandshake connection","children":[],"payload":{"tag":"li","lines":"7108,7110"}},{"content":"Use an <code>api-key</code> query string parameter on the request URI","children":[],"payload":{"tag":"li","lines":"7110,7111"}},{"content":"Query string parameters are encrypted when using https/WSS<br>\n(Hypertext Transfer Protocol Secure/Web Socket Secure)","children":[],"payload":{"tag":"li","lines":"7111,7114"}}],"payload":{"tag":"li","lines":"7107,7114"}}],"payload":{"tag":"li","lines":"7092,7114"}}],"payload":{"tag":"li","lines":"7091,7114"}},{"content":"\n<p data-lines=\"7114,7115\">WebSocket endpoint</p>","children":[{"content":"Can access resources through a ,<br>\nconnection to the Foundry project","children":[],"payload":{"tag":"li","lines":"7115,7117"}},{"content":"A direct connection to a model","children":[],"payload":{"tag":"li","lines":"7117,7118"}},{"content":"Project connection<br>\nThe endpoint is <code>wss://&lt;your-ai-foundry-resource-name&gt;.services.ai.azure.com/voice-live/realtime?api-version=2025-10-01</code>","children":[],"payload":{"tag":"li","lines":"7118,7120"}},{"content":"Model connection<br>\nThe endpoint is <code>wss://&lt;your-ai-foundry-resource-name&gt;.cognitiveservices.azure.com/voice-live/realtime?api-version=2025-10-01</code>.","children":[],"payload":{"tag":"li","lines":"7120,7122"}},{"content":"The endpoint is the same for all models","children":[],"payload":{"tag":"li","lines":"7122,7123"}},{"content":"The difference is the required <code>model</code> query parameter","children":[],"payload":{"tag":"li","lines":"7123,7124"}},{"content":"When using the Agent service, the <code>agent_id</code> and <code>project_id</code> parameters","children":[],"payload":{"tag":"li","lines":"7124,7126"}}],"payload":{"tag":"li","lines":"7114,7126"}},{"content":"\n<p data-lines=\"7126,7127\">Voice Live API events</p>","children":[{"content":"Key client events","children":[{"content":"<code>session.update</code><br>\nModify session configurations.","children":[],"payload":{"tag":"li","lines":"7128,7130"}},{"content":"<code>input_audio_buffer.append</code><br>\nAdd audio data to the buffer.","children":[],"payload":{"tag":"li","lines":"7130,7132"}},{"content":"<code>response.create</code><br>\nGenerate responses via model inference.","children":[],"payload":{"tag":"li","lines":"7132,7134"}}],"payload":{"tag":"li","lines":"7127,7134"}},{"content":"Server events","children":[{"content":"<code>session.updated</code><br>\nConfirm session configuration changes.","children":[],"payload":{"tag":"li","lines":"7135,7137"}},{"content":"<code>response.done</code><br>\nIndicate response generation completion.","children":[],"payload":{"tag":"li","lines":"7137,7139"}},{"content":"<code>conversation.item.created</code><br>\nNotify when a new conversation item is added.","children":[],"payload":{"tag":"li","lines":"7139,7141"}},{"content":"For a full list of client/server events,<br>\nvisit <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-api-reference\">Voice live API Reference</a>.","children":[],"payload":{"tag":"li","lines":"7141,7144"}}],"payload":{"tag":"li","lines":"7134,7144"}}],"payload":{"tag":"li","lines":"7126,7144"}},{"content":"\n<p data-lines=\"7144,7145\">Configure session settings for the Voice live API</p>","children":[{"content":"First event sent by the caller on a newly established<br>\nVoice live API session is the <code>session.update</code> event","children":[],"payload":{"tag":"li","lines":"7145,7147"}},{"content":"Controls a wide set of input and output behavior","children":[],"payload":{"tag":"li","lines":"7147,7148"}},{"content":"Developers can configure","children":[{"content":"Voice types","children":[],"payload":{"tag":"li","lines":"7149,7150"}},{"content":"Modalities","children":[],"payload":{"tag":"li","lines":"7150,7151"}},{"content":"Turn detection","children":[],"payload":{"tag":"li","lines":"7151,7152"}},{"content":"Audio formats","children":[],"payload":{"tag":"li","lines":"7152,7153"}}],"payload":{"tag":"li","lines":"7148,7153"}},{"content":"Example  <pre>\n  {\n      &quot;type&quot;: &quot;session.update&quot;,\n      &quot;session&quot;: {\n          &quot;modalities&quot;: [&quot;text&quot;, &quot;audio&quot;],\n          &quot;voice&quot;: {\n          &quot;type&quot;: &quot;openai&quot;,\n          &quot;name&quot;: &quot;alloy&quot;\n          },\n          &quot;instructions&quot;: &quot;You are a helpful assistant. Be concise and friendly.&quot;,\n          &quot;input_audio_format&quot;: &quot;pcm16&quot;,\n          &quot;output_audio_format&quot;: &quot;pcm16&quot;,\n          &quot;input_audio_sampling_rate&quot;: 24000,\n          &quot;turn_detection&quot;: {\n          &quot;type&quot;: &quot;azure_semantic_vad&quot;,\n          &quot;threshold&quot;: 0.5,\n          &quot;prefix_padding_ms&quot;: 300,\n          &quot;silence_duration_ms&quot;: 500\n          },\n          &quot;temperature&quot;: 0.8,\n          &quot;max_response_output_tokens&quot;: &quot;inf&quot;\n      }\n  }\n  <pre>\n</pre></pre>","children":[],"payload":{"tag":"li","lines":"7153,7178"}},{"content":"<span>&#x1f4a1;</span><mark>Use Azure semantic Voice Activity Detection (VAD) for<br>\nintelligent turn detection and improved conversational flow.</mark>","children":[],"payload":{"tag":"li","lines":"7178,7181"}}],"payload":{"tag":"li","lines":"7144,7181"}},{"content":"\n<p data-lines=\"7181,7182\">Implement real-time audio processing with the Voice live API</p>","children":[{"content":"Real-time audio processing is a<br>\ncore feature of the Voice live API","children":[],"payload":{"tag":"li","lines":"7182,7184"}},{"content":"Developers can","children":[{"content":"Append audio<br>\nAdd audio bytes to the input buffer.","children":[],"payload":{"tag":"li","lines":"7185,7187"}},{"content":"Commit audio<br>\nProcess the audio buffer for transcription or response generation.","children":[],"payload":{"tag":"li","lines":"7187,7189"}},{"content":"Clear audio<br>\nRemove audio data from the buffer.","children":[],"payload":{"tag":"li","lines":"7189,7191"}},{"content":"Noise reduction and echo cancellation can be<br>\nconfigured to enhance audio quality","children":[],"payload":{"tag":"li","lines":"7191,7193"}},{"content":"Example  <pre>\n  {\n      &quot;type&quot;: &quot;session.update&quot;,\n      &quot;session&quot;: {\n          &quot;input_audio_noise_reduction&quot;: {\n          &quot;type&quot;: &quot;azure_deep_noise_suppression&quot;\n          },\n          &quot;input_audio_echo_cancellation&quot;: {\n          &quot;type&quot;: &quot;server_echo_cancellation&quot;\n          }\n      }   \n  }\n  </pre>","children":[],"payload":{"tag":"li","lines":"7193,7208"}}],"payload":{"tag":"li","lines":"7184,7208"}}],"payload":{"tag":"li","lines":"7181,7208"}},{"content":"\n<p data-lines=\"7208,7209\">Integrate avatar streaming using the Voice live API</p>","children":[{"content":"The Voice live API supports WebRTC-based avatar<br>\nstreaming for interactive applications","children":[],"payload":{"tag":"li","lines":"7209,7211"}},{"content":"Developers can","children":[{"content":"Use the <code>session.avatar.connect</code> event to provide the<br>\nclient&apos;s Session Description Protoco (SDP) offer.","children":[],"payload":{"tag":"li","lines":"7212,7214"}},{"content":"Configure video resolution, bitrate, and codec settings.","children":[],"payload":{"tag":"li","lines":"7214,7215"}},{"content":"Define animation outputs such as blendshapes and visemes","children":[],"payload":{"tag":"li","lines":"7215,7216"}}],"payload":{"tag":"li","lines":"7211,7216"}},{"content":"Example  <pre>\n  {\n  &quot;type&quot;: &quot;session.avatar.connect&quot;,\n  &quot;client_sdp&quot;: &quot;<client_sdp>&quot;\n  }\n  </client_sdp></pre>","children":[],"payload":{"tag":"li","lines":"7216,7224"}}],"payload":{"tag":"li","lines":"7208,7224"}}],"payload":{"tag":"li","lines":"7067,7224"}},{"content":"\n<p data-lines=\"7224,7225\"><strong>Explore the AI Voice Live client library for Python</strong></p>","children":[{"content":"\n<p data-lines=\"7226,7227\">Implement authentication</p>","children":[{"content":"Azure AI Voice Live client library for Python provides a real-time,<br>\nspeech-to-speech client for Azure AI Voice Live API","children":[],"payload":{"tag":"li","lines":"7227,7229"}},{"content":"Opens a WebSocket session to stream microphone audio to the service","children":[],"payload":{"tag":"li","lines":"7229,7230"}},{"content":"Receives server events for responsive conversations","children":[],"payload":{"tag":"li","lines":"7230,7231"}},{"content":"<span>&#x1f4a1;</span><mark>Full reference to the Voice Live package, visit the <a href=\"https://learn.microsoft.com/en-us/python/api/azure-ai-voicelive/azure.ai.voicelive?view=azure-python\">voice live Package reference</a>.</mark>","children":[],"payload":{"tag":"li","lines":"7231,7232"}},{"content":"Can implement authentication with","children":[{"content":"API key","children":[],"payload":{"tag":"li","lines":"7233,7234"}},{"content":"Microsoft Entra ID token","children":[],"payload":{"tag":"li","lines":"7234,7235"}}],"payload":{"tag":"li","lines":"7232,7235"}},{"content":"Assumes environment variables are set in a .env file","children":[],"payload":{"tag":"li","lines":"7235,7236"}},{"content":"Example  <pre><code>\n  import asyncio\n  from azure.core.credentials import AzureKeyCredential\n  from azure.ai.voicelive import connect\n  &#xa0;\n  async def main():\n      async with connect(\n          endpoint=&quot;your-endpoint&quot;,\n          credential=AzureKeyCredential(&quot;your-api-key&quot;),\n          model=&quot;gpt-4o&quot;\n      ) as connection:\n          # Your async code here\n          pass\n  &#xa0;\n  asyncio.run(main())\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"7236,7253"}},{"content":"Example<br>\n(production applications, Microsoft Entra authentication is recommended)  <pre><code>\n  import asyncio\n  from azure.identity.aio import DefaultAzureCredential\n  from azure.ai.voicelive import connect\n  &#xa0;\n  async def main():\n      credential = DefaultAzureCredential()\n  &#xa0;\n      async with connect(\n          endpoint=&quot;your-endpoint&quot;,\n          credential=credential,\n          model=&quot;gpt-4o&quot;\n      ) as connection:\n          # Your async code here\n          pass\n  &#xa0;\n  asyncio.run(main())\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"7253,7274"}}],"payload":{"tag":"li","lines":"7226,7274"}},{"content":"\n<p data-lines=\"7274,7275\">Handling events</p>","children":[{"content":"Proper handling of events ensures a more<br>\nseamless interaction between the client and agent","children":[],"payload":{"tag":"li","lines":"7275,7277"}},{"content":"Case","children":[{"content":"When handling a user interrupting the voice agent<br>\nyou need to cancel agent audio playback immediately in the client","children":[],"payload":{"tag":"li","lines":"7278,7280"}},{"content":"If don&apos;t, the client continues to play the last agent response until the<br>\ninterrupt is processed in the API &#x2010;<br>\n&#x2010; resulting in the agent &quot;talking over&quot; the user","children":[],"payload":{"tag":"li","lines":"7280,7283"}}],"payload":{"tag":"li","lines":"7277,7283"}},{"content":"Basic event handling  <pre><code>\n  async for event in connection:\n      if event.type == ServerEventType.SESSION_UPDATED:\n          print(f&quot;Session ready: {event.session.id}&quot;)\n          # Start audio capture\n  &#xa0;\n      elif event.type == ServerEventType.INPUT_AUDIO_BUFFER_SPEECH_STARTED:\n          print(&quot;User started speaking&quot;)\n          # Stop playback and cancel any current response\n  &#xa0;\n      elif event.type == ServerEventType.RESPONSE_AUDIO_DELTA:\n          # Play the audio chunk\n          audio_bytes = event.delta\n  &#xa0;\n      elif event.type == ServerEventType.ERROR:\n          print(f&quot;Error: {event.error.message}&quot;)\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"7283,7302"}}],"payload":{"tag":"li","lines":"7274,7302"}},{"content":"\n<p data-lines=\"7302,7303\">Minimal example</p>\n  <pre><code>\n  import asyncio\n  from azure.core.credentials import AzureKeyCredential\n  from azure.ai.voicelive.aio import connect\n  from azure.ai.voicelive.models import (\n      RequestSession, Modality, InputAudioFormat, OutputAudioFormat, ServerVad, ServerEventType\n  )\n  &#xa0;\n  API_KEY = &quot;your-api-key&quot;\n  ENDPOINT = &quot;your-endpoint&quot;\n  MODEL = &quot;gpt-4o&quot;\n  &#xa0;\n  async def main():\n      async with connect(\n          endpoint=ENDPOINT,\n          credential=AzureKeyCredential(API_KEY),\n          model=MODEL,\n      ) as conn:\n          session = RequestSession(\n              modalities=[Modality.TEXT, Modality.AUDIO],\n              instructions=&quot;You are a helpful assistant.&quot;,\n              input_audio_format=InputAudioFormat.PCM16,\n              output_audio_format=OutputAudioFormat.PCM16,\n              turn_detection=ServerVad(\n                  threshold=0.5, \n                  prefix_padding_ms=300, \n                  silence_duration_ms=500\n              ),\n          )\n          await conn.session.update(session=session)\n  &#xa0;\n          # Process events\n          async for evt in conn:\n              print(f&quot;Event: {evt.type}&quot;)\n              if evt.type == ServerEventType.RESPONSE_DONE:\n                  break\n  &#xa0;\n  asyncio.run(main())\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"7302,7343"}}],"payload":{"tag":"li","lines":"7224,7343"}},{"content":"\n<p data-lines=\"7343,7344\"><strong>Create a Voice Live agent</strong></p>","children":[{"content":"\n<p data-lines=\"7345,7347\">Advantages in using agents with Voice Live API<br>\n(over connecting to a model)</p>","children":[{"content":"Agents encapsulate instructions and configuration within the agent itself,<br>\nrather than specifying instructions in the session code.","children":[],"payload":{"tag":"li","lines":"7347,7349"}},{"content":"Agents support complex logic and behaviors, making it easier to manage and<br>\nupdate conversational flows without changing the client code.","children":[],"payload":{"tag":"li","lines":"7349,7351"}},{"content":"The agent approach streamlines integration. The agent ID is used to connect and<br>\nall necessary settings are handled internally, reducing the need for manual configuration in the code.","children":[],"payload":{"tag":"li","lines":"7351,7353"}},{"content":"Separating agent logic from voice implementation supports better maintainability and<br>\nscalability for scenarios where multiple conversational experiences or business logic variations are needed.","children":[],"payload":{"tag":"li","lines":"7353,7356"}}],"payload":{"tag":"li","lines":"7345,7356"}},{"content":"\n<p data-lines=\"7356,7357\">Create a voice agent in the agent playground</p>","children":[{"content":"After enabling voice mode, you can use the<br>\n<strong>Configuration</strong> pane to enable Voice Live settings","children":[{"content":"Language<br>\nThe language spoken and understood by the agent.","children":[],"payload":{"tag":"li","lines":"7359,7361"}},{"content":"Advanced settings","children":[{"content":"Voice activity detection (VAD) settings to<br>\ndetect interruptions and end of speech.","children":[],"payload":{"tag":"li","lines":"7362,7364"}},{"content":"Audio enhancement to mitigate background noise and<br>\naudio quality.","children":[],"payload":{"tag":"li","lines":"7364,7366"}}],"payload":{"tag":"li","lines":"7361,7366"}},{"content":"Voice<br>\nThe specific voice used by the agent, and advanced<br>\nvoice settings to control the tone and speaking rate.","children":[],"payload":{"tag":"li","lines":"7366,7369"}},{"content":"Interim response<br>\nThe agent can automatically generate speech while<br>\nwaiting for a model&apos;s response.","children":[],"payload":{"tag":"li","lines":"7369,7372"}},{"content":"Avatar<br>\nInclusion of a visual avatar to represent the agent.","children":[],"payload":{"tag":"li","lines":"7372,7375"}}],"payload":{"tag":"li","lines":"7357,7375"}}],"payload":{"tag":"li","lines":"7356,7375"}},{"content":"\n<p data-lines=\"7375,7376\">Create a voice agent using code</p>","children":[{"content":"Create your agent using the<br>\nFoundry SDK for Python","children":[],"payload":{"tag":"li","lines":"7376,7378"}},{"content":"Add Voice Live metadata to its definition","children":[],"payload":{"tag":"li","lines":"7378,7379"}},{"content":"Example  <pre><code>\n  import os\n  import json\n  from azure.identity             import DefaultAzureCredential\n  from azure.ai.projects          import AIProjectClient\n  from azure.ai.projects.models   import PromptAgentDefinition\n  &#xa0;\n  load_dotenv()\n  &#xa0;\n  # Setup client\n  project_client = AIProjectClient(\n      &quot;PROJECT_ENDPOINT&quot;,\n      credential=DefaultAzureCredential(),\n  )\n  &#xa0;\n  # Define Voice Live session settings\n  voice_live_config = {\n      &quot;session&quot;: {\n          &quot;voice&quot;: {\n              &quot;name&quot;: &quot;en-US-Ava:DragonHDLatestNeural&quot;,\n              &quot;type&quot;: &quot;azure-standard&quot;,\n              &quot;temperature&quot;: 0.8\n          },\n          &quot;input_audio_transcription&quot;: {\n              &quot;model&quot;: &quot;azure-speech&quot;\n          },\n          &quot;turn_detection&quot;: {\n              &quot;type&quot;: &quot;azure_semantic_vad&quot;,\n              &quot;end_of_utterance_detection&quot;: {\n                  &quot;model&quot;: &quot;semantic_detection_v1_multilingual&quot;\n              }\n
