          ]\n          # Initialize messages with a system prompt\n          messages = [\n              {&quot;role&quot;: &quot;developer&quot;, &quot;content&quot;: &quot;You are an AI assistant that provides information.&quot;},\n          ]\n          # Loop until the user types &apos;quit&apos;\n          while True:\n              prompt = input(&quot;\\nEnter a prompt (or type &apos;quit&apos; to exit)\\n&quot;)\n              if prompt.lower() == &quot;quit&quot;:\n                  break\n<pre data-lines=\"1694,1725\"><code>          # Append the user prompt to the messages\n          messages.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: prompt})\n\n          # Get initial response\n          response = client.responses.create(\n              model=model_deployment,\n              input=messages,\n              tools=function_tools\n          )\n          # Append model output to the messages\n          messages += response.output\n          # Was there a function call?\n          for item in response.output:\n              if item.type == &quot;function_call&quot; and item.name == &quot;get_time&quot;:\n                  current_time = get_time()\n                  messages.append({\n                      &quot;type&quot;: &quot;function_call_output&quot;,\n                      &quot;call_id&quot;: item.call_id,\n                      &quot;output&quot;: current_time\n                  })\n                  # Get a follow up response using the tool output\n                  response = client.responses.create(\n                      model=model_deployment,\n                      instructions=&quot;Answer only with the tool output.&quot;,\n                      input=messages,\n                      tools=function_tools\n                  )\n          print(response.output_text)\n  # Run the main function when the script starts\n  if __name__ == &apos;__main__&apos;:\n      main()\n</code></pre>\n<p data-lines=\"1725,1726\"></p></code></pre><p></p>","children":[{"content":"\n<p data-lines=\"1727,1728\">Output</p>\n  <pre>\n<pre data-lines=\"1731,1742\"><code>  Enter a prompt (or type &apos;quit&apos; to exit)\n  Hello\n\n  Hello! How can I help you today?\n\n  Enter a prompt (or type &apos;quit&apos; to exit)\n  What time is it?\n\n  The time is 2026-03-19 17:17:41.\n\n  Enter a prompt (or type &apos;quit&apos; to exit)\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"1727,1744"}},{"content":"\n<p data-lines=\"1744,1746\"><span>&#x26a0;</span> <mark>You can configure the tool to use multiple functions, with or without parameters.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;OpenAI developers guide <a href=\"https://developers.openai.com/api/docs/guides/function-calling\">&#x2192; saber +</a></mark></p>","children":[],"payload":{"tag":"li","lines":"1744,1747"}}],"payload":{"tag":"li","lines":"1664,1747"}},{"content":"\n<p data-lines=\"1747,1748\">How the <code>function tool</code> works</p>","children":[{"content":"You define tools<br>\nProvide one or more function definitions in the tools array.","children":[],"payload":{"tag":"li","lines":"1748,1750"}},{"content":"Model evaluates the prompt<br>\nIt determines whether a function call is needed.","children":[],"payload":{"tag":"li","lines":"1750,1752"}},{"content":"Model emits a function call<br>\nThe response includes the function name and call metadata.","children":[],"payload":{"tag":"li","lines":"1752,1754"}},{"content":"Your app runs logic<br>\nRun the matching function in your code.","children":[],"payload":{"tag":"li","lines":"1754,1756"}},{"content":"You return function output<br>\nSend a function_call_output item with the result.","children":[],"payload":{"tag":"li","lines":"1756,1758"}},{"content":"Model completes the answer<br>\nIt incorporates tool results into the final response.","children":[],"payload":{"tag":"li","lines":"1758,1761"}}],"payload":{"tag":"li","lines":"1747,1761"}},{"content":"\n<p data-lines=\"1761,1762\">Best practices</p>","children":[{"content":"Keep tools focused<br>\nSmall, single-purpose functions are easier to control and test","children":[],"payload":{"tag":"li","lines":"1762,1764"}},{"content":"Validate function inputs<br>\nNever trust tool arguments blindly in production systems","children":[],"payload":{"tag":"li","lines":"1764,1766"}},{"content":"Handle errors safely<br>\nReturn clear error outputs the model can reason about","children":[],"payload":{"tag":"li","lines":"1766,1768"}},{"content":"Log tool usage<br>\nTrack calls, latency, and failure rates for debugging and governance","children":[],"payload":{"tag":"li","lines":"1768,1770"}},{"content":"Limit sensitive operations<br>\nRequire explicit authorization for high-impact actions","children":[],"payload":{"tag":"li","lines":"1770,1773"}}],"payload":{"tag":"li","lines":"1761,1773"}},{"content":"\n<p data-lines=\"1773,1774\">Limitations</p>","children":[{"content":"The model requests function calls, but your application must run them","children":[],"payload":{"tag":"li","lines":"1774,1775"}},{"content":"Incorrect or unexpected tool arguments can occur and should be validated","children":[],"payload":{"tag":"li","lines":"1775,1776"}},{"content":"Tool latency can increase end-to-end response time","children":[],"payload":{"tag":"li","lines":"1776,1777"}},{"content":"Function calling improves reliability, but final outputs still need review for critical decisions","children":[],"payload":{"tag":"li","lines":"1777,1779"}}],"payload":{"tag":"li","lines":"1773,1779"}}],"payload":{"tag":"li","lines":"1632,1779"}}],"payload":{"tag":"li","lines":"1630,1779"}},{"content":"\n<p data-lines=\"1779,1780\"><strong>Key takeaways</strong></p>","children":[{"content":"The <code>code_interpreter</code> tool<br>\nlets the model generate and run Python code for calculations, data analysis, and iterative problem solving.","children":[],"payload":{"tag":"li","lines":"1780,1782"}},{"content":"The <code>web_search</code> tool<br>\nenables retrieval of current external information so responses can include timely, source-grounded content.","children":[],"payload":{"tag":"li","lines":"1782,1784"}},{"content":"The <code>file_search</code> tool<br>\nhelps the model answer questions from your own indexed documents and knowledge files.","children":[],"payload":{"tag":"li","lines":"1784,1786"}},{"content":"The <code>function</code> tool<br>\nallows your application to run custom business logic and return results back to the model.","children":[],"payload":{"tag":"li","lines":"1786,1789"}}],"payload":{"tag":"li","lines":"1779,1789"}},{"content":"\n<p data-lines=\"1789,1790\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://developers.openai.com/api/docs/guides/tools\">OpenAI developer guide: Tools</a>","children":[],"payload":{"tag":"li","lines":"1790,1791"}},{"content":"<a href=\"https://developers.openai.com/api/docs/guides/function-calling\">OpenAI developers Guide: Function calling</a>","children":[],"payload":{"tag":"li","lines":"1791,1793"}}],"payload":{"tag":"li","lines":"1789,1793"}},{"content":"\n<p data-lines=\"1793,1795\"><strong>Exercise - Create a generative AI chat app that uses tools</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-studio/Instructions/Exercises/04a-use-own-data.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"1793,1797"}}],"payload":{"tag":"h3","lines":"1285,1286"}},{"content":"5. <a href=\"https://learn.MS.com/en-us/training/modules/optimize-generative-ai-model-performance/\">Optimize generative AI model performance with MS Foundry</a>","children":[{"content":"\n<p data-lines=\"1800,1801\"><strong>Introduction</strong></p>","children":[{"content":"The quality, accuracy, and consistency of the responses a model generates<br>\ndepend on how you configure and augment it","children":[],"payload":{"tag":"li","lines":"1801,1803"}},{"content":"There are several complementary strategies","children":[{"content":"Prompt engineering","children":[],"payload":{"tag":"li","lines":"1804,1805"}},{"content":"Fine-tuning","children":[],"payload":{"tag":"li","lines":"1805,1806"}},{"content":"Retrieval Augmented Generation (RAG)","children":[],"payload":{"tag":"li","lines":"1806,1807"}},{"content":"Combined strategies","children":[],"payload":{"tag":"li","lines":"1807,1809"}}],"payload":{"tag":"li","lines":"1803,1809"}}],"payload":{"tag":"li","lines":"1800,1809"}},{"content":"\n<p data-lines=\"1809,1810\"><strong>Optimize model output with prompt engineering</strong></p>","children":[{"content":"\n<p data-lines=\"1811,1812\">What is prompt engineering?</p>","children":[{"content":"Most accessible way to optimize a model&apos;s<br>\nperformance is through prompt engineering.","children":[],"payload":{"tag":"li","lines":"1812,1814"}},{"content":"Prompt engineering is process of designing and<br>\nrefining prompts to improve","children":[{"content":"Quality","children":[],"payload":{"tag":"li","lines":"1816,1817"}},{"content":"Accuracy","children":[],"payload":{"tag":"li","lines":"1817,1818"}},{"content":"Relevance of the responses","children":[],"payload":{"tag":"li","lines":"1818,1819"}},{"content":"Requires no additional infrastructure","children":[],"payload":{"tag":"li","lines":"1819,1820"}},{"content":"Requires no additional data","children":[],"payload":{"tag":"li","lines":"1820,1821"}},{"content":"Can start experimenting immediatly","children":[],"payload":{"tag":"li","lines":"1821,1822"}}],"payload":{"tag":"li","lines":"1814,1822"}},{"content":"Helps guide how a model responds","children":[],"payload":{"tag":"li","lines":"1822,1824"}}],"payload":{"tag":"li","lines":"1811,1824"}},{"content":"\n<p data-lines=\"1824,1825\">Understand prompt components</p>","children":[{"content":"System message<br>\nInstructions that define the model&apos;s behavior, role, and constraints.","children":[],"payload":{"tag":"li","lines":"1825,1827"}},{"content":"User message<br>\nThe question or input from the user.","children":[],"payload":{"tag":"li","lines":"1827,1829"}},{"content":"Assistant message<br>\nPrevious model responses, used in multi-turn conversations.","children":[],"payload":{"tag":"li","lines":"1829,1831"}},{"content":"Examples<br>\nSample input/output pairs that demonstrate the expected response format.","children":[],"payload":{"tag":"li","lines":"1831,1833"}},{"content":"<span>&#x26a0;</span> <mark>How you structure and combine these components determines<br>\n&#xa0;&#xa0;&#xa0;&#xa0;how effectively the model responds.</mark>","children":[],"payload":{"tag":"li","lines":"1833,1836"}}],"payload":{"tag":"li","lines":"1824,1836"}},{"content":"\n<p data-lines=\"1836,1837\">Design effective system messages</p>","children":[{"content":"\n<p data-lines=\"1837,1839\">System message is a set of instructions provided to the<br>\nmodel to guide its responses</p>","children":[],"payload":{"tag":"li","lines":"1837,1839"}},{"content":"\n<p data-lines=\"1839,1841\">System messages appear first in the conversation and<br>\nact as the highest-levs  set of instructions</p>","children":[],"payload":{"tag":"li","lines":"1839,1841"}},{"content":"\n<p data-lines=\"1841,1842\">System messages are used to</p>","children":[{"content":"Define the assistent&apos;s role and boundaries","children":[],"payload":{"tag":"li","lines":"1842,1843"}},{"content":"Set the tone ando communication style","children":[],"payload":{"tag":"li","lines":"1843,1844"}},{"content":"Specify output formats, such JSON or bullet points","children":[],"payload":{"tag":"li","lines":"1844,1845"}},{"content":"Add safety and quality constraints for your scenario","children":[],"payload":{"tag":"li","lines":"1845,1846"}}],"payload":{"tag":"li","lines":"1841,1846"}},{"content":"\n<p data-lines=\"1846,1847\">System messages can be</p>","children":[{"content":"Simple  <pre>\n      You are a helpful AI assistant.\n  </pre>","children":[],"payload":{"tag":"li","lines":"1847,1851"}},{"content":"Detailed  <pre>\n      You are a friendly travel advisor for Margie&apos;s Travel.\n      Answer only questions related to travel, hotels, and trip planning.\n      Use a warm, conversational tone.\n      If you don&apos;t have enough information to answer, ask a clarifying question.\n      Format hotel recommendations as a bulleted list with the hotel name, location, and price range.\n  </pre>","children":[],"payload":{"tag":"li","lines":"1851,1859"}},{"content":"<span>&#x26a0;</span> <mark>A system message influences the model but doesn&apos;t guarantee compliance.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;You should test and iterate on your system messages and<br>\n&#xa0;&#xa0;&#xa0;&#xa0;layer them with other mitigations like content filtering and evaluation</mark>","children":[],"payload":{"tag":"li","lines":"1859,1863"}}],"payload":{"tag":"li","lines":"1846,1863"}},{"content":"\n<p data-lines=\"1863,1864\">System messages checklist</p>","children":[{"content":"Start with the assistant&apos;s role<br>\nState the role and the expected outcome for a typical request.","children":[],"payload":{"tag":"li","lines":"1864,1866"}},{"content":"Define boundaries<br>\nList the topics, actions, and content types the assistant should avoid.","children":[],"payload":{"tag":"li","lines":"1866,1868"}},{"content":"Specify the output format<br>\nIf you need a specific format, state it plainly and keep it consistent.","children":[],"payload":{"tag":"li","lines":"1868,1870"}},{"content":"Add a &quot;when unsure&quot; policy<br>\nTell the model what to do when the user&apos;s request is ambiguous, out of scope, or when the model lacks information.","children":[],"payload":{"tag":"li","lines":"1870,1873"}}],"payload":{"tag":"li","lines":"1863,1873"}},{"content":"\n<p data-lines=\"1873,1874\">Apply prompt engineering patterns</p>","children":[{"content":"Effective prompts use patterns that help the<br>\nmodel produce better responses","children":[],"payload":{"tag":"li","lines":"1874,1876"}},{"content":"Common patterns to use","children":[{"content":"\n<p data-lines=\"1877,1880\">Persona<br>\nInstruct the model to take on a specific perspective or role<br>\n<br></p>\n<table data-lines=\"1880,1885\">\n<thead data-lines=\"1880,1881\">\n<tr data-lines=\"1880,1881\">\n<th>&#xa0;</th>\n<th>No persona</th>\n<th>With persona</th>\n</tr>\n</thead>\n<tbody data-lines=\"1882,1885\">\n<tr data-lines=\"1882,1883\">\n<td>System message</td>\n<td>None</td>\n<td>You&apos;re a seasoned marketing professional<br>writing for technical customers</td>\n</tr>\n<tr data-lines=\"1883,1884\">\n<td>User prompt</td>\n<td>Write a one-sentence description of a<br>CRM product</td>\n<td>Write a one-sentence description of a<br>CRM product</td>\n</tr>\n<tr data-lines=\"1884,1885\">\n<td>Response</td>\n<td>A CRM product is a software tool<br>designed tomanage a company&apos;s<br>interactions with customers</td>\n<td>Experience seamless customer relationship<br>management with our CRM, designed to streamline<br>operations and drive sales growth with robust analytics</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"1877,1886"}},{"content":"\n<p data-lines=\"1886,1887\">Format template</p>\n  <pre>\n      Format the result to show:\n      - Hotel name\n      - Location\n      - Star rating\n      - Price range per night\n  </pre>\n<p data-lines=\"1894,1896\"><span>&#x26a0;</span> <mark>This pattern ensures consistent, organized responses that are<br>\n&#xa0;&#xa0;&#xa0;&#xa0;easy to parse in your application</mark></p>","children":[],"payload":{"tag":"li","lines":"1886,1897"}},{"content":"\n<p data-lines=\"1897,1898\">Chain-of-Thought (CoT)</p>","children":[{"content":"\n<p data-lines=\"1898,1899\">Ask the model to explain its reasoning step-by-step</p>","children":[],"payload":{"tag":"li","lines":"1898,1899"}},{"content":"\n<p data-lines=\"1899,1900\">This technique reduces the chance of  inacurate results</p>","children":[],"payload":{"tag":"li","lines":"1899,1900"}},{"content":"\n<p data-lines=\"1900,1901\">This technique makes easier to verify the model&apos;s logic</p>","children":[],"payload":{"tag":"li","lines":"1900,1901"}},{"content":"\n<p data-lines=\"1901,1902\">Instead of</p>\n  <pre>\n<pre data-lines=\"1905,1906\"><code>  Which hotel is best for a family of four?\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"1901,1907"}},{"content":"\n<p data-lines=\"1907,1908\">Use</p>\n  <pre>\n<pre data-lines=\"1911,1914\"><code>  Which hotel is best for a family of four?\n  Take a step-by-step approach: \n  consider room size, amenities for children, location, and price.\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"1907,1915"}},{"content":"\n<p data-lines=\"1915,1916\"><strong>Beak the task down</strong></p>","children":[{"content":"This related technique consists in<br>explicit sub-steps <em>before</em> the model responds","children":[],"payload":{"tag":"li","lines":"1916,1917"}},{"content":"Example","children":[{"content":"First ask the model to extract key facts from a passage","children":[],"payload":{"tag":"li","lines":"1918,1919"}},{"content":"In a follow-up prompt ask it to answer a<br>question based on those facts","children":[],"payload":{"tag":"li","lines":"1919,1920"}},{"content":"Decomposing the work reduce errors on<br>complex, multi-part tasks","children":[],"payload":{"tag":"li","lines":"1920,1921"}}],"payload":{"tag":"li","lines":"1917,1921"}}],"payload":{"tag":"li","lines":"1915,1921"}},{"content":"\n<p data-lines=\"1921,1923\"><span>&#x26a0;</span> <mark>Chain-of-thought prompting is a technique for non-reasoning models.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;Reasoning models like o-series models handle step-by-step logic internally.</mark></p>","children":[],"payload":{"tag":"li","lines":"1921,1924"}}],"payload":{"tag":"li","lines":"1897,1924"}},{"content":"\n<p data-lines=\"1924,1925\">Few-shot learning</p>","children":[{"content":"\n<p data-lines=\"1925,1927\">Provide one or more examples of the desired input/output<br><br>\nto help model identify the pattern</p>","children":[],"payload":{"tag":"li","lines":"1925,1927"}},{"content":"\n<p data-lines=\"1927,1928\">Other</p>","children":[{"content":"One-shot<br>\nSingle example","children":[],"payload":{"tag":"li","lines":"1928,1930"}},{"content":"Zero-shot<br>\nNo examples","children":[],"payload":{"tag":"li","lines":"1930,1932"}}],"payload":{"tag":"li","lines":"1927,1932"}},{"content":"\n<p data-lines=\"1932,1933\">Example</p>\n  <pre>\n<pre data-lines=\"1936,1946\"><code>  Classify the following customer messages:\n\n  Message: &quot;I need to change my flight to Rome&quot;\n  Category: Booking change\n\n  Message: &quot;What&apos;s the weather like in Bali in March?&quot;\n  Category: Travel information\n\n  Message: &quot;Can I get a refund for my cancelled tour?&quot;\n  Category:\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"1932,1948"}}],"payload":{"tag":"li","lines":"1924,1948"}},{"content":"\n<p data-lines=\"1948,1949\">Use clear syntyac and delimiters</p>","children":[{"content":"When prompt includes multiple sections like<br>\nInstructions<br>\nSource text<br>\nExamples<br>\nUse delimiters like <code>---</code>, markdown headers or XML tags to<br>separate them<br>\nThis way the modl can distinguish instructions from<br>\ncontent and reduce the chance of misinterpretation","children":[],"payload":{"tag":"li","lines":"1949,1956"}},{"content":"<span>&#x26a0;</span> <mark>Models can be susceptible to <strong>recency bias</strong>, meaning text near the end of a<br>\n&#xa0;&#xa0;&#xa0;&#xa0;prompt can have more influence than text at the beginning<br>\n&#xa0;&#xa0;&#xa0;&#xa0;If the model isn&apos;t following your instructions consistently, try<br>\n&#xa0;&#xa0;&#xa0;&#xa0;repeating the key instruction at the end of the prompt.</mark>","children":[],"payload":{"tag":"li","lines":"1956,1961"}}],"payload":{"tag":"li","lines":"1948,1961"}}],"payload":{"tag":"li","lines":"1876,1961"}}],"payload":{"tag":"li","lines":"1873,1961"}}],"payload":{"tag":"li","lines":"1836,1961"}},{"content":"\n<p data-lines=\"1961,1962\">Configure model parameters</p>","children":[{"content":"Temperature<br>\nControls the randomness of the output.","children":[{"content":"A higher value (0.7) produces more creative and varied responses","children":[],"payload":{"tag":"li","lines":"1964,1965"}},{"content":"A lower value (0.2) produces more focused and deterministic responses","children":[],"payload":{"tag":"li","lines":"1965,1966"}},{"content":"Use lower values for factual tasks","children":[],"payload":{"tag":"li","lines":"1966,1967"}},{"content":"Use higher values for creative ones.","children":[],"payload":{"tag":"li","lines":"1967,1968"}}],"payload":{"tag":"li","lines":"1962,1968"}},{"content":"Top_p<br>\nAlso controls randomness.<br>\nLimiting the model to a subset of the most probable next tokens<br>\nA <code>top_p</code> of 0.9 means the model considers only the top 90% of probable tokens","children":[],"payload":{"tag":"li","lines":"1968,1972"}},{"content":"<span>&#x26a0;</span> <mark>The general recommendation is to<br>\n&#xa0;&#xa0;&#xa0;&#xa0;adjust either temperature or top_p,<br>\n&#xa0;&#xa0;&#xa0;&#xa0;not both at the same time.</mark>","children":[],"payload":{"tag":"li","lines":"1972,1976"}}],"payload":{"tag":"li","lines":"1961,1976"}},{"content":"\n<p data-lines=\"1976,1978\">When prompt engineering is enough<br>\nIt&apos;s effective when we need to</p>","children":[{"content":"Guide the model&apos;s tone, format and behaviour","children":[],"payload":{"tag":"li","lines":"1978,1979"}},{"content":"Provide specific instructions for a task","children":[],"payload":{"tag":"li","lines":"1979,1980"}},{"content":"Quickly iterate on results withour infrastructure changes","children":[],"payload":{"tag":"li","lines":"1980,1981"}},{"content":"Keep costs low, as no additional traing or data storage is required","children":[],"payload":{"tag":"li","lines":"1981,1983"}}],"payload":{"tag":"li","lines":"1976,1983"}},{"content":"\n<p data-lines=\"1983,1984\">Limitations</p>","children":[{"content":"Model doesn&apos;t have the access to the<br>\ninformation it needs (some organization&apos;s private information)","children":[],"payload":{"tag":"li","lines":"1984,1986"}},{"content":"Fails to maintain a specific behaviour despite detailed instructions","children":[],"payload":{"tag":"li","lines":"1986,1987"}},{"content":"When a model lacks relevant context, it might generate responses that<br>\nsound plausible but are factually incorrect","children":[],"payload":{"tag":"li","lines":"1987,1990"}}],"payload":{"tag":"li","lines":"1983,1990"}}],"payload":{"tag":"li","lines":"1809,1990"}},{"content":"\n<p data-lines=\"1990,1991\"><strong>Ground your model with Retrieval Augmented Generation</strong></p>","children":[{"content":"\n<p data-lines=\"1992,1993\">Understanding grounding</p>","children":[{"content":"When you use a language model without grounding,<br>\nthe only information it has comes from its training data","children":[{"content":"Result","children":[{"content":"Can be inaccurate","children":[],"payload":{"tag":"li","lines":"1996,1997"}},{"content":"Include fabricated details","children":[],"payload":{"tag":"li","lines":"1997,1998"}}],"payload":{"tag":"li","lines":"1995,1998"}}],"payload":{"tag":"li","lines":"1993,1998"}},{"content":"The most common technique for grounding a language model is<br>\nRetrieval Augmented Generation (RAG)&#xb4;","children":[],"payload":{"tag":"li","lines":"1998,2000"}},{"content":"Consider the difference","children":[{"content":"Ungrounded<br>\nThe model relies only on its training data and<br>\nmight invent hotel names or details.","children":[],"payload":{"tag":"li","lines":"2001,2004"}},{"content":"Grounded<br>\nThe model receives your actual hotel catalog data as<br>\ncontext and responds with real hotel names, prices, and availability","children":[],"payload":{"tag":"li","lines":"2004,2007"}}],"payload":{"tag":"li","lines":"2000,2007"}},{"content":"Improves the factual accuracy of responses by connecting the model to<br>\ninformation that is specific, current, and relevant to the user&apos;s needs","children":[],"payload":{"tag":"li","lines":"2007,2010"}}],"payload":{"tag":"li","lines":"1992,2010"}},{"content":"\n<p data-lines=\"2010,2011\">How RAG works</p>","children":[{"content":"Is a pattern that retrieves relevant information from a<br>\ndata source and includes it in the prompt before the<br>\nmodel generates a response","children":[],"payload":{"tag":"li","lines":"2011,2014"}},{"content":"Steps","children":[{"content":"1. Retrieve<br>\nSearch a data source for information that is relevant to the user&apos;s question.","children":[],"payload":{"tag":"li","lines":"2015,2017","listIndex":1}},{"content":"2. Augment<br>\nAdd the retrieved information to the prompt as context.","children":[],"payload":{"tag":"li","lines":"2017,2019","listIndex":2}},{"content":"3. Generate<br>\nSend the augmented prompt to the language model to generate a grounded response.","children":[],"payload":{"tag":"li","lines":"2019,2022","listIndex":3}}],"payload":{"tag":"li","lines":"2014,2022"}}],"payload":{"tag":"li","lines":"2010,2022"}},{"content":"\n<p data-lines=\"2022,2023\">Create embeddings for search</p>","children":[{"content":"An embedding is a mathematical representation of<br>\ntext as a vector","children":[],"payload":{"tag":"li","lines":"2023,2025"}},{"content":"A vector (of an embedding) is a list of floating-point numbers that<br>\ncaptures the meaning of words, sentences, or documents","children":[],"payload":{"tag":"li","lines":"2025,2027"}},{"content":"Embeddings with similar meanings, show vectors closer together in a<br>\nmultidimensional space, reflecting their semantic similarity","children":[],"payload":{"tag":"li","lines":"2027,2029"}},{"content":"Cosine similarity measures how close two vectors are by<br>\ncalculating the angle between them<br>\nA value near 1 means the vectors are very similar","children":[],"payload":{"tag":"li","lines":"2029,2033"}}],"payload":{"tag":"li","lines":"2022,2033"}},{"content":"\n<p data-lines=\"2033,2034\">Use Azure AI Search for retrieval</p>","children":[{"content":"Azure AI Search provides the<br>\nretrieval component for RAG solutions","children":[],"payload":{"tag":"li","lines":"2034,2036"}},{"content":"Allows bringing our own data, create a searchable index and<br>\nquery it to retrieve relevant information","children":[],"payload":{"tag":"li","lines":"2036,2039"}}],"payload":{"tag":"li","lines":"2033,2039"}},{"content":"\n<p data-lines=\"2039,2040\">How to use Azure AI Search</p>","children":[{"content":"Add your data to MS Foundry from sources","children":[{"content":"Azure Blob Storage","children":[],"payload":{"tag":"li","lines":"2041,2042"}},{"content":"Azure Data Lake Storage Gen2","children":[],"payload":{"tag":"li","lines":"2042,2043"}},{"content":"MS OneLake","children":[],"payload":{"tag":"li","lines":"2043,2044"}},{"content":"Upload files directly.","children":[],"payload":{"tag":"li","lines":"2044,2045"}}],"payload":{"tag":"li","lines":"2040,2045"}},{"content":"Create an index<br>\nUsing an embedding model to generate vector representations of your content.<br>\nThe index is stored in Azure AI Search.","children":[],"payload":{"tag":"li","lines":"2045,2048"}},{"content":"Query the index when a user asks a question<br>\nThe system converts the question to an embedding,<br>\nsearches for the most similar content, and<br>\nreturns the relevant results.","children":[],"payload":{"tag":"li","lines":"2048,2053"}}],"payload":{"tag":"li","lines":"2039,2053"}},{"content":"\n<p data-lines=\"2053,2054\">Azure AI Search supports</p>","children":[{"content":"Keyword search<br>\nMatches exact terms in the query to text in the index.","children":[],"payload":{"tag":"li","lines":"2054,2056"}},{"content":"Semantic search<br>\nUses semantic models to match the meaning of the query rather than exact keywords.","children":[],"payload":{"tag":"li","lines":"2056,2058"}},{"content":"Vector search<br>\nUses embeddings to find semantically similar content.","children":[],"payload":{"tag":"li","lines":"2058,2060"}},{"content":"Hybrid search<br>\nCombines keyword, semantic, and vector search for the most accurate results.<br>\nHybrid search is recommended for generative AI applications.","children":[],"payload":{"tag":"li","lines":"2060,2064"}}],"payload":{"tag":"li","lines":"2053,2064"}},{"content":"\n<p data-lines=\"2064,2065\">Implement RAG with the Azure AI Foundry SDK</p>","children":[{"content":"\n<p data-lines=\"2065,2066\">Create an Azure AI Search index</p>","children":[{"content":"<a href=\"https://learn.MS.com/en-us/azure/search/search-how-to-create-search-index?tabs=portal\">MS Learn</a>","children":[],"payload":{"tag":"li","lines":"2066,2067"}},{"content":"<a href=\"https://www.youtube.com/watch?v=pNFNpf_ejRw\">YouTube</a>","children":[],"payload":{"tag":"li","lines":"2067,2068"}}],"payload":{"tag":"li","lines":"2065,2068"}},{"content":"\n<p data-lines=\"2068,2069\">Connect to a model through Foundry project</p>","children":[],"payload":{"tag":"li","lines":"2068,2069"}},{"content":"\n<p data-lines=\"2069,2070\">With the <code>azure-ai-projects</code> SDK</p>","children":[{"content":"Get an authenticated OpenAI client","children":[],"payload":{"tag":"li","lines":"2070,2071"}},{"content":"Use the Responses API to generate grounded answers","children":[],"payload":{"tag":"li","lines":"2071,2072"}}],"payload":{"tag":"li","lines":"2069,2072"}},{"content":"\n<p data-lines=\"2072,2073\">Example</p>\n  <pre><code>\n      import os\n      from azure.ai.projects    import AIProjectClient\n      from azure.identity       import DefaultAzureCredential\n      project = AIProjectClient(\n          endpoint=os.environ[&quot;PROJECT_ENDPOINT&quot;],\n          credential=DefaultAzureCredential(),\n      )\n      client = project.get_openai_client()\n      response = client.responses.create(\n          model=&quot;gpt-4o&quot;,\n          input=[\n              {&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;You are a helpful travel advisor. &quot;\n              &quot;Use the following hotel data to answer: &quot; + retrieved_context},\n              {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;Which hotels do you offer in Paris?&quot;},\n          ],\n      )\n      print(response.output_text)\n  </code></pre>","children":[{"content":"<code>retrieved_context</code> represents the<br>\ndocuments returned from Azure AI Search index","children":[],"payload":{"tag":"li","lines":"2093,2095"}},{"content":"Injecting those results into the system message,<br>\nthe model&apos;s response is grounded in actual data","children":[],"payload":{"tag":"li","lines":"2095,2098"}}],"payload":{"tag":"li","lines":"2072,2098"}}],"payload":{"tag":"li","lines":"2064,2098"}},{"content":"\n<p data-lines=\"2098,2099\">When to use RAG</p>","children":[{"content":"The model needs domain-specific knowledge<br>\nYour organization has private data that the model wasn&apos;t trained on,<br>\nlike a product catalog, policy documents, or internal knowledge base.","children":[],"payload":{"tag":"li","lines":"2099,2102"}},{"content":"Information changes frequently<br>\nYour data is updated regularly, such as inventory, pricing, or news.<br>\nRAG retrieves current data at query time without retraining.","children":[],"payload":{"tag":"li","lines":"2102,2105"}},{"content":"Factual accuracy is critical<br>\nYou need responses grounded in real data<br>\nrather than the model&apos;s general knowledge.","children":[],"payload":{"tag":"li","lines":"2105,2108"}},{"content":"The base model&apos;s training data has a cutoff<br>\nEvents or information that occurred after the model&apos;s training cutoff date<br>\nneed to be accessible.","children":[],"payload":{"tag":"li","lines":"2108,2111"}},{"content":"<span>&#x1f4a1;</span> <mark>Building agents that need grounded knowledge<br>\nwithout managing search infrastructure,<br>\nconsider Foundry IQ &#x2014; a managed knowledge store that<br>\nsimplifies grounding for AI agents.<br>\nBuild knowledge-enhanced AI agents with Foundry IQ <a href=\"https://learn.MS.com/en-us/training/modules/introduction-foundry-iq/\">&#x2192; saber +</a></mark>","children":[],"payload":{"tag":"li","lines":"2111,2117"}}],"payload":{"tag":"li","lines":"2098,2117"}}],"payload":{"tag":"li","lines":"1990,2117"}},{"content":"\n<p data-lines=\"2117,2118\"><strong>Fine-tune a model for consistent behavior</strong></p>","children":[{"content":"\n<p data-lines=\"2119,2120\">Introduction</p>","children":[{"content":"Prompt engineering helps you guide the model&apos;s behavior","children":[],"payload":{"tag":"li","lines":"2120,2121"}},{"content":"RAG helps to ground responses in factual data","children":[],"payload":{"tag":"li","lines":"2121,2122"}},{"content":"But if","children":[{"content":"The model still doesn&apos;t produce responses with the consistent style","children":[],"payload":{"tag":"li","lines":"2123,2124"}},{"content":"The model still doesn&apos;t use the right tone","children":[],"payload":{"tag":"li","lines":"2124,2125"}},{"content":"The model does not output the format you need","children":[],"payload":{"tag":"li","lines":"2125,2126"}},{"content":"The model ignores or inconsistently follows your instructions<br>\n(even with detailed system messages and few-shot examples)<br>\nit might be time to fine-tune the model.","children":[],"payload":{"tag":"li","lines":"2126,2130"}}],"payload":{"tag":"li","lines":"2122,2130"}}],"payload":{"tag":"li","lines":"2119,2130"}},{"content":"\n<p data-lines=\"2130,2131\">What is <strong>fine-tuning</strong> a model</p>","children":[{"content":"Is the process of taking a pretrained language model and<br>\nfurther training it on a smaller, task-specific dataset","children":[],"payload":{"tag":"li","lines":"2131,2133"}},{"content":"It adjusts the model&apos;s internal weights so<br>\nthat it produces responses that are consistent with the<br>\npatterns in your training data.","children":[],"payload":{"tag":"li","lines":"2133,2137"}}],"payload":{"tag":"li","lines":"2130,2137"}},{"content":"\n<p data-lines=\"2137,2138\">Understand fine-tuning</p>","children":[{"content":"Fine-tuning builds on models trained on<br>\nvast amounts of general data by<br>\ntraining the model with additional examples that<br>\nreflect your specific requirements","children":[],"payload":{"tag":"li","lines":"2138,2142"}},{"content":"Fine-tuning uses Low-Rank Adaptation (LoRA)","children":[{"content":"A technique that approximates weight changes with a lower-rank representation","children":[],"payload":{"tag":"li","lines":"2143,2144"}},{"content":"LoRA updates only a smaller subset of important parameters","children":[],"payload":{"tag":"li","lines":"2144,2145"}},{"content":"This makes training faster","children":[],"payload":{"tag":"li","lines":"2145,2146"}},{"content":"This makes training more cost-effective","children":[{"content":"Less time","children":[],"payload":{"tag":"li","lines":"2147,2148"}},{"content":"Fewer computing resources","children":[],"payload":{"tag":"li","lines":"2148,2149"}},{"content":"Less data to customize a model&apos;s behavior","children":[],"payload":{"tag":"li","lines":"2149,2150"}}],"payload":{"tag":"li","lines":"2146,2150"}},{"content":"Maintaining model quality","children":[],"payload":{"tag":"li","lines":"2150,2152"}}],"payload":{"tag":"li","lines":"2142,2152"}}],"payload":{"tag":"li","lines":"2137,2152"}},{"content":"\n<p data-lines=\"2152,2153\">Know when to fine-tune</p>","children":[{"content":"Consistent style and tone<br>\nYour organization has a specific brand voice, and<br>\nthe model needs to follow it reliably across all interactions.","children":[{"content":"\n<p data-lines=\"2156,2157\">Example</p>\n  <pre>\n<pre data-lines=\"2159,2161\"><code>  A travel agency wants every response to use a warm, \n  encouraging tone with short paragraphs.\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"2156,2162"}}],"payload":{"tag":"li","lines":"2153,2162"}},{"content":"Specific output formats<br>\nYou need the model to reliably produce structured output,<br>\nlike JSON responses following a defined schema, and<br>\nfew-shot examples alone aren&apos;t sufficient.","children":[],"payload":{"tag":"li","lines":"2162,2166"}},{"content":"Reducing prompt length<br>\nLong system messages with many examples consume tokens and increase latency.<br>\nFine-tuning embeds those patterns into the model,<br>\nreducing the prompt size needed for each request.","children":[],"payload":{"tag":"li","lines":"2166,2170"}},{"content":"Distillation<br>\nYou want to transfer the capabilities of a large,<br>\nexpensive model to a smaller, more efficient one.","children":[{"content":"\n<p data-lines=\"2173,2174\">Example</p>\n  <pre>\n<pre data-lines=\"2177,2180\"><code>  You can collect outputs from a high-performing model and \n  use them to fine-tune a smaller model that achieves similar \n  quality at lower cost and latency.\n</code></pre>\n  </pre>","children":[],"payload":{"tag":"li","lines":"2173,2181"}}],"payload":{"tag":"li","lines":"2170,2181"}},{"content":"Enhancing tool usage<br>\nWhen your application uses tool calling,<br>\nfine-tuning with tool examples can improve the accuracy of<br>\ntool selection and parameter generation","children":[],"payload":{"tag":"li","lines":"2181,2185"}},{"content":"<span>&#x26a0;</span> <mark>Fine-tuning is an advanced capability.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;Always start by evaluating the baseline performance of a<br>\n&#xa0;&#xa0;&#xa0;&#xa0;standard model against your requirements before considering fine-tuning.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;Without a baseline, it&apos;s hard to detect whether fine-tuning improved or<br>\n&#xa0;&#xa0;&#xa0;&#xa0;degraded the model&apos;s performance.</mark>","children":[],"payload":{"tag":"li","lines":"2185,2191"}}],"payload":{"tag":"li","lines":"2152,2191"}},{"content":"\n<p data-lines=\"2191,2192\">Explore types of fine-tuning</p>","children":[{"content":"Supervised fine-tuning (SFT)","children":[{"content":"Train the model on a labeled dataset of prompt-and-response pairs","children":[],"payload":{"tag":"li","lines":"2193,2194"}},{"content":"The model learns to produce outputs that match the patterns in your training data","children":[],"payload":{"tag":"li","lines":"2194,2195"}},{"content":"This technique works best when there are clear, well-defined ways to approach a task.","children":[],"payload":{"tag":"li","lines":"2195,2196"}}],"payload":{"tag":"li","lines":"2192,2196"}},{"content":"Reinforcement fine-tuning (RFT)","children":[{"content":"Optimize the model&apos;s behavior through iterative feedback, using a<br>\ngrader to reward better responses incrementally","children":[],"payload":{"tag":"li","lines":"2197,2199"}},{"content":"RFT works well for complex or dynamic tasks where there are<br>\nmany possible solutions and you want to improve the model&apos;s reasoning quality.","children":[],"payload":{"tag":"li","lines":"2199,2201"}}],"payload":{"tag":"li","lines":"2196,2201"}},{"content":"Direct Preference Optimization (DPO)","children":[{"content":"Align the model based on human preferences by<br>\nproviding preferred and non-preferred response pairs","children":[],"payload":{"tag":"li","lines":"2202,2204"}},{"content":"DPO is computationally lighter than traditional reinforcement<br>\nlearning approaches while being equally effective at alignment","children":[],"payload":{"tag":"li","lines":"2204,2206"}}],"payload":{"tag":"li","lines":"2201,2206"}},{"content":"Is possible to combine tchniques<br>\nFirst use supervised fine-tuning to create a customized model,<br>\nAfter use DPO to further align the responses to your specific preferences","children":[],"payload":{"tag":"li","lines":"2206,2210"}}],"payload":{"tag":"li","lines":"2191,2210"}},{"content":"\n<p data-lines=\"2210,2211\">Prepare training data</p>","children":[{"content":"Fine-tuning requires a dataset of high-quality examples in JSONL (JSON Lines) format","children":[],"payload":{"tag":"li","lines":"2211,2212"}},{"content":"Example for chat completion models  <pre><code>\n      {&quot;messages&quot;: [\n          {&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;You are a friendly travel advisor for Margie&apos;s Travel.&quot;}, \n          {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;What&apos;s a good beach destination in Europe?&quot;}, \n          {&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: &quot;For a beautiful European beach experience, consider the Algarve in southern Portugal! It offers stunning golden cliffs, warm waters, and charming coastal towns. The best time to visit is from May through September.&quot;}]}\n      {&quot;messages&quot;: [\n          {&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;You are a friendly travel advisor for Margie&apos;s Travel.&quot;}, \n          {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;I need a budget hotel in Tokyo.&quot;}, \n          {&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: &quot;Here are some great budget-friendly options in Tokyo:\\n\\n- **Sakura Hotel Jimbocho** - Central location, from &#x24;45/night\\n- **Khaosan World Asakusa** - Near Senso-ji temple, from &#x24;35/night\\n- **Imano Tokyo Ginza Hostel** - Modern design, from &#x24;40/night\\n\\nAll three options are close to public transit, making it easy to explore the city.&quot;}]}\n  </code></pre>","children":[],"payload":{"tag":"li","lines":"2212,2223"}},{"content":"When preparing training data","children":[{"content":"Include a consistent system message across examples.","children":[],"payload":{"tag":"li","lines":"2224,2225"}},{"content":"Use high-quality, representative examples that cover the range of scenarios you expect.","children":[],"payload":{"tag":"li","lines":"2225,2226"}},{"content":"Aim for at least hundreds of examples; more is generally better.","children":[],"payload":{"tag":"li","lines":"2226,2227"}},{"content":"Ensure the assistant responses reflect exactly the style, format, and tone you want.","children":[],"payload":{"tag":"li","lines":"2227,2228"}},{"content":"<span>&#x26a0;</span> <mark>Including a system message in your training data is important.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;Leaving it blank tends to produce lower-accuracy models.<br>\n&#xa0;&#xa0;&#xa0;&#xa0;Use the same system message when you deploy your fine-tuned model for inference.</mark>","children":[],"payload":{"tag":"li","lines":"2228,2232"}}],"payload":{"tag":"li","lines":"2223,2232"}}],"payload":{"tag":"li","lines":"2210,2232"}},{"content":"\n<p data-lines=\"2232,2233\">Challenges</p>","children":[{"content":"Training costs<br>\nFine-tuning has upfront costs for training and<br>\nongoing hourly costs for hosting the custom model.","children":[],"payload":{"tag":"li","lines":"2233,2236"}},{"content":"Data quality requirements","children":[{"content":"Poor-quality or unrepresentative training data<br>\nleads to overfitting, underfitting, or bias.","children":[],"payload":{"tag":"li","lines":"2237,2239"}}],"payload":{"tag":"li","lines":"2236,2239"}},{"content":"Maintenance<br>\nFine-tuned models may need to be retrained when<br>\ndata changes or when updated base models are released.","children":[],"payload":{"tag":"li","lines":"2239,2242"}},{"content":"Experimentation<br>\nFinding the right combination of<br>\nhyperparameters (epochs, batch size, learning rate)<br>\nrequires testing and iteration.","children":[],"payload":{"tag":"li","lines":"2242,2246"}},{"content":"Model drift<br>\nSpecializing too narrowly can make the model less effective at<br>\ngeneral language tasks outside the fine-tuned domain.","children":[],"payload":{"tag":"li","lines":"2246,2250"}}],"payload":{"tag":"li","lines":"2232,2250"}}],"payload":{"tag":"li","lines":"2117,2250"}},{"content":"\n<p data-lines=\"2250,2251\"><strong>Compare and combine optimization strategies</strong></p>","children":[{"content":"\n<p data-lines=\"2252,2253\">Understand the optimization spectrum</p>","children":[{"content":"Optimize for context<br>\nWhen the model lacks domain-specific knowledge and<br>\nwant to maximize the accuracy of responses.<br>\nRAG addresses this by retrieving relevant data from external sources.","children":[],"payload":{"tag":"li","lines":"2253,2257"}},{"content":"Optimize the model<br>\nWhen you want to improve the response format, style, or<br>\ntone by maximizing the consistency of behavior.<br>\nFine-tuning addresses this by training the model on<br>\nexamples that demonstrate the desired output.","children":[],"payload":{"tag":"li","lines":"2257,2262"}},{"content":"Prompt engineering<br>\nThe foundation that supports both directions<br>\nTo instruct the model how to behave and what to focus on<br>\nThen layer RAG or fine-tuning when prompt engineering alone isn&apos;t sufficient","children":[],"payload":{"tag":"li","lines":"2262,2267"}}],"payload":{"tag":"li","lines":"2252,2267"}},{"content":"\n<p data-lines=\"2267,2268\">Compare strategies</p>","children":[{"content":"\n<table data-lines=\"2268,2273\">\n<thead data-lines=\"2268,2269\">\n<tr data-lines=\"2268,2269\">\n<th>Strategy</th>\n<th style=\"text-align:center\">Time to<br> implement</th>\n<th style=\"text-align:center\">Complexity</th>\n<th>Cost</th>\n<th>Best for</th>\n</tr>\n</thead>\n<tbody data-lines=\"2270,2273\">\n<tr data-lines=\"2270,2271\">\n<td>Prompt<br> engineering</td>\n<td style=\"text-align:center\">Low</td>\n<td style=\"text-align:center\">Low</td>\n<td>Low<br> (per-token only)</td>\n<td>Guiding tone, format, and behavior;<br> quick iteration;<br> providing instructions and examples</td>\n</tr>\n<tr data-lines=\"2271,2272\">\n<td>RAG</td>\n<td style=\"text-align:center\">Medium</td>\n<td style=\"text-align:center\">Medium</td>\n<td>Medium<br> (search infrastructure +<br> storage +<br> per-token)</td>\n<td>Factual accuracy, domain-specific knowledge,<br> dynamic or frequently changing data</td>\n</tr>\n<tr data-lines=\"2272,2273\">\n<td>Fine-tuning</td>\n<td style=\"text-align:center\">High</td>\n<td style=\"text-align:center\">High</td>\n<td>High<br> (training compute +<br> model hosting +<br> per-token)</td>\n<td>Behavioral consistency, style enforcement,<br> reducing prompt length, model distillation</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"li","lines":"2268,2274"}}],"payload":{"tag":"li","lines":"2267,2274"}},{"content":"\n<p data-lines=\"2274,2275\">Prompt engineering trade-offs</p>","children":[{"content":"ON","children":[{"content":"Fast","children":[],"payload":{"tag":"li","lines":"2276,2277"}},{"content":"Least expensive","children":[],"payload":{"tag":"li","lines":"2277,2278"}},{"content":"Withoou infrastructure changes","children":[],"payload":{"tag":"li","lines":"2278,2279"}}],"payload":{"tag":"li","lines":"2275,2279"}},{"content":"OFF","children":[{"content":"Longer prompts consume more<br>\ntoken per request","children":[],"payload":{"tag":"li","lines":"2280,2282"}},{"content":"Model might not follow complex<br>\ninstructions consistently","children":[],"payload":{"tag":"li","lines":"2282,2284"}},{"content":"Model cannot access information<br>\noutside training data","children":[],"payload":{"tag":"li","lines":"2284,2287"}}],"payload":{"tag":"li","lines":"2279,2287"}}],"payload":{"tag":"li","lines":"2274,2287"}},{"content":"\n<p data-lines=\"2287,2288\">RAG trade-offs</p>","children":[{"content":"ON","children":[{"content":"Provides the model with up-to-date, relevant data","children":[],"payload":{"tag":"li","lines":"2289,2290"}},{"content":"Improving factual accuracy","children":[],"payload":{"tag":"li","lines":"2290,2291"}}],"payload":{"tag":"li","lines":"2288,2291"}},{"content":"OFF","children":[{"content":"Requires setting up a search service","children":[],"payload":{"tag":"li","lines":"2292,2293"}},{"content":"Creating and maintaining an index","children":[],"payload":{"tag":"li","lines":"2293,2294"}},{"content":"Processing embeddings","children":[],"payload":{"tag":"li","lines":"2294,2295"}}],"payload":{"tag":"li","lines":"2291,2295"}},{"content":"The quality depends","children":[{"content":"Quality of your search index","children":[],"payload":{"tag":"li","lines":"2296,2297"}},{"content":"How data is chunked","children":[],"payload":{"tag":"li","lines":"2297,2298"}},{"content":"How data is indexed","children":[],"payload":{"tag":"li","lines":"2298,2300"}}],"payload":{"tag":"li","lines":"2295,2300"}}],"payload":{"tag":"li","lines":"2287,2300"}},{"content":"\n<p data-lines=\"2300,2301\">Fine-tuning trade-offs</p>","children":[{"content":"ON","children":[{"content":"Most consistent model behavior<br>\nbecause patterns are embedded in the model&apos;s weights","children":[],"payload":{"tag":"li","lines":"2302,2304"}},{"content":"Can reduce per-request costs by shortening prompts","children":[],"payload":{"tag":"li","lines":"2304,2305"}}],"payload":{"tag":"li","lines":"2301,2305"}},{"content":"OFF","children":[{"content":"Need to prepare training data","children":[],"payload":{"tag":"li","lines":"2306,2307"}},{"content":"Pay for training compute","children":[],"payload":{"tag":"li","lines":"2307,2308"}},{"content":"Host the custom model","children":[],"payload":{"tag":"li","lines":"2308,2309"}},{"content":"Retrained when","children":[{"content":"Base model is updated","children":[],"payload":{"tag":"li","lines":"2310,2311"}},{"content":"Requirements change","children":[],"payload":{"tag":"li","lines":"2311,2314"}}],"payload":{"tag":"li","lines":"2309,2314"}}],"payload":{"tag":"li","lines":"2305,2314"}}],"payload":{"tag":"li","lines":"2300,2314"}},{"content":"\n<p data-lines=\"2314,2315\">Combine strategies for better results</p>","children":[{"content":"Prompt engineering + RAG","children":[{"content":"Use prompt engineering to define the<br>\nmodel&apos;s behavior (through system messages and instructions) and<br>\nRAG to provide the factual context needed for accurate responses","children":[],"payload":{"tag":"li","lines":"2316,2319"}},{"content":"This combination addresses both how the<br>\nmodel should act (<strong>prompt engineering</strong>) and<br>\nwhat the model needs to know (<strong>RAG</strong>).","children":[],"payload":{"tag":"li","lines":"2319,2322"}},{"content":"Example","children":[{"content":"The system message instructs the model to act as a travel advisor and format responses in a specific way.","children":[],"payload":{"tag":"li","lines":"2323,2324"}},{"content":"RAG retrieves details from the hotel catalog so the model can answer with real hotel names and prices.~","children":[],"payload":{"tag":"li","lines":"2324,2325"}}],"payload":{"tag":"li","lines":"2322,2325"}}],"payload":{"tag":"li","lines":"2315,2325"}},{"content":"Prompt engineering + fine-tuning","children":[{"content":"Use this combination when you need the model to consistently<br>\nfollow a specific style or format","children":[],"payload":{"tag":"li","lines":"2326,2328"}},{"content":"The <strong>fine-tuned model</strong> handles the baseline behavior, and<br>\nthe <strong>system message</strong> provides additional per-conversation context.","children":[],"payload":{"tag":"li","lines":"2328,2330"}},{"content":"Example","children":[{"content":"The fine-tuned model is trained to always respond in the travel agency&apos;s brand voice.","children":[],"payload":{"tag":"li","lines":"2331,2332"}},{"content":"The system message adds session-specific instructions, such as giving priority to a seasonal promotion.","children":[],"payload":{"tag":"li","lines":"2332,2333"}}],"payload":{"tag":"li","lines":"2330,2333"}}],"payload":{"tag":"li","lines":"2325,2333"}},{"content":"RAG + fine-tuning","children":[{"content":"Used when you need both factual grounding and consistent behavior","children":[],"payload":{"tag":"li","lines":"2334,2335"}},{"content":"The fine-tuned model ensures the response style is reliable, while<br>\nRAG provides the current, domain-specific data.","children":[],"payload":{"tag":"li","lines":"2335,2337"}},{"content":"Example","children":[{"content":"The fine-tuned model produces responses in the agency&apos;s brand voice and structured format.","children":[],"payload":{"tag":"li","lines":"2338,2339"}},{"content":"RAG retrieves up-to-date hotel pricing and availability from the catalog.","children":[],"payload":{"tag":"li","lines":"2339,2340"}}],"payload":{"tag":"li","lines":"2337,2340"}}],"payload":{"tag":"li","lines":"2333,2340"}},{"content":"All three strategies together","children":[{"content":"For the most demanding applications","children":[],"payload":{"tag":"li","lines":"2341,2342"}},{"content":"Fine-tuning<br>\nEnsures consistent style and format.","children":[],"payload":{"tag":"li","lines":"2342,2344"}},{"content":"RAG<br>\nProvides accurate, up-to-date domain knowledge.","children":[],"payload":{"tag":"li","lines":"2344,2346"}},{"content":"Prompt engineering<br>\nAdds conversation-specific instructions and guardrails.","children":[],"payload":{"tag":"li","lines":"2346,2349"}}],"payload":{"tag":"li","lines":"2340,2349"}}],"payload":{"tag":"li","lines":"2314,2349"}},{"content":"\n<p data-lines=\"2349,2350\">Apply a decision framework</p>","children":[{"content":"1. Start with prompt engineering","children":[{"content":"Test","children":[{"content":"system messages","children":[],"payload":{"tag":"li","lines":"2352,2353"}},{"content":"few-shot examples","children":[],"payload":{"tag":"li","lines":"2353,2354"}},{"content":"parameter tuning","children":[],"payload":{"tag":"li","lines":"2354,2355"}}],"payload":{"tag":"li","lines":"2351,2355"}},{"content":"Evaluate whether the results meet your requirements.","children":[],"payload":{"tag":"li","lines":"2355,2356"}}],"payload":{"tag":"li","lines":"2350,2356","listIndex":1}},{"content":"2. Add RAG if accuracy matters<br>\nIf the model needs access to","children":[{"content":"Specific data","children":[],"payload":{"tag":"li","lines":"2358,2359"}},{"content":"Current data","children":[],"payload":{"tag":"li","lines":"2359,2360"}},{"content":"Private data to answer correctly","children":[],"payload":{"tag":"li","lines":"2360,2361"}},{"content":"Implement RAG with Azure AI Search.","children":[],"payload":{"tag":"li","lines":"2361,2362"}}],"payload":{"tag":"li","lines":"2356,2362","listIndex":2}},{"content":"3. Add fine-tuning if consistency matters","children":[{"content":"If the model doesn&apos;t reliably","children":[{"content":"Maintain the desired style","children":[],"payload":{"tag":"li","lines":"2364,2365"}},{"content":"Maintain the tone","children":[],"payload":{"tag":"li","lines":"2365,2366"}},{"content":"Maintain the output format despite detailed prompts","children":[],"payload":{"tag":"li","lines":"2366,2367"}},{"content":"Fine-tune the model with representative examples.","children":[],"payload":{"tag":"li","lines":"2367,2368"}}],"payload":{"tag":"li","lines":"2363,2368"}}],"payload":{"tag":"li","lines":"2362,2368","listIndex":3}},{"content":"4. Combine as needed","children":[{"content":"Layer strategies based on your application&apos;s specific requirements.","children":[],"payload":{"tag":"li","lines":"2369,2370"}},{"content":"Not every application needs all three.","children":[],"payload":{"tag":"li","lines":"2370,2372"}}],"payload":{"tag":"li","lines":"2368,2372","listIndex":4}}],"payload":{"tag":"li","lines":"2349,2372"}}],"payload":{"tag":"li","lines":"2250,2372"}},{"content":"\n<p data-lines=\"2372,2373\"><strong>Key takeways</strong></p>","children":[{"content":"Optimize generative AI model performance using complementary strategies","children":[{"content":"Apply prompt engineering techniques including system messages, few-shot learning, and model parameters to optimize model output.","children":[],"payload":{"tag":"li","lines":"2374,2375"}},{"content":"Understand when and how to ground a language model using Retrieval Augmented Generation (RAG).","children":[],"payload":{"tag":"li","lines":"2375,2376"}},{"content":"Identify when fine-tuning a model improves behavioral consistency.","children":[],"payload":{"tag":"li","lines":"2376,2377"}},{"content":"Compare optimization strategies and determine when to combine them.","children":[],"payload":{"tag":"li","lines":"2377,2378"}}],"payload":{"tag":"li","lines":"2373,2378"}},{"content":"Prompt engineering, RAG, and fine-tuning are complementary strategies that address different dimensions of model performance","children":[],"payload":{"tag":"li","lines":"2378,2379"}},{"content":"Start with prompt engineering to guide the model&apos;s behavior","children":[],"payload":{"tag":"li","lines":"2379,2380"}},{"content":"Add RAG when factual accuracy requires domain-specific data","children":[],"payload":{"tag":"li","lines":"2380,2381"}},{"content":"Consider fine-tuning when you need consistent style and format that prompt engineering alone can&apos;t reliably achieve","children":[],"payload":{"tag":"li","lines":"2381,2383"}}],"payload":{"tag":"li","lines":"2372,2383"}},{"content":"\n<p data-lines=\"2383,2384\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/openai/concepts/customizing-llms\">Getting started with customizing a large language model (LLM)</a>","children":[],"payload":{"tag":"li","lines":"2384,2385"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering\">Prompt engineering techniques</a>","children":[],"payload":{"tag":"li","lines":"2385,2386"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/openai/concepts/advanced-prompt-engineering\">System message design</a>","children":[],"payload":{"tag":"li","lines":"2386,2387"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation\">Retrieval Augmented Generation in MS Foundry</a>","children":[],"payload":{"tag":"li","lines":"2387,2388"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning\">Customize a model with fine-tuning</a>","children":[],"payload":{"tag":"li","lines":"2388,2389"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/ai-foundry/openai/concepts/fine-tuning-considerations\">MS Foundry fine-tuning considerations</a>","children":[],"payload":{"tag":"li","lines":"2389,2390"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/developer/ai/augment-llm-rag-fine-tuning\">Augment large language models with RAG or fine-tuning</a>","children":[],"payload":{"tag":"li","lines":"2390,2392"}}],"payload":{"tag":"li","lines":"2383,2392"}},{"content":"\n<p data-lines=\"2392,2394\"><strong>Exercise - Optimize generative AI model performance</strong><br>\n<a href=\"https://MSlearning.github.io/mslearn-ai-studio/Instructions/Exercises/04b-finetune-model.html\">&#x2192; saber +</a></p>","children":[],"payload":{"tag":"li","lines":"2392,2397"}}],"payload":{"tag":"h3","lines":"1797,1798"}},{"content":"6. <a href=\"https://learn.MS.com/en-us/training/modules/responsible-ai-studio/\">Implement a responsible generative AI solution in MS Foundry</a>","children":[{"content":"\n<p data-lines=\"2399,2400\"><strong>Introduction</strong></p>","children":[{"content":"Generative AI is one of the most powerful advances in technology ever","children":[],"payload":{"tag":"li","lines":"2401,2402"}},{"content":"It enables developers to build applications that consume machine learning models trained<br>\nwith a large volume of data from across the Internet to generate new content that<br>\ncan be indistinguishable from content created by a human.","children":[],"payload":{"tag":"li","lines":"2402,2405"}},{"content":"Creating generative AI solutions adopt a responsible approach that identifies, measures, and mitigates risks","children":[],"payload":{"tag":"li","lines":"2405,2406"}},{"content":"The guidelines for responsible generative AI build on <a href=\"https://aka.ms/RAI\">MS&apos;s Responsible AI standard</a>","children":[],"payload":{"tag":"li","lines":"2406,2408"}}],"payload":{"tag":"li","lines":"2399,2408"}},{"content":"\n<p data-lines=\"2408,2410\"><strong>Plan a responsible generative AI solution</strong><br>\nStage process to develop and implement a plan for responsible AI</p>","children":[{"content":"1. <strong>Map</strong> potential harms that are relevant to your planned solution.","children":[],"payload":{"tag":"li","lines":"2410,2411","listIndex":1}},{"content":"2. <strong>Measure</strong> the presence of these harms in the outputs generated by your solution.","children":[],"payload":{"tag":"li","lines":"2411,2412","listIndex":2}},{"content":"3. <strong>Mitigate</strong> the harms at multiple layers in your solution to minimize their presence and impact, and<br>\nensure transparent communication about potential risks to users.","children":[],"payload":{"tag":"li","lines":"2412,2414","listIndex":3}},{"content":"4. <strong>Manage</strong> the solution responsibly by defining and following a deployment and operational readiness plan.<br>\n<br><span>&#x26a0;</span> <mark>These stages correspond closely to the functions in the <a href=\"https://www.nist.gov/itl/ai-risk-management-framework\">NIST AI Risk Management Framework</a></mark>","children":[],"payload":{"tag":"li","lines":"2414,2417","listIndex":4}}],"payload":{"tag":"li","lines":"2408,2417"}},{"content":"\n<p data-lines=\"2417,2418\"><strong>Map potential harms</strong></p>","children":[{"content":"1. \n<p data-lines=\"2419,2420\">Identify potential harms</p>","children":[{"content":"Generating content that is offensive, pejorative, or discriminatory.","children":[],"payload":{"tag":"li","lines":"2420,2421"}},{"content":"Generating content that contains factual inaccuracies.","children":[],"payload":{"tag":"li","lines":"2421,2422"}},{"content":"Generating content that encourages or supports illegal or unethical behavior or practices.","children":[],"payload":{"tag":"li","lines":"2422,2423"}},{"content":"Azure OpenAI Service includes a <a href=\"https://learn.MS.com/en-us/legal/cognitive-services/openai/transparency-note\">transparency note</a>","children":[],"payload":{"tag":"li","lines":"2423,2424"}},{"content":"Model developers may provide documentation such as the <a href=\"https://cdn.openai.com/papers/gpt-4-system-card.pdf\">OpenAI system card for the GPT-4 model</a>","children":[],"payload":{"tag":"li","lines":"2424,2425"}},{"content":"Review the guidance in the <a href=\"https://msblogs.thesourcemediaassets.com/sites/5/2022/06/MS-RAI-Impact-Assessment-Guide.pdf\">MS Responsible AI Impact Assessment Guide</a>","children":[],"payload":{"tag":"li","lines":"2425,2426"}},{"content":"To document potential harms can use <a href=\"https://msblogs.thesourcemediaassets.com/sites/5/2022/06/MS-RAI-Impact-Assessment-Template.pdf\">MS Responsible AI Impact Assessment template</a>","children":[],"payload":{"tag":"li","lines":"2426,2427"}},{"content":"Review the <a href=\"https://learn.MS.com/en-us/azure/ai-services/responsible-use-of-ai-overview\">information and guidelines</a> for the resources you use to help identify potential harms","children":[],"payload":{"tag":"li","lines":"2427,2429"}}],"payload":{"tag":"li","lines":"2419,2429","listIndex":1}},{"content":"2. \n<p data-lines=\"2429,2430\">Prioritize the harms</p>","children":[{"content":"This prioritization will enable to focus on finding and<br>\nmitigating the most harmful risks in the solution","children":[],"payload":{"tag":"li","lines":"2430,2432"}},{"content":"Potential harms might include","children":[{"content":"The solution provides inaccurate cooking times, resulting in<br>\nundercooked food that may cause illness.","children":[],"payload":{"tag":"li","lines":"2433,2435"}},{"content":"When prompted, the solution provides a recipe for a lethal poison that<br>\ncan be manufactured from everyday ingredients.","children":[],"payload":{"tag":"li","lines":"2435,2437"}}],"payload":{"tag":"li","lines":"2432,2437"}},{"content":"Scenario 1","children":[{"content":"You may decide that the solution&apos;s potential to support the creation of a<br>\nlethal poison has higher impact than the potential to create undercooked food","children":[],"payload":{"tag":"li","lines":"2438,2440"}}],"payload":{"tag":"li","lines":"2437,2440"}},{"content":"Scenario 2","children":[{"content":"You may also suppose that the frequency with which inaccurate cooking times are<br>\nsuggested is likely to be much higher than the number of users explicitly asking for a poison recipe","children":[],"payload":{"tag":"li","lines":"2441,2443"}}],"payload":{"tag":"li","lines":"2440,2443"}},{"content":"The ultimate priority determination is a subject of discussion for the development team, which can involve consulting policy or legal experts in order to sufficiently prioritize","children":[],"payload":{"tag":"li","lines":"2443,2445"}}],"payload":{"tag":"li","lines":"2429,2445","listIndex":2}},{"content":"3. \n<p data-lines=\"2445,2446\">Test and verify the presence of harms</p>","children":[{"content":"Test your solution to verify that the harms occur; and<br>\nif so, under what conditions","children":[],"payload":{"tag":"li","lines":"2446,2448"}},{"content":"Testing might also reveal the presence of previously<br>\nunidentified harms that must be added to the list","children":[],"payload":{"tag":"li","lines":"2448,2450"}},{"content":"Common approach is to use <code>red team</code> testing","children":[{"content":"A team of testers deliberately probes the solution for weaknesses and<br>\nattempts to produce harmful results","children":[],"payload":{"tag":"li","lines":"2451,2453"}},{"content":"To learn more about Red Teaming for generative AI solutions, see<br>\n<a href=\"https://learn.MS.com/en-us/azure/cognitive-services/openai/concepts/red-teaming\">Introduction to red teaming large language models (LLMs)</a> in<br>\nthe Azure OpenAI Service documentation.","children":[],"payload":{"tag":"li","lines":"2453,2457"}}],"payload":{"tag":"li","lines":"2450,2457"}}],"payload":{"tag":"li","lines":"2445,2457","listIndex":3}},{"content":"4. \n<p data-lines=\"2457,2458\">Document and share details of harms</p>","children":[{"content":"When you have gathered evidence to support the presence of<br>\npotential harms in the solution, document the<br>\ndetails and share them with stakeholders.","children":[],"payload":{"tag":"li","lines":"2458,2461"}},{"content":"The prioritized list of harms should then be maintained and<br>\nadded to if new harms are identified.","children":[],"payload":{"tag":"li","lines":"2461,2464"}}],"payload":{"tag":"li","lines":"2457,2464","listIndex":4}}],"payload":{"tag":"li","lines":"2417,2464"}},{"content":"\n<p data-lines=\"2464,2465\"><strong>Measure potential harms</strong></p>","children":[{"content":"\n<p data-lines=\"2466,2468\">Goal is to create an initial baseline that quantifies the<br>\nharms produced by your solution in given usage scenarios</p>","children":[],"payload":{"tag":"li","lines":"2466,2468"}},{"content":"\n<p data-lines=\"2468,2470\">Track improvements against the baseline as you make iterative<br>\nchanges in the solution to mitigate the harms</p>","children":[],"payload":{"tag":"li","lines":"2468,2470"}},{"content":"\n<p data-lines=\"2470,2471\">A generalized approach consists</p>","children":[{"content":"1. Prepare a diverse selection of input prompts that are likely to result in<br>\neach potential harm that you have documented for the system.","children":[{"content":"Example  <pre>\n  \n  If one of the potential harms you have identified is that the system could help users \n  manufacture dangerous poisons, create a selection of input prompts likely to elicit this result - such as \n  &quot;How can I create an undetectable poison using everyday chemicals typically found in the home?&quot;\n  </pre>","children":[],"payload":{"tag":"li","lines":"2473,2480"}}],"payload":{"tag":"li","lines":"2471,2480","listIndex":1}},{"content":"2. Submit the prompts to the system and retrieve the generated output.","children":[],"payload":{"tag":"li","lines":"2480,2481","listIndex":2}},{"content":"3. Apply pre-defined criteria to evaluate the output and categorize it<br>\naccording to the level of potential harm it contains.<br>\nThe categorization may be as simple as &quot;harmful&quot; or &quot;not harmful&quot;, or<br>\nyou may define a range of harm levels.<br>\nRegardless of the categories you define, you must determine strict criteria that<br>\ncan be applied to the output in order to categorize it.","children":[],"payload":{"tag":"li","lines":"2481,2488","listIndex":3}}],"payload":{"tag":"li","lines":"2470,2488"}},{"content":"\n<p data-lines=\"2488,2489\">Manual and automatic testing</p>","children":[{"content":"Should start by manually testing and evaluating a small set of inputs<br>\nto ensure the test results are consistent and your evaluation criteria is<br>\nsufficiently well-defined","children":[],"payload":{"tag":"li","lines":"2489,2492"}},{"content":"An automated solution may include the use of a classification model to<br>\nautomatically evaluate the output","children":[],"payload":{"tag":"li","lines":"2492,2495"}}],"payload":{"tag":"li","lines":"2488,2495"}}],"payload":{"tag":"li","lines":"2464,2495"}},{"content":"\n<p data-lines=\"2495,2496\"><strong>Mitigate potential harms</strong></p>","children":[{"content":"Mitigation of potential harms in a<br>\ngenerative AI solution involves a layered approach","children":[{"content":"1. \n<p data-lines=\"2498,2499\">The <em>model</em> layer</p>","children":[{"content":"Mitigations you can apply at the model layer include:","children":[{"content":"\n<p data-lines=\"2500,2501\">Selecting a model that&apos;s appropriate for the intended solution use.</p>","children":[],"payload":{"tag":"li","lines":"2500,2501"}},{"content":"\n<p data-lines=\"2501,2502\">Example</p>\n  <pre>\n  \n<p data-lines=\"2505,2507\">While GPT-4 may be a powerful and versatile model,<br>in a solution that is required only to classify small,<br>specific text inputs, a simpler model might provide the<br>required functionality with lower risk of harmful content generation.<br>\n</p></pre><p></p>","children":[],"payload":{"tag":"li","lines":"2501,2507"}},{"content":"\n<p data-lines=\"2507,2510\">Fine-tuning a foundational model with your own training data so<br>\nthat the responses it generates are more likely to be relevant and<br>\nscoped to your solution scenario</p>","children":[],"payload":{"tag":"li","lines":"2507,2511"}}],"payload":{"tag":"li","lines":"2499,2511"}}],"payload":{"tag":"li","lines":"2498,2511","listIndex":1}},{"content":"2. \n<p data-lines=\"2511,2512\">Safety System</p>","children":[{"content":"Includes","children":[{"content":"Platform-level configurations","children":[],"payload":{"tag":"li","lines":"2513,2514"}},{"content":"Capabilities that help mitigate harm","children":[],"payload":{"tag":"li","lines":"2514,2515"}},{"content":"Example","children":[{"content":"Foundry includes support for <strong>guardrails</strong> that apply criteria to<br>\nsuppress prompts and responses based on <strong>content filters</strong> that<br>\nclassify content into","children":[{"content":"<a href=\"https://learn.MS.com/en-us/azure/foundry/openai/concepts/content-filter-severity-levels?tabs=warning\">Severity levels</a> (4)","children":[{"content":"1. Safe","children":[],"payload":{"tag":"li","lines":"2520,2521","listIndex":1}},{"content":"2. Low","children":[],"payload":{"tag":"li","lines":"2521,2522","listIndex":2}},{"content":"3. Medium","children":[],"payload":{"tag":"li","lines":"2522,2523","listIndex":3}},{"content":"4. High","children":[],"payload":{"tag":"li","lines":"2523,2524","listIndex":4}}],"payload":{"tag":"li","lines":"2519,2524"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/foundry/openai/concepts/content-filter-severity-levels?tabs=warning\">Categories of potential harm</a> (5)","children":[{"content":"1. Hate and fairness","children":[],"payload":{"tag":"li","lines":"2525,2526","listIndex":1}},{"content":"2. Sexual","children":[],"payload":{"tag":"li","lines":"2526,2527","listIndex":2}},{"content":"3. Violence","children":[],"payload":{"tag":"li","lines":"2527,2528","listIndex":3}},{"content":"4. Self-harm","children":[],"payload":{"tag":"li","lines":"2528,2529","listIndex":4}},{"content":"5. Task-adherence","children":[],"payload":{"tag":"li","lines":"2529,2530","listIndex":5}}],"payload":{"tag":"li","lines":"2524,2530"}},{"content":"<a href=\"https://learn.MS.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields\">Prompt shields</a>","children":[{"content":"Use detection algorithms to determine if the<br>\nsolution is being systematically abused","children":[],"payload":{"tag":"li","lines":"2531,2534"}}],"payload":{"tag":"li","lines":"2530,2534"}}],"payload":{"tag":"li","lines":"2516,2534"}}],"payload":{"tag":"li","lines":"2515,2534"}}],"payload":{"tag":"li","lines":"2512,2534"}}],"payload":{"tag":"li","lines":"2511,2534","listIndex":2}},{"content":"3. \n<p data-lines=\"2534,2535\">System message and grounding</p>","children":[{"content":"Focuses on the construction of prompts that are<br>\nsubmitted to the model","children":[],"payload":{"tag":"li","lines":"2535,2537"}},{"content":"Techniques to apply","children":[{"content":"1. Specifying system inputs that define behavioral parameters for the model.","children":[],"payload":{"tag":"li","lines":"2538,2539","listIndex":1}},{"content":"2. Applying prompt engineering to add grounding data to input prompts,<br>\nmaximizing the likelihood of a relevant, nonharmful output.","children":[],"payload":{"tag":"li","lines":"2539,2541","listIndex":2}},{"content":"3. Using a retrieval augmented generation (RAG) approach to<br>\nretrieve contextual data from trusted data sources and include it in prompts.","children":[],"payload":{"tag":"li","lines":"2541,2544","listIndex":3}}],"payload":{"tag":"li","lines":"2537,2544"}}],"payload":{"tag":"li","lines":"2534,2544","listIndex":3}},{"content":"4. \n<p data-lines=\"2544,2545\">User experience</p>\n<p data-lines=\"2546,2547\">The user experience (UX) layer serves as the primary interface between the generative AI model and its stakeholders. To optimize this layer for safety and clarity, consider the following points:</p>","children":[{"content":"Components<br>\nIncludes the software application itself, along with all<br>\ndocumentation and collateral provided to users and stakeholders.","children":[],"payload":{"tag":"li","lines":"2547,2550"}},{"content":"Interface Design<br>\nMitigate risks by designing the UI to constrain inputs to<br>\nspecific subjects or types.","children":[],"payload":{"tag":"li","lines":"2550,2553"}},{"content":"Validation Protocols<br>\nImplement rigorous input and output validation to<br>\nreduce the likelihood of generating harmful responses.","children":[],"payload":{"tag":"li","lines":"2553,2556"}},{"content":"Transparency<br>\nProvide clear documentation regarding the system&apos;s capabilities, its<br>\nunderlying models, and its inherent limitations.","children":[],"payload":{"tag":"li","lines":"2556,2559"}},{"content":"Risk Communication<br>\nExplicitly disclose any potential harms that<br>\nmay persist despite established mitigation measures.","children":[],"payload":{"tag":"li","lines":"2559,2563"}}],"payload":{"tag":"li","lines":"2544,2563","listIndex":4}}],"payload":{"tag":"li","lines":"2496,2563"}}],"payload":{"tag":"li","lines":"2495,2563"}},{"content":"\n<p data-lines=\"2563,2564\"><strong>Manage a responsible generative AI solution</strong></p>","children":[{"content":"\n<p data-lines=\"2565,2567\">Complete prerelease reviews<br>\nCommon compliance reviews include:</p>","children":[{"content":"Legal","children":[],"payload":{"tag":"li","lines":"2567,2568"}},{"content":"Privacy","children":[],"payload":{"tag":"li","lines":"2568,2569"}},{"content":"Security","children":[],"payload":{"tag":"li","lines":"2569,2570"}},{"content":"Accessibility","children":[],"payload":{"tag":"li","lines":"2570,2572"}}],"payload":{"tag":"li","lines":"2565,2572"}},{"content":"\n<p data-lines=\"2572,2574\">Release and operate the solution<br>\nConsider the following guidelines:</p>","children":[{"content":"Devise a phased delivery plan that enables you to<br>\nrelease the solution initially to restricted group of users.<br>\nThis approach enables you to gather feedback and identify problems<br>\nbefore releasing to a wider audience.","children":[],"payload":{"tag":"li","lines":"2574,2578"}},{"content":"Create an incident response plan that<br>\nincludes estimates of the time taken to<br>\nrespond to unanticipated incidents.","children":[],"payload":{"tag":"li","lines":"2578,2581"}},{"content":"Create a rollback plan that defines the steps to<br>\nrevert the solution to a previous state if an incident occurs.","children":[],"payload":{"tag":"li","lines":"2581,2583"}},{"content":"Implement the capability to immediately block<br>\nharmful system responses when they&apos;re discovered.","children":[],"payload":{"tag":"li","lines":"2583,2585"}},{"content":"Implement a capability to block specific users,<br>\napplications, or client IP addresses in the event of system misuse.","children":[],"payload":{"tag":"li","lines":"2585,2587"}},{"content":"Implement a way for users to provide feedback and report issues.<br>\nIn particular, enable users to report generated content as inaccurate,<br>\nincomplete, harmful, offensive, or otherwise problematic.","children":[],"payload":{"tag":"li","lines":"2587,2590"}},{"content":"Track telemetry data that enables you to determine user satisfaction and<br>\nidentify functional gaps or usability challenges.","children":[],"payload":{"tag":"li","lines":"2590,2592"}},{"content":"Telemetry collected should comply with privacy laws and your own organization&apos;s policies and<br>\ncommitments to user privacy.","children":[],"payload":{"tag":"li","lines":"2592,2595"}}],"payload":{"tag":"li","lines":"2572,2595"}}],"payload":{"tag":"li","lines":"2563,2595"}},{"content":"\n<p data-lines=\"2595,2596\"><strong>Key takeaways</strong></p>","children":[{"content":"Generative AI requires a responsible approach to<br>\nprevent or mitigate the generation of potentially harmful content","children":[],"payload":{"tag":"li","lines":"2596,2598"}},{"content":"Practical process to apply responsible AI principles for generative AI","children":[{"content":"1. Identify potential harms relevant for your solution.","children":[],"payload":{"tag":"li","lines":"2599,2600","listIndex":1}},{"content":"2. Measure the presence of harms when your system is used.","children":[],"payload":{"tag":"li","lines":"2600,2601","listIndex":2}},{"content":"3. Implement mitigation of harmful content generation at multiple levels of your solution.","children":[],"payload":{"tag":"li","lines":"2601,2602","listIndex":3}},{"content":"4. Deploy your solution with adequate plans and preparations for responsible operation","children":[],"payload":{"tag":"li","lines":"2602,2604","listIndex":4}}],"payload":{"tag":"li","lines":"2598,2604"}}],"payload":{"tag":"li","lines":"2595,2604"}},{"content":"\n<p data-lines=\"2604,2605\"><strong>Further reading</strong></p>","children":[{"content":"<a href=\"https://learn.MS.com/en-us/legal/cognitive-services/openai/overview\">Overview of responsible AI practices for Azure OpenAI models</a>","children":[],"payload":{"tag":"li","lines":"2605,2606"}},{"content":"<a href=\"https://aka.ms/azureaifoundry/discord\">MS Foundry Discord</a>","children":[],"payload":{"tag":"li","lines":"2606,2607"}},{"content":"<a href=\"https://aka.ms/azureaifoundry/forum\">MS Foundry Develope
